دعو الله تعالى أن يسقيهم ماء يشربون منه وتشرب منه مواشيهم، وذلك لأنَّهم ـ والله أعلم ـ في محلٍّ قليل الماء، فأوحى الله لموسى إجابة لِطلبَتِهِم: ﴿أنِ اضربْ بعصاك الحجرَ﴾: يُحتمل أنه حجرٌ معيَّن، ويُحتمل أنه اسم جنس يشمل أي حجر كان، فضربه، ﴿فانبَجَستْ﴾؛ أي: انفجرت من ذلك الحجر ﴿اثنتا عشرة عيناً﴾: جارية سارحة، ﴿قد علم كلُّ أناس مشرَبَهم﴾؛ أي: قد قسم على كل قبيلة من تلك القبائل الاثنتي عشرة، وجعل لكلٍّ منهم عيناً، فعلموها، واطمأنُّوا واستراحوا من التعب والمزاحمة، وهذا من تمام نعمة الله عليهم، ﴿وظلَّلْنا عليهم الغمام﴾: فكان يستُرهم من حرِّ الشمس، ﴿وأنزلنا عليهم المنَّ﴾: وهو الحلوى، ﴿والسَّلوى﴾: وهو لحم طير من أحسن أنواع الطيور وألذِّها، فجمع الله لهم بين الظلال والشراب والطعام الطيب من الحلوى واللحوم على وجه الراحة والطمأنينة، وقيل لهم: ﴿كلوا من طيِّبات ما رَزَقْناكم وما ظلمونا﴾: حين لم يشكُروا الله ولم يقوموا بما أوجب الله عليهم. ﴿ولكن كانوا أنفسَهم يظلمونَ﴾: حيث فوَّتوها كلَّ خير وعرَّضوها للشرِّ والنقمة، وهذا كان مدة لبثهم في التيه."},{"a":"7:161","t":"﴿وإذ قيلَ لهم اسكنوا هذه القريةَ﴾؛ أي: ادخلوها لتكون وطناً لكم ومسكناً، وهي إيلياء، ﴿وكلوا منها حيث شئتُم﴾؛ أي: قرية كانت كثيرة الأشجار غزيرة الثمار رغيدة العيش؛ فلذلك أمرهم الله أن يأكلوا منها حيث شاؤوا، ﴿وقولوا﴾: حين تدخلون الباب: ﴿حِطَّةٌ﴾؛ أي: احطُطْ عنَّا خطايانا واعفُ عنا، ﴿وادخُلوا الباب سجَّداً﴾؛ أي خاضعين لربكم مستكينين لعزَّته شاكرين لنعمته؛ فأمرهم بالخضوع وسؤال المغفرة، ووعدهم على ذلك مغفرة ذنوبهم والثواب العاجل والآجل، فقال: ﴿نغفر لكم خطيئاتِكُم سنزيدُ المحسنينَ﴾: من خير الدنيا والآخرة."},{"a":"7:162","t":"فلم يمتثلوا هذا الأمر الإلهيَّ، بل بدَّل الذين ظلموا منهم؛ أي: عصوا الله واستهانوا بأمره ﴿قولاً غير الذي قيل لهم﴾: فقالوا بدل طلب المغفرة وقولهم حطة: حبَّة في شعيرة، وإذا بدلوا القول مع يسره وسهولته؛ فتبديلهم للفعل من باب أولى، ولهذا دخلوا يزحفون على أَسْتَاهِهم، ﴿فأرسلنا عليهم﴾: حين خالفوا أمر الله وعَصَوْه ﴿رِجزاً من السماء﴾؛ أي: عذاباً شديداً إما الطاعون وإما غيره من العقوبات السماويَّة، وما ظلمهم الله بعقابه، وإنَّما كان ذلك ﴿بما كانوا يظلمونَ﴾."},{"a":"7:163","t":"﴿واسْألْهُم﴾؛ أي: اسأل بني إسرائيل ﴿عن القرية التي كانت حاضرةَ البحر﴾؛ أي: على ساحله في حال تعدِّيهم وعقاب الله إيَّاهم، ﴿إذ يَعْدونَ في السبتِ﴾: وكان الله تعالى قد أمرهم أن يعظِّموه ويحترموه ولا يصيدوا فيه صيداً، فابتلاهُم الله وامتحنهم، فكانت الحيتان تأتيهم يومَ سبتهم شُرَّعاً؛ أي: كثيرة طافية على وجه البحر. ﴿ويوم لا يَسْبِتونَ﴾؛ أي: إذا ذهب يوم السبت ﴿لا تأتيهم﴾؛ أي: تذهب في البحر فلا يرون منها شيئاً. ﴿كذلك نبلوهُم بما كانوا يفسُقون﴾: ففسقُهم هو الذي أوجب أن يبتلِيَهم الله وأن تكون لهم هذه المحنة، وإلاَّ؛ فلو لم يفسُقوا؛ لعافاهم الله، ولما عرَّضهم للبلاء والشرِّ."}],"172":[{"a":"7:164","t":"فتحيلوا على الصيد، فكانوا يحفرون لها حفراً، وينصبون لها الشباك؛ فإذا جاءت يوم السبت ووقعت في تلك الحفر والشِّباك؛ لم يأخذوها في ذلك اليوم؛ فإذا جاء يوم الأحد؛ أخذوها، وكثر فيهم ذلك، وانقسموا ثلاث فرق: معظمهم اعتَدَوا وتجرَّؤوا وأعلنوا بذلك. وفرقةٌ أعلنت بنهيهم والإنكار عليهم. وفرقةٌ اكتفتْ بإنكار أولئك عليهم ونهيهم لهم وقالوا: ﴿لم تَعِظونَ قوماً اللهُ مهلِكُهم أو معذِّبهم عذاباً شديداً﴾: كأنَّهم يقولون: لا فائدة في وعظ مَن اقتحم محارم الله ولم يُصْغِ للنصيح بل استمرَّ على اعتدائه وطغيانه؛ فإنه لا بد أن يعاقبهم الله إما بهلاك أو عذاب شديد. فقال الواعظون: نعظهم وننهاهم ﴿معذرةً إلى ربِّكم﴾؛ أي: لنُعْذَرَ فيهم، ﴿ولعلَّهم يتَّقون﴾؛ أي: يتركون ما هم فيه من المعصية؛ فلا نيأس من هدايتهم؛ فربَّما نجع فيهم الوعظ وأثر فيهم اللوم، وهذا المقصود الأعظم من إنكار المنكر؛ ليكون معذرة وإقامة حجةٍ على المأمور المنهي، ولعل الله أن يهديه فيعمل بمقتضى ذلك الأمر والنهي."},{"a":"7:165","t":"﴿فلما نسوا ما ذُكِّروا به﴾؛ أي: تركوا ما ذُكِّروا به واستمروا على غَيِّهم واعتدائهم، ﴿أنْجَيْنا الذين ينهون عن السوء﴾: وهكذا سنة الله في عباده أن العقوبة إذا نزلت نجا منها الآمرون بالمعروف والناهون عن المنكر، ﴿وأخذنا الذين ظلموا﴾: وهم الذين اعتدَوْا في السبت ﴿بعذابٍ بئيس﴾؛ أي: شديد ﴿بما كانوا يفسُقون﴾. وأما الفرقة الأخرى التي قالت للناهين: لم تعِظون قوماً الله مهلكهم؛ فاختلف المفسرون في نجاتِهِم وهلاكهم، والظاهرُ أنهم كانوا من الناجين؛ لأنَّ الله خصَّ الهلاك بالظالمين، وهو لم يذكر أنهم ظالمون، فدلَّ على أن العقوبة خاصَّة بالمعتدين في السبت، ولأنَّ الأمر بالمعروف والنهي عن المنكر فرضُ كفاية إذا قام به البعض سقط عن الآخرين؛ فاكتفوا بإنكار أولئك، ولأنهم أنكروا عليهم بقولهم: ﴿لم تَعِظونَ قوماً الله مهلِكُهم أو معذِّبهم عذاباً شديداً﴾: فأبدَوْا من غضبهم عليهم ما يقتضي أنَّهم كارهون أشدَّ الكراهة لفعلهم، وأنَّ الله سيعاقبهم أشدَّ العقوبة."},{"a":"7:166","t":"﴿فلما عَتَوْا عما نُهوا عنه﴾؛ أي: قسوا فلم يلينوا ولا اتَّعظوا، ﴿قلنا لهم﴾ قولاً قدريًّا: ﴿كونوا قردةً خاسئين﴾: فانقلبوا بإذن الله قردةً وأبعدهم الله من رحمته."},{"a":"7:167","t":"ثم ذكر ضَرْبَ الذلة والصغار على من بقي منهم، فقال: ﴿وإذ تأذَّنَ ربُّك﴾؛ أي: أعلم إعلاماً صريحاً، ﴿ليبعثنَّ عليهم إلى يوم القيامة من يسومُهم سوء العذاب﴾؛ أي: يهينُهم ويذلُّهم، ﴿إنَّ ربَّك لسريع العقاب﴾: لمن عصاه، حتى إنه يعجِّل له العقوبة في الدنيا. ﴿وإنَّه لغفورٌ رحيم﴾: لمن تاب إليه وأناب؛ يغفر له الذُّنوب، ويستُر عليه العيوب، ويرحمه بأن يتقبَّل منه الطاعات ويثيبه عليها بأنواع المثوبات، وقد فعل الله بهم ما وعدهم به؛ فلا يزالون في ذلٍّ وإهانة، تحت حكم غيرهم، لا تقوم لهم رايةٌ ولا ينصر لهم عَلَمٌ."},{"a":"7:168","t":"﴿وقطَّعناهم في الأرض أمماً﴾؛ أي: فرَّقناهم ومزَّقناهم في الأرض بعدما كانوا مجتمعين، ﴿منهم الصالحون﴾: القائمون بحقوق الله وحقوق عباده، ﴿ومنهم دون ذلك﴾؛ أي: دون الصلاح: إما مقتصدون، وإما الظالمون لأنفسهم. ﴿وبَلَوْناهم﴾: على عادتنا وسنَّتنا ﴿بالحسنات والسيئات﴾؛ أي: باليُسْر والعُسْر، ﴿لعلَّهم يرجِعون﴾: عما هم عليه مقيمون من الرَّدى، ويراجعون ما خُلقوا له من الهدى، فلم يزالوا بين صالح وطالح ومقتصدٍ."},{"a":"7:169","t":"حتى خلف ﴿من بعدِهم خَلْفٌ﴾: زاد شرُّهم ﴿ورثوا﴾: بعدهم ﴿الكتابَ﴾: وصار المرجع فيه إليهم، وصاروا يتصرَّفون فيه بأهوائهم، وتُبْذَلُ لهم الأموال ليفْتُوا ويحكموا بغير الحقِّ، وفشت فيهم الرشوة. ﴿يأخُذون عَرَضَ هذا الأدنى ويقولونَ﴾: مقرِّين بأنه ذنب وأنهم ظلمة: ﴿سَيُغْفَرُ لنا﴾: وهذا قول خالٍ من الحقيقة؛ فإنه ليس استغفاراً وطلباً للمغفرة على الحقيقة؛ فلو كان ذلك؛ لندموا على ما فعلوا، وعزموا على أن لا يعودوا، ولكنهم إذا أتاهم عرضٌ آخر ورشوةٌ أخرى؛ يأخذوه، فاشتروا بآيات الله ثمناً قليلاً، واستبدلوا الذي هو أدنى بالذي هو خير! قال الله تعالى في الإنكار عليهم وبيان جراءتهم: ﴿ألم يؤخَذْ عليهم ميثاقُ الكتاب أن لا يقولوا على الله إلا الحقَّ﴾: فما بالُهم يقولون عليه غير الحقِّ اتِّباعاً لأهوائهم وميلاً مع مطامعهم؟! ﴿و﴾ الحالُ أنهم قد ﴿دَرَسوا ما فيه﴾: فليس عليهم فيه إشكالٌ، بل قد أتوا أمرهم متعمِّدين، وكانوا في أمرهم مستبصرين، وهذا أعظمُ للذنب وأشدُّ للَّوم وأشنع للعقوبة، وهذا من نقص عقولهم وسفاهة رأيهم بإيثار الحياة الدُّنيا على الآخرة، ولهذا قال: ﴿والدارُ الآخرة خيرٌ للذين يتَّقون﴾: ما حرَّم الله عليهم من المآكل التي تُصاب وتؤكل رشوة على الحكم بغير ما أنزل الله وغير ذلك من أنواع المحرمات. ﴿أفلا تعقلون﴾؛ أي: أفلا يكون لكم عقولٌ توازن بين ما ينبغي إيثاره وما ينبغي الإيثار عليه، وما هو أولى بالسعي إليه والتقديم له على غيره؟! فخاصيَّة العقل النظر للعواقب، وأما من نَظَرَ إلى عاجل طفيف منقطع يفوِّت نعيماً عظيماً باقياً؛ فأنَّى له العقل والرأي؟!"},{"a":"7:170","t":"وإنما العقلاءُ حقيقة من وصفهم الله بقوله: ﴿والذين يمسِّكونَ بالكتاب﴾؛ أي: يتمسَّكون به علماً وعملاً، فيعلمون ما فيه من الأحكام والأخبار التي علمها أشرف العلوم، ويعملون بما فيها من الأوامر التي هي قرة العيون وسرور القلوب وأفراح الأرواح وصلاح الدنيا والآخرة. ومن أعظم ما يجب التمسُّك به من المأمورات إقامة الصلاة ظاهراً وباطناً، ولهذا خصها بالذِّكر لفضلها وشرفها وكونها ميزان الإيمان وإقامتها داعيةٌ لإقامة غيرها من العبادات. ولما كان عملهم كلُّه إصلاحاً؛ قال تعالى: ﴿إنَّا لا نُضيعَ أجر المصلحين﴾: في أقوالهم وأعمالهم ونيَّاتهم، مصلحين لأنفسهم ولغيرهم. وهذه الآية وما أشبهها دلَّت على أنَّ الله بعث رسله عليهم الصلاة والسلام بالصلاح لا بالفساد، وبالمنافع لا بالمضار، وأنَّهم بُعِثوا بصلاح الدارين؛ فكلُّ مَن كان أصلح؛ كان أقرب إلى اتِّباعهم."}],"173":[{"a":"7:171","t":"ثم قال تعالى: ﴿وإذ نَتَقْنا الجبل فوقَهم﴾: حين امتنعوا من قَبول ما في التوراة، فألزمهم الله العمل، وَنَتقَ فوق رؤوسهم الجبل، فصار فوقهم: ﴿كأنه ظُلَّة وظنُّوا أنه واقعٌ بهم﴾، وقيل لهم: ﴿خذوا ما آتيناكم بقوَّةٍ﴾؛ أي: بجدٍّ واجتهاد. ﴿واذكُروا ما فيه﴾: دراسة ومباحثة واتصافاً بالعمل به، ﴿لعلَّكم تتَّقون﴾: إذا فعلتُم ذلك."},{"a":"7:172","t":"يقول تعالى: ﴿وإذْ أخَذَ ربُّك من بني آدمَ من ظهورهم ذُرِّيَّتهم﴾؛ أي: أخرج من أصلابهم ذريتهم، وجعلهم يتناسلون ويتوالدون قرناً بعد قرنٍ. ﴿و﴾: حين أخرجهم من بطون أمَّهاتهم وأصلاب آبائهم، ﴿أشهدهم على أنفسِهِم ألستُ بربِّكم﴾؛ أي: قرَّرهم بإثبات ربوبيَّته بما أودعه في فطرهم من الإقرار بأنه ربُّهم وخالقهم ومليكهم. قالوا: بلى؛ قد أقررنا بذلك؛ فإنَّ الله تعالى فطر عباده على الدين الحنيف القيم، فكلُّ أحدٍ فهو مفطورٌ على ذلك، ولكن الفطرة قد تُغيَّر وتُبدَّل بما يطرأ على العقول والعقائد الفاسدة ، ولهذا ﴿قالوا بلى شَهِدْنا أن تَقولوا يوم القيامةِ إنَّا كنَّا عن هذا غافلين﴾؛ أي: إنما امتحنَّاكم حتى أقررتم بما تقرَّر عندكم من أنَّ الله تعالى ربُّكم؛ خشية أن تنكِروا يوم القيامة فلا تقرُّوا بشيء من ذلك، وتزعمون أن حجَّة الله ما قامت عليكم، ولا عندكم بها علم، بل أنتم غافلون عنها لاهون؛ فاليوم قد انقطعت حجَّتكم، وثبتت الحجة البالغة لله عليكم. أو تحتجون أيضاً بحجَّة أخرى، فتقولون: ﴿إنَّما أشركَ آباؤنا من قَبْلُ وكُنَّا ذُرِّيَّةً من بعدِهم﴾: فحذونا حَذْوَهم، وتبعناهم في باطلهم. ﴿أفتهلِكُنا بما فعل المبطلون﴾؟ فقد أودع الله في فطركم ما يدلُّكم على أن ما مع آبائكم باطلٌ، وأنَّ الحقَّ ما جاءت به الرسل، وهذا يقاوم ما وجدتم عليه آباءكم ويعلو عليه. نعم؛ قد يعرض للعبد من أقوال آبائه الضالِّين ومذاهبهم الفاسدة ما يظنُّه هو الحقَّ، وما ذاك إلا لإعراضه عن حجج الله وبيِّناته وآياته الأفقيَّة والنفسيَّة؛ فإعراضه عن ذلك وإقباله على ما قاله المبطلون، ربَّما صيَّره بحالة يُفضِّل بها الباطل على الحق. هذا هو الصواب في تفسير هذه الآيات، وقد قيل: إن هذا يوم أخذ الله الميثاق على ذريَّة آدم حين استخرجهم من ظهره وأشهدهم على أنفسهم فشهدوا بذلك فاحتجَّ عليهم بما أمرهم به في ذلك الوقت على ظلمهم في كفرهم وعنادهم في الدنيا والآخرة! ولكن ليس في الآية ما يدلُّ على هذا، ولا له مناسبة، ولا تقتضيه حكمة الله تعالى، والواقع شاهدٌ بذلك؛ فإنَّ هذا العهد والميثاق الذي ذَكَروا أنه حين أخْرَجَ اللهُ ذُرِّيَّةَ آدم من ظهره حين كانوا في عالم كالذَّرِّ لا يذكُرُه أحدٌ ولا يخطُرُ ببال آدميٍّ؛ فكيف يحتجُّ الله عليهم بأمرٍ ليس عندهم به خبرٌ ولا له عينٌ ولا أثرٌ؟!"},{"a":"7:173","t":"يقول تعالى: ﴿وإذْ أخَذَ ربُّك من بني آدمَ من ظهورهم ذُرِّيَّتهم﴾؛ أي: أخرج من أصلابهم ذريتهم، وجعلهم يتناسلون ويتوالدون قرناً بعد قرنٍ. ﴿و﴾: حين أخرجهم من بطون أمَّهاتهم وأصلاب آبائهم، ﴿أشهدهم على أنفسِهِم ألستُ بربِّكم﴾؛ أي: قرَّرهم بإثبات ربوبيَّته بما أودعه في فطرهم من الإقرار بأنه ربُّهم وخالقهم ومليكهم. قالوا: بلى؛ قد أقررنا بذلك؛ فإنَّ الله تعالى فطر عباده على الدين الحنيف القيم، فكلُّ أحدٍ فهو مفطورٌ على ذلك، ولكن الفطرة قد تُغيَّر وتُبدَّل بما يطرأ على العقول والعقائد الفاسدة ، ولهذا ﴿قالوا بلى شَهِدْنا أن تَقولوا يوم القيامةِ إنَّا كنَّا عن هذا غافلين﴾؛ أي: إنما امتحنَّاكم حتى أقررتم بما تقرَّر عندكم من أنَّ الله تعالى ربُّكم؛ خشية أن تنكِروا يوم القيامة فلا تقرُّوا بشيء من ذلك، وتزعمون أن حجَّة الله ما قامت عليكم، ولا عندكم بها علم، بل أنتم غافلون عنها لاهون؛ فاليوم قد انقطعت حجَّتكم، وثبتت الحجة البالغة لله عليكم. أو تحتجون أيضاً بحجَّة أخرى، فتقولون: ﴿إنَّما أشركَ آباؤنا من قَبْلُ وكُنَّا ذُرِّيَّةً من بعدِهم﴾: فحذونا حَذْوَهم، وتبعناهم في باطلهم. ﴿أفتهلِكُنا بما فعل المبطلون﴾؟ فقد أودع الله في فطركم ما يدلُّكم على أن ما مع آبائكم باطلٌ، وأنَّ الحقَّ ما جاءت به الرسل، وهذا يقاوم ما وجدتم عليه آباءكم ويعلو عليه. نعم؛ قد يعرض للعبد من أقوال آبائه الضالِّين ومذاهبهم الفاسدة ما يظنُّه هو الحقَّ، وما ذاك إلا لإعراضه عن حجج الله وبيِّناته وآياته الأفقيَّة والنفسيَّة؛ فإعراضه عن ذلك وإقباله على ما قاله المبطلون، ربَّما صيَّره بحالة يُفضِّل بها الباطل على الحق. هذا هو الصواب في تفسير هذه الآيات، وقد قيل: إن هذا يوم أخذ الله الميثاق على ذريَّة آدم حين استخرجهم من ظهره وأشهدهم على أنفسهم فشهدوا بذلك فاحتجَّ عليهم بما أمرهم به في ذلك الوقت على ظلمهم في كفرهم وعنادهم في الدنيا والآخرة! ولكن ليس في الآية ما يدلُّ على هذا، ولا له مناسبة، ولا تقتضيه حكمة الله تعالى، والواقع شاهدٌ بذلك؛ فإنَّ هذا العهد والميثاق الذي ذَكَروا أنه حين أخْرَجَ اللهُ ذُرِّيَّةَ آدم من ظهره حين كانوا في عالم كالذَّرِّ لا يذكُرُه أحدٌ ولا يخطُرُ ببال آدميٍّ؛ فكيف يحتجُّ الله عليهم بأمرٍ ليس عندهم به خبرٌ ولا له عينٌ ولا أثرٌ؟!"},{"a":"7:174","t":"ولهذا؛ لما كان هذا أمراً واضحاً جليًّا؛ قال تعالى: ﴿وكذلك نفصِّل الآيات﴾؛ أي: نبيِّنها ونوضِّحها، ﴿ولعلَّهم يرجعون﴾: إلى ما أودع الله في فِطَرِهم وإلى ما عاهدوا الله عليه فيرتدعوا عن القبائح."},{"a":"7:175","t":"يقول تعالى لنبيه - صلى الله عليه وسلم -: ﴿واتلُ عليهم نبأ الذي آتَيْناه آياتِنا﴾؛ أي: علمناه [علم] كتاب الله فصار العالم الكبير والحبر النحرير فانسلخ منها فأتبعه الشيطان؛ أي: انسلخ من الاتِّصاف الحقيقيِّ بالعلم بآيات الله؛ فإنَّ العلم بذلك يصيِّر صاحبه متصفاً بمكارم الأخلاق ومحاسن الأعمال ويرقى إلى أعلى الدرجات وأرفع المقامات؛ فترك هذا كتاب الله وراء ظهره، ونبذ الأخلاق التي يأمر بها الكتاب، وخلعها كما يُخْلَعُ اللباس، فلما انسلخ منها؛ أتْبَعَهُ الشيطانُ؛ أي: تسلَّط عليه حين خرج من الحصن الحصين وصار إلى أسفل سافلين، فأزَّه إلى المعاصي أزًّا، ﴿فكان من الغاوين﴾: بعد أن كان من الراشدين المرشدين."},{"a":"7:176","t":"وهذا لأنَّ الله تعالى خَذَلَه ووَكَلَه إلى نفسه؛ فلهذا قال تعالى: ﴿ولو شِئْنا لرَفَعْناه بها﴾: بأن نوفِّقه للعمل بها، فيرتفع في الدنيا والآخرة، فيتحصَّن من أعدائه، ﴿ولكنَّه﴾: فعل ما يقتضي الخذلان؛ فأخلدَ إلى الأرضِ؛ أي: إلى الشهوات السفليَّة والمقاصد الدنيويَّة، ﴿واتَّبع هواه﴾: وترك طاعة مولاه. ﴿فَمَثله﴾: في شدة حرصه على الدنيا وانقطاع قلبه إليها ﴿كمثل الكلب إن تَحْمِلْ عليه يَلْهَثْ أو تترُكْهُ يلهثْ﴾؛ أي: لا يزال لاهثاً في كل حال، وهذا لا يزال حريصاً حرصاً قاطعاً قلبه لا يسدُّ فاقتَهُ شيءٌ من الدُّنيا. ﴿ذلك مَثَلُ القوم الذين كذَّبوا بآياتنا﴾: بعد أن ساقها الله إليهم، فلم ينقادوا لها، بل كذَّبوا بها وردُّوها لهوانهم على الله واتِّباعهم لأهوائهم بغير هدى من الله. ﴿فاقصُص القَصَص لعلَّهم يتفكَّرون﴾: في ضرب الأمثال وفي العبر والآيات؛ فإذا تفكَّروا؛ علموا، وإذا علموا؛ عملوا."},{"a":"7:177","t":"﴿ساء مَثَلاً القومُ الذين كذَّبوا بآياتِنا وأنفسَهم كانوا يظلمونَ﴾؛ أي: ساء وقَبُح مَثَلُ مَن كذب بآيات الله، وظلم نفسه بأنواع المعاصي؛ فإنَّ مَثَلَهم مَثَلُ السَّوْء. وهذا الذي آتاه الله آياته يُحتمل أنَّ المرادَ به شخصٌ معيَّن قد كان منه ما ذكره اللهُ فقص اللهُ قصَّته تنبيهاً للعباد، ويُحتمل أنَّ المراد بذلك أنه اسم جنس، وأنَّه شاملٌ لكلِّ من آتاه اللهُ آياته فانسلخ منها. وفي هذه الآيات الترغيب في العمل بالعلم، وأنَّ ذلك رفعة من الله لصاحبه وعصمة من الشيطان، والترهيب من عدم العمل به، وأنه نزولٌ إلى أسفل سافلين وتسليط للشيطان عليه. وفيه أنَّ اتِّباع الهوى وإخلادَ العبد إلى الشهوات يكون سبباً للخذلان."},{"a":"7:178","t":"ثم قال تعالى مبيناً أنه المنفرد بالهداية والإضلال: ﴿مَن يهدِ الله﴾: بأن يوفِّقه للخيرات ويعصمه من المكروهات ويعلِّمه ما لم يكن يعلم، ﴿فهو المهتدي﴾: حقًّا؛ لأنه آثر هدايته تعالى، ﴿ومن يُضْلِلْ﴾: فيخذله ولا يوفِّقه للخير، ﴿فأولئك هم الخاسرون﴾: لأنفسهم وأهليهم يوم القيامة، ألا ذلك هو الخسران المبين."}],"174":[{"a":"7:179","t":"يقول تعالى مبيناً كثرة الغاوين الضالِّين المتَّبعين إبليس اللعين: ﴿ولقد ذَرَأنا﴾؛ أي: أنشأنا، وبثثنا ﴿لجهنَّم كثيراً من الجنِّ والإنس﴾: صارت البهائم أحسن حالة منهم. ﴿لهم قلوبٌ لا يفقهون بها﴾؛ أي: لا يصلُ إليها فقهٌ ولا علمٌ إلاَّ مجرَّد قيام الحجة، ﴿ولهم أعينٌ لا يبصرون بها﴾: ما ينفعُهم، بل فقدوا منفعتها وفائدتها، ﴿ولهم آذانٌ لا يسمعون بها﴾: سماعاً يصل معناه إلى قلوبهم. ﴿أولئك﴾: الذين بهذه الأوصاف القبيحة ﴿كالأنعام﴾؛ أي: البهائم التي فقدت العقول، وهؤلاء آثروا ما يفنى على ما يبقى فسُلِبوا خاصية العقل. ﴿بل هم أضلُّ﴾: من البهائم؛ فإنَّ الأنعام مستعملة فيما خُلِقت له، ولها أذهانٌ تدرك بها مضرَّتها من منفعتها؛ فلذلك كانت أحسن حالاً منهم. و ﴿أولئك هم الغافلون﴾: الذين غفلوا عن أنفع الأشياء؛ غفلوا عن الإيمان بالله وطاعته وذِكْره، خُلِقَتْ لهم الأفئدة والأسماع والأبصار لتكونَ عوناً لهم على القيام بأوامر الله وحقوقه، فاستعانوا بها على ضدِّ هذا المقصود؛ فهؤلاء حقيقون بأن يكونوا ممَّن ذرأ الله لجهنَّم وخلقهم لها؛ فخلقهم للنار وبأعمال أهلها يعملون، وأما مَن استعمل هذه الجوارح في عبادة الله وانصبغ قلبُهُ بالإيمان بالله ومحبَّته ولم يغفل عن الله؛ فهؤلاء أهل الجنة وبأعمال أهل الجنة يعملون."},{"a":"7:180","t":"هذا بيانٌ لعظيم جلاله وسعة أوصافه بأن له الأسماء الحسنى؛ أي: له كل اسم حسن، وضابطه أنه كل اسم دال على صفة كمال عظيمة، وبذلك كانت حسنى؛ فإنها لو دلَّت على غير صفة، بل كانت علماً محضاً؛ لم تكن حسنى، وكذلك لو دلَّت على صفة ليست بصفة كمال، بل إما صفة نقص أو صفة منقسمة إلى المدح والقدح؛ لم تكن حسنى؛ فكلُّ اسم من أسمائه دال على جميع الصفة التي اشتُقَّ منها، مستغرقٌ لجميع معناها، وذلك نحو: ﴿العليم﴾ الدال على أنَّ له علماً محيطاً عامًّا لجميع الأشياء فلا يخرج عن علمه مثقال ذرةٍ في الأرض ولا في السماء، و ﴿الرحيم﴾ الدال على أن له رحمة عظيمة واسعة لكلِّ شيء، و ﴿القدير﴾ الدال على أن له قدرة عامَّة لا يُعْجِزُها شيء ... ونحو ذلك. ومن تمام كونها حسنى أنَّه لا يُدعى إلا بها، ولذلك قال: ﴿فادعوه بها﴾: وهذا شاملٌ لدعاء العبادة ودعاء المسألة، فيُدعى في كل مطلوب بما يناسب ذلك المطلوب، فيقول الداعي مثلاً: اللهمَّ! اغفر لي، وارحمني؛ إنك أنت الغفور الرحيم. وتب عليَّ يا توَّاب! وارزقني يا رزاق! والطفْ بي يا لطيف! ونحو ذلك. وقوله: ﴿وَذَروا الذين يُلحِدون في أسمائِهِ سيُجْزَوْن ما كانوا يعملون﴾؛ أي: عقوبة وعذاباً على إلحادهم في أسمائه. وحقيقة الإلحاد: الميلُ بها عما جُعِلَتْ له، إمَّا بأن يسمَّى بها من لا يستحقُّها؛ كتسمية المشركين بها لآلهتهم، وإما بنفي معانيها وتحريفها وأن يجعل لها معنى ما أراده الله ولا رسوله، وإما أن يشبِّه بها غيرها؛ فالواجب أن يُحذر الإلحاد فيها ويُحذر الملحدون فيها. وقد ثبت في الصحيح عن النبيِّ - صلى الله عليه وسلم -: «إنَّ لله تسعةً وتسعين اسماً من أحصاها دخل الجنة»."},{"a":"7:181","t":"أي: ومن جملة من خلقنا أمة فاضلة كاملة في نفسها مكمِّلة لغيرها يهدون أنفسهم وغيرهم بالحقِّ فيعلمون الحقَّ ويعملون به ويعلِّمونه ويدعون إليه وإلى العمل به. ﴿وبه يعدلون﴾: بين الناس في أحكامهم إذا حكموا في الأموال والدماء والحقوق والمقالات وغير ذلك. وهؤلاء أئمة الهدى ومصابيح الدُّجى، وهم الذين أنعم الله عليهم بالإيمان والعمل الصالح والتواصي بالحقِّ والتواصي بالصبر، وهم الصدِّيقون الذين مرتبتهم تلي مرتبة الرسالة، وهم في أنفسهم مراتب متفاوتة؛ كل بحسب حاله وعلوِّ منزلته؛ فسبحان من يختصُّ برحمته من يشاء والله ذو الفضل العظيم."},{"a":"7:182","t":"أي: والذين كذَّبوا بآيات الله الدالَّة على صحة ما جاء به محمد - صلى الله عليه وسلم - من الهدى فردُّوها ولم يقبلوها، ﴿سنستدرِجُهم من حيث لا يعلمون﴾: بأن يدر لهم الأرزاق."},{"a":"7:183","t":"﴿وأملي لهم﴾؛ أي: أمهلهم حتى يظنُّوا أنهم لا يؤخَذون ولا يعاقَبون، فيزدادون كفراً وطغياناً وشرًّا إلى شرِّهم، وبذلك تزيد عقوبتهم ويتضاعف عذابهم، فيضرُّون أنفسهم من حيث لا يعلمون. ولهذا قال: ﴿إن كيدي متينٌ﴾؛ أي: قويٌّ بليغٌ."},{"a":"7:184","t":"﴿أوَ لَمْ يتفكَّروا ما بصاحبهم﴾: [محمدٍ]- صلى الله عليه وسلم - ﴿من جِنَّةٍ﴾؛ أي: أولم يُعْمِلوا أفكارهم وينظروا هل في صاحبهم الذي يعرفونه ولا يخفى عليهم من حاله شيءٌ؛ هل هو مجنونٌ؟! فلينظروا في أخلاقه وهديه ودلِّه وصفاته، وينظروا فيما دعا إليه؛ فلا يجدون فيه من الصفات إلا أكملها، ولا من الأخلاق إلا أتمَّها، ولا من العقل والرأي إلا ما فاق به العالمين، ولا يدعو إلا لكلِّ خير، ولا ينهى إلا عن كلِّ شرٍّ! أفبهذا يا أولي الألباب جِنَّة ؟! أم هو الإمام العظيم والناصح المبين والماجد الكريم والرءوف الرحيم؟! ولهذا قال: ﴿إن هو إلا نذيرٌ مبينٌ﴾؛ أي: يدعو الخلق إلى ما يُنجيهم من العذاب، ويحصِّل لهم الثواب."},{"a":"7:185","t":"﴿أولم ينظروا في مَلَكوت السموات والأرض﴾: فإنهم إذا نظروا إليها؛ وجدوها أدلة دالة على توحيد ربِّها وعلى ما لَه من صفات الكمال. ﴿و﴾: كذلك لينظروا إلى جميع ﴿ما خَلَقَ الله من شيء﴾: فإن جميع أجزاء العالم يدلُّ أعظم دِلالة على علم الله وقدرته وحكمته وسَعَةِ رحمته وإحسانه ونفوذ مشيئته وغير ذلك من صفاته العظيمة الدالَّة على تفرُّده بالخلق والتدبير الموجبة لأن يكون هو المعبودَ المحمودَ المسبَّح الموحَّد المحبوب. وقوله: ﴿وأنْ عسى أن يكونَ قد اقترب أجَلُهم﴾؛ أي: لينظروا في خصوص حالهم، وينظروا لأنفسهم قبل أن يقتربَ أجلُهم ويفجأهم الموتُ وهم في غفلةٍ معرضونَ؛ فلا يتمكَّنون حينئذٍ من استدراك الفارط. ﴿فبأيِّ حديثٍ بعدَه يؤمنون﴾؛ أي: إذا لم يؤمنوا بهذا الكتاب الجليل؛ فبأيِّ حديث يؤمنون به؟! أبكتب الكذب والضلال؟! أم بحديث كل مفترٍ دجَّال؟!"},{"a":"7:186","t":"ولكن الضالَّ لا حيلة فيه ولا سبيل إلى هدايته، ولهذا قال تعالى: ﴿مَن يُضْلِلِ الله فلا هاديَ له وَيَذَرُهم في طغيانِهِم يعمهونَ﴾؛ أي: متحيَّرون ، يتردَّدون لا يخرجون منه، ولا يهتدون إلى حقٍّ."},{"a":"7:187","t":"يقول تعالى لرسوله محمد - صلى الله عليه وسلم -: ﴿يسألونَك﴾؛ أي: المكذبون لك المتعنِّتون ﴿عن الساعة أيان مُرْساها﴾؛ أي: متى وقتها التي تجيء به؟ ومتى تحِلُّ بالخلق؟ ﴿قل إنَّما علمُها عند ربي﴾؛ أي: إنه تعالى المختصُّ بعلمها، ﴿لا يجلِّيها لوقتها إلا هو﴾؛ أي: لا يظهرها لوقتها الذي قُدِّر أن تقوم فيه إلا هو. ﴿ثَقُلَتْ في السموات والأرض﴾؛ أي: خفي علمها على أهل السماوات والأرض واشتدَّ أمرُها أيضاً عليهم فهم من الساعة مشفقون. ﴿لا تأتيكم إلَّا بغتةً﴾؛ أي: فجأة من حيث لا يشعرون لم يستعدُّوا لها ولم يتهيؤوا لها. ﴿يسألونك كأنَّك حَفِيٌّ عنها﴾؛ أي: هم حريصون على سؤالك عن الساعة كأنك مستحفٍ عن السؤال عنها، ولم يعلموا أنك لكمال علمك بربِّك وما ينفعُ السؤال عنه غير مبال بالسؤال [عنها، ولا حريص على ذلك، فَلِمَ لا يقتدون بك؟ ويكفون عن الاستحفاء عن هذا السؤال] الخالي من المصلحة المتعذِّر علمه؛ فإنَّه لا يعلمها نبيٌّ مرسلٌ ولا مَلَكٌ مقرَّب، وهي من الأمور التي أخفاها عن الخلق لكمال حكمته وسعة علمه. ﴿قل إنَّما علمُها عند الله ولكنَّ أكثر الناس لا يعلمون﴾: فلذلك حرصوا على ما لا ينبغي الحرص عليه، وخصوصاً مثل حال هؤلاء الذين يتركون السؤال عن الأهمِّ ويَدَعون ما يجبُ عليهم من العلم، ثم يذهبون إلى ما لا سبيل لأحدٍ أن يدركه ولا هُم مطالبون بعلمه."}],"175":[{"a":"7:188","t":"﴿قل لا أملِكُ لنفسي نفعاً ولا ضرًّا﴾: فإني فقير مدبَّر، لا يأتيني خيرٌ إلا من الله، ولا يَدْفَعُ عني الشرَّ إلا هو، وليس لي من العلم إلا ما علمني الله تعالى. ﴿ولو كنتُ أعلم الغيبَ لاستكثرتُ من الخير وما مسَّني السوءُ﴾؛ أي: لفعلت الأسباب التي أعلم أنها تنتج لي المصالح والمنافع، ولحذرتُ من كلِّ ما يفضي إلى سوءٍ ومكروهٍ؛ لعلمي بالأشياء قبل كونها، وعلمي بما تفضي إليه، ولكني لعدم علمي قد ينالني ما ينالني من السوء وقد يفوتني ما يفوتني من مصالح الدُّنيا ومنافعها؛ فهذا أدلُّ دليل على أني لا علم لي بالغيب. ﴿إن أنا إلا نذيرٌ﴾: أنذر العقوبات الدينيَّة والدنيويَّة والأخرويَّة، وأبيِّن الأعمال المفضية إلى ذلك وأحذِّر منها. وبشير بالثواب العاجل والآجل، ببيان الأعمال الموصلة إليه والترغيب فيها، ولكن ليس كلُّ أحدٍ يقبل هذه البشارة والنذارة، وإنما ينتفع بذلك ويقبله المؤمنون. وهذه الآيات الكريمات مبيِّنة جهل من يقصد النبي - صلى الله عليه وسلم - ويدعوه لحصول نفع أو دفع ضرٍّ؛ فإنَّه ليس بيده شيء من الأمر، ولا ينفع مَنْ لم ينفعْه الله، ولا يدفعُ الضرَّ عمَّن لم يدفعْه الله عنه، ولا له من العلم إلاَّ ما علَّمه الله [تعالى]، وإنما ينفع مَنْ قَبِلَ ما أرسل به من البشارة والنذارة وعمل بذلك؛ فهذا نفعه عليه السلام الذي فاق نفع الآباء والأمهات والأخلاَّء والإخوان، بما حثَّ العباد على كلِّ خير، وحذَّرهم عن كلِّ شرٍّ، وبينه لهم غاية البيان والإيضاح."},{"a":"7:189","t":"أي: ﴿هو الذي خلقكم﴾: أيها الرجال والنساء المنتشرون في الأرض على كثرتكم وتفرُّقكم، ﴿من نفس واحدةٍ﴾: وهو آدمُ أبو البشر - صلى الله عليه وسلم -، ﴿وجعل منها زوجَها﴾؛ أي: خلق من آدم زوجته حواء. لأجل أن يسكن إليها، لأنها إذا كانت منه؛ حصل بينهما من المناسبة والموافقة ما يقتضي سكونَ أحدهما إلى الآخر، فانقاد كلٌّ منهما إلى صاحبه بزمام الشهوة. ﴿فلما تغشَّاها﴾؛ أي: تجلَّلها مجامعاً لها؛ قدَّر الباري أن يوجد من تلك الشهوة ـ وذلك الجماع ـ النسل، فحملتْ ﴿حملاً خفيفاً﴾، وذلك في ابتداء الحمل لا تحس به الأنثى ولا يثقلها. ﴿فلما﴾ استمرَّت [به] و ﴿أثقلت﴾ به حين كبر في بطنها؛ فحينئذٍ صار في قلوبهما الشفقة على الولد وعلى خروجه حيًّا صحيحاً سالماً لا آفة فيه، فدَعَوَا ﴿الله ربَّهما لئن آتَيْتنَا﴾: ولداً: ﴿صالحاً﴾؛ أي: صالح الخلقة تامّها لا نقص فيه، ﴿لنكوننَّ من الشاكرين﴾."},{"a":"7:190","t":"﴿فلما آتاهما صالحاً﴾: على وَفْق ما طَلَبَا وتمَّت عليهما النعمة فيه، ﴿جعلا له شركاء فيما آتاهما﴾؛ أي: جعلا لله شركاء في ذلك الولد الذي انفرد الله بإيجاده والنعمة به وأقرَّ به أعين والديه، فعبَّداه لغير الله: إمّا أن يسمياه بعبد غير الله؛ كعبد الحارث وعبد العزَّى وعبد الكعبة ونحو ذلك، أو يشركا في الله في العبادة بعدما منَّ الله عليهما بما منَّ من النعم التي لا يحصيها أحدٌ من العباد، وهذا انتقالٌ من النوع إلى الجنس؛ فإنَّ أول الكلام في آدم وحواء، ثم انتقل [إلى] الكلام في الجنس، ولا شكَّ أنَّ هذا موجود في الذُّرية كثيراً؛ فلذلك قرَّرهم الله على بطلان الشرك، وأنهم في ذلك ظالمون أشدَّ الظلم، سواء كان الشرك في الأقوال أم في الأفعال؛ فإنَّ الخالق لهم من نفس واحدة، الذي خلق منها زوجها، وجعل لهم من أنفسهم أزواجاً، ثم جعل بينهم من المودَّة والرحمة ما يسكُنُ بعضُهم إلى بعض ويألفه ويلتذُّ به، ثم هداهم إلى ما به تحصل الشهوة واللَّذة والأولاد والنسل، ثم أوجد الذُّرية في بطون الأمهات وقتاً موقَّتاً تتشوَّف إليه نفوسهم ويدعون الله أن يخرِجَه سويًّا صحيحاً، فأتمَّ الله عليهم النعمة، وأنالهم مطلوبهم، أفلا يستحقُّ أن يعبدوه ولا يشركوا به في عبادته أحداً ويخلصوا له الدين؟!"},{"a":"7:191","t":"ولكنَّ الأمر جاء على العكس، فأشركوا بالله ﴿مالا يَخْلُقُ شيئاً وهم يُخْلَقونَ. ولا يستطيعون لهم﴾؛ أي: لعابديها ﴿نصراً ولا أنفسَهم ينصرونَ﴾: فإذا كانت لا تخلق شيئاً ولا مثقال ذرَّة، بل هي مخلوقة، ولا تستطيع أن تدفع المكروه عن من يعبُدُها ولا عن أنفسها؛ فكيف تُتَّخذ مع الله آلهة؟! إنْ هذا إلا أظلم الظلم وأسفه السفه."},{"a":"7:192","t":"ولكنَّ الأمر جاء على العكس، فأشركوا بالله ﴿مالا يَخْلُقُ شيئاً وهم يُخْلَقونَ. ولا يستطيعون لهم﴾؛ أي: لعابديها ﴿نصراً ولا أنفسَهم ينصرونَ﴾: فإذا كانت لا تخلق شيئاً ولا مثقال ذرَّة، بل هي مخلوقة، ولا تستطيع أن تدفع المكروه عن من يعبُدُها ولا عن أنفسها؛ فكيف تُتَّخذ مع الله آلهة؟! إنْ هذا إلا أظلم الظلم وأسفه السفه."},{"a":"7:193","t":"وإن تدعوا أيُّها المشركون، هذه الأصنام التي عبدتم من دون الله ﴿إلى الهدى لا يتَّبعوكم سواءٌ عليكم أدعوتُموهم أم أنتم صامتونَ﴾: فصار الإنسانُ أحسنَ حالةً منها؛ لأنَّها لا تسمع ولا تبصِرُ ولا تَهْدي ولا تُهْدَى، وكل هذا إذا تصوَّره اللبيب العاقل تصوراً مجرداً؛ جزم ببطلان إلهيتها وسفاهة مَنْ عبدها."},{"a":"7:194","t":"وهذا من نوع التحدي للمشركين العابدين للأوثان؛ يقول تعالى: ﴿إنَّ الذين تَدْعون من دونِ الله عبادٌ أمثالكم﴾؛ أي: لا فرق بينكم وبينهم؛ فكلُّكم عبيدٌ لله مملوكون؛ فإن كنتم كما تزعمون صادقين في أنها تستحقُّ من العبادة شيئاً؛ ﴿فادْعوهم فليستجيبوا لكم﴾: فإن استجابوا لكم وحصَّلوا مطلوبكم، وإلاَّ؛ تبيَّن أنكم كاذبون في هذه الدعوى مفترون على الله أعظم الفرية."},{"a":"7:195","t":"وهذا لا يحتاج إلى تبيين فيه ؛ فإنَّكم إذا نظرتُم إليها؛ وجدتُم صورتها دالةً على أنه ليس لديها من النفع شيء، فليس لها أرجلٌ تمشي بها، ولا أيدٍ تبطش بها، ولا أعينٌ تبصر بها، ولا آذان تسمع بها؛ فهي عادمةٌ لجميع الآلات والقوى الموجودة في الإنسان؛ فإذا كانت لا تجيبكم إذا دعوتموها؛ فهي عبادٌ أمثالكم، بل أنتم أكمل منها وأقوى على كثير من الأشياء؛ فلأيِّ شيء عبدتموها؟! ﴿قل ادعوا شركاءكم ثم كيدونِ فلا تُنظِرونِ﴾؛ أي: اجتمعوا أنتم وشركاؤكم على إيقاع السوء والمكروه بي من غير إمهال ولا إنظار فإنكم غير بالغين لشيء من المكروه بي."}],"176":[{"a":"7:196","t":"لأنَّ وَلِيِّيَ اللهُ الذي يتولاَّني فيجلب لي المنافع ويدفع عني المضار. ﴿الذي نزَّل الكتابَ﴾: الذي فيه الهدى والشفاء والنور، وهو من تولِّيه وتربيته لعباده الخاصة الدينيَّة. ﴿وهو يتولَّى الصالحين﴾: الذين صلحت نيَّاتهم وأعمالهم وأقوالهم؛ كما قال تعالى: ﴿اللهُ وليُّ الذين آمنوا يخرِجُهم من الظُّلمات إلى النور﴾؛ فالمؤمنون الصالحون لمَّا تولَّوا ربَّهم بالإيمان والتقوى ولم يتولَّوا غيره ممَّن لا ينفع ولا يضرُّ؛ تولاَّهم الله ولطف بهم وأعانهم على ما فيه الخير والمصلحة لهم في دينهم ودنياهم ودفع عنهم بإيمانهم كلَّ مكروه؛ كما قال تعالى: ﴿إنَّ الله يدافِعُ عن الذين آمنوا﴾."},{"a":"7:197","t":"وهذا أيضاً في بيان عدم استحقاق هذه الأصنام التي يعبُدونها من دون الله شيئاً من العبادة؛ لأنها ليس لها استطاعةٌ ولا اقتدارٌ في نصر أنفسهم ولا في نصر عابديها، وليس لها قوة العقل والاستجابة؛ فلو دعوتَها إلى الهدى؛ لم تهتدِ، وهي صورٌ لا حياة فيها، فتراهم ينظرون إليك وهم لا يبصرونَ حقيقةً؛ لأنهم صوَّروها على صور الحيوانات من الآدميين أو غيرهم، وجعلوا لها أبصاراً وأعضاءً؛ فإذا رأيتها؛ قلت: هذه حيَّة؛ فإذا تأملتها؛ عرفت أنها جمادات لا حراك بها ولا حياة؛ فبأيِّ رأي اتَّخذها المشركون آلهةً مع الله؟! ولأيِّ مصلحة أو نفع عكفوا عندها وتقرَّبوا لها بأنواع العبادات؟! فإذا عُرِفَ هذا؛ عُرِفَ أن المشركين وآلهتهم التي عبدوها ولو اجتمعوا وأرادوا أن يكيدوا من تولاَّه فاطر السماوات والأرض متولِّي أحوال عباده الصالحين؛ لم يقدروا على كيده بمثقال ذرَّةٍ من الشرِّ؛ لكمال عجزهم وعجزها وكمال قوَّة الله واقتداره وقوَّة من احتمى بجلاله وتوكَّل عليه، وقيل: إنَّ معنى قوله: ﴿وتَراهُم ينظُرونَ إليكَ وهم لا يبصِرونَ﴾: إنَّ الضمير يعود إلى المشركين المكذِّبين لرسول الله - صلى الله عليه وسلم -، فتحسبهم ينظُرون إليك يا رسول الله نظر اعتبارٍ يتبيَّن به الصادق من الكاذب، ولكنهم لا يبصرون حقيقتك وما يتوسَّمه المتوسِّمون فيك من الجمال والكمال والصدق."},{"a":"7:198","t":"وهذا أيضاً في بيان عدم استحقاق هذه الأصنام التي يعبُدونها من دون الله شيئاً من العبادة؛ لأنها ليس لها استطاعةٌ ولا اقتدارٌ في نصر أنفسهم ولا في نصر عابديها، وليس لها قوة العقل والاستجابة؛ فلو دعوتَها إلى الهدى؛ لم تهتدِ، وهي صورٌ لا حياة فيها، فتراهم ينظرون إليك وهم لا يبصرونَ حقيقةً؛ لأنهم صوَّروها على صور الحيوانات من الآدميين أو غيرهم، وجعلوا لها أبصاراً وأعضاءً؛ فإذا رأيتها؛ قلت: هذه حيَّة؛ فإذا تأملتها؛ عرفت أنها جمادات لا حراك بها ولا حياة؛ فبأيِّ رأي اتَّخذها المشركون آلهةً مع الله؟! ولأيِّ مصلحة أو نفع عكفوا عندها وتقرَّبوا لها بأنواع العبادات؟! فإذا عُرِفَ هذا؛ عُرِفَ أن المشركين وآلهتهم التي عبدوها ولو اجتمعوا وأرادوا أن يكيدوا من تولاَّه فاطر السماوات والأرض متولِّي أحوال عباده الصالحين؛ لم يقدروا على كيده بمثقال ذرَّةٍ من الشرِّ؛ لكمال عجزهم وعجزها وكمال قوَّة الله واقتداره وقوَّة من احتمى بجلاله وتوكَّل عليه، وقيل: إنَّ معنى قوله: ﴿وتَراهُم ينظُرونَ إليكَ وهم لا يبصِرونَ﴾: إنَّ الضمير يعود إلى المشركين المكذِّبين لرسول الله - صلى الله عليه وسلم -، فتحسبهم ينظُرون إليك يا رسول الله نظر اعتبارٍ يتبيَّن به الصادق من الكاذب، ولكنهم لا يبصرون حقيقتك وما يتوسَّمه المتوسِّمون فيك من الجمال والكمال والصدق."},{"a":"7:199","t":"هذه الآية جامعة لِحُسْنِ الخلق مع الناس وما ينبغي في معاملتهم: فالذي ينبغي أن يعامَلَ به الناس: أن يأخذَ العفوَ؛ أي: ما سمحتْ به أنفسُهم وما سَهُلَ عليهم من الأعمال والأخلاق؛ فلا يكلِّفهم ما لا تسمح به طبائعهم، بل يشكُر من كلِّ أحدٍ ما قابله به من قول وفعل جميل أو ما هو دونَ ذلك، ويتجاوزُ عن تقصيرِهم ويغضُّ طرفه عن نقصهم ولا يتكبَّر على الصغير لصغره ولا ناقص العقل لنقصه ولا الفقير لفقره، بل يعامل الجميع باللُّطف والمقابلة بما تقتضيه الحال وتنشرح له صدورهم. ﴿وأمُرْ بالعُرْفِ﴾؛ أي: بكل قول حسن وفعل جميل وخلق كامل للقريب والبعيد؛ فاجعل ما يأتي إلى الناس منك إما تعليم علم أو حث على خير من صلة رحم أو برِّ والدين أو إصلاح بين الناس أو نصيحة نافعة أو رأي مصيب أو معاونة على برٍّ وتقوى أو زجر عن قبيح أو إرشاد إلى تحصيل مصلحة دينيَّة أو دنيويَّة. ولما كان لا بدَّ من أذيَّة الجاهل؛ أمر الله تعالى أن يقابَلَ الجاهل بالإعراض عنه وعدم مقابلته بجهله؛ فمن آذاك بقوله أو فعله؛ لا تؤذه، ومن حَرَمَكَ لا تحرِمْه، ومن قطعك فَصِلْه، ومن ظلمك فاعدل فيه. وأما ما ينبغي أن يعاملَ به العبدُ شياطين الجن؛ فقال تعالى:"},{"a":"7:200","t":"أي: أيَّ وقت وفي أيِّ حال، ﴿ينزغنَّك من الشيطان نزغٌ﴾؛ أي: تحس منه بوسوسةٍ وتثبيطٍ عن الخير أو حثٍّ على الشرِّ وإيعازٍ إليه، ﴿فاستعذْ بالله﴾؛ أي: التجئ واعتصم بالله واحتم بحماه. فإنَّه سميعٌ لما تقول، ﴿عليمٌ﴾: بنيَّتك وضعفك وقوة التجائك له فسيحميك من فتنته ويقيك من وسوسته؛ كما قال تعالى: ﴿قل أعوذُ بربِّ الناس ...﴾ إلى آخر السورة."},{"a":"7:201","t":"ولما كان العبدُ لا بدَّ أن يغفل وينال منه الشيطان الذي لا يزال مرابطاً ينتظر غرَّته وغفلته؛ ذكر تعالى علامة المتَّقين من الغاوين، وأن المتَّقي إذا أحسَّ بذنب ومسَّه طائفٌ من الشيطان فأذنب بفعل محرَّم أو ترك واجبٍ؛ تذكَّر من أي باب أُتِيَ ومن أيِّ مدخل دخل الشيطان عليه، وتذكَّر ما أوجب الله عليه وما عليه من لوازم الإيمان، فأبصر، واستغفر الله تعالى، واستدرك ما فرط منه بالتوبة النصوح والحسنات الكثيرة، فرد شيطانه خاسئاً حسيراً؛ قد أفسد عليه كلَّ ما أدركه منه."},{"a":"7:202","t":"وأما إخوان الشياطين وأولياؤهم؛ فإنهم إذا وقعوا في الذُّنوب لا يزالون يمدُّونهم في الغيِّ ذنباً بعد ذنبٍ، ولا يقصرون عن ذلك؛ فالشياطين لا تقصر عنهم بالإغواء؛ لأنها طمعت فيهم حين رأتهم سلسي القياد لها وهم لا يقصرون عن فعل الشرِّ."},{"a":"7:203","t":"أي: لا يزال هؤلاء المكذِّبون لك في تعنُّت وعناد، ولو جاءتهم الآيات الدالَّة على الهدى والرشاد؛ فإذا جئتهم بشيء من الآيات الدالَّة على صدقك؛ لم ينقادوا. ﴿وإذا لم تأتهم بآيةٍ﴾: من آيات الاقتراح التي يعيِّنونها، ﴿قالوا لولا اجتبيتها﴾؛ أي: هلاَّ اخترت الآية فصارت الآية الفلانية أو المعجزة الفلانية، كأنك أنت المنزِّل للآيات المدبِّر لجميع المخلوقات، ولم يعلموا أنه ليس لك من الأمر شيء، أو [أنّ المعنى]: لولا اخترعتها من نفسك، ﴿قل إنَّما أتَّبع ما يوحى إليَّ من ربي﴾: فأنا عبدٌ مُتَّبِعٌ مدبَّر، والله تعالى هو الذي ينزل الآيات ويرسلها على حسب ما اقتضاه حمده، وَطَلبَتْهُ حكمته البالغة؛ فإن أردتم آية لا تضمحلُّ على تعاقب الأوقات وحجة لا تبطل في جميع الآنات؛ فهذا: القرآن العظيم والذكر الحكيم. ﴿بصائرُ من ربِّكم﴾: يستبصر به في جميع المطالب الإلهيَّة والمقاصد الإنسانيَّة، وهو الدليل والمدلول؛ فمن تفكَّر فيه وتدبَّره؛ علم أنه تنزيلٌ من حكيم حميدٍ، لا يأتيه الباطل من بين يديه ولا من خلفه، وبه قامت الحجَّة على كلِّ من بلغه، ولكن أكثر الناس لا يؤمنون، وإلاَّ؛ فمن آمن؛ فهو ﴿هدىً﴾ له من الضلال ﴿ورحمةٌ﴾ له من الشقاء؛ فالمؤمن مهتدٍ بالقرآن، متَّبع له، سعيدٌ في دنياه وأخراه، وأما من لم يؤمنْ به؛ فإنه ضالٌّ شقيٌّ في الدنيا والآخرة."},{"a":"7:204","t":"هذا الأمر عامٌّ في كلِّ من سمع كتاب الله يتلى؛ فإنه مأمور بالاستماع له والإنصات، والفرق بين الاستماع والإنصات أن الإنصات في الظاهر بترك التحدُّث أو الاشتغال بما يشغل عن استماعه، وأما الاستماع له؛ فهو أن يُلْقِيَ سَمْعَه ويحضِرَ قلبَه ويتدبَّر ما يستمع؛ فإنَّ من لازم على هذين الأمرين حين يُتلى كتاب الله؛ فإنه ينال خيراً كثيراً وعلماً غزيراً وإيماناً مستمرًّا متجدداً وهدىً متزايداً وبصيرةً في دينه، ولهذا رتَّب الله حصول الرحمة عليهما، فدلَّ ذلك على أن مَنْ تُلي عليه الكتاب فلم يستمع له وينصت أنه محروم الحظ من الرحمة، قد فاته خيرٌ كثير. ومن أوكدِ ما يؤمر [به] مستمع القرآن أن يستمعَ له وينصتَ في الصلاة الجهرية إذا قرأ إمامُهُ؛ فإنَّه مأمورٌ بالإنصات حتى إنَّ أكثر العلماء يقولون: إنَّ اشتغاله بالإنصات أولى من قراءته الفاتحة وغيرها."},{"a":"7:205","t":"الذكر لله تعالى يكون بالقلب ويكون باللسان ويكون بهما وهو أكمل أنواع الذكر وأحواله، فأمر الله عبده ورسوله محمداً أصلاً وغيره تبعاً بذكر ربِّه في نفسه؛ أي: مخلصاً خالياً، ﴿تضرُّعاً﴾؛ أي: متضرعاً بلسانك مكرِّراً لأنواع الذكر، ﴿وخِيفةً﴾: في قلبك؛ بأن تكون خائفاً من الله، وَجِلَ القلب منه خوفاً أن يكون عملك غير مقبول، وعلامة الخوف أن يسعى ويجتهد في تكميل العمل وإصلاحه والنصح به. ﴿ودون الجهر من القول﴾ ـ؛ أي: كن متوسطاً، لا تجهرْ بصلاتك ولا تخافِتْ بها وابتغ بين ذلك سبيلاً ـ ﴿بالغدو﴾: أول النهار، ﴿والآصال﴾: آخره، وهذان الوقتان [لذكرِ اللهِ] فيهما مزيَّةٌ وفضيلةٌ على غيرهما. ﴿ولا تكن من الغافلينَ﴾: الذين نَسُوا الله فأنساهم أنفُسَهم؛ فإنَّهم حُرِموا خير الدنيا والآخرة، وأعرضوا عمَّن كلُّ السعادة والفوز في ذكره وعبوديَّته، وأقبلوا على مَن كلُّ الشقاوة والخيبة في الاشتغال به. وهذه من الآداب التي ينبغي للعبد أن يراعِيَها حقَّ رعايتها، وهي الإكثار من ذكر الله آناء الليل والنهار، خصوصاً طرفي النهار، مخلصاً خاشعاً متضرِّعاً متذللاً ساكناً متواطئاً عليه قلبه ولسانه بأدبٍ ووَقارٍ وإقبال على الدُّعاء والذِّكر وإحضارٍ له بقلبه وعدم غفلة؛ فإنَّ الله لا يستجيبُ دعاءً من قلبٍ غافلٍ لاهٍ."},{"a":"7:206","t":"ثم ذكر تعالى أن له عباداً مستديمين لعبادته، ملازمين لخدمته، وهم الملائكة. فلتعلموا أن الله لا يريدُ أن يتكثَّر بعبادتكم من قلَّة، ولا ليتعزَّز بها من ذِلَّة، وإنما يريدُ نفع أنفسكم، وأن تربحوا عليه أضعاف أضعاف ما عملتم، فقال: ﴿إنَّ الذين عند ربِّك﴾: من الملائكة المقرَّبين وحملة العرش والكروبيين، ﴿لا يستكبِرون عن عبادته﴾: بل يُذْعِنون لها وينقادون لأوامر ربِّهم، ﴿ويسبِّحونه﴾: الليل والنهار لا يفترون. ﴿وله﴾ وحده لا شريك له ﴿يسجُدون﴾: فليقتَدِ العبادُ بهؤلاء الملائكة الكرام، وليداوِموا على عبادة الملك العلاَّم. تم تفسير سورة الأعراف. ولله الحمد والشكر والثناء. وصلى الله على محمد وآله وصحبه وسلم * * *"}]}/*SAADI-DATA*/;</script>

/* الأعداد الترتيبية للأوجه: آحاد وعشرات ومركّبات («الثاني عشر»، «السادس والعشرون») */
const ORD_UNITS = [["الحادي",1],["الثاني",2],["الثالث",3],["الرابع",4],["الخامس",5],
                   ["السادس",6],["السابع",7],["الثامن",8],["التاسع",9]];
const ORD_TENS  = [["العشرون",20],["العشرين",20],["الثلاثون",30],["الثلاثين",30],
                   ["الأربعون",40],["الأربعين",40],["الخمسون",50],["الخمسين",50]];
const ORD_ONES  = [["الأول",1],["الثاني",2],["الثالث",3],["الرابع",4],["الخامس",5],
                   ["السادس",6],["السابع",7],["الثامن",8],["التاسع",9],["العاشر",10]];

const AUDIO_ID = "quran-by--alhosary-mad-almonfasel--morattal-128-kb----604-part-full-quran-604-";

function normAr(s){
  return String(s==null?"":s)
    .replace(/[ً-ْٰـ]/g,"")   // تشكيل وتطويل
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/\s+/g," ").trim();
}
function surahKey(s){ return normAr(s).replace(/^سوره\s*/,"").replace(/^ال/,""); }

function findSurahPage(name){
  const k = surahKey(name);
  if (!k) return null;
  const hit = SURAHS.find(x => surahKey(x[0]) === k);
  return hit ? hit[1] : null;
}
function parseFaceOrdinal(txt){
  const t = normAr(txt);
  if (!t) return null;
  const digits = t.match(/\d+/);
  if (digits) return +digits[0];
  const has = w => t.indexOf(normAr(w)) !== -1;

  // «السادس والعشرون» = ٦ + ٢٠
  for (const [uw,u] of ORD_UNITS)
    for (const [tw,d] of ORD_TENS)
      if (has(uw) && has("و" + tw)) return u + d;

  for (const [tw,d] of ORD_TENS) if (has(tw)) return d;          // «العشرون»
  for (const [uw,u] of ORD_UNITS) if (has(uw) && has("عشر")) return 10 + u;  // «الثاني عشر»
  for (const [w,n] of ORD_ONES)  if (has(w)) return n;           // «الأول» … «العاشر»
  return null;
}
/* رقم صفحة المصحف المحسوب من السورة والوجه (الوجه الأول = أول صفحة في السورة) */
function computeMushafPage(portion){
  const p = portion || {};
  const start = findSurahPage(p.surah);
  const ord = parseFaceOrdinal(p.face);
  if (!start || !ord) return null;
  return Math.min(604, Math.max(1, start + ord - 1));
}
/* الصفحة المعتمدة: ما كتبته المعلمة يدويًا، وإلا المحسوبة */
function activePage(){
  const p = S.settings.portion || {};
  const manual = parseInt(String(p.page||"").match(/\d+/) ? String(p.page).match(/\d+/)[0] : "", 10);
  if (!isNaN(manual) && manual >= 1 && manual <= 604) return manual;
  return computeMushafPage(p);
}
/* جلب تفسير السعدي آليًا — واجهة quran.com الإصدار الرابع، معرّف التفسير ٩١ */
const SAADI_ID = 91;
function stripTafsirHTML(html){
  // DOMParser خامل: لا يحمّل صورًا ولا ينفّذ نصوصًا برمجية من المحتوى الخارجي
  const doc = new DOMParser().parseFromString(String(html||""), "text/html");
  doc.querySelectorAll("span").forEach(sp=>{
    const t = sp.textContent.replace(/[{}]/g,"").trim();
    sp.textContent = t ? " ﴿" + t + "﴾ " : "";
  });
  return (doc.body.textContent||"").replace(/\s+/g," ").replace(/\s+([،.:؛؟])/g,"$1").trim();
}
/* السعدي يفسّر مجموعة آيات بنص واحد، فندمج المتكرر بدل تكراره */
function formatSaadi(entries){
  const groups = [];
  for (const e of (entries||[])){
    const txt = stripTafsirHTML(e && e.t);
    if (!txt) continue;
    const ayah = String((e && e.a) || "").split(":")[1] || "";
    const last = groups[groups.length - 1];
    if (last && last.txt === txt) last.to = ayah;
    else groups.push({ from:ayah, to:ayah, txt });
  }
  if (!groups.length) return "";
  return groups.map(g =>
    "[ " + (g.from === g.to ? "الآية " + g.from : "الآيات " + g.from + " – " + g.to) + " ]\n" + g.txt
  ).join("\n\n");
}
const SAADI = () => (window.SAADI_STORE || {});
const saadiEmbedded = pg => { const a = SAADI()[String(pg)]; return (a && a.length) ? a : null; };

async function fetchSaadiForPage(pg, onStatus){
  // النسخة المضمّنة أولًا: فورية وتعمل بلا إنترنت
  const local = saadiEmbedded(pg);
  if (local){
    if (onStatus) onStatus("من النسخة المضمّنة…");
    const out = formatSaadi(local);
    if (out) return out;
  }

  const vr = await fetch("https://api.quran.com/api/v4/verses/by_page/" + pg + "?fields=verse_key&per_page=50");
  if (!vr.ok) throw new Error("verses:" + vr.status);
  const keys = ((await vr.json()).verses || []).map(v => v.verse_key);
  if (!keys.length) throw new Error("no-verses");

  const entries = [];
  for (let i = 0; i < keys.length; i++){
    if (onStatus) onStatus("جلب التفسير… " + (i+1) + "/" + keys.length);
    const r = await fetch("https://api.quran.com/api/v4/tafsirs/" + SAADI_ID + "/by_ayah/" + keys[i]);
    if (!r.ok) continue;
    const j = await r.json();
    entries.push({ a: keys[i], t: (j && j.tafsir && j.tafsir.text) || "" });
  }
  const out = formatSaadi(entries);
  if (!out) throw new Error("empty");
  return out;
}

function prettyDate(k){
  const [y,m,d] = k.split("-").map(Number);

function minutesOf(hhmm){ const p=String(hhmm||"0:0").split(":"); return (+p[0]||0)*60 + (+p[1]||0); }
/* عرض الوقت بنظام ١٢ ساعة: "15:30" → "3:30 م" */
function fmt12(hhmm){
  const p = String(hhmm||"").split(":");
  const h = +p[0], m = +p[1];
  if (isNaN(h) || isNaN(m)) return String(hhmm||"");
  const suffix = h < 12 ? "ص" : "م";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + pad2(m) + " " + suffix;
}
function sessionRange(){ return fmt12(S.settings.start) + " — " + fmt12(S.settings.end); }
function fmtClock(totalSec){
  const s = Math.max(0, Math.round(totalSec));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h>0 ? h+":"+pad2(m)+":"+pad2(sec) : pad2(m)+":"+pad2(sec);
}

const LS = "utrujjah.v1";
const Store = {
  db:null, mode:"local", ready:false,
  _local:(()=>{ try{ return JSON.parse(lsGet(LS)||"{}"); }catch(e){ return {}; } })(),
  _subs:{},
  _flush(){ lsSet(LS, JSON.stringify(this._local)); },

  async init(){
    try{
      if (window.claude && typeof window.claude.use === "function"){
        this.db = await window.claude.use("db");
      }
    }catch(e){ this.db = null; }
    this.mode = this.db ? "cloud" : "local";
    this.ready = true;
    setSyncChip();
    for (const k in this._subs) this._subs[k]();
  },

  /* وثيقة مفردة */
  watchDoc(path, cb){
    const key = "d:"+path;
    if (this.db){
      this.db.doc(path).onSnapshot(
        snap => cb(snap.exists ? snap.data() : null),
        () => cb(this._local[key] || null)
      );
    } else {
      const emit = () => cb(this._local[key] || null);
      this._subs[key] = emit; emit();
    }
  },
  async setDoc(path, data){
    const key = "d:"+path;
    this._local[key] = deepClone(data); this._flush();
    if (this._subs[key]) this._subs[key]();
    if (this.db){
      try{ await this.db.doc(path).set(deepClone(data)); }
      catch(e){ console.warn("تعذّر الحفظ في القاعدة المشتركة", e); }
    }
  },

  /* مجموعة */
  watchCol(path, cb){
    const key = "c:"+path;
    if (this.db){
      this.db.collection(path).onSnapshot(
        snap => cb(snap.docs.map(d => Object.assign({__id:d.id}, d.data()))),
        () => cb(Object.values(this._local[key]||{}))
      );
    } else {
      const emit = () => cb(Object.values(this._local[key]||{}));
      this._subs[key] = emit; emit();
    }
  },
  async setInCol(path, id, data){
    const key = "c:"+path;
    if (!this._local[key]) this._local[key] = {};
    this._local[key][id] = Object.assign({__id:id}, deepClone(data)); this._flush();
    if (this._subs[key]) this._subs[key]();
    if (this.db){
      try{ await this.db.collection(path).doc(id).set(deepClone(data)); }
      catch(e){ console.warn("تعذّر الحفظ في القاعدة المشتركة", e); }
    }
  },
  async delFromCol(path, id){
    const key = "c:"+path;
    if (this._local[key]) { delete this._local[key][id]; this._flush(); }
    if (this._subs[key]) this._subs[key]();
    if (this.db){
      try{ await this.db.collection(path).doc(id).delete(); }catch(e){}
    }
  }
};

/* ============================ الوقت ============================ */
function sessionInfo(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const a = minutesOf(S.settings.start), b = minutesOf(S.settings.end);
  const span = Math.max(1, b - a);
  const segs = (S.settings.segments||[]).filter(s => s && +s.min > 0);
  const segTotal = segs.reduce((t,s)=> t + (+s.min||0), 0) || span;

  let phase = "before", elapsed = 0, remainSec = 0, ratio = 0;
  if (nowMin < a){ phase = "before"; remainSec = (a - nowMin) * 60; ratio = 0; }
  else if (nowMin >= b){ phase = "after"; remainSec = 0; ratio = 1; }
  else { phase = "during"; elapsed = nowMin - a; remainSec = (b - nowMin) * 60; ratio = elapsed / span; }

  // القسم الجاري بحسب تقسيم الوقت
  let acc = 0, current = null, currentIdx = -1;
  if (phase === "during"){
    const scaled = ratio * segTotal;
    for (let i=0;i<segs.length;i++){
      if (scaled < acc + (+segs[i].min||0)){ current = segs[i]; currentIdx = i; break; }
      acc += (+segs[i].min||0);
    }
    if (!current && segs.length){ current = segs[segs.length-1]; currentIdx = segs.length-1; }
  }
  return { phase, ratio, remainSec, segs, segTotal, current, currentIdx, span };
}

function tickClock(){
  const info = sessionInfo();
  const t = $("#clkT"), l = $("#clkL"), p = $("#clkProg"), sn = $("#segNow");
  if (t){
    const C = 2 * Math.PI * 74;
    if (info.phase === "before"){ t.textContent = fmtClock(info.remainSec); l.textContent = "حتى بداية الحلقة"; }
    else if (info.phase === "after"){ t.textContent = "انتهت"; l.textContent = "نلقاكِ غدًا بإذن الله"; }
    else { t.textContent = fmtClock(info.remainSec); l.textContent = "المتبقي من الحلقة"; }
    if (p) p.setAttribute("stroke-dashoffset", String(C * (1 - info.ratio)));
  }
  if (sn){
    sn.textContent = info.phase === "during" && info.current
      ? info.current.name
      : (info.phase === "before" ? "لم تبدأ الحلقة بعد" : "انتهى وقت الحلقة");
  }
  document.querySelectorAll("[data-segidx]").forEach(el => {
    el.classList.toggle("now", +el.dataset.segidx === info.currentIdx);
  });
}

/* فشل تحميل صورة الوجه = المصادر الخارجية محجوبة في هذا السياق،
   فنخفي مشغّل الصوت المعطّل ونكتفي بالرابط. */
/* تسلسل المصادر: الملفات المرفقة ← الإنترنت ← زر يفتحها في تبويب */
function setMediaSource(src){
  if (S.mediaSource === src) return;
  S.mediaSource = src;
  document.documentElement.classList.toggle("no-remote", src === "none");
  render();
}
function mediaOK(el){ setMediaSource(el.dataset.tried ? "remote" : "local"); }
function imgFallback(el){
  if (!el.dataset.tried && el.dataset.remote){
    el.dataset.tried = "1"; el.src = el.dataset.remote; return;
  }
  const box = document.getElementById("mushafBox");
  if (box) box.classList.add("failed");
  setMediaSource("none");
}
function audioFallback(el){
  if (!el.dataset.tried && el.dataset.remote){
    el.dataset.tried = "1"; el.src = el.dataset.remote;
    try{ el.load(); }catch(e){}
  }
}

function portionText(){
  const p = S.settings.portion || {};
  const face = (p.face||"").trim(), surah = (p.surah||"").trim();
  if (!face && !surah) return "لم يُحدَّد مقدار اليوم بعد";
  return (face || "الوجه") + (surah ? " من سورة " + surah : "");
}

function tReport(){
  const keys = sortedDayKeys().slice(-7);
  const list = S.roster.students||[];
  if (!keys.length || !list.length) return `<section class="card"><div class="empty">لا توجد بيانات كافية للتقرير بعد. سجّلي الحضور والتقييم أولًا.</div></section>`;

  let tPresent=0, tMarked=0, scoreSum=0, scoreN=0, tasksDone=0, tasksAll=0;
  const rows = list.map(s=>{
    let pres=0, marked=0, ss=0, sn=0, td=0, ta=0;
    const rateCells = keys.map(k=>{
      const r = (S.days[k].records||{})[s.id] || {};
      if (r.att){ marked++; if (r.att==="present") pres++; }
      if (r.rating){ ss += RATINGS[r.rating].score; sn++; }
      (r.tasks||[]).forEach(t=>{ ta++; if (t.done) td++; });
      const c = r.rating ? RATINGS[r.rating].color : "var(--line)";
      return `<i title="${esc(prettyDate(k))}" style="width:15px;height:15px;border-radius:4px;background:${c};display:block"></i>`;
    }).join("");
    tPresent+=pres; tMarked+=marked; scoreSum+=ss; scoreN+=sn; tasksDone+=td; tasksAll+=ta;
    const pct = marked ? Math.round(pres/marked*100) : 0;
    const avg = sn ? (ss/sn) : 0;
    const avgKey = avg>=3.5?"excellent":avg>=2.5?"vgood":avg>=1.5?"good":avg>0?"weak":null;
    const bens = S.benefits.filter(b=>b.studentId===s.id && b.status==="approved").length;
    return `<tr>
      <td><b>${esc(s.name)}</b></td>
      <td class="num">${pres}/${marked||0}<div class="bar"><i style="width:${pct}%"></i></div></td>
      <td>${avgKey?`<span class="pill" style="background:${RATINGS[avgKey].bg};color:${RATINGS[avgKey].color};border-color:${RATINGS[avgKey].color}"><i class="dot"></i>${esc(RATINGS[avgKey].label)}</span>`:`<span class="muted">—</span>`}</td>
      <td><div class="row tight">${rateCells}</div></td>
      <td class="num">${td}/${ta}</td>
      <td class="num">${bens}</td>
      <td class="num">${streakOf(s.id)}</td>
    </tr>`;
  }).join("");

  const attPct = tMarked ? Math.round(tPresent/tMarked*100) : 0;
  const avgAll = scoreN ? (scoreSum/scoreN).toFixed(2) : "—";
  const benApproved = S.benefits.filter(b=>b.status==="approved").length;

  return `<div class="grid" style="gap:16px">
    <div class="tiles">
      <div class="tile"><span>نسبة الحضور</span><b class="num">${attPct}%</b><div class="bar"><i style="width:${attPct}%"></i></div></div>
      <div class="tile"><span>متوسط التقييم (من ٤)</span><b class="num">${avgAll}</b></div>
      <div class="tile"><span>التكاليف المنجزة</span><b class="num">${tasksDone}/${tasksAll}</b></div>
      <div class="tile"><span>فوائد معتمدة</span><b class="num">${benApproved}</b></div>
    </div>
    <section class="card">
      <header>
        <h3>نواتج الحلقة — آخر ${keys.length} أيام</h3>
        <span class="muted" style="font-size:12.5px">${esc(prettyDate(keys[0]))} — ${esc(prettyDate(keys[keys.length-1]))}</span>
        <button class="btn sm noprint" id="printRep">طباعة</button>
      </header>
      <div class="tablewrap"><table>
        <thead><tr><th>الطالبة</th><th>الحضور</th><th>متوسط التقييم</th><th>سجل التقييم</th><th>التكاليف</th><th>الفوائد</th><th>السلسلة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </section>
  </div>`;
}

/* --- رسم العجلة --- */
let wheelAngle = 0, wheelSpinning = false;
function wheelNames(){
  const list = S.roster.students||[];
  const pool = S.wheelSkip ? list.filter(s=>!(S.wheelDone||[]).includes(s.id)) : list;
  return pool.length ? pool : list;
}
function drawWheel(){
  const cv = $("#wheelCv"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const N = cv.width, R = N/2, cx = R, cy = R;
  const names = wheelNames();
  const css = getComputedStyle(document.documentElement);
  const line = css.getPropertyValue("--surface").trim() || "#fff";
  const ink  = css.getPropertyValue("--ink").trim() || "#000";
  const wedge = ["#1F5B43","#2C7A5B","#A8791A","#C99B10","#D4711F","#2E7D52","#3E6E58","#8A6A2A"];

  ctx.clearRect(0,0,N,N);
  if (!names.length) return;
  const step = (Math.PI*2)/names.length;

  ctx.save(); ctx.translate(cx,cy); ctx.rotate(wheelAngle);
  names.forEach((s,i)=>{
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,R-14, i*step, (i+1)*step); ctx.closePath();
    ctx.fillStyle = wedge[i % wedge.length]; ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = 3; ctx.stroke();

    ctx.save();
    ctx.rotate(i*step + step/2);
    // محاذاة فيزيائية لليمين: يمتد النص العربي من الحافة نحو المركز
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFFFFF";
    const fs = Math.max(15, Math.min(34, 260/Math.max(3,names.length) + 14));
    ctx.font = "700 " + fs + "px 'Noto Naskh Arabic', 'Amiri', serif";
    ctx.fillText(s.name, R-34, 0, R-92);
    ctx.restore();
  });
  ctx.restore();

  ctx.beginPath(); ctx.arc(cx,cy,44,0,Math.PI*2);
  ctx.fillStyle = line; ctx.fill();
  ctx.strokeStyle = ink; ctx.globalAlpha=.12; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle = ink; ctx.font = "700 30px 'Noto Naskh Arabic', 'Amiri', serif";
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("أ", cx, cy+2);
}
function spinWheel(){
  const names = wheelNames();
  if (wheelSpinning || !names.length) return;
  wheelSpinning = true;
  const idx = Math.floor(Math.random()*names.length);
  const step = (Math.PI*2)/names.length;
  // المؤشر في الأعلى => الزاوية -PI/2
  const target = (Math.PI*2*6) + (-Math.PI/2 - (idx*step + step/2));
  const from = wheelAngle % (Math.PI*2);
  const to = target;
  const dur = 4200, t0 = performance.now();
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ wheelAngle = to; drawWheel(); finish(); return; }
  (function frame(now){
    const t = Math.min(1,(now - t0)/dur);
    const e = 1 - Math.pow(1-t, 4);
    wheelAngle = from + (to - from) * e;
    drawWheel();
    if (t < 1) requestAnimationFrame(frame); else finish();
  })(t0);
  function finish(){
    wheelSpinning = false;
    const win = names[idx];
    S.wheelWinner = win.name;
    S.wheelDone = S.wheelDone || [];
    if (!S.wheelDone.includes(win.id)) S.wheelDone.push(win.id);
    const el = $("#wheelWinner"); if (el) el.textContent = win.name;
    render();
  }
}

/* ============================ العرض ============================ */
let clockTimer = null;
let lastSig = null;
function render(){
  const view = $("#view");
  const active = document.activeElement;
  const memo = active && active.id ? {id:active.id, start:active.selectionStart, end:active.selectionEnd} : null;
  // نحافظ على موضع التمرير ما دمنا في الصفحة نفسها، ونعود للأعلى عند تبديل الصفحة أو التبويب
  const sig = S.role + "/" + (S.role==="teacher" ? S.tTab : (S.me||"pick"));
  const keepScroll = sig === lastSig;
  const scrollY = window.scrollY;
  lastSig = sig;

  $("#mkName").textContent = S.settings.circleName || "حلقة الأترجة الافتراضية";
  $("#btnStudent").setAttribute("aria-pressed", S.role==="student");
  $("#btnTeacher").setAttribute("aria-pressed", S.role==="teacher");
  view.innerHTML = S.role === "student" ? viewStudent() : viewTeacher();

  window.scrollTo(0, keepScroll ? scrollY : 0);
  if (memo){
    const el = document.getElementById(memo.id);
    if (el && typeof el.focus === "function"){
      el.focus();
      try{ if (memo.start!=null && el.setSelectionRange) el.setSelectionRange(memo.start, memo.end); }catch(e){}
    }
  }
  applyAudioPrefs();
  if (S.role === "teacher" && S.tTab === "settings") syncPageHint(false);
  if (S.role === "teacher" && S.tTab === "wheel"){
    drawWheel();
    // إعادة الرسم بعد جاهزية الخطوط حتى تظهر الأسماء بالخط الصحيح
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if (!wheelSpinning) drawWheel(); });
  }
  tickClock();
  if (!clockTimer) clockTimer = setInterval(tickClock, 1000);
}

/* ============================ الأحداث ============================ */
$("#btnStudent").addEventListener("click", ()=>{ S.role="student"; lsSet("utrujjah.role","student"); render(); });
$("#btnTeacher").addEventListener("click", ()=>{ S.role="teacher"; lsSet("utrujjah.role","teacher"); S.passErr=""; render(); });

document.addEventListener("click", async (e)=>{
  const t = e.target.closest("button, a");
  if (!t) return;

  /* --- اختيار الطالبة --- */
  if (t.id === "pickGo"){
    const v = $("#pickMe") && $("#pickMe").value;
    if (v){ S.me = v; lsSet("utrujjah.me", v); render(); }
    return;
  }
  if (t.id === "switchMe"){ S.me=null; lsDel("utrujjah.me"); render(); return; }

  /* --- رمز المعلمة --- */
  if (t.id === "passGo"){
    const v = ($("#passIn")||{}).value || "";
    if (v && v === String(S.settings.pass||"")){
      S.teacherOK = true; ssSet("utrujjah.t","1"); S.passErr="";
    } else { S.passErr = "الرمز غير صحيح، حاولي مرة أخرى."; }
    render(); return;
  }

  /* --- تبويبات --- */
  if (t.dataset.explain){ S.explainTab = t.dataset.explain; render(); return; }
  if (t.dataset.ttab){ S.tTab = t.dataset.ttab; render(); return; }

  /* --- فائدة الطالبة --- */
  if (t.id === "benefitSave"){
    const txt = (($("#benefitTxt")||{}).value||"").trim();
    const me = studentById(S.me); if (!me) return;
    const id = S.today + "_" + me.id;
    if (!txt){ await Store.delFromCol("benefits", id); return; }
    await Store.setInCol("benefits", id, {
      studentId: me.id, studentName: me.name, date: S.today, text: txt, status:"pending"
    });
    return;
  }

  /* --- المعلمة: الطالبات --- */
  if (t.id === "addStudent"){
    const inp = $("#newStudent"); const name = (inp.value||"").trim();
    if (!name) return;
    S.roster.students = (S.roster.students||[]).concat([{ id:"s"+uid(), name, weak:[], strong:[] }]);
    inp.value = ""; await saveRoster(); return;
  }
  if (t.dataset.del){
    const s = studentById(t.dataset.del);
    if (s && confirm("حذف الطالبة «" + s.name + "» من السجل؟")){
      S.roster.students = S.roster.students.filter(x=>x.id!==t.dataset.del);
      await saveRoster();
    }
    return;
  }
  if (t.dataset.att){
    const sid = t.closest("tr").dataset.sid;
    const cur = rec(sid).att;
    await saveRecord(sid, { att: cur === t.dataset.att ? "" : t.dataset.att });
    return;
  }
  if (t.dataset.rate){
    const sid = t.closest("tr").dataset.sid;
    const cur = rec(sid).rating;
    await saveRecord(sid, { rating: cur === t.dataset.rate ? "" : t.dataset.rate });
    return;
  }
  if (t.dataset.addtask){
    const txt = prompt("نص التكليف (مثال: تكرار الوجه ١٠ مرات، اختبار في الوجه السابق):");
    if (!txt || !txt.trim()) return;
    const sid = t.dataset.addtask;
    const kind = /اختبار/.test(txt) ? "اختبار" : /تكرار/.test(txt) ? "تكرار" : "";
    const tasks = (rec(sid).tasks||[]).concat([{ id:uid(), t:txt.trim(), kind, done:false }]);
    await saveRecord(sid, { tasks });
    return;
  }
  if (t.id === "taskAll"){
    const txt = prompt("تكليف يُسنَد لجميع الطالبات:");
    if (!txt || !txt.trim()) return;
    const kind = /اختبار/.test(txt) ? "اختبار" : /تكرار/.test(txt) ? "تكرار" : "";
    for (const s of (S.roster.students||[])){
      const tasks = (rec(s.id).tasks||[]).concat([{ id:uid(), t:txt.trim(), kind, done:false }]);
      await saveRecord(s.id, { tasks });
    }
    return;
  }
  if (t.dataset.deltask){
    const sid = t.dataset.sid;
    await saveRecord(sid, { tasks: (rec(sid).tasks||[]).filter(x=>x.id!==t.dataset.deltask) });
    return;
  }
  if (t.dataset.faces){ S.facesOpen = S.facesOpen === t.dataset.faces ? null : t.dataset.faces; render(); return; }
  if (t.dataset.rmface){
    const s = studentById(t.dataset.sid); if (!s) return;
    const arr = (s[t.dataset.rmface]||[]).slice(); arr.splice(+t.dataset.i,1);
    s[t.dataset.rmface] = arr; await saveRoster(); return;
  }

  /* --- الفوائد --- */
  if (t.dataset.approve){
    const b = S.benefits.find(x=>x.__id===t.dataset.approve); if (!b) return;
    await Store.setInCol("benefits", b.__id, { studentId:b.studentId, studentName:b.studentName, date:b.date, text:b.text, status:"approved" });
    return;
  }
  if (t.dataset.unapprove){
    const b = S.benefits.find(x=>x.__id===t.dataset.unapprove); if (!b) return;
    await Store.setInCol("benefits", b.__id, { studentId:b.studentId, studentName:b.studentName, date:b.date, text:b.text, status:"pending" });
    return;
  }
  if (t.dataset.delben){ await Store.delFromCol("benefits", t.dataset.delben); return; }

  /* --- الإعدادات --- */
  if (t.id === "autoPage"){ syncPageHint(true); return; }

  if (t.id === "fetchSaadi"){
    const say = m => { const el = $("#saadiStatus"); if (el) el.textContent = m; };
    const pg = formPage();
    if (!pg){ say("حدّدي السورة والوجه أولًا."); return; }
    t.disabled = true;
    say(saadiEmbedded(pg) ? "جارٍ التحضير…" : "جارٍ الاتصال بمصدر التفسير…");
    try{
      const txt = await fetchSaadiForPage(pg, say);
      const ta = $("#setSaadi");
      if (ta) ta.value = txt;
      say("تم جلب تفسير الصفحة " + pg + " — راجعيه ثم احفظي الإعدادات.");
    }catch(err){
      say("تعذّر الجلب: هذا الوجه خارج النسخة المضمّنة (الأنعام والأعراف)، والاتصال بالمصدر محجوب في الصفحة المنشورة. افتحي الملف المحلي أو انسخي من الشاملة.");
    }
    const b = $("#fetchSaadi"); if (b) b.disabled = false;
    return;
  }
  if (t.id === "segAdd"){
    S.settings.segments = (S.settings.segments||[]).concat([{name:"قسم جديد", min:10}]);
    render(); return;
  }
  if (t.dataset.segdel){
    S.settings.segments = (S.settings.segments||[]).filter((_,i)=> i !== +t.dataset.segdel);
    render(); return;
  }
  if (t.id === "saveAll"){
    const gh = (($("#setGhareeb")||{}).value||"").split("\n").map(l=>{
      const i = l.indexOf("="); if (i < 0) return null;
      const w = l.slice(0,i).trim(), m = l.slice(i+1).trim();
      return (w||m) ? {w,m} : null;
    }).filter(Boolean);
    const segments = Array.from(document.querySelectorAll('[data-seg="name"]')).map((el,i)=>({
      name: el.value.trim() || "قسم",
      min: +(document.querySelector('[data-seg="min"][data-i="'+i+'"]')||{value:0}).value || 0
    }));
    await saveSettings({
      circleName:  ($("#setCircle")||{}).value || DEFAULT_SETTINGS.circleName,
      teacherName: (($("#setTeacher")||{}).value||"").trim(),
      welcome:     ($("#setWelcome")||{}).value || "",
      start:      ($("#setStart")||{}).value || "15:30",
      end:        ($("#setEnd")||{}).value || "16:30",
      meetLink:   ($("#setLink")||{}).value || "",
      meetLabel:  ($("#setLinkLabel")||{}).value || "درس اليوم",
      portion:{ face:($("#setFace")||{}).value||"", surah:($("#setSurah")||{}).value||"",
                page:($("#setPage")||{}).value||"", note:($("#setNote")||{}).value||"" },
      shamelaPage: Math.max(1, parseInt(($("#setShamela")||{}).value,10) || 459),
      saadi:      ($("#setSaadi")||{}).value || "",
      ghareeb:    gh,
      absenceMsg: ($("#setAbsence")||{}).value || "",
      makeup:     ($("#setMakeup")||{}).value || "",
      pass:       (($("#setPass")||{}).value||"").trim() || "1234",
      segments
    });
    const m = $("#saveMsg"); if (m){ m.textContent = "حُفظت الإعدادات ✓"; setTimeout(()=>{ if($("#saveMsg")) $("#saveMsg").textContent=""; }, 2500); }
    return;
  }

  /* --- العجلة والتقرير --- */
  if (t.id === "wheelSpin"){ spinWheel(); return; }
  if (t.id === "wheelReset"){ S.wheelDone = []; S.wheelWinner = null; render(); return; }
  if (t.id === "printRep"){ window.print(); return; }
});

/* رقم الصفحة من نموذج الإعدادات المفتوح (قبل الحفظ) */
function formPage(){
  const pg = $("#setPage");
  const n = pg ? parseInt(pg.value, 10) : NaN;
  if (!isNaN(n) && n >= 1 && n <= 604) return n;
  const f = $("#setFace"), s = $("#setSurah");
  return (f && s) ? computeMushafPage({ surah:s.value, face:f.value }) : null;
}

/* تحديث رقم الصفحة تلقائيًا من السورة والوجه داخل الإعدادات */
function syncPageHint(fill){
  const f = $("#setFace"), s = $("#setSurah"), pg = $("#setPage"), h = $("#pageHint");
  if (!f || !s || !pg || !h) return;
  const auto = computeMushafPage({ surah:s.value, face:f.value });
  if (fill && auto) pg.value = auto;
  h.innerHTML = auto
    ? `الحساب التلقائي: صفحة <b class="num">${auto}</b> — ومنها تُجلب صورة الوجه وتلاوة الحصري.`
    : `اكتبي السورة والوجه (مثال: «الأنعام» و«الوجه الثاني») ليُحسب رقم الصفحة تلقائيًا.`;

  const st = $("#saadiStatus");
  if (st && !st.dataset.busy){
    const cur = formPage();
    st.textContent = cur
      ? (saadiEmbedded(cur) ? "تفسير هذا الوجه مضمّن — يعمل بلا إنترنت." : "هذا الوجه خارج النسخة المضمّنة؛ يحتاج اتصالًا بالمصدر.")
      : "";
  }
}
document.addEventListener("input", (e)=>{
  const id = e.target.id;
  if (id === "setFace" || id === "setSurah") syncPageHint(true);
  else if (id === "setPage") syncPageHint(false);
});

/* إنجاز التكاليف من صفحة الطالبة */
document.addEventListener("change", async (e)=>{
  const cb = e.target;
  if (cb.dataset && cb.dataset.task && S.me){
    const tasks = (rec(S.me).tasks||[]).map(x => x.id === cb.dataset.task ? Object.assign({}, x, {done: cb.checked}) : x);
    await saveRecord(S.me, { tasks });
    return;
  }
  if (cb.id === "wheelSkip"){ S.wheelSkip = cb.checked; render(); return; }

  if (cb.id === "audioLoop"){
    S.audioLoop = cb.checked; lsSet("utrujjah.loop", cb.checked ? "1" : "0");
    applyAudioPrefs(); return;
  }
  if (cb.id === "audioRate"){
    S.audioRate = parseFloat(cb.value) || 1; lsSet("utrujjah.rate", String(S.audioRate));
    applyAudioPrefs(); return;
  }
});

/* تكرار الوجه وسرعة التلاوة — يبقيان محفوظين لكل جهاز */
function applyAudioPrefs(){
  const a = $("#pageAudio");
  if (!a) return;
  a.loop = !!S.audioLoop;
  try{ a.playbackRate = +S.audioRate || 1; }catch(e){}
}

/* إضافة الأوجه بالضغط على Enter */
document.addEventListener("keydown", async (e)=>{
  const el = e.target;
  if (e.key !== "Enter") return;
  if (el.dataset && el.dataset.addface){
    e.preventDefault();
    const s = studentById(el.dataset.sid); const v = (el.value||"").trim();
    if (!s || !v) return;
    const k = el.dataset.addface;
    s[k] = (s[k]||[]).concat([v]); el.value = "";
    await saveRoster(); return;
  }
  if (el.id === "newStudent"){ e.preventDefault(); const b = $("#addStudent"); if (b) b.click(); }
});

/* ============================ الإقلاع ============================ */
render();

Store.init().then(async ()=>{
  Store.watchDoc("halaqa/settings", d=>{
    S.settings = Object.assign({}, DEFAULT_SETTINGS, d||{});
    if (!d && !S.seeded){ S.seeded = true; Store.setDoc("halaqa/settings", S.settings); }
    render();
  });
  Store.watchDoc("halaqa/roster", d=>{
    S.roster = (d && Array.isArray(d.students)) ? d : deepClone(DEFAULT_ROSTER);
    if (!d) Store.setDoc("halaqa/roster", S.roster);
    render();
  });
  Store.watchCol("days", arr=>{
    const map = {};
    arr.forEach(d => { map[d.__id] = { records: d.records || {} }; });
    S.days = map;
    if (!S.days[S.today]) S.days[S.today] = { records:{} };
    render();
  });
  Store.watchCol("benefits", arr=>{ S.benefits = arr || []; render(); });
});

/* تجديد التاريخ عند تجاوز منتصف الليل */
setInterval(()=>{
  const k = dayKey();
  if (k !== S.today){ S.today = k; if (!S.days[k]) S.days[k] = {records:{}}; render(); }
}, 60000);
</script>
