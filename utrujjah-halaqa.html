 التجمل فيها ونظافة السترة من الأدناس والأنجاس. ثم قال: ﴿وكلوا واشربوا﴾؛ أي: مما رزقكم الله من الطيبات، ﴿ولا تسرِفوا﴾: في ذلك، والإسراف إما أن يكون بالزيادة على القدر الكافي والشره في المأكولات التي تضر بالجسم، وإما أن يكون بزيادة الترفُّه والتنوُّق في المآكل والمشارب واللباس، وإما بتجاوز الحلال إلى الحرام. ﴿إنَّه لا يحبُّ المسرفين﴾: فإن السرف يبغضه الله، ويضرُّ بدن الإنسان ومعيشته، حتى إنه ربما أدَّت به الحالُ إلى أن يعجز عما يجب عليه من النفقات. ففي هذه الآية الكريمة الأمر بتناول الأكل والشرب والنهي عن تركهما وعن الإسراف فيهما."},{"a":"7:32","t":"يقول تعالى منكراً على من تعنَّت وحرَّم ما أحلَّ الله من الطيبات: ﴿قل مَنْ حَرَّمَ زينةَ الله التي أخرج لعباده﴾: من أنواع اللباس على اختلاف أصنافه والطيبات من الرزق من مأكل ومشرب بجميع أنواعه؛ أي: من هذا الذي يقدم على تحريم ما أنعم الله بها على العباد؟ ومن ذا الذي يضيِّق عليهم ما وسعه الله؟ وهذا التوسيع من الله لعباده بالطيبات جعله لهم ليستعينوا به على عبادته فلم يُبِحْه إلا لعباده المؤمنين، ولهذا قال: ﴿قل هي للذين آمنوا في الحياة الدُّنيا خالصةً يوم القيامة﴾؛ أي: لا تبعة عليهم فيها. ومفهوم الآية أن من لم يؤمن بالله بل استعان بها على معاصيه؛ فإنها غير خالصة له ولا مباحة، بل يعاقب عليها وعلى التنعُّم بها، ويسأل عن النعيم يوم القيامة. ﴿كذلك نفصِّل الآيات﴾؛ أي: نوضحها ونبيِّنها، ﴿لقوم يعلمون﴾: لأنهم الذين ينتفعون بما فصَّله الله من الآيات، ويعلمون أنها من عند الله، فيعقلونها ويفهمونها."},{"a":"7:33","t":"ثم ذكر المحرمات التي حرَّمها الله في كلِّ شريعة من الشرائع، فقال: ﴿قلْ إنَّما حرَّم ربِّي الفواحش﴾؛ أي: الذنوب الكبار التي تُستفحش، وتستقبح لشناعتها وقبحها، وذلك كالزِّنا واللواط ونحوهما. وقوله: ﴿ما ظهر منها وما بطن﴾؛ أي: الفواحش التي تتعلَّق بحركات البدن والتي تتعلَّق بحركات القلوب؛ كالكبر والعُجْب والرياء والنفاق ونحو ذلك، ﴿والإثم والبغي بغير الحقِّ﴾؛ أي: الذنوب التي تؤثم وتوجب العقوبة في حقوق الله، والبغي على الناس في دمائهم وأموالهم وأعراضهم. فدخل في هذا الذنوب المتعلقة بحق الله والمتعلقة بحق العباد، ﴿وأن تشرِكوا بالله ما لم ينزِّلْ به سلطاناً﴾؛ أي: حجة، بل أنزل الحجة والبرهان على التوحيد. والشرك هو أن يُشْرَكَ مع الله في عبادته أحدٌ من الخلق، وربما دخل في هذا الشرك الأصغر؛ كالرياء والحلف بغير الله ونحو ذلك، ﴿وأن تقولوا على الله ما لا تعلمونَ﴾: في أسمائِهِ وصفاتِهِ وأفعالِهِ وشرعِهِ؛ فكل هذه قد حرمها الله ونهى العباد عن تعاطيها؛ لما فيها من المفاسد الخاصة والعامة، ولما فيها من الظلم والتجري على الله والاستطالة على عباد الله وتغيير دين الله وشرعه."},{"a":"7:34","t":"أي: وقد أخرج الله بني آدم إلى الأرض، وأسكنهم فيها، وجعل لهم أجلاً مسمًّى، لا تتقدَّم أمة من الأمم على وقتها المسمَّى ولا تتأخَّر، لا الأمم المجتمعة ولا أفرادها."},{"a":"7:35","t":"لما أخرج الله بني آدم من الجنة؛ ابتلاهم بإرسال الرسل وإنزال الكتب عليهم يقصُّون عليهم آيات الله ويبيِّنون لهم أحكامه. ثم ذكر فضلَ من استجاب لهم وخسارَ من لم يستجبْ لهم، فقال: ﴿فمنِ اتَّقى﴾: ما حرم الله من الشرك والكبائر والصغائر، ﴿وأصلح﴾: أعماله الظاهرة والباطنة، ﴿فلا خوفٌ عليهم﴾: من الشرِّ الذي قد يخافه غيرهم، ﴿ولا هم يحزنونَ﴾: على ما مضى. وإذا انتفى الخوفُ والحزنُ؛ حصل الأمنُ التامُّ والسعادة والفلاح الأبدي."},{"a":"7:36","t":"﴿والذين كذَّبوا بآياتنا واستكبروا عنها﴾؛ أي: لا آمنت بها قلوبهم ولا انقادت لها جوارحهم، ﴿أولئك أصحابُ النار هم فيها خالدون﴾: كما استهانوا بآياته، ولازموا التكذيب بها؛ أهينوا بالعذابِ الدائم الملازم."},{"a":"7:37","t":"أي: لا أحد أظلم ﴿ممَّنِ افترى على الله كذباً﴾: بنسبة الشريك له والنقص له والتقوُّل عليه ما لم يقل، ﴿أو كذَّب بآياته﴾: الواضحة المبينة للحقِّ المبين الهادية إلى الصراط المستقيم؛ فهؤلاء وإن تمتعوا بالدنيا ونالهم نصيبهم مما كان مكتوباً لهم في اللوح المحفوظ؛ فليس ذلك بمغنٍ عنهم شيئاً، يتمتَّعون قليلاً ثم يعذَّبون طويلاً. ﴿حتى إذا جاءتهم رسُلُنا يتوفَّوْنهم﴾؛ أي: الملائكة الموكلون بقبض أرواحهم واستيفاء آجالهم، ﴿قالوا﴾: لهم في تلك الحالة توبيخاً وعتاباً: ﴿أين ما كنتم تَدْعون من دونِ الله﴾: من الأصنام والأوثان؛ فقد جاء وقت الحاجة إن كان فيها منفعةٌ لكم أو دفع مضرة، ﴿قالوا ضَلُّوا عنا﴾؛ أي: اضمحلوا وبطلوا، وليسوا مغنين عنَّا من عذاب الله من شيء، ﴿وشهدوا على أنفسِهم أنهم كانوا كافرين﴾: مستحقين للعذاب المهين الدائم."}],"155":[{"a":"7:38","t":"فقالت لهم الملائكة: ﴿ادخُلوا في أمم﴾؛ أي: في جملة أمم ﴿قد خلت من قبلكم من الجنِّ والإنس﴾؛ أي: مضوا على ما مضيتم عليه من الكفر والاستكبار، فاستحق الجميعُ الخزيَ والبوارَ. ﴿كلَّما دخلتْ أمةٌ﴾: من الأمم العاتية النار، ﴿لعنتْ أختَها﴾؛ كما قال تعالى: ﴿ويومَ القيامةِ يكفُرُ بعضُكم ببعضٍ ويلعنُ بعضكم بعضاً﴾، ﴿حتَّى إذا ادَّاركوا فيها جميعاً﴾؛ أي: اجتمع في النار جميع أهلها من الأولين والآخرين والقادة والرؤساء والمقلِّدين الأتباع، ﴿قالت أخراهم﴾؛ أي: متأخروهم المتبعون للرؤساء، ﴿لأولاهم﴾: أي: لرؤسائهم شاكين إلى الله إضلالهم إياهم: ﴿ربَّنا هؤلاء أضلُّونا فآتهم عذاباً ضعفاً من النار﴾؛ أي: عذِّبْهم عذاباً مضاعفاً لأنَّهم أضلُّونا وزينوا لنا الأعمال الخبيثة. فقالت ﴿أولاهم لأخراهم﴾؛ أي: الرؤساء قالوا لأتباعهم: ﴿فما كان لكم علينا من فضل﴾؛ أي: قد اشتركنا جميعاً في الغيِّ والضلال، وفي فعل أسباب العذاب؛ فأيُّ فضلٍ لكم علينا؟ ﴿قال﴾ اللَّه: ﴿لكلٍّ﴾ منكم ﴿ضعفٌ﴾: ونصيب من العذاب، ﴿فذوقوا العذاب بما كنتم تكسِبونَ﴾: ولكنه من المعلوم أن عذاب الرؤساء وأئمة الضلال أبلغُ وأشنعُ من عذاب الأتباع؛ كما أنَّ نعيم أئمة الهدى ورؤسائه أعظم من ثواب الأتباع؛ قال تعالى: ﴿الذين كَفَروا وصدُّوا عن سبيل اللهِ زِدْناهم عذاباً فوق العذابِ بما كانوا يُفْسِدون﴾. فهذه الآيات ونحوها دلَّت على أن سائر أنواع المكذبين بآيات الله مخلَّدون في العذاب مشتركون فيه وفي أصله، وإن كانوا متفاوتين في مقداره بحسب أعمالهم وعنادهم وظلمهم وافترائهم وأن مودتهم التي كانت بينَهم في الدُّنيا تنقلب يوم القيامة عداوةً وملاعنةً."},{"a":"7:39","t":"فقالت لهم الملائكة: ﴿ادخُلوا في أمم﴾؛ أي: في جملة أمم ﴿قد خلت من قبلكم من الجنِّ والإنس﴾؛ أي: مضوا على ما مضيتم عليه من الكفر والاستكبار، فاستحق الجميعُ الخزيَ والبوارَ. ﴿كلَّما دخلتْ أمةٌ﴾: من الأمم العاتية النار، ﴿لعنتْ أختَها﴾؛ كما قال تعالى: ﴿ويومَ القيامةِ يكفُرُ بعضُكم ببعضٍ ويلعنُ بعضكم بعضاً﴾، ﴿حتَّى إذا ادَّاركوا فيها جميعاً﴾؛ أي: اجتمع في النار جميع أهلها من الأولين والآخرين والقادة والرؤساء والمقلِّدين الأتباع، ﴿قالت أخراهم﴾؛ أي: متأخروهم المتبعون للرؤساء، ﴿لأولاهم﴾: أي: لرؤسائهم شاكين إلى الله إضلالهم إياهم: ﴿ربَّنا هؤلاء أضلُّونا فآتهم عذاباً ضعفاً من النار﴾؛ أي: عذِّبْهم عذاباً مضاعفاً لأنَّهم أضلُّونا وزينوا لنا الأعمال الخبيثة. فقالت ﴿أولاهم لأخراهم﴾؛ أي: الرؤساء قالوا لأتباعهم: ﴿فما كان لكم علينا من فضل﴾؛ أي: قد اشتركنا جميعاً في الغيِّ والضلال، وفي فعل أسباب العذاب؛ فأيُّ فضلٍ لكم علينا؟ ﴿قال﴾ اللَّه: ﴿لكلٍّ﴾ منكم ﴿ضعفٌ﴾: ونصيب من العذاب، ﴿فذوقوا العذاب بما كنتم تكسِبونَ﴾: ولكنه من المعلوم أن عذاب الرؤساء وأئمة الضلال أبلغُ وأشنعُ من عذاب الأتباع؛ كما أنَّ نعيم أئمة الهدى ورؤسائه أعظم من ثواب الأتباع؛ قال تعالى: ﴿الذين كَفَروا وصدُّوا عن سبيل اللهِ زِدْناهم عذاباً فوق العذابِ بما كانوا يُفْسِدون﴾. فهذه الآيات ونحوها دلَّت على أن سائر أنواع المكذبين بآيات الله مخلَّدون في العذاب مشتركون فيه وفي أصله، وإن كانوا متفاوتين في مقداره بحسب أعمالهم وعنادهم وظلمهم وافترائهم وأن مودتهم التي كانت بينَهم في الدُّنيا تنقلب يوم القيامة عداوةً وملاعنةً."},{"a":"7:40","t":"يخبر تعالى عن عقاب من كذَّب بآياته فلم يؤمنْ بها مع أنها آيات بيناتٌ واستكبر عنها فلم ينقدْ لأحكامها بل كذَّب، وتولى أنهم آيسون من كلِّ خير؛ فلا تفتَّحُ أبوابُ السماء لأرواحهم إذا ماتوا، وصعدت تريد العروجَ إلى الله، فتستأذنُ، فلا يؤذَنُ لها؛ كما لم تصعدْ في الدنيا إلى الإيمان بالله ومعرفته ومحبته، كذلك لا تصعد بعد الموت؛ فإن الجزاء من جنس العمل. ومفهوم الآية أنَّ أرواح المؤمنين المنقادين لأمرِ الله المصدِّقين بآياته تفتَّح لها أبواب السماء حتى تعرج إلى الله، وتصل إلى حيث أراد الله من العالم العلويِّ، وتبتهجَ بالقرب من ربِّها والحظُوةِ برضوانه. وقوله عن أهل النار: ﴿ولا يدخُلونَ الجنَّة حتى يلجَ الجملُ﴾: وهو البعير المعروف ﴿في سَمِّ الخِياطِ﴾؛ أي: حتى يدخُلَ البعير الذي هو من أكبر الحيوانات جسماً في خرق الإبرة الذي هو من أضيق الأشياء. وهذا من باب تعليق الشيء بالمحال؛ أي: فكما أنه محالٌ دخول الجمل في سَمِّ الخياطِ؛ فكذلك المكذِّبون بآيات الله محالٌ دخولهم الجنة؛ قال تعالى: ﴿إنَّه من يُشْرِكْ بالله فقد حرَّم اللهُ عليه الجنةَ ومأواه النارُ﴾؛ وقال هنا: ﴿وكذلك نَجْزي المجرمينَ﴾؛ أي: الذين كَثُرَ إجرامُهم، واشتدَّ طغيانُهم."},{"a":"7:41","t":"﴿لهم من جهنَّمَ مِهادٌ﴾؛ أي: فراش من تحتهم، ﴿ومن فوقِهِم غَواشٍ﴾؛ أي: ظلل من العذاب تغشاهم، ﴿وكذلك نَجْزي الظالمين﴾: لأنفسهم جزاءً وفاقاً، وما ربُّك بظلام للعبيد."},{"a":"7:42","t":"لما ذكر تعالى عقاب العاصين الظالمين؛ ذَكَرَ ثواب المطيعين، فقال: ﴿والذين آمنوا﴾: بقلوبهم، ﴿وعملوا الصالحات﴾: بجوارحهم؛ فجمعوا بين الإيمان والعمل، بين الأعمال الظاهرة والأعمال الباطنة، بين فعل الواجبات وترك المحرمات، ولما كان قوله: ﴿وعَمِلوا الصالحاتِ﴾ لفظاً عامًّا يشمل جميع الصالحات الواجبة والمستحبة، وقد يكون بعضها غير مقدور للعبد؛ قال تعالى: ﴿لا نُكَلِّفُ نفساً إلَّا وُسْعَها﴾؛ أي: بمقدار ما تسعه طاقتها ولا يعسر على قدرتها؛ فعليها في هذه الحال أن تتقي الله بحسب استطاعتها، وإذا عجزت عن بعض الواجبات التي يقدر عليها غيرها؛ سقطت عنها؛ كما قال تعالى: ﴿لا يُكَلِّفُ اللهُ نفساً إلاَّ وُسْعَها﴾، ﴿لا يُكَلِّفُ الله نفساً إلاَّ ما آتاها﴾، ﴿ما جَعَلَ عليكم في الدِّينِ مِنْ حَرَج﴾، ﴿فاتَّقوا الله ما استطعتُم﴾؛ فلا واجب مع العجز، ولا محرَّم مع الضرورة. ﴿أولئك﴾؛ أي: المتصفون بالإيمان والعمل الصالح، ﴿أصحابُ الجنة هم فيها خالدون﴾؛ أي: لا يحولون عنها ولا يبغون بها بدلاً؛ لأنهم يَرَوْن فيها من أنواع اللَّذَّات وأصناف المشتهيات ما تقفُ عنده الغايات، ولا يطلب أعلى منه."},{"a":"7:43","t":"﴿ونزعنا ما في صُدورهم من غِلٍّ﴾: وهذا من كرمه وإحسانِهِ على أهل الجنة؛ أنَّ الغلَّ الذي كان موجوداً في قلوبهم والتنافس الذي بينهم أن الله يقلعه ويزيله حتى يكونوا إخواناً متحابِّين وأخلاَّء متصافين؛ قال تعالى: ﴿ونزعنا ما في صدورهم من غلٍّ إخواناً على سُرُرٍ متقابلينَ﴾، ويخلُقُ الله لهم من الكرامة ما به يحصُلُ لكلِّ واحد منهم الغِبْطَةَ والسرور، ويرى أنه لا فوق ما هو فيه من النعيم نعيمٌ؛ فبهذا يأمنون من التحاسد والتباغض؛ لأنه قد فقدت أسبابه. [و] قوله: ﴿تجري من تحتهم الأنهار﴾؛ أي: يفجِّرونها تفجيراً حيث شاؤوا وأين أرادوا، إن شاؤوا في خلال القصور أو في تلك الغرف العاليات أو في رياض الجنات من تحت تلك الحدائق الزاهرات، أنهار تجري في غير أخدود، وخيراتٌ ليس لها حدٌّ محدودٌ. ﴿و﴾ لهذا لما رأوا ما أنعم الله عليهم وأكرمهم به؛ ﴿قالوا الحمدُ لله الذي هدانا لهذا﴾: بأن منَّ علينا وأوحى إلى قلوبنا فآمنت به وانقادتْ للأعمال الموصلةِ إلى هذه الدار، وحفظ الله علينا إيماننا وأعمالَنا حتى أوصَلَنا بها إلى هذه الدار، فنعم الربُّ الكريم الذي ابتدأنا بالنعم، وأسدى من النعم الظاهرة والباطنة ما لا يحصيه المحصون ولا يعدُّه العادُّون. ﴿وما كنَّا لنهتديَ لولا أن هدانا الله﴾؛ أي: ليس في نفوسنا قابليةٌ للهدى، لولا أنَّه تعالى منَّ بهدايته واتِّباع رسله، ﴿لقد جاءت رسُلُ ربِّنا بالحق﴾؛ أي: حين كانوا يتمتَّعون بالنعيم الذي أخبرت به الرسل وصار حقَّ يقينٍ لهم بعد أن كان علم يقينٍ لهم قالوا: لقد تحقَّقنا ورأينا ما وعدتنا به الرسلُ وأنَّ جميع ما جاؤوا به حقُّ اليقين لامِرْيَةَ فيه ولا إشكال. ﴿ونودوا﴾: تهنئةً لهم وإكراماً وتحية واحتراماً ﴿أن تِلْكُمُ الجنة أورثتموها﴾؛ أي: كنتم الوارثين لها، وصارت إقطاعاً لكم إذ كان إقطاع الكفار النار، أورثتموها ﴿بما كنتم تعملونَ﴾: قال بعضُ السلف: أهل الجنة نَجَوْا من النار بعفو الله، وأدخلوا الجنة برحمة الله، واقتسموا المنازل، وورثوها بالأعمال الصالحة، وهي من رحمته، بل من أعلى أنواع رحمته."}],"156":[{"a":"7:44","t":"يقول تعالى بعد ما ذكر استقرار كلٍّ من الفريقين في الدارين ووجدا ما أخبرت به الرُّسل ونطقتْ به الكتبُ من الثواب والعقاب: إن أهل الجنة نادوا أصحاب النار بأن قالوا: ﴿أن قد وَجَدْنا ما وَعَدَنا ربُّنا حقًّا﴾: حين وعدنا على الإيمان والعمل الصالح الجنة، فأدخلناها وأرانا ما وصفه لنا، ﴿فهل وجدتُم ما وعدكم ربكم﴾: على الكفر والمعاصي ﴿حقًّا قالوا نعم﴾: قد وجدناه حقًّا، فتبين للخلق كلِّهم بياناً لا شكَّ فيه صدق وعد الله، ومن أصدق من الله قيلاً، وذهبت عنهم الشكوك والشبه، وصار الأمر حقَّ اليقين، وفرح المؤمنون بوعد الله واغتبطوا، وأيس الكفار من الخير، وأقروا على أنفسهم بأنهم مستحقون للعذاب. ﴿فأذَّن مؤذنٌ بينهم﴾؛ أي: بين أهل النار وأهل الجنة بأن قال: ﴿أن لعنةُ الله﴾؛ أي: بعده وإقصاؤه عن كل خير ﴿على الظالمين﴾: إذ فتح الله لهم أبوابَ رحمتِهِ، فصدَفوا أنفسهم عنها ظلماً وصدُّوا عن سبيل الله بأنفسهم وصدُّوا غيرهم فضلُّوا وأضلُّوا. والله تعالى يريد أن تكون مستقيمةً ويعتدل سير السالكين إليه، وهؤلاء يريدونها ﴿عِوَجاً﴾: منحرفةً صادةً عن سواء السبيل. ﴿وهم بالآخرة كافرونَ﴾: وهذا الذي أوجب لهم الانحرافَ عن الصراط والإقبالَ على شهوات النفوس المحرَّمة عدمُ إيمانهم بالبعث، وعدم خوفهم من العقاب ورجائهم للثواب. ومفهوم هذا [النداء] أن رحمة الله على المؤمنين، وبرَّه شاملٌ لهم، وإحسانه متواترٌ عليهم."},{"a":"7:45","t":"يقول تعالى بعد ما ذكر استقرار كلٍّ من الفريقين في الدارين ووجدا ما أخبرت به الرُّسل ونطقتْ به الكتبُ من الثواب والعقاب: إن أهل الجنة نادوا أصحاب النار بأن قالوا: ﴿أن قد وَجَدْنا ما وَعَدَنا ربُّنا حقًّا﴾: حين وعدنا على الإيمان والعمل الصالح الجنة، فأدخلناها وأرانا ما وصفه لنا، ﴿فهل وجدتُم ما وعدكم ربكم﴾: على الكفر والمعاصي ﴿حقًّا قالوا نعم﴾: قد وجدناه حقًّا، فتبين للخلق كلِّهم بياناً لا شكَّ فيه صدق وعد الله، ومن أصدق من الله قيلاً، وذهبت عنهم الشكوك والشبه، وصار الأمر حقَّ اليقين، وفرح المؤمنون بوعد الله واغتبطوا، وأيس الكفار من الخير، وأقروا على أنفسهم بأنهم مستحقون للعذاب. ﴿فأذَّن مؤذنٌ بينهم﴾؛ أي: بين أهل النار وأهل الجنة بأن قال: ﴿أن لعنةُ الله﴾؛ أي: بعده وإقصاؤه عن كل خير ﴿على الظالمين﴾: إذ فتح الله لهم أبوابَ رحمتِهِ، فصدَفوا أنفسهم عنها ظلماً وصدُّوا عن سبيل الله بأنفسهم وصدُّوا غيرهم فضلُّوا وأضلُّوا. والله تعالى يريد أن تكون مستقيمةً ويعتدل سير السالكين إليه، وهؤلاء يريدونها ﴿عِوَجاً﴾: منحرفةً صادةً عن سواء السبيل. ﴿وهم بالآخرة كافرونَ﴾: وهذا الذي أوجب لهم الانحرافَ عن الصراط والإقبالَ على شهوات النفوس المحرَّمة عدمُ إيمانهم بالبعث، وعدم خوفهم من العقاب ورجائهم للثواب. ومفهوم هذا [النداء] أن رحمة الله على المؤمنين، وبرَّه شاملٌ لهم، وإحسانه متواترٌ عليهم."},{"a":"7:46","t":"أي: وبين أصحاب الجنة وأصحاب النار حجابٌ يُقال له: الأعراف، لا من الجنة ولا من النار، يشرف على الدارين، وينظُر من عليه حال الفريقين، وعلى هذا الحجاب رجالٌ يعرفونَ كلًّا من أهل الجنة والنار بسيماهم؛ أي: علاماتهم التي بها يُعْرَفون ويُمَيَّزون؛ فإذا نظروا إلى أهل الجنة؛ نادَوْهم: ﴿أن سلامٌ عليكم﴾؛ أي: يحيُّونهم ويسلِّمون عليهم، وهم إلى الآن لم يدخلوا الجنة، ولكنهم يطمعون في دخولها، ولم يجعل الله الطمع في قلوبهم إلا لما يُريد بهم من كرامته."},{"a":"7:47","t":"﴿وإذا صُرِفَتْ أبصارُهم تِلْقاءَ أصحابِ النَّارِ﴾: ورأوا منظراً شنيعاً وهولاً فظيعاً، ﴿قالوا ربَّنا لا تَجْعَلْنا مع القوم الظالمين﴾: فأهل الجنة إذا رآهم أهلُ الأعراف يطمعون أن يكونوا معهم في الجنة ويحيُّونهم ويسلِّمون عليهم، وعند انصراف أبصارهم بغير اختيارهم لأهل النار يستجيرون [بالله] من حالهم هذا على وجه العموم."},{"a":"7:48","t":"ثم ذكر الخصوص بعد العموم، فقال: ﴿ونادى أصحابُ الأعراف رجالاً يعرفونهم بسيماهُم﴾: وهم من أهل النار، وقد كانوا في الدنيا لهم أبهة وشرفٌ وأموالٌ وأولادٌ، فقال لهم أصحاب الأعراف حين رأوهم منفردين في العذاب بلا ناصرٍ ولا مغيث: ﴿ما أغنى عنكُم جمعُكم﴾: في الدُّنيا الذي تستدفِعون به المكاره، وتوسلون به إلى مطالبكم في الدُّنيا؛ فاليوم اضمحل ولا أغنى عنكم شيئاً، وكذلك أيُّ شيءٍ نفعكم استكباركم على الحقِّ وعلى ما جاء به وعلى مَن اتبعه؟!"},{"a":"7:49","t":"ثم أشاروا لهم إلى أناس من أهل الجنة كانوا في الدنيا فقراء ضعفاء يستهزئ بهم أهل النار، فقالوا لأهل النار: ﴿أهؤلاء﴾: الذين أدخلهم الله الجنة، ﴿الذين أقسمتُم لا ينالُهُم الله برحمةٍ﴾: احتقاراً لهم وازدراءً وإعجاباً بأنفسكم، قد حنثتم في أيمانكم، وبدا لكم من الله ما لم يكن لكم في حساب. ﴿ادخلوا الجنة﴾: بما كنتم تعملونَ؛ أي: قيل لهؤلاء الضعفاء إكراماً واحتراماً: ادخلوا الجنة بأعمالكم الصالحة، ﴿لا خوفٌ عليكم﴾: فيما يُستقبل من المكاره، ﴿ولا أنتم تحزنونَ﴾: على ما مضى، بل آمنون مطمئنُّون فرحون بكل خير. وهذا كقولِهِ تعالى: ﴿إنَّ الذين أجرموا كانوا من الذين آمنوا يضحكونَ. وإذا مَرُّوا بهم يتغامَزون ...﴾ إلى أن قال: ﴿فاليومَ الذين آمنوا مِنَ الكُفَّارِ يضحكون. على الأرائكِ ينظُرونَ﴾. واختلف أهل العلم والمفسِّرون من هم أصحاب الأعراف وما أعمالهم، والصحيح من ذلك أنهم قوم تساوت حسناتهم وسيئاتهم؛ فلا رجحتْ سيئاتهم فدخلوا النار، ولا رجحت حسناتهم فدخلوا الجنة، فصاروا في الأعراف ما شاء الله، ثم إن الله تعالى يدخِلُهم برحمته الجنة؛ فإن رحمته تسبق وتغلب غضبه، ورحمته وسعت كلَّ شيءٍ."},{"a":"7:50","t":"أي: ينادي أصحاب النار أصحاب الجنة حين يبلغُ منهم العذابُ كلَّ مبلغ وحين يمسُّهم الجوع المفرط والظمأ الموجع؛ يستغيثون بهم فيقولون: ﴿أفيضوا علينا من الماءِ أو ممَّا رزقكم الله﴾: من الطعام، فأجابهم أهل الجنة بقولهم: ﴿إنَّ الله حرَّمَهما﴾؛ أي: ماء الجنة وطعامها ﴿على الكافرين﴾: وذلك جزاء لهم على كفرهم بآيات الله واتخاذهم دينهم الذي أُمروا أن يستقيموا عليه ووُعدوا بالجزاء الجزيل عليه ﴿لهواً ولعباً﴾؛ أي: لهت قلوبهم وأعرضت عنه ولعبوا واتَّخذوه سخريًّا، أو أنهم جعلوا بدل دينهم اللهو واللعب، واستعاضوا بذلك عن الدين القيم، ﴿وغرَّتْهم الحياة الدنيا﴾: بزينتها وزخرفها وكثرة دعاتِها، فاطمأنوا إليها ورضوا بها وفرحوا وأعرضوا عن الآخرة ونسوها. ﴿فاليوم ننساهم﴾؛ أي: نتركهم في العذاب، ﴿كما نسوا لقاء يومهم هذا﴾: فكأنهم لم يُخْلقوا إلا للدُّنيا، وليس أمامهم عرض ولا جزاء، ﴿وما كانوا بآياتنا يجحدون﴾: والحال أن جحودهم هذا لا عن قصور في آيات الله وبيِّناته، بل قد ﴿جئناهم بكتابٍ فصَّلْناه﴾؛ أي: بينا فيه جميع المطالب التي يحتاج إليها الخلق ﴿على علم﴾؛ من الله بأحوال العباد في كل زمان ومكان، وما يصلُحُ لهم وما لا يصلُحُ ليس تفصيله تفصيل غير عالم بالأمور، فتجهله بعض الأحوال فيحكم حكماً غير مناسب، بل تفصيل من أحاط علمه بكل شيء ووسعتْ رحمتُهُ كلَّ شيء. ﴿هدىً ورحمةً لقوم يؤمنون﴾؛ أي: تحصل للمؤمنين بهذا الكتاب الهداية من الضلال وبيان الحق والباطل والغي والرشد، ويحصُل أيضاً لهم به الرحمة، وهي الخير والسعادة في الدنيا والآخرة، فينتفي عنهم بذلك الضلال والشقاء."},{"a":"7:51","t":"أي: ينادي أصحاب النار أصحاب الجنة حين يبلغُ منهم العذابُ كلَّ مبلغ وحين يمسُّهم الجوع المفرط والظمأ الموجع؛ يستغيثون بهم فيقولون: ﴿أفيضوا علينا من الماءِ أو ممَّا رزقكم الله﴾: من الطعام، فأجابهم أهل الجنة بقولهم: ﴿إنَّ الله حرَّمَهما﴾؛ أي: ماء الجنة وطعامها ﴿على الكافرين﴾: وذلك جزاء لهم على كفرهم بآيات الله واتخاذهم دينهم الذي أُمروا أن يستقيموا عليه ووُعدوا بالجزاء الجزيل عليه ﴿لهواً ولعباً﴾؛ أي: لهت قلوبهم وأعرضت عنه ولعبوا واتَّخذوه سخريًّا، أو أنهم جعلوا بدل دينهم اللهو واللعب، واستعاضوا بذلك عن الدين القيم، ﴿وغرَّتْهم الحياة الدنيا﴾: بزينتها وزخرفها وكثرة دعاتِها، فاطمأنوا إليها ورضوا بها وفرحوا وأعرضوا عن الآخرة ونسوها. ﴿فاليوم ننساهم﴾؛ أي: نتركهم في العذاب، ﴿كما نسوا لقاء يومهم هذا﴾: فكأنهم لم يُخْلقوا إلا للدُّنيا، وليس أمامهم عرض ولا جزاء، ﴿وما كانوا بآياتنا يجحدون﴾: والحال أن جحودهم هذا لا عن قصور في آيات الله وبيِّناته، بل قد ﴿جئناهم بكتابٍ فصَّلْناه﴾؛ أي: بينا فيه جميع المطالب التي يحتاج إليها الخلق ﴿على علم﴾؛ من الله بأحوال العباد في كل زمان ومكان، وما يصلُحُ لهم وما لا يصلُحُ ليس تفصيله تفصيل غير عالم بالأمور، فتجهله بعض الأحوال فيحكم حكماً غير مناسب، بل تفصيل من أحاط علمه بكل شيء ووسعتْ رحمتُهُ كلَّ شيء. ﴿هدىً ورحمةً لقوم يؤمنون﴾؛ أي: تحصل للمؤمنين بهذا الكتاب الهداية من الضلال وبيان الحق والباطل والغي والرشد، ويحصُل أيضاً لهم به الرحمة، وهي الخير والسعادة في الدنيا والآخرة، فينتفي عنهم بذلك الضلال والشقاء."}],"157":[{"a":"7:52","t":"أي: ينادي أصحاب النار أصحاب الجنة حين يبلغُ منهم العذابُ كلَّ مبلغ وحين يمسُّهم الجوع المفرط والظمأ الموجع؛ يستغيثون بهم فيقولون: ﴿أفيضوا علينا من الماءِ أو ممَّا رزقكم الله﴾: من الطعام، فأجابهم أهل الجنة بقولهم: ﴿إنَّ الله حرَّمَهما﴾؛ أي: ماء الجنة وطعامها ﴿على الكافرين﴾: وذلك جزاء لهم على كفرهم بآيات الله واتخاذهم دينهم الذي أُمروا أن يستقيموا عليه ووُعدوا بالجزاء الجزيل عليه ﴿لهواً ولعباً﴾؛ أي: لهت قلوبهم وأعرضت عنه ولعبوا واتَّخذوه سخريًّا، أو أنهم جعلوا بدل دينهم اللهو واللعب، واستعاضوا بذلك عن الدين القيم، ﴿وغرَّتْهم الحياة الدنيا﴾: بزينتها وزخرفها وكثرة دعاتِها، فاطمأنوا إليها ورضوا بها وفرحوا وأعرضوا عن الآخرة ونسوها. ﴿فاليوم ننساهم﴾؛ أي: نتركهم في العذاب، ﴿كما نسوا لقاء يومهم هذا﴾: فكأنهم لم يُخْلقوا إلا للدُّنيا، وليس أمامهم عرض ولا جزاء، ﴿وما كانوا بآياتنا يجحدون﴾: والحال أن جحودهم هذا لا عن قصور في آيات الله وبيِّناته، بل قد ﴿جئناهم بكتابٍ فصَّلْناه﴾؛ أي: بينا فيه جميع المطالب التي يحتاج إليها الخلق ﴿على علم﴾؛ من الله بأحوال العباد في كل زمان ومكان، وما يصلُحُ لهم وما لا يصلُحُ ليس تفصيله تفصيل غير عالم بالأمور، فتجهله بعض الأحوال فيحكم حكماً غير مناسب، بل تفصيل من أحاط علمه بكل شيء ووسعتْ رحمتُهُ كلَّ شيء. ﴿هدىً ورحمةً لقوم يؤمنون﴾؛ أي: تحصل للمؤمنين بهذا الكتاب الهداية من الضلال وبيان الحق والباطل والغي والرشد، ويحصُل أيضاً لهم به الرحمة، وهي الخير والسعادة في الدنيا والآخرة، فينتفي عنهم بذلك الضلال والشقاء."},{"a":"7:53","t":"وهؤلاء الذين حقَّ عليهم العذاب لم يؤمنوا بهذا الكتاب العظيم ولا انقادوا لأوامره ونواهيه، فلم يبق فيهم حيلة إلاَّ استحقاقُهم أن يحلَّ بهم ما أخبر به القرآن، ولهذا قال: ﴿هل ينظُرون إلا تأويلَه﴾؛ أي: وقوع ما أخبر به؛ كما قال يوسف عليه السلام حين وقعت رؤياه: ﴿هذا تأويلُ رؤيايَ مِن قَبْلُ﴾. ﴿يومَ يأتي تأويلُهُ يقول الذين نسوه من قبل﴾: متندِّمين متأسِّفين على ما مضى متشفِّعين في مغفرة ذنوبهم مقرِّين بما أخبرت به الرسل: ﴿قد جاءت رُسُلُ ربِّنا بالحقِّ فهل لنا من شفعاءَ فيشفعوا لنا أو نُردُّ﴾: إلى الدنيا؛ ﴿فنعملَ غير الذي كُنَّا نعملُ﴾: وقد فات الوقتُ عن الرُّجوع إلى الدنيا؛ فما تنفعُهم شفاعة الشافعين. وسؤالهم الرجوع إلى الدنيا ليعملوا غيرَ عملهم كذبٌ منهم، مقصودُهم به دفعُ ما حلَّ بهم؛ قال تعالى: ﴿ولو رُدُّوا لَعادوا لِما نُهوا عنه وإنَّهم لَكاذبونَ﴾. ﴿قد خسروا أنفسَهم﴾: حين فوَّتوها الأرباحَ وسَلَكوا بها سبيل الهلاك، وليس ذلك كخسران الأموال والأثاث أو الأولاد، إنما هذا خسرانٌ لا جُبْرانَ لمصابِهِ. ﴿وضلَّ عنهم ما كانوا يفترونَ﴾: في الدُّنيا مما تُمَنِّيهم أنفسُهم به، ويعدُهم به الشيطان، قدموا على ما لم يكن لهم في حساب، وتبيَّن لهم باطلهم وضلالهم، وصدق ما جاءتهم به الرسل."},{"a":"7:54","t":"يقول تعالى مبيناً أنه الربُّ المعبود وحده لا شريك له: ﴿إنَّ ربَّكم اللهُ الذي خَلَقَ السمواتِ والأرضَ﴾: وما فيهما على عظمهما وسعتهما وإحكامهما وإتقانهما وبديع خلقهما ﴿في ستة أيام﴾: أولها يوم الأحد، وآخرها يوم الجمعة. فلما قضاهما وأودع فيهما من أمره ما أودع؛ ﴿استوى﴾: تبارك وتعالى ﴿على العرش﴾: العظيم الذي يسع السماوات والأرض وما فيهما وما بينهما؛ استوى استواءً يليق بجلاله وعظمته وسلطانه، فاستوى على العرش، واحتوى على الملك، ودبر الممالك، وأجرى عليهم أحكامه الكونيّة وأحكامه الدينيّة، ولهذا قال: ﴿يُغْشي الليلَ﴾: المظلم ﴿النهارَ﴾؛ المضيء، فيظلم ما على وجه الأرض، ويسكُن الآدميون، وتأوي المخلوقات إلى مساكنها، ويستريحون من التعب والذهاب والإياب الذي حصل لهم في النهار. ﴿يطلُبُه حثيثاً﴾: كلَّما جاء الليل؛ ذهب النهار، وكلَّما جاء النهار؛ ذهب الليل ... وهكذا أبداً على الدوام حتى يطوي الله هذا العالم، وينتقل العباد إلى دار غير هذه الدار. ﴿والشمس والقمر والنجوم مسخرات بأمره﴾؛ أي: بتسخيره وتدبيره الدالِّ على ما له من أوصاف الكمال، فخلقها وعظمها دالٌّ على كمال قدرته، وما فيها من الإحكام والانتظام والإتقان دالٌّ على كمال حكمته، وما فيها من المنافع والمصالح الضروريَّة وما دونها دالٌّ على سعة رحمته، وذلك دال على سعة علمه، وأنه الإله الحقُّ الذي لا تنبغي العبادة إلا له. ﴿ألا له الخَلْق والأمر﴾؛ أي: له الخلق الذي صدرت عنه جميع المخلوقات علويّها وسفليّها أعيانها وأوصافها وأفعالها والأمر المتضمن للشرائع والنبوات؛ فالخلق يتضمَّن أحكامه الكونيَّة القدريَّة، والأمر يتضمَّن أحكامه الدينيَّة الشرعيَّة، وثم أحكام الجزاء، وذلك يكون في دار البقاء. ﴿تبارك الله﴾؛ أي: عَظُم وتعالى وكثر خيره وإحسانه، فتبارك في نفسه لعظمة أوصافه وكمالها، وبارك في غيره بإحلال الخير الجزيل والبر الكثير؛ فكل بركة في الكون فمن آثار رحمته، ولهذا قال: ﴿تبارك الله ربُّ العالمين﴾. ولما ذكر من عظمته وجلاله ما يدلُّ ذوي الألباب على أنه وحده المعبود المقصود في الحوائج كلِّها؛ أمر بما يترتب على ذلك، فقال:"},{"a":"7:55","t":"الدعاء يدخل فيه دعاء المسألة ودعاء العبادة، فأمر بدعائه ﴿تضرعاً﴾؛ أي: إلحاحاً في المسألة ودؤوباً في العبادة، ﴿وخُفية﴾؛ أي: لا جهراً وعلانيةً يُخاف منه الرياء، بل خفية وإخلاصاً لله تعالى. ﴿إنه لا يحبُّ المعتدين﴾؛ أي: المتجاوزين للحدِّ في كل الأمور، ومن الاعتداء كون العبد يسأل الله مسائل لا تصلح له، أو يتنطع في السؤال، أو يبالغ في رفع صوته بالدعاء؛ فكلُّ هذا داخل في الاعتداء المنهيِّ عنه."},{"a":"7:56","t":"﴿ولا تفسدوا في الأرض﴾: بعمل المعاصي ﴿بعد إصلاحها﴾: بالطاعات؛ فإن المعاصي تفسد الأخلاق والأعمال والأرزاق؛ كما قال تعالى: ﴿ظهر الفسادُ في البرِّ والبحر بما كسبتْ أيدي الناس﴾: كما أنَّ الطاعات تصلُحُ بها الأخلاق والأعمال والأرزاق وأحوال الدُّنيا والآخرة. ﴿وادعوه خوفاً وطمعاً﴾؛ أي: خوفاً من عقابه، وطمعاً في ثوابه، طمعاً في قبولها وخوفاً من ردِّها، لا دعاء عبد مدلٍّ على ربه، قد أعجبته نفسه، ونزَّل نفسه فوق منزلته، أو دعاء من هو غافل لاهٍ. وحاصل ما ذكر الله من آداب الدعاء: الإخلاصُ فيه لله وحده؛ لأنَّ ذلك يتضمَّنه الخفية، وإخفاءه وإسراره، وأن يكون القلبُ خائفاً طامعاً لا غافلاً ولا آمناً ولا غير مبالٍ بالإجابة، وهذا من إحسان الدعاء؛ فإن الإحسان في كل عبادة بَذْلُ الجهد فيها وأداؤها كاملةً لا نقصَ فيها بوجه من الوجوه. ولهذا قال: ﴿إنَّ رحمةَ الله قريبٌ من المحسنين﴾: في عبادة الله، المحسنين إلى عباد الله، فكلَّما كان العبد أكثر إحساناً؛ كان أقرب إلى رحمة ربِّه، وكان ربُّه قريباً منه برحمته. وفي هذا من الحثِّ على الإحسان ما لا يخفى."},{"a":"7:57","t":"بين تعالى أثراً من آثار قدرته ونفحة من نفحات رحمته، فقال: ﴿وهو الذي يرسل الرياح بشراً بين يدي رحمته﴾؛ أي: الرياح المبشرات بالغيث، التي تثيره بإذن الله من الأرض، فيستبشر الخلق برحمة الله، وترتاح لها قلوبهم قبل نزوله. ﴿حتى إذا أقلَّت﴾: الرياح ﴿سحاباً ثقالاً﴾: قد أثاره بعضها، وألفه ريحٌ أخرى وألقحه ريح أخرى، ﴿سُقْناه لبلدٍ ميِّتٍ﴾: قد كادت تهلك حيواناتُهُ وكاد أهله أن ييأسوا من رحمة الله. ﴿فأنزلنا به﴾؛ أي: بذلك البلد الميت ﴿الماء﴾: الغزير من ذلك السحاب، وسخَّر الله له ريحاً تدره وريحاً تفرِّقه بإذن الله. فأنبتنا به من كلِّ الثمرات: فأصبحوا مستبشرين برحمة الله، راتعين بخير الله. وقوله: ﴿كذلك نخرِجُ الموتى لعلَّكم تَذَكَّرون﴾؛ أي: كما أحيينا الأرض بعد موتها بالنبات كذلك نخرج الموتى من قبورهم بعدما كانوا رفاتاً متمزِّقين. وهذا استدلال واضح؛ فإنه لا فرق بين الأمرين؛ فمنكِرُ البعثِ استبعاداً له مع أنه يرى ما هو نظيره من باب العناد وإنكار المحسوسات. وفي هذا الحثُّ على التذكُّر والتفكُّر في آلاء الله والنظر إليها بعين الاعتبار والاستدلال لا بعين الغفلة والإهمال."}],"158":[{"a":"7:58","t":"ثم ذكر تفاوت الأراضي التي ينزل عليها المطر، فقال: ﴿والبلدُ الطيِّب﴾؛ أي: طيب التربة والمادة، إذا نزل عليه المطر؛ ﴿يخرج نباتُهُ﴾: الذي هو مستعدٌّ له ﴿بإذن ربِّه﴾؛ أي: بإرادة الله ومشيئته، فليست الأسباب مستقلَّةً بوجود الأشياء حتى يأذن الله بذلك. ﴿والذي خَبُثَ﴾: من الأراضي ﴿لا يخرُجُ إلَّا نَكِداً﴾؛ أي: إلا نباتاً خاسًّا لا نفع فيه ولا بركة. ﴿كذلك نصرِّف الآيات لقوم يشكرونَ﴾؛ أي: ننوِّعها، ونبيِّنها، ونضرب فيها الأمثال، ونسوقها لقوم يشكرون الله بالاعتراف بنعمه والإقرار بها وصرفها في مرضاة الله؛ فهم الذين ينتفعون بما فصل الله في كتابه من الأحكام والمطالب الإلهية؛ لأنَّهم يرونها من أكبر النعم الواصلة إليهم من ربهم، فيتلقونها مفتقرين إليها فرحين بها، فيتدبَّرونها ويتأمَّلونها، فيبين لهم من معانيها بحسب استعدادهم. وهذا مثالٌ للقلوب حين ينزل عليها الوحي الذي هو مادةُ الحياة كما أن الغيث مادة الحيا؛ فإن القلوب الطيبة حين يجيئها الوحي تقبله وتعلمه وتنبُتُ بحسب طيب أصلها وحسن عنصرها، وأما القلوب الخبيثة التي لا خير فيها؛ فإذا جاءها الوحي؛ لم يجد محلاًّ قابلاً، بل يجدها غافلة معرضة أو معارضة، فيكون كالمطر الذي يمرُّ على السباخ والرمال والصخور فلا يؤثِّر فيها شيئاً، وهذا كقوله تعالى: ﴿أنزل من السماءِ ماءً فسالتْ أوديةٌ بِقَدَرِها فاحتملَ السيلُ زبداً رابياً ...﴾ الآيات."},{"a":"7:59","t":"لما ذكر تعالى من أدلة توحيده جملةً صالحةً؛ أيَّد ذلك بذِكْرِ ما جرى للأنبياء الداعين إلى توحيده مع أممهم المنكرين لذلك، وكيف أيَّد الله أهل التوحيد وأهلك من عاندهم ولم ينقَدْ لهم، وكيف اتَّفقت دعوة المرسلين على دينٍ واحد ومعتقدٍ واحد. فقال عن نوح أول المرسلين: ﴿لقد أرسلنا نوحاً إلى قومه﴾: يدعوهم إلى عبادة الله وحده حين كانوا يعبدُون الأوثان، ﴿فقال﴾: لهم: ﴿يا قوم اعبُدوا الله﴾؛ أي: وحدوه، ﴿ما لكم من إلهٍ غيرُهُ﴾: لأنه الخالق الرازق المدبِّر لجميع الأمور، وما سواه مخلوقٌ مدبَّر ليس له من الأمر شيء. ثم خوَّفهم إن لم يطيعوه عذابَ الله، فقال: ﴿إنِّي أخافُ عليكم عذابَ يوم عظيم﴾: وهذا من نصحه عليه الصلاة والسلام وشفقته عليهم؛ حيث خاف عليهم العذاب الأبديَّ والشقاء السرمديَّ؛ كإخوانه من المرسلين، الذين يشفِقون على الخَلْق أعظم من شفقة آبائهم وأمهاتهم."},{"a":"7:60","t":"فلما قال لهم هذه المقالة؛ ردُّوا عليه أقبح ردٍّ، فقال ﴿الملأ من قومِهِ﴾؛ أي: الرؤساء الأغنياء المتبوعون، الذين قد جرت العادة باستكبارهم على الحقِّ وعدم انقيادهم للرسل: ﴿إنا لنراك في ضلال مبين﴾: فلم يكفِهِم قبَّحَهُمُ اللهُ أنهم لم ينقادوا له، بل استكبروا عن الانقياد له، وقدحوا فيه أعظم قدح، ونسبوه إلى الضلال، ولم يكتفوا بمجرَّد الضلال، حتَّى جعلوه ضلالاً مبيناً واضحاً لكلِّ أحدٍ!! وهذا من أعظم أنواع المكابرة، التي لا تروج على أضعف الناس عقلاً، وإنَّما هذا الوصف منطبقٌ على قوم نوح، الذين جاؤوا إلى أصنام قد صوَّروها ونحتوها بأيديهم من الجمادات التي لا تسمع ولا تبصِرُ ولا تغني عنهم شيئاً، فنزَّلوها منزلة فاطر السماوات، وصرفوا لها ما أمكنهم من أنواع القُرُبات، فلولا أنَّ لهم أذهاناً تقوم بها حُجَّة الله عليهم؛ لَحُكِمَ عليهم بأن المجانين أهدى منهم، بل هم أهدى منهم وأعقل."},{"a":"7:61","t":"فرد نوح عليهم رَدًّا لطيفاً وترقَّق لهم لعلهم ينقادون له، فقال: ﴿يا قوم ليس بي ضلالةٌ﴾؛ أي: لست ضالاًّ في مسألة من المسائل من جميع الوجوه، وإنما أنا هادٍ مهتدٍ، بل هدايتُهُ عليه الصلاة والسلام من جنس هداية إخوانِهِ أولي العزم من المرسلين، أعلى أنواع الهدايات وأكملها وأتمها، وهي هداية الرسالة التامَّة الكاملة، ولهذا قال: ﴿ولكنِّي رسولٌ من ربِّ العالمينَ﴾؛ أي: ربي وربكم ورب جميع الخلق، الذي ربَّى جميع الخلق بأنواع التربية، الذي من أعظم تربيته أن أرسل إلى عباده رسلاً تأمرهم بالأعمال الصالحة والأخلاق الفاضلة والعقائد الحسنة، وتنهاهم عن أضدادها، ولهذا قال: ﴿أبلِّغُكم رسالاتِ ربِّي وأنصحُ لكم﴾؛ أي: وظيفتي تبليغكم ببيان توحيده وأوامره ونواهيه على وجه النصيحة لكم والشفقة عليكم، ﴿وأعلمُ من اللهِ مالا تعلمونَ﴾: فالذي يتعيَّن أن تطيعوني وتنقادوا لأمري إن كنتم تعلمونَ."},{"a":"7:62","t":"فرد نوح عليهم رَدًّا لطيفاً وترقَّق لهم لعلهم ينقادون له، فقال: ﴿يا قوم ليس بي ضلالةٌ﴾؛ أي: لست ضالاًّ في مسألة من المسائل من جميع الوجوه، وإنما أنا هادٍ مهتدٍ، بل هدايتُهُ عليه الصلاة والسلام من جنس هداية إخوانِهِ أولي العزم من المرسلين، أعلى أنواع الهدايات وأكملها وأتمها، وهي هداية الرسالة التامَّة الكاملة، ولهذا قال: ﴿ولكنِّي رسولٌ من ربِّ العالمينَ﴾؛ أي: ربي وربكم ورب جميع الخلق، الذي ربَّى جميع الخلق بأنواع التربية، الذي من أعظم تربيته أن أرسل إلى عباده رسلاً تأمرهم بالأعمال الصالحة والأخلاق الفاضلة والعقائد الحسنة، وتنهاهم عن أضدادها، ولهذا قال: ﴿أبلِّغُكم رسالاتِ ربِّي وأنصحُ لكم﴾؛ أي: وظيفتي تبليغكم ببيان توحيده وأوامره ونواهيه على وجه النصيحة لكم والشفقة عليكم، ﴿وأعلمُ من اللهِ مالا تعلمونَ﴾: فالذي يتعيَّن أن تطيعوني وتنقادوا لأمري إن كنتم تعلمونَ."},{"a":"7:63","t":"﴿أوَعَجِبْتُم أن جاءكم ذِكْرٌ من ربِّكم على رجل منكم﴾؛ أي: كيف تعجبون من حالة لا ينبغي العجب منها، وهو أن جاءكم التذكير والموعظة والنصيحة على يد رجل منكم، تعرفون حقيقتَه وصدقَه وحالَه؛ فهذه الحال من عناية الله بكم وبرِّه وإحسانه الذي يُتَلَقَّى بالقبول والشكر. وقوله: ﴿لِيُنذِرَكُم ولتتَّقوا ولعلَّكم تُرحمون﴾؛ أي: لينذركم العذاب الأليم، وتفعلوا الأسباب المنجية من استعمال تقوى الله ظاهراً وباطناً، وبذلك تحصُلُ عليهم، وتنزل رحمة الله الواسعة."},{"a":"7:64","t":"فلم يفد فيهم ولا نَجَحَ، ﴿فكذَّبوه فأنجَيْناه والذين معه في الفُلْك﴾؛ أي: السفينة التي أمر الله نوحاً عليه السلام بصنعها، وأوحى إليه أن يحمِلَ من كلِّ صنف من الحيوانات زوجين اثنين وأهله ومَنْ آمن معه، فحملهم فيها، ونجَّاهم الله بها. ﴿وأغرقنا الذين كذَّبوا بآياتنا إنَّهم كانوا قوماً عَمِينَ﴾: عن الهدى، أبصروا الحقَّ، وأراهم الله على يد نوح من الآيات البيناتِ ما به يؤمِنُ أولو الألباب، فسخروا منه، واستهزؤوا به، وكفروا."},{"a":"7:65","t":"أي: ﴿و﴾: أرسلنا ﴿إلى عادٍ﴾: ـ الأولى، الذين كانوا في أرض اليمن ـ ﴿أخاهم﴾: في النسب ﴿هوداً﴾: عليه السلام، يدعوهم إلى التوحيد، وينهاهم عن الشرك، والطغيان في الأرض، فقال لهم: ﴿يا قوم اعبُدوا اللهَ ما لكم من إلهٍ غيره أفلا تتقون﴾: سَخَطَهُ وعذابَهُ إن أقمتم على ما أنتم عليه."},{"a":"7:66","t":"فلم يستجيبوا ولا انقادوا، فقال ﴿الملأُ الذين كفروا من قومِهِ﴾: رادِّين لدعوته قادحين في رأيه: ﴿إنا لنراك في سَفاهةٍ وإنا لنظنُّك من الكاذبين﴾؛ أي: ما نراك إلاَّ سفيهاً غير رشيد، ويغلب على ظنِّنا أنك من جملة الكاذبين. وقد انقلبت عليهم الحقيقةُ واستحكم عماهم حيث رموا نبيَّهم عليه السلام بما هم متَّصفون به، وهو أبعدُ الناس عنه؛ فإنهم السفهاء حقًّا الكاذبون، وأيُّ سفهٍ أعظم ممَّن قابل أحقَّ الحقِّ بالردِّ والإنكار، وتكبَّر عن الانقياد للمرشدين والنصحاء، وانقاد قلبُهُ وقالبه لكلِّ شيطان مريدٍ، ووضع العبادة في غير موضعها، فعَبَدَ من لا يغني عنه شيئاً من الأشجار والأحجار؟! وأيُّ كذب أبلغ من كذب من نسب هذه الأمور إلى الله تعالى؟!"},{"a":"7:67","t":"﴿قال يا قوم ليس بي سفاهةٌ﴾: بوجهٍ من الوجوه، بل هو الرسول المرشدُ الرشيدُ، ﴿ولكنِّي رسولٌ من ربِّ العالمين﴾."}],"159":[{"a":"7:68","t":"﴿أبلِّغُكم رسالاتِ ربِّي وأنا لكم ناصحٌ أمين﴾: فالواجب عليكم أن تتلقَّوا ذلك بالقبول والانقياد وطاعة رب العباد."},{"a":"7:69","t":"﴿أوَعَجِبْتُم أن جاءكم ذِكْرٌ من ربِّكم على رجل منكُم لِيُنذِرَكُم﴾؛ أي: كيف تعجبون من أمر لا يُتَعَجَّبُ منه، وهو أن الله أرسل إليكم رجلاً منكم، تعرفون أمره، يذكِّركم بما فيه مصالحكم، ويحثُّكم على ما فيه النفع لكم، فتعجَّبتم من ذلك تعجُّب المنكرين. ﴿واذْكُروا إذْ جَعَلَكم خلفاء من بعد قوم نوح﴾؛ أي: واحمدوا ربَّكم، واشكُروه إذ مَكَّنَ لكم في الأرض، وجعلكم تخلُفون الأمم الهالكة الذين كذَّبوا الرسل، فأهلكهم الله، وأبقاكم لينظر كيف تعملون، واحذروا أن تقيموا على التكذيب كما أقاموا، فيصيبكم ما أصابهم، ﴿و﴾ اذكروا نعمة الله عليكم التي خصَّكم بها، وهي أن ﴿زادكم في الخلق بَسْطَةً﴾: في القوة وكبر الأجسام وشدَّة البطش، ﴿فاذكُروا آلاءَ اللهِ﴾؛ أي: نعمه الواسعة وأياديه المتكررة، ﴿لعلَّكُم﴾: إذا ذَكَرْتُموها بشكرها وأداء حقِّها، ﴿تفلحونَ﴾؛ أي: تفوزون بالمطلوب، وتنجون من المرهوب."},{"a":"7:70","t":"فوعظهم وذكَّرهم وأمرهم بالتوحيد وذكر لهم وصف نفسه وأنه ناصح أمين، وحذَّرهم أن يأخذهم اللهُ كما أخذ من قبلهم، وذكَّرهم نعم الله عليهم وإدرار الأرزاق إليهم، فلم ينقادوا ولا استجابوا، فقالوا متعجِّبين من دعوته ومخبرين له أنهم من المحال أن يطيعوه: ﴿أجئتَنا لنعبدَ اللهَ وحدَهُ ونَذَرَ ما كان يعبدُ آباؤنا﴾: قبَّحهم الله، جعلوا الأمر الذي هو أوجبُ الواجبات وأكملُ الأمور من الأمور التي لا يعارضون بها ما وجدوا عليه آباءهم، فقدَّموا ما عليه الآباء الضالون من الشرك وعبادة الأصنام على ما دعت إليه الرسل من توحيد الله وحده لا شريك له وكذبوا نبيهم وقالوا: ﴿ائتنا بما تعِدُنا إن كنتَ من الصادقين﴾: وهذا الاستفتاحُ منهم على أنفسهم."},{"a":"7:71","t":"فقال لهم هودٌ عليه السلام: ﴿قد وَقَعَ عليكم من ربِّكم رجْسٌ وغضبٌ﴾؛ أي: لا بدَّ من وقوعه؛ فإنه قد انعقدت أسبابه وحان وقتُ الهلاك. ﴿أتجادِلونَني في أسماءٍ سمَّيْتموها أنتم وآباؤكم﴾؛ أي: كيف تجادلون على أمور لا حقائق لها وعلى أصنام سمَّيْتُموها آلهة وهي لا شيء من الإلهية فيها ولا مثقال ذرَّة و ﴿ما أنزل الله بها من سلطانٍ﴾؛ فإنها لو كانت صحيحةً؛ لأنزل الله بها سلطانًا، فعدم إنزاله له دليلٌ على بطلانها؛ فإنه ما من مطلوب ومقصود ـ وخصوصاً الأمورَ الكبارَ ـ إلا وقد بيَّن الله فيها من الحجج ما يدلُّ عليها ومن السلطان ما لا تخفى معه، ﴿فانتظروا﴾: ما يقعُ بكم من العقاب الذي وَعَدْتكم به. ﴿إنِّي معكم من المنتظرين﴾: وفرق بين الانتظارَيْن؛ انتظارِ مَنْ يخشى وقوع العقاب ومَنْ يرجو من الله النصر والثواب."},{"a":"7:72","t":"ولهذا فتح الله بين الفريقين فقال: ﴿فأنجَيْناه﴾؛ أي: هوداً، ﴿والذين﴾ آمنوا معه ﴿برحمةٍ منا﴾: فإنه الذي هداهم للإيمان، وجعل إيمانهم سبباً ينالون به رحمته، فأنجاهم برحمته، ﴿وقطَعْنا دابر الذين كذَّبوا بآياتنا﴾؛ أي: استأصلناهم بالعذاب الشديد الذي لم يُبْق منهم أحداً، وسَلَّطَ الله عليهم ﴿الريح العقيم. ما تَذَرُ من شيءٍ أتت عليه إلا جعلته كالرَّميم﴾، ﴿فأهْلِكوا فأصبحوا لا يُرى إلاَّ مساكِنُهم فانْظُرْ كيف كان عاقبةُ المنذَرين﴾، الذين أقيمت عليهم الحُجج فلم ينقادوا لها، وأمِروا بالإيمان فلم يؤمنوا، فكان عاقِبَتُهم الهلاك والخزي والفضيحة، ﴿وأُتْبِعوا في هذه الدُّنيا لعنةً ويومَ القيامةِ. ألا إنَّ عاداً كَفَروا ربَّهم ألا بُعْداً لعادٍ قوم هود﴾. وقال هنا: ﴿وقَطَعْنا دابرَ الذين كذَّبوا بآياتنا وما كانوا مؤمنينَ﴾: بوجهٍ من الوجوه، بل وَصْفُهمُ التكذيب والعناد، ونعتُهُم الكِبْر والفساد."},{"a":"7:73","t":"أي: ﴿و﴾ أرسلنا ﴿إلى ثمود﴾: القبيلة المعروفة الذين كانوا يسكُنون الحِجْر وما حوله من أرض الحجاز وجزيرة العرب، أرسل الله إليهم ﴿أخاهم صالحاً﴾: نبيًّا يدعوهم إلى الإيمان والتوحيد وينهاهم عن الشرك والتنديد، فقال: ﴿يا قوم اعبدوا الله مالَكُم من إلهٍ غيره﴾: دعوتُهُ عليه الصلاة والسلام من جنس دعوة إخوانه من المرسلين: الأمر بعبادةِ الله وبيان أنه ليس للعباد إله غير الله. ﴿قد جاءتْكم بينةٌ من ربِّكم﴾؛ أي: خارق من خوارق العادات التي لا تكون إلا آية سماويَّة لا يقدر الناس عليها، ثم فسَّرها بقوله: ﴿هذه ناقةُ الله لكم آية﴾؛ أي: هذه ناقةٌ شريفةٌ فاضلةٌ لإضافتها إلى الله تعالى إضافة تشريف، لكم فيها آية عظيمة، وقد ذكر وجه الآية في قوله: ﴿لها شِرْبٌ ولكم شِرْبُ يوم معلوم﴾، وكان عندهم بئر كبيرةٌ، وهي المعروفة ببئر الناقة، يتناوبونها هم والناقة، للناقة يوم تشربها ويشربون اللبن من ضرعها، ولهم يوم يردونها وتصدر الناقة عنهم. وقال لهم نبيُّهم صالح عليه السلام: ﴿فذَروها تأكلْ في أرض الله﴾: فلا عليكم من مؤونتها شيء، ﴿ولا تَمَسُّوها بسوءٍ﴾؛ أي: بعقر أو غيره، ﴿فيأخذَكُم عذابٌ أليم﴾."}],"160":[{"a":"7:74","t":"﴿واذْكُروا إذ جَعَلَكُم خلفاءَ﴾: في الأرض تتمتَّعون بها وتدركون مطالبكم، ﴿من بعد عادٍ﴾: الذين أهلكهم الله وجعَلَكم خلفاء من بعدهم، ﴿وبوَّأكم في الأرض﴾؛ أي: مكَّن لكم فيها وسهَّل لكم الأسباب الموصلة إلى ما تريدون وتبتغون، ﴿تتَّخذونَ من سهولها قصوراً﴾؛ أي: الأراضي السهلة التي ليست بجبال بيوتاً، ومن الجبال بيوتاً ينحتونها كما هو مشاهدٌ إلى الآن أعمالهم التي في الجبال من المساكن والحِجْر ونحوها، وهي باقية ما بقيت الجبال. ﴿فاذكروا آلاء الله﴾؛ أي: نعمه وما خوَّلكم من الفضل والرزق والقوة، ﴿ولا تعثَوا في الأرض مفسدين﴾؛ أي: لا تُخَرِّبوا في الأرض بالفساد والمعاصي؛ فإن المعاصي تدع الديارَ العامرةَ بلاقِعَ، وقد أخلتْ ديارَهُم منهم، وأبقتْ مساكِنَهم موحشةً بعدَهم."},{"a":"7:75","t":"﴿قال الملأُ الذين استكبروا من قومِهِ﴾؛ أي: الرؤساء والأشراف الذين تكبروا عن الحق، ﴿للذين استضعفوا﴾: ولما كان المستضعَفون ليسوا كلُّهم مؤمنين؛ قالوا: ﴿لِمَنْ آمن منهم أتعلَمون أنَّ صالحاً مرسلٌ من ربِّه﴾؛ أي: أهو صادقٌ أم كاذب؟ فقال المستضعفون: إنَّا بالذي ﴿أرسِلَ به مؤمنونَ﴾ من توحيد الله والخبر عنه وأمره ونهيه."},{"a":"7:76","t":"﴿قال الذين استكبَروا إنَّا بالذي آمنتُم به كافرونَ﴾: حَمَلَهُمُ الكِبْرُ أن لا ينقادوا للحقِّ الذي انقاد له الضعفاء."},{"a":"7:77","t":"﴿فعقروا الناقة﴾: التي توعَّدهم إن مسوها بسوء أن يصيبَهم عذابٌ أليم. ﴿وعَتَوا عن أمر ربِّهم﴾؛ أي: قسوا عنه واستكبروا عن أمره الذي مَنْ عتا عنه أذاقه العذاب الشديد، لا جرم أحلَّ الله بهم من النَّكال ما لم يُحِلَّ بغيرِهم. ﴿وقالوا﴾: مع هذه الأفعال متجرِّئين على الله معجِزين له غير مبالين بما فعلوا بل مفتخرين بها: ﴿يا صالحُ ائتِنا بما تعِدُنا﴾: - إن كنت من الصادقين - من العذاب، فقال: ﴿تمتَّعوا في دارِكم ثلاثةَ أيَّام ذلك وعدٌ غيرُ مكذوبٍ﴾."},{"a":"7:78","t":"﴿فأخذتهم الرجفةُ فأصبحوا في دارِهِم جاثمين﴾: على ركبهم قد أبادهم الله وقطع دابرهم."},{"a":"7:79","t":"﴿فتولَّى عنهم﴾: صالحٌ عليه السلام حين أحلَّ الله بهم العذاب، ﴿وقال﴾: مخاطباً لهم توبيخاً وعتاباً بعدما أهلكهم الله: ﴿يا قوم لقد أبلغتُكُم رسالةَ ربِّي ونصحتُ لكم﴾؛ أي: جميع ما أرسلني الله به إليكم قد أبلغتُكم به وحرصت على هدايتكم واجتهدتُ في سلوككم الصراط المستقيم والدين القويم، ﴿ولكن لا تحبُّونَ الناصحين﴾: بل رددتُم قول النُّصحاء، وأطعتم كلَّ شيطان رجيم. واعلم أن كثيراً من المفسِّرين يذكرون في هذه القصة أنَّ الناقة خرجت من صخرةٍ صماء ملساء اقترحوها على صالح، وأنها تمخَّضت تمخُّض الحامل، فخرجت الناقة وهم ينظرون، وأن لها فصيلاً حين عقروها رغى ثلاث رغيات وانفلق له الجبل ودخل فيه، وأن صالحاً عليه السلام قال لهم: آية نزول العذاب بكم أن تصبحوا في اليوم الأول من الأيام الثلاثة ووجوهكم مصفرَّة، واليوم الثاني محمرَّة، والثالث مسودَّة، فكان كما قال. وهذا من الإسرائيليات التي لا ينبغي نقلها في تفسير كتاب الله، وليس في القرآن ما يدلُّ على شيء منها بوجه من الوجوه، بل لو كانت صحيحةً لَذَكَرها الله تعالى؛ لأن فيها من العجائب والعبر والآيات ما لا يهمله تعالى ويدع ذِكْرَهُ حتى يأتي من طريق مَنْ لا يوثَق بنقله، بل القرآن يكذِّب بعض هذه المذكورات؛ فإنَّ صالحاً قال لهم: ﴿تمتَّعوا في دارِكُم ثلاثة [أيام]﴾؛ أي: تنعَّموا وتلذَّذوا بهذا الوقت القصير جدًّا؛ فإنه ليس لكم من المتاع واللَّذَّة سوى هذا، وأيُّ لذَّة وتمتُّع لمن وعدهم نبيُّهم وقوع العذاب وذكر لهم وقوع مقدِّماته فوقعت يوماً فيوماً على وجهٍ يعمُّهم ويشمُلهم؛ لأن احمرار وجوههم واصفرارها واسودادها من العذاب؟! هل هذا إلا مناقض للقرآن ومضادٌّ له؟! فالقرآن فيه الكفاية والهداية عن ما سواه. نعم؛ لو صحَّ شيء عن رسول الله - صلى الله عليه وسلم - مما لا يناقض كتاب الله؛ فعلى الرأس والعين، وهو مما أمر القرآن باتباعه: ﴿وما آتاكُمُ الرسولُ فُخذوه وما نهاكم عنه فانتَهوا﴾. وقد تقدَّم أنه لا يجوز تفسير كتاب الله بالأخبار الإسرائيليَّة، ولو على تجويز الرواية عنهم بالأمور التي لا يُجْزَمُ بكذِبِها؛ فإنَّ معاني كتاب الله يقينيَّة، وتلك أمور لا تصدَّق ولا تكذَّب؛ فلا يمكن اتفاقهما."},{"a":"7:80","t":"أي: ﴿و﴾ اذكر عبدنا ﴿لوطاً﴾: عليه الصلاة والسلام؛ إذ أرسلناه إلى قومه؛ يأمُرُهم بعبادة الله وحدَه، وينهاهم عن الفاحشة التي ما سبقَهم بها أحدٌ من العالمين؛ فقال: ﴿أتأتونَ الفاحشةَ﴾؛ أي: الخصلة التي بلغت في العِظَم والشَّناعة إلى أن استغرقتْ أنواعَ الفحش، ﴿ما سَبَقَكم بها من أحدٍ من العالمين﴾: فكونُها فاحشةً من أشنع الأشياء، وكونُهم ابتدعوها، وابتَكَروها، وسَنُّوها لمن بعدَهم من أشنع ما يكونُ أيضاً."},{"a":"7:81","t":"ثم بيَّنها بقوله: ﴿إنَّكم لَتأتونَ الرجال شهوةً من دون النساء﴾؛ أي: كيف تَذَرون النساء التي خلقهنَّ الله لكم، وفيهنَّ المستمتَعُ الموافق للشهوة والفطرة، وتقبِلون على أدبار الرجال، التي هي غايةُ ما يكون في الشناعة والخبث، محلٌّ تخرج منه الأنتان والأخباث التي يُسْتَحى من ذكرِها فضلاً عن ملامستها وقربها. ﴿بل أنتم قومٌ مسرفونَ﴾؛ أي: متجاوِزون لما حدَّه الله، متجرِّئون على محارمه."}],"161":[{"a":"7:82","t":"﴿وما كانَ جوابَ قومِهِ إلَّا أن قالوا أخرِجوهِم من قريتِكُم إنَّهم أناسٌ يتطهَّرونَ﴾؛ أي: يتنزَّهون عن فعل الفاحشة، ﴿وما نَقَموا منهم إلاَّ أن يؤمنوا باللهِ العزيز الحميد﴾."},{"a":"7:83","t":"﴿فأنجيناه وأهلَهُ إلَّا امرأتَهُ كانت من الغابرينَ﴾؛ أي: الباقين المعذَّبين؛ أمره الله أن يسري بأهله ليلاً؛ فإنَّ العذابَ مصبِّحٌ قومَه، فسرى بهم إلاَّ امرأته أصابها ما أصابهم."},{"a":"7:84","t":"﴿وأمطَرْنا عليهم مطراً﴾؛ أي: حجارة حارَّة شديدةً من سِجِّيل، وجعل الله عالِيَها سافِلَها، ﴿فانظرْ كيف كان عاقبةُ المجرِمين﴾: الهلاك والخزي الدائم."},{"a":"7:85","t":"أي: ﴿و﴾ أرسلنا إلى القبيلة المعروفة بمدين ﴿أخاهم﴾: في النسب، ﴿شُعَيْباً﴾: يدعوهم إلى عبادة الله وحده لا شريك له، ويأمرهم بإيفاء المكيال والميزان، وأن لا يبخسوا الناس أشياءهم، وأن لا يعثَوْا في الأرض مفسدين بالإكثار من عمل المعاصي، ولهذا قال: ﴿ولا تفسدوا في الأرض بعد إصلاحها ذلكم خير لكم إن كنتم مؤمنين﴾: فإنَّ ترك المعاصي امتثالاً لأمر الله وتقرُّباً إليه خيرٌ وأنفع للعبد من ارتكابها الموجب لسخط الجبار وعذاب النار."},{"a":"7:86","t":"﴿ولا تقعُدوا﴾: للناس ﴿بكلِّ صراطٍ﴾؛ أي: طريق من الطرق التي يكثُرُ سلوكها؛ تحذِّرون الناس منها، و ﴿توعِدونَ﴾: من سلكها، ﴿وتَصُدُّون عن سبيل الله﴾: من أراد الاهتداء به، ﴿وتبغونَها عِوَجاً﴾؛ أي: تبغون سبيل الله تكون معوجَّة، وتميلونها اتِّباعاً لأهوائكم، وقد كان الواجب عليكم وعلى غيركم الاحترام والتعظيم للسبيل التي نصبها الله لعباده، ليسلكوها إلى مرضاته ودار كرامته ورحمهم بها أعظمَ رحمةٍ، وتَصَدَّون لنصرتها والدعوة إليها والذبِّ عنها، لا أن تكونوا أنتم قطاع طريقها الصّادِّين الناس عنها؛ فإنَّ هذا كفرٌ لنعمة الله ومحادَّة لله وجعل أقوم الطرق وأعدلها مائلةً، وتشنِّعون على من سلكها، ﴿واذكُروا﴾: نعمة الله عليكم ﴿إذ كُنتُم قليلاً فكثَّرَكم﴾؛ أي: نمَّاكم بما أنعم عليكم من الزوجات والنسل والصحة، وأنه ما ابتلاكم بوباء أو أمراض من الأمراض المقلِّلة لكم، ولا سلَّط عليكم عدوًّا يجتاحُكم، ولا فرَّقكم في الأرض، بل أنعم عليكم باجتماعكم وإدرار الأرزاق وكثرة النسل. ﴿وانظروا كيف كان عاقبةُ المفسدين﴾: فإنكم لا تجدون في جموعهم إلاَّ الشتات، ولا في ربوعهم إلاَّ الوَحْشة والانبتات، ولم يورثوا ذِكْراً حسناً، بل أُتْبِعوا في هذه الدُّنيا لعنةً ويوم القيامة [أشد] خزياً وفضيحة."},{"a":"7:87","t":"﴿وإن كان طائفةٌ منكُم آمنوا بالذي أرْسِلْتُ به وطائفةٌ لم يؤمنوا﴾: وهم الجمهور منهم، ﴿فاصبِروا حتى يحكُمَ اللهُ بيننا وهو خيرُ الحاكمينَ﴾: فينصر المحقَّ، ويوقع العقوبة على المبطل."}],"162":[{"a":"7:88","t":"﴿قال الملأُ الذين استَكْبَروا من قومِهِ﴾: وهم الأشرافُ والكبراءُ منهم، الذين اتَّبعوا أهواءهم ولهوا بلذاتهم، فلما أتاهم الحقُّ ورأوه غير موافق لأهوائهم الرديئة؛ ردُّوه، واستكبروا عنه، فقالوا لنبيِّهم شعيب ومن معه من المؤمنين المستضعفين: ﴿لنخرجَنَّكَ يا شعيبُ والذين آمنوا معك من قريتِنا أو لتعودُنَّ في مِلَّتنا﴾: استعملوا قوَّتهم السَّبُعية في مقابلة الحقِّ، ولم يراعوا ديناً ولا ذمَّةً ولا حقًّا، وإنما راعوا واتبعوا أهواءهم وعقولهم السفيهة، التي دلَّتهم على هذا القول الفاسد، فقالوا إمَّا أن ترجع أنت ومن معك إلى ديننا أو لنخرجنَّكم من قريتنا؛ فشعيبٌ عليه الصلاة والسلام كان يدعوهم طامعاً في إيمانهم، والآن لم يَسْلَم [من شرهم] حتى توعَّدوه إن لم يتابعهم بالجلاء عن وطنه الذي هو ومن معه أحقُّ به منهم. فقال لهم شعيبٌ عليه الصلاة والسلام متعجباً من قولهم: ﴿أوَلَوْ كنَّا كارهينَ﴾؛ أي: أنتابعكم على دينكم وملَّتكم الباطلة ولو كُنَّا كارهين لها لعلمنا ببطلانها؛ فإنما يدعَى إليها من له نوعُ رغبة فيها، أما من يعلن بالنهي عنها والتشنيع على من اتَّبعها؛ فكيف يُدعى إليها."},{"a":"7:89","t":"﴿قدِ افتَرَيْنا على الله كذباً إن عُدْنا في ملَّتكم بعد إذ نجَّانا الله منها﴾؛ أي: اشهدوا علينا أننا إن عُدنا [فيها] بعد ما نجَّانا الله منها وأنقذنا من شرِّها أننا كاذبون مفترون على الله الكذب؛ فإننا نعلمُ أنه لا أعظم افتراء ممَّن جعل لله شريكاً وهو الواحد الأحد الفرد الصمد الذي لم يتَّخذ صاحبة ولا ولداً ولا شريكاً في الملك. ﴿وما يكونُ لنا أن نعودَ فيها﴾؛ أي: يمتنع على مثلنا أن نعودَ فيها؛ فإنَّ هذا من المحال، فآيَسَهم عليه الصلاة والسلام من كونه يوافقهم من وجوهٍ متعددةٍ. من جهة أنهم كارهون لها مبغضون لما هم عليه من الشرك. ومن جهة أنه جعل ما هم عليه كذباً وأشهدهم أنه إنِ اتَّبَعَهم ومن معه فإنَّهم كاذبون. ومنها اعترافُهم بمنَّة الله عليهم إذ أنقذهم الله منها، ومنها أنَّ عودَهم فيها بعدما هداهم الله من المحالات بالنظر إلى حالتهم الراهنة وما في قلوبهم من تعظيم الله تعالى والاعتراف له بالعبوديَّة وأنه الإله وحده الذي لا تنبغي العبادة إلاَّ له وحده لا شريك له، وأنَّ آلهة المشركين أبطل الباطل وأمحل المحال، وحيث إنَّ اللهَ منَّ عليهم بعقول يعرفون بها الحقَّ والباطل والهدى والضلال، وأما من حيث النظر إلى مشيئة الله وإرادته النافذة في خلقه التي لا خروجَ لأحدٍ عنها ولو تواترتِ الأسبابُ وتوافقت القوى؛ فإنَّهم لا يحكمون على أنفسهم أنهم سيفعلون شيئاً أو يتركونه، ولهذا استثنى: ﴿وما يكونُ لنا أن نعودَ فيها إلا أن يشاء اللهُ ربُّنا﴾؛ أي: فلا يمكننا ولا غيرنا الخروج عن مشيئته التابعة لعلمه وحكمته، وقد ﴿وَسِعَ ربُّنا كلَّ شيءٍ علماً﴾: فيعلم ما يصلُح للعباد، وما يدبِّرُهم عليه. ﴿على الله توكَّلْنا﴾؛ أي: اعتمدنا أنه سيثبِّتنا على الصراط المستقيم، وأن يعصِمَنا من جميع طرق الجحيم؛ فإن من توكَّل على الله كفاه ويسَّر له أمر دينه ودنياه. ﴿ربَّنا افتحْ بينَنا وبين قومِنا بالحقِّ﴾؛ أي: انصر المظلوم وصاحب الحق على الظالم المعاند للحق، ﴿وأنت خيرُ الفاتحين﴾: وفتحُهُ تعالى لعباده نوعان: فتحُ العلم بتبيين الحقِّ من الباطل والهدى من الضلال ومَنْ هو المستقيمُ على الصراط ممَّن هو منحرفٌ عنه. والنوع الثاني: فتحُهُ بالجزاء وإيقاع العقوبة على الظالمين، والنجاة والإكرام للصالحين. فسألوا الله أن يفتحَ بينَهم وبين قومهم بالحقِّ والعدل، وأن يريَهم من آياتِهِ وعِبَرِهِ ما يكون فاصلاً بين الفريقين."},{"a":"7:90","t":"﴿وقال الملأُ الذين كفروا من قومه﴾: محذِّرين عن اتِّباع شعيب: ﴿لئن اتَّبعتم شعيباً إنَّكم إذاً لخاسرونَ﴾: هذا ما سوَّلت لهم أنفسهم؛ أن الخسارة والشقاء في اتباع الرشد والهدى، ولم يدروا أن الخسارة كلَّ الخسارة في لزوم ما هم عليه من الضلال والإضلال، وقد علموا ذلك حين وقع بهم النَّكال."},{"a":"7:91","t":"﴿فأخذتْهُمُ الرجفةُ﴾؛ أي: الزلزلة الشديدة، ﴿فأصبحوا في دارهم جاثمينَ﴾؛ أي: صرعى ميِّتين هامدين."},{"a":"7:92","t":"قال تعالى ناعياً حالَهم: ﴿الذين كذَّبوا شعيباً كأن لم يَغْنَوْا فيها﴾؛ أي: كأنهم ما أقاموا في ديارهم، وكأنهم ما تمتَّعوا في عَرَصاتهم، ولا تفيَّئوا في ظلالها، ولا غنوا في مسارح أنهارها، ولا أكلوا من ثمار أشجارها، فأخذهم العذاب فنقلهم من مورد اللهو واللعب واللَّذَّات إلى مستقرِّ الحزن والشقاء والعقاب والدرَكات، ولهذا قال: ﴿الذين كذَّبوا شُعيباً كانوا هم الخاسرينَ﴾؛ أي: الخسار محصورٌ فيهم؛ لأنهم خسروا أنفسهم وأهليهم يوم القيامة، ألا ذلك هو الخسران المبين، لا مَنْ قالوا لهم: ﴿لئنِ اتَّبعتُم شعيباً إنَّكم إذاً لخاسرونَ﴾."},{"a":"7:93","t":"فحين هلكوا تولَّى عنهم نبيُّهم عليه الصلاة والسلام، ﴿وقال﴾ معاتباً وموبِّخاً ومخاطباً لهم بعد موتهم: ﴿يا قوم لقد أبلغتُكم رسالاتِ ربِّي﴾؛ أي: أوصلتها إليكم وبيَّنتها حتَّى بلغت منكم أقصى ما يمكن أن تصل إليه وخالطت أفئدتكم، ﴿ونصحتُ لكم﴾: فلم تقَبلوا نُصحي ولا انقدتم لإرشادي، بل فسقتُم وطغيتم؛ ﴿فكيف آسى على قوم كافرينَ﴾؛ أي: فكيف أحزن على قوم لا خيرَ فيهم، أتاهم الخيرُ فردُّوه ولم يقبلوه، ولا يَليقُ بهم إلا الشرُّ؛ فهؤلاء غير حقيقين أن يُحْزَنَ عليهم، بل يُفْرَحُ بإهلاكهم ومَحْقِهم؛ فعياذاً بك اللهمَّ من الخزي والفضيحة! وأيُّ شقاء وعقوبة أبلغ من أن يصلوا إلى حالة يتبرأ منهم أنصح الخلق لهم؟!"},{"a":"7:94","t":"يقول تعالى: ﴿وما أرسلنا في قرية من نبيٍّ﴾: يدعوهم إلى عبادة الله، وينهاهم عن ما هم فيه من الشرِّ، فلم ينقادوا له؛ إلاَّ ابتلاهم الله ﴿بالبأساءِ والضرَّاءِ﴾؛ أي: بالفقر والمرض وأنواع البلايا، ﴿لعلهم﴾: إذا أصابتهم؛ خضعتْ نفوسُهم؛ فتضرعوا إلى الله، واستكانوا للحق."},{"a":"7:95","t":"﴿ثم﴾: إذا لم يُفِدْ فيهم واستمرَّ استكبارُهم وازداد طغيانُهم، ﴿بدَّلْنا مكانَ السيئةِ الحسنةَ﴾: فأَدَرَّ عليهم الأرزاق، وعافى أبدانهم، ورفع عنهم البلايا، ﴿حتى عَفَوْا﴾؛ أي: كثروا وكثرتْ أرزاقُهم وانبسطوا في نعمة الله وفضله ونسوا ما مرَّ عليهم من البلايا ، ﴿وقالوا قد مسَّ آباءنا الضَّرَّاءُ والسَّرَّاءُ﴾؛ أي: هذه عادة جارية لم تزل موجودة في الأولين واللاحقين؛ تارة يكونون في سرَّاء، وتارة في ضرَّاء، وتارة في فرح، ومرة في ترح؛ على حسب تقلُّبات الزمان وتداول الأيام، وحسبوا أنها ليست للموعظة والتذكير ولا للاستدراج والنكير، حتى إذا اغتبطوا وفرحوا بما أوتوا، وكانت الدُّنيا أسرَّ ما كانت إليهم. أخذْناهم بالعذاب ﴿بغتةً وهم لا يشعُرون﴾؛ أي: لا يخطُرُ لهم الهلاك على بالٍ، وظنُّوا أنهم قادرون على ما آتاهم الله، وأنهم غير زائلين ولا منتقلين عنه."}],"163":[{"a":"7:96","t":"لما ذكر تعالى أنَّ المكذِّبين للرسل يُبتلون بالضراء موعظةً وإنذاراً، وبالسراء استدراجاً ومكراً؛ ذكر أنَّ أهل القُرى لو آمنوا بقلوبهم إيماناً صادقاً صدقتْه الأعمالُ، واستعملوا تقوى الله تعالى ظاهراً وباطناً بترك جميع ما حرَّم الله [تعالى]؛ لفتحَ عليهم بركاتِ السَّماء والأرض، فأرسل السماء عليهم مدراراً، وأنبتَ لهم من الأرض ما به يعيشون وتعيشُ بهائمهُم في أخصب عيش وأغزر رزق من غير عناء ولا تعبٍ ولا كدٍّ ولا نصبٍ، ولكنهم لم يؤمنوا ويتَّقوا، ﴿فأخذناهم بما كانوا يكسِبون﴾: بالعقوبات والبلايا ونزع البركات وكثرة الآفات، وهي بعض جزاء أعمالهم، وإلاَّ؛ فلو آخذهم بجميع ما كسبوا؛ ما ترك على ظهرها من دابَّةٍ، ﴿ظَهَرَ الفسادُ في البرِّ والبحر بما كَسَبَتْ أيدي الناس لِيُذيقَهم بعضَ الذي عملوا لعلَّهم يرجِعون﴾."},{"a":"7:97","t":"﴿أفأمِنَ أهلُ القرى﴾؛ أي: المكذبة بقرينة السياق، ﴿أن يأتِيَهُم بأسُنا﴾؛ أي: عذابنا الشديد، ﴿بَياتاً وهم نائمون﴾؛ أي: في غفلتهم وغرتهم وراحتهم."},{"a":"7:98","t":"﴿أوَ أمِنَ أهلُ القرى أن يأتِيَهم بأسُنا ضحىً وهم يلعبونَ﴾: أيُّ شيءٍ يؤمِّنُهم من ذلك وهم قد فعلوا أسبابه وارتكبوا من الجرائم العظيمة ما يوجب بعضُه الهلاك."},{"a":"7:99","t":"﴿أفأمنوا مَكْرَ الله﴾: حيث يستدرِجُهم من حيث لا يعلمونَ، ويُملي لهم إنَّ كيده متين. ﴿فلا يأمنُ مكرَ اللهِ إلا القومُ الخاسرون﴾: فإنَّ من أمِنَ من عذاب الله؛ فإنه لم يصدِّق بالجزاء على الأعمال ولا آمن بالرسل حقيقة الإيمان. وهذه الآية الكريمة فيها من التخويف البليغ على أنَّ العبد لا ينبغي له أن يكون آمناً على ما معه من الإيمان، بل لا يزالُ خائفاً وَجِلاً أن يُبتلى ببليَّةٍ تسلب ما معه من الإيمان، وأن لا يزال داعياً بقوله: يا مقلب القلوب! ثبِّتْ قلبي على دينك، وأن يعمل ويسعى في كلِّ سبب يخلِّصه من الشرِّ عند وقوع الفتن؛ فإنَّ العبد ولو بلغت به الحال ما بلغتْ؛ فليس على يقين من السلامة."},{"a":"7:100","t":"يقول تعالى منبهاً للأمم الغابرين بعد هلاك الأمم الغابرين: ﴿أوَلَمْ يَهْدِ للذين يرِثون الأرض من بعدِ أهلها أن لو نشاءُ أصبْناهم بذُنوبهم﴾؛ أي: أوَلم يتبيَّن ويتَّضح للأمم الذين ورثوا الأرض بعد إهلاك من قبلَهم بذنوبهم ثم عملوا كأعمال أولئك المهلَكين، أوَلم يهتدوا أنَّ الله لو شاء لأصابَهم بذُنوبهم؛ فإنَّ هذه سنته في الأولين والآخرين. وقوله: ﴿ونطبَعُ على قلوبهم فهم لا يسمعونَ﴾؛ أي: إذا نبَّههم الله فلم ينتبهوا، وذكَّرهم فلم يتذكَّروا، وهداهم بالآيات والعِبَر فلم يهتَدوا؛ فإنَّ الله تعالى يعاقِبُهم ويطبعُ على قلوبهم فيعلوها الرَّانُ والدَّنَسُ حتى يُخْتَمَ عليها فلا يدخُلها حقٌّ ولا يصلُ إليها خيرٌ ولا يسمعون ما ينفعهم، وإنَّما يسمعون ما به تقوم الحجَّةُ عليهم."},{"a":"7:101","t":"﴿تلك القرى﴾: الذين تقدَّم ذِكْرُهم، ﴿نَقُصُّ عليك من أنبائها﴾: ما يحصُلُ به عبرة للمعتبرين، وازدجارٌ للظالمين، وموعظة للمتقين، ﴿ولقد جاءتْهم رسُلُهم بالبيناتِ﴾؛ أي: [ولقد] جاءت هؤلاء المكذبين رسُلُهم تدعوهم إلى ما فيه سعادتهم، وأيَّدهم الله بالمعجزات الظاهرة والبيِّنات المبيِّنات للحقِّ بياناً كاملاً، ولكنهم لم يُفِدْهم هذا ولا أغنى عنهم شيئاً؛ ﴿فما كانوا ليؤمِنوا بما كذَّبوا من قبلُ﴾؛ أي: بسبب تكذيبهم وردِّهم الحقّ أول مرة ما كان يهديهم للإيمان جزاءً لهم على ردِّهم الحق؛ كما قال تعالى: ﴿ونقلِّبُ أفْئِدَتَهم وأبصارَهم كما لم يؤمنوا به أولَ مرَّةٍ ونَذَرُهم في طغيانِهِم يعمَهونَ﴾، ﴿كذلك يطبعُ الله على قلوب الكافرين﴾: عقوبةً منه، وما ظلمهم الله، ولكنهم ظلموا أنفسهم."},{"a":"7:102","t":"﴿وما وَجَدْنا لأكثرِهم من عهدٍ﴾؛ أي: وما وجدنا لأكثر الأمم الذين أرسل الله إليهم الرسل من عهد؛ أي: من ثبات والتزام لوصية الله التي أوصى بها جميع العالمين، ولا انقادوا لأوامره التي ساقها إليهم على ألسنة رسله. ﴿وإن وَجَدْنا أكْثَرَهُم لفاسقينَ﴾؛ أي: خارجين عن طاعة الله، متَّبعين لأهوائهم بغير هدىً من الله؛ فالله تعالى امتحن العباد بإرسال الرسل وإنزال الكتب، وأمرهم باتِّباع عهده وهداه، فلم يمتثلْ لأمره إلا القليل من الناس، الذين سبقتْ لهم من الله سابقةُ السعادة، وأما أكثر الخلق؛ فأعرضوا عن الهدى، واستكبروا عما جاءت به الرسل، فأحلَّ الله بهم من عقوباتِهِ المتنوِّعة ما أحلَّ."},{"a":"7:103","t":"أي: ثم بعثنا من بعد أولئك الرسل موسى الكليم الإمام العظيم والرسول الكريم إلى قوم عتاةٍ جبابرةٍ ـ وهم فرعون وملؤه من أشرافهم وكبرائهم ـ فأراهم من آيات الله العظيمة ما لم يشاهَدْ له نظيرٌ. ﴿فظلموا بها﴾: بأن لم ينقادوا لحقِّها الذي مَن لم ينقدْ له فهو ظالمٌ، بل استكبروا عنها، ﴿فانظرْ كيفَ كان عاقبةُ المفسدينَ﴾: كيف أهلَكَهُمُ الله وأتْبَعَهم الذمَّ واللعنة في الدنيا، ويوم القيامة بئس الرِّفْدُ المرفود."},{"a":"7:104","t":"وهذا مجمل فصَّله بقوله: ﴿وقال موسى﴾: حين جاء إلى فرعون يدعوه إلى الإيمان: ﴿يا فرعونُ إنِّي رسولٌ من ربِّ العالَمين﴾؛ أي: إني رسولٌ من مُرسِل عظيم، وهو ربُّ العالَمين، الشامل للعالم العلويِّ والسفليِّ، مربِّي جميع خلقِهِ بأنواع التدابير الإلهيَّة، التي من جملتها أنه لا يترُكُهم سدىً، بل يرسل إليهم الرسل مبشِّرين ومنذرين، وهو الذي لا يقدر أحدٌ أن يتجرَّأ عليه ويدَّعي أنه أرسله ولم يرسله."}],"164":[{"a":"7:105","t":"فإذا كان هذا شأنه، وأنا قد اختارني واصطفاني لرسالته؛ فحقيقٌ عليَّ أن لا أكذب عليه ولا أقول عليه إلا الحقَّ؛ فإني لو قلتُ غير ذلك؛ لعاجلني بالعقوبة، وأخذني أخذ عزيز مقتدر؛ فهذا موجبٌ لأن ينقادوا له ويتَبعوه، خصوصاً وقد جاءهم ببيِّنة من الله واضحةٍ على صحَّة ما جاء به من الحقِّ، فوجب عليهم أن يعملوا بمقصود رسالته، ولها مقصودان عظيمان: إيمانُهم به واتِّباعُهم له، وإرسالُ بني إسرائيل الشعب الذي فضَّله الله على العالمين أولاد الأنبياء وسلسلة يعقوب عليه السلام الذي موسى عليه الصلاة والسلام واحدٌ منهم."},{"a":"7:106","t":"فقال له فرعون: ﴿إن كنتَ جئتَ بآيةٍ فأت بها إن كنتَ من الصادقين﴾."},{"a":"7:107","t":"﴿فألقى﴾ موسى ﴿عصاه﴾: في الأرض، ﴿فإذا هي ثعبانٌ مبينٌ﴾؛ أي: حية ظاهرةٌ تسعى وهم يشاهدونها."},{"a":"7:108","t":"﴿ونزع يده﴾: من جيبه، ﴿فإذا هي بيضاء للناظرين﴾: من غير سوءٍ؛ فهاتان آيتان كبيرتان دالَّتان على صحة ما جاء به موسى وصدقِهِ، وأنَّه رسولُ ربِّ العالمين."},{"a":"7:109","t":"ولكن الذين لا يؤمنون لو جاءتهم كلُّ آيةٍ لا يؤمنون حتى يروا العذاب الأليم؛ فلهذا ﴿قال الملأ من قوم فرعون﴾ حين بهرهم ما رأوا من الآيات ولم يؤمنوا وطلبوا لها التأويلات الفاسدة: ﴿إنَّ هذا لساحرٌ عليمٌ﴾؛ أي: ماهرٌ في سحره."},{"a":"7:110","t":"ثم خوَّفوا ضعفاءَ الأحلام وسفهاء العقول بأنه ﴿يريدُ﴾ موسى بفعلِهِ هذا ﴿أن يخرِجَكم من أرضكم﴾؛ أي: يريد أن يجليكم من أوطانكم، ﴿فماذا تأمرونَ﴾؟ أي: إنهم تشاوروا فيما بينهم ما يفعلون بموسى، وما يندفع به ضررهم بزعمهم عنهم؛ فإنَّ ما جاء به إن لم يقابَلْ بما يبطِلُه ويدحضه، وإلا؛ دخل في عقول أكثر الناس."},{"a":"7:111","t":"فحينئذ انعقد رأيهم إلى أن قالوا لفرعون: ﴿أرْجِهِ وأخاه﴾؛ أي: احبسهما وأمهلهما، وابعثْ في المدائن أناساً يحشُرون أهل المملكة ويأتون بكل سَحَّارٍ عليم؛ أي: يجيئون بالسحرة المهرة؛ ليقابلوا ما جاء به موسى، فقالوا: يا موسى ﴿اجعلْ بيننا وبينَكَ موعداً لا نُخْلِفُهُ نحن ولا أنت مكاناً سُوىً. قال موعِدْكم يومُ الزينةِ وأن يُحْشَرَ الناس ضحىً. فتولَّى فرعونُ فجمَعَ كيدَه ثم أتى﴾."},{"a":"7:112","t":"فحينئذ انعقد رأيهم إلى أن قالوا لفرعون: ﴿أرْجِهِ وأخاه﴾؛ أي: احبسهما وأمهلهما، وابعثْ في المدائن أناساً يحشُرون أهل المملكة ويأتون بكل سَحَّارٍ عليم؛ أي: يجيئون بالسحرة المهرة؛ ليقابلوا ما جاء به موسى، فقالوا: يا موسى ﴿اجعلْ بيننا وبينَكَ موعداً لا نُخْلِفُهُ نحن ولا أنت مكاناً سُوىً. قال موعِدْكم يومُ الزينةِ وأن يُحْشَرَ الناس ضحىً. فتولَّى فرعونُ فجمَعَ كيدَه ثم أتى﴾."},{"a":"7:113","t":"وقال هنا: ﴿وجاء السحرةُ فرعونَ﴾: طالبين منه الجزاء إن غلبوا، فقالوا: ﴿إنَّ لنا لأجراً إن كُنَّا نحنُ الغالبينَ﴾."},{"a":"7:114","t":"فقالَ فرعونُ: ﴿نعم﴾: لكم أجر، ﴿وإنَّكم لمن المقرَّبين﴾: فوعَدَهم الأجر والتقريب وعلو المنزلة عنده؛ ليجتهدوا ويبذُلوا، وسعهم وطاقتهم في مغالبة موسى."},{"a":"7:115","t":"فلما حضروا مع موسى بحضرة الخلق العظيم، ﴿قالوا﴾: على وجه التألِّي وعدم المبالاة بما جاء به موسى، ﴿يا موسى إما أن تُلْقِيَ﴾: ما معك، ﴿وإما أن نكونَ نحنُ الملقينَ﴾."},{"a":"7:116","t":"فقالَ موسى: ﴿ألقوا﴾: لأجل أن يرى الناسُ ما معهم وما مع موسى، ﴿فلما ألقَوْا﴾: حبالَهم وعصيَّهم إذا هي من سحرهم كأنها حياتٌ تسعى، فسحروا ﴿أعين الناس واسترهبوهم وجاؤوا بسحرٍ عظيم﴾: لم يوجدْ له نظيرٌ من السحر."},{"a":"7:117","t":"﴿وأوحَيْنا إلى موسى أن ألقِ عصاك﴾: فألقاها، ﴿فإذا هي﴾: حيَّةٌ تسعى فتلقفت جميعَ ما يأفِكونَ؛ أي: يكذِّبون به ويموِّهون."},{"a":"7:118","t":"﴿فوقع الحقُّ﴾؛ أي: تبين، وظهر، واستعلن في ذلك المجمع، ﴿وبَطَلَ ما كانوا يعملون﴾."},{"a":"7:119","t":"﴿فغُلِبوا هنالك﴾؛ أي: في ذلك المقام، ﴿وانقلبوا صاغرينَ﴾؛ أي: حقيرين قد اضمحلَّ باطلُهم وتلاشى سحرهم ولم يحصُل لهم المقصود الذي ظنوا حصوله."},{"a":"7:120","t":"وأعظم من تبيَّن له الحقُّ العظيم أهل الصنف والسحر [الذين] يعرفون من أنواع السحر وجزئياتِهِ ما لا يعرفه غيرُهم، فعرفوا أن هذه آية عظيمة من آيات الله، لا يدان لأحد بها، فألقي ﴿السحرةُ ساجدينَ. قالوا آمنا بربِّ العالمين. ربِّ موسى وهارون﴾؛ أي: وصدَّقنا بما بُعِثَ به موسى من الآيات البينات."}],"165":[{"a":"7:121","t":"وأعظم من تبيَّن له الحقُّ العظيم أهل الصنف والسحر [الذين] يعرفون من أنواع السحر وجزئياتِهِ ما لا يعرفه غيرُهم، فعرفوا أن هذه آية عظيمة من آيات الله، لا يدان لأحد بها، فألقي ﴿السحرةُ ساجدينَ. قالوا آمنا بربِّ العالمين. ربِّ موسى وهارون﴾؛ أي: وصدَّقنا بما بُعِثَ به موسى من الآيات البينات."},{"a":"7:122","t":"وأعظم من تبيَّن له الحقُّ العظيم أهل الصنف والسحر [الذين] يعرفون من أنواع السحر وجزئياتِهِ ما لا يعرفه غيرُهم، فعرفوا أن هذه آية عظيمة من آيات الله، لا يدان لأحد بها، فألقي ﴿السحرةُ ساجدينَ. قالوا آمنا بربِّ العالمين. ربِّ موسى وهارون﴾؛ أي: وصدَّقنا بما بُعِثَ به موسى من الآيات البينات."},{"a":"7:123","t":"فقال لهم ﴿فرعونُ﴾ متهدِّداً لهم على الإيمان: ﴿آمنتُم به قبل أن آذنَ لكم﴾: كان الخبيث حاكماً مستبداً على الأبدان والأقوال، قد تقرَّر عنده وعندهم أن قوله هو المطاع وأمره نافذٌ فيهم ولا خروج لأحدٍ عن قوله وحكمه، وبهذه الحالة تنحطُّ الأمم وتضعف عقولها ونفوذها وتعجز عن المدافعة عن حقوقها، ولهذا قال الله عنه: ﴿فاستخفَّ قومَه فأطاعوه﴾، وقال هنا: ﴿آمنتُم به قبلَ أن آذنَ لكم﴾؛ أي: فهذا سوءُ أدبٍ منكم وتجرُّؤ عليَّ، ثم موَّه على قومه وقال: ﴿إنَّ هذا لَمَكرٌ مكرتُموه في المدينة لتُخْرِجوا منها أهلها﴾؛ أي: إن موسى كبيركم الذي علَّمكم السحر، فتواطأتم أنتم وهو على أن تنغلِبوا له فيظهرَ فتتَّبعونه ثم يتَّبعكم الناس أو جمهورهم، فتُخْرِجوا منها أهلها، وهذا كذب يعلم هو ومن سبر الأحوال أن موسى عليه الصلاة والسلام لم يجتمع بأحدٍ منهم، وأنهم جُمِعوا على نظر فرعون ورسله، وأن ما جاء به موسى آية إلهيَّة، وأن السحرة قد بذلوا مجهودهم في مغالبة موسى حتى عجزوا وتبيَّن لهم الحق فاتبعوه. ثم توعَّدهم فرعون بقوله: فلسوف ﴿تعلمونَ﴾: ما أحِلُّ بكم من العقوبة."},{"a":"7:124","t":"﴿لأقطِّعنَّ أيديَكم وأرجلَكم من خلافٍ﴾: زعم الخبيثُ أنَّهم مفسدون في الأرض، وسيصنع بهم ما يُصنع بالمفسدين من تقطيع الأيدي والأرجل من خلافٍ؛ أي: اليد اليمنى والرجل اليسرى، ﴿ثم لأصَلِّبَنَّكُم﴾: في جذوع النخل؛ لتختَزوا بزعمه ﴿أجمعينَ﴾؛ أي: لا أفعل هذا الفعل بأحدٍ دون أحدٍ، بل كلُّكم سيذوق هذا العذاب."},{"a":"7:125","t":"فقال السحرة الذين آمنوا لفرعون حين تهدَّدهم: ﴿إنَّا إلى ربِّنا منقلبونَ﴾؛ أي: فلا نبالي بعقوبتك؛ فالله خيرٌ وأبقى؛ فاقضِ ما أنت قاضٍ."},{"a":"7:126","t":"﴿وما تَنقِمُ منَّا﴾؛ أي: وما تعيب منَّا على إنكارك علينا وتوعُّدك لنا؛ فليس لنا ذنبٌ ﴿إلَّا أنْ آمنَّا بآيات ربِّنا لما جاءتْنا﴾ ؛ فإنْ كان هذا ذنباً يُعاب عليه ويستحقُّ صاحبه العقوبة؛ فهو ذنبُنا. ثم دعوا الله أن يثبِّتهم ويصبِّرهم، فقالوا: ﴿ربَّنا أفرغْ﴾؛ أي: أفض ﴿عليْنا صبراً﴾؛ أي: عظيماً كما يدلُّ عليه التنكير؛ لأنَّ هذه محنة عظيمة تؤدي إلى ذهاب النفس، فيحتاج فيها من الصبر إلى شيء كثير؛ ليثبت الفؤاد ويطمئن المؤمن على إيمانِهِ ويزول عنه الانزعاج الكثير. ﴿وتوفَّنا مسلمينَ﴾؛ أي: منقادين لأمرك متَّبعين لرسولك. والظاهر أنه أوقع بهم ما توعَّدهم عليه، وأنَّ الله تعالى ثبَّتهم على الإيمان."},{"a":"7:127","t":"هذا وفرعون وملؤه وعامتهم المتبعون للملأ قد استكبروا عن آيات الله وجحدوا بها ظلماً وعلوًّا وقالوا لفرعون مهيجين له على الإيقاع بموسى وزاعمين أن ما جاء باطل وفساد: ﴿أتذرُ موسى وقومَه ليفسِدوا في الأرض﴾: بالدعوة إلى الله وإلى مكارم الأخلاق ومحاسن الأعمال التي هي الصلاح في الأرض وما هم عليه هو الفساد، ولكنَّ الظالمين لا يبالون بما يقولون، ﴿وَيَذَرَكَ وآلهتَكَ﴾؛ أي: يدعك أنت وآلهتك، وينهى عنك، ويصد الناس عن اتباعك، فقال فرعونُ مجيباً لهم بأنه سيدع بني إسرائيل مع موسى بحالةٍ لا ينمون فيها ويأمنُ فرعونُ وقومُه بزعمه من ضررهم: ﴿سَنُقَتِّلُ أبناءَهم ونستحيي نساءَهم﴾؛ أي: نستبقيهنَّ فلا نقتلهنَّ؛ فإذا فعلْنا ذلك؛ أمنَّا مِن كثرتِهِم، وكنَّا مستخدمين لباقيهم ومسخِّرين لهم على ما نشاء من الأعمال، ﴿وإنَّا فوقَهم قاهرونَ﴾: لا خروج لهم عن حكمنا ولا قدرة. وهذا نهاية الجَبَروت من فرعون والعتوِّ والقسوة."},{"a":"7:128","t":"فقال ﴿موسى لقومه﴾: موصياً لهم ـ في هذه الحالة التي لا يقدرون معها على شيء ولا مقاومة ـ بالمقاومة الإلهية والاستعانة الربانيَّة: ﴿استعينوا بالله﴾؛ أي: اعتمدوا عليه في جلب ما ينفعكم ودفع ما يضرُّكم، وثِقوا بالله أنه سيتمُّ أمركم، ﴿واصبروا﴾؛ أي: الزموا الصبر على ما يحلُّ بكم منتظرين للفرج. ﴿إنَّ الأرض لله﴾: ليست لفرعون ولا لقومه حتى يتحكَّموا فيها، ﴿يورِثُها مَن يشاءُ من عبادِهِ﴾؛ أي: يداولها بين الناس على حسب مشيئته وحكمته، ولكن العاقبة للمتَّقين؛ فإنهم وإن امتُحِنوا مدة ابتلاء من الله وحكمة؛ فإنَّ النصر لهم، ﴿والعاقبةُ﴾: الحميدة لهم على قومهم. وهذه وظيفة العبد؛ أنَّه عند القدرة أن يفعل من الأسباب الدافعة عنه أذى الغير ما يقدر عليه وعند العجز أن يصبر ويستعين الله وينتظر الفرج."},{"a":"7:129","t":"﴿قالوا﴾: لموسى متضجِّرين من طول ما مكثوا في عذاب فرعون وأذيَّته: ﴿أوذينا من قبل أن تأتِيَنا﴾: فإنهم يسوموننا سوء العذاب يذبِّحون أبناءنا ويستحيون نساءنا، ﴿ومن بعدِ ما جئتنا﴾: كذلك، فقال لهم موسى مرجياً لهم بالفرج والخلاص من شرِّهم: ﴿عسى ربُّكم أن يُهْلِكَ عدوَّكم ويستخلِفَكم في الأرض﴾؛ أي: يمكِّنكم فيها ويجعل لكم التدبير فيها، ﴿فينظرَ كيف تعملونَ﴾: هل تشكُرون أم تكفُرون؟ وهذا وعدٌ أنجزه الله لمَّا جاء الوقت الذي أراده الله."},{"a":"7:130","t":"قال الله تعالى في بيان ما عامل به آلَ فرعون في هذه المدة الأخيرة ـ إنها على عادته وسنته في الأمم أن يأخُذَهم ﴿بالبأساء والضرَّاء لعلهم يضَّرَّعون﴾ الآيات ـ: ﴿ولقد أخذنا آل فرعون بالسنين﴾؛ أي: بالدُّهور والجدب، ﴿ونقص من الثمرات لعلهم يذَّكَّرون﴾؛ أي: يتَّعظون أنَّ ما حلَّ بهم وأصابهم معاتبة من الله لهم لعلَّهم يرجِعون عن كفرهم، فلم ينجعْ فيهم ولا أفاد، بل استمرُّوا على الظُّلم والفساد."}],"166":[{"a":"7:131","t":"﴿فإذا جاءتهم الحسنةُ﴾؛ أي: الخصب وإدرار الرزق، ﴿قالوا لنا هذه﴾؛ أي: نحن مستحقُّون لها، فلم يشكروا الله عليها، ﴿وإن تصِبْهم سيئةٌ﴾؛ أي: قحط وجدب، ﴿يطَّيَّروا بموسى ومن معه﴾؛ أي: يقولوا: إنما جاءنا بسبب مجيء موسى واتباع بني إسرائيل له. قال الله تعالى: ﴿ألا إنَّما طائِرُهم عند الله﴾؛ أي: بقضائه وقدرته، ليس كما قالوا، بل إن ذنوبهم وكفرهم هو السبب في ذلك، بل أكثرهم لا يعلمونَ؛ أي: فلذلك قالوا ما قالوا."},{"a":"7:132","t":"﴿وقالوا﴾: مبيِّنين لموسى أنهم لا يزالون ولا يزولون عن باطلهم: ﴿مهما تأتِنا به من آيةٍ لِتَسْحَرَنا بها فما نحن لك بمؤمنين﴾؛ أي: قد تقرَّر عندنا أنك ساحرٌ؛ فمهما جئت بآية؛ جزمنا أنها سحرٌ؛ فلا نؤمن لك ولا نصدِّق. وهذا غاية ما يكون من العناد أن يبلغ بالكافرين إلى أن تستوي عندهم الحالات سواء نزلت عليهم الآيات أم لم تنزل."},{"a":"7:133","t":"﴿فأرسلنا عليهم الطوفان﴾؛ أي: الماء الكثير الذي أغرق أشجارهم وزروعهم وأضرَّهم ضرراً كثيراً، ﴿والجراد﴾: فأكل ثمارَهم وزروعَهم ونباتهم، ﴿والقُمَّلَ﴾: قيل: إنه الدُّباء؛ أي: صغار الجراد، والظاهر أنه القمل المعروف، ﴿والضفادع﴾: فملأت أوعيتهم وأقلقتهم وآذتهم أذيَّة شديدةً، ﴿والدم﴾: إما أن يكونَ الرعاف، أو كما قال كثير من المفسرين: إنَّ ماءهم الذي يشربون انقلب دماً، فكانوا لا يشربون إلاَّ دماً ولا يطبخون [إلاّ بدم]. ﴿آياتٍ مفصَّلاتٍ﴾؛ أي: أدلَّة وبيِّنات على أنَّهم كانوا كاذبين ظالمين، وعلى أن ما جاء به موسى حقٌّ وصدقٌ. ﴿فاستكبروا﴾: لما رأوا الآيات، ﴿وكانوا﴾: في سابق أمرهم ﴿قوماً مجرمين﴾: فلذلك عاقبهم الله تعالى بأن أبقاهم على الغيِّ والضلال."},{"a":"7:134","t":"﴿ولما وقع عليهم الرِّجْزُ﴾؛ أي: العذاب؛ يحتمل أنَّ المراد به الطاعون كما قاله كثيرٌ من المفسِّرين، ويحتمل أن يُراد به ما تقدَّم من الآيات الطوفان والجراد والقمَّل والضفادع والدَّم؛ فإنها رجزٌ وعذابٌ، وإنهم كلَّما أصابهم واحد منها؛ ﴿قالوا يا موسى ادعُ لنا ربك بما عَهدَ عندك﴾؛ أي: تشفَّعوا بموسى بما عَهدَ الله عنده من الوحي والشرع. ﴿لئن كشفتَ عنَّا الرِّجْزَ لنؤمننَّ لك ولنرسلنَّ معك بني إسرائيل﴾: وهم في ذلك كذبةٌ لا قصدَ لهم إلا زوالُ ما حلَّ بهم من العذاب، وظنُّوا إذا رفع لا يصيبهم غيره."},{"a":"7:135","t":"﴿فلما كشَفْنا عنهم الرِّجْزَ إلى أجل هم بالغوهُ﴾؛ أي: إلى مدة قدر الله بقاءهم إليها، وليس كشفاً مؤبَّداً، وإنما هو موقت، ﴿إذا هم ينكُثون﴾: العهد الذي عاهدوا عليه موسى ووعدوه بالإيمان به وإرسال بني إسرائيل؛ فلا آمنوا به ولا أرسلوا معه بني إسرائيل، بل استمرُّوا على كفرهم يعمهون وعلى تعذيب بني إسرائيل دائبين."},{"a":"7:136","t":"﴿فانتقمنا منهم﴾؛ أي: حين جاء الوقت الموقَّت لهلاكهم؛ أمر الله موسى أن يسري ببني إسرائيل ليلاً، وأخبره أن فرعون سيتبعُهم هو وجنوده. ﴿فأرسلَ فرعونُ في المدائن حاشرين﴾ يجمعونَ الناس لِيَتْبَعوا بني إسرائيل، وقالوا لهم: ﴿إنَّ هؤلاء لَشِرْذمةٌ قليلون. وإنَّهم لنا لغائظونَ. وإنَّا لجميعٌ حاذرون. فأخْرَجْناهم من جناتٍ وعيون. وكنوزٍ ومقام كريم. كذلك وأورَثْناها بني إسرائيل. فأتْبعوهم مشرقينَ. فلما تراءى الجمعانِ قال أصحابُ موسى إنا لَمُدْرَكونَ. قال كلاَّ إن معي ربي سيهدين. فأوحَيْنا إلى موسى أنِ اضرِبْ بعصاك البحرَ فانفلق فكان كلُّ فرقٍ كالطودِ العظيم. وأزلفنا ثَمَّ الآخرين. وأنجينا موسى ومن معه أجمعين. ثم أغرقنا الآخرين﴾. وقال هنا: ﴿فأغرَقْناهم في اليمِّ بأنَّهم كذَّبوا بآياتنا وكانوا عنها غافلين﴾؛ أي: بسبب تكذيبهم بآيات الله، وإعراضهم عمَّا دلَّت عليه من الحقِّ."},{"a":"7:137","t":"﴿وأورثنا القوم الذين كانوا يُسْتَضْعَفونَ﴾: في الأرض؛ أي: بني إسرائيل الذين كانوا خدمة لآل فرعون يسومونهم سوء العذاب، أورثهم الله ﴿مشارقَ الأرض ومغاربها﴾: والمراد بالأرض ها هنا أرض مصر التي كانوا فيها مستضعفين أذلين؛ أي: ملَّكهم الله جميعها ومكَّنهم فيها، ﴿التي باركنا فيها وتمَّتْ كلمةُ ربك الحسنى على بني إسرائيل بما صبروا﴾: حين قال لهم موسى: ﴿استعينوا باللَّهِ واصبِروا إنَّ الأرضَ للَّه يورِثها من يشاءُ من عباده والعاقبةُ للمتَّقين﴾، ﴿ودمَّرْنا ما كان يصنعُ فرعونُ وقومُهُ﴾: من الأبنية الهائلة والمساكن المزخرفة، ﴿وما كانوا يعرِشون﴾: فتلك بيوتهم [خاوية] بما ظلموا إن في ذلك لآية لقوم يعلمون."}],"167":[{"a":"7:138","t":"﴿وجاوزنا ببني إسرائيل البحر﴾: بعدما أنجاهم الله من عدوِّهم فرعون وقومه وأهلكهم الله، وبنو إسرائيل ينظرون، ﴿فأتَوْا﴾؛ أي: مرُّوا ﴿على قوم يعكُفون على أصنامٍ لهم﴾؛ أي: يقيمون عندها ويتبرَّكون بها ويعبُدونها، فقالوا من جهلهم وسَفَهِهم لنبيِّهم موسى بعدما أراهم الله من الآيات ما أراهم: ﴿يا موسى اجعلْ لنا إلهاً كما لهم آلهةٌ﴾؛ أي: اشرع لنا أن نتَّخذ أصناماً آلهة كما اتَّخذها هؤلاء، فقال لهم موسى: ﴿إنَّكم قومٌ تجهلونَ﴾: وأيُّ جهل أعظم من جَهِل ربَّه وخالقَه، وأراد أن يسوِّيَ به غيره ممَّن لا يملِكُ نفعاً ولا ضرًّا ولا موتاً ولا حياةً ولا نشوراً؟!"},{"a":"7:139","t":"ولهذا قال لهم موسى: ﴿إنَّ هؤلاء مُتَبَّرٌ ما هم فيه وباطلٌ ما كانوا يعملونَ﴾: لأن دعاءهم إياها باطلٌ وهي باطلة بنفسها؛ فالعمل باطلٌ وغايته باطلةٌ."},{"a":"7:140","t":"﴿قال أغيرَ الله أبغيكم إلهاً﴾؛ أي: أطلب لكم إلهاً غير الله المألوه الكامل في ذاته وصفاته وأفعاله. ﴿وهو فضَّلكم على العالمين﴾: فيقتضي أن تقابلوا فضله وتفضيله بالشكرِ، وذلك بإفراد الله وحدَه بالعبادة والكفرِ بما يُدعى من دونه."},{"a":"7:141","t":"ثم ذكَّرهم ما امتنَّ الله به عليهم فقال: ﴿وإذ أنجيناكم من آل فرعونَ﴾؛ أي: من فرعون وآله، ﴿يسومونكم سوءَ العذابِ﴾؛ أي: يوجِّهون إليكم من العذاب أسوأه، وهو أنهم كانوا يذبحون ﴿أبناءكم ويَسْتَحيون نساءَكم وفي ذلِكم﴾؛ أي: النجاة من عذابهم، ﴿بلاءٌ من ربِّكم عظيمٌ﴾؛ أي: نعمةٌ جليلةٌ ومنحةٌ جزيلةٌ، أو وفي ذلك العذاب الصادر منهم لكم بلاءٌ من ربِّكم عليكم عظيم."},{"a":"7:142","t":"فلما ذكَّرهم موسى ووعظهم؛ انتَهَوْا عن ذلك، ولما أتمَّ الله نعمته عليهم بالنجاة من عدوهم وتمكينهم في الأرض؛ أرادَ تبارك وتعالى أن يُتِمَّ نعمته عليهم بإنزال الكتاب الذي فيه الأحكام الشرعيَّة والعقائد المرضيَّة، فواعد موسى ثلاثين ليلة، وأتمَّها بعشر، فصارت أربعين ليلة؛ ليستعدَّ موسى ويتهيَّأ لوعد الله ويكون لنزولها موقع كبير لديهم وتشوق إلى إنزالها، ولما ذهب موسى إلى ميقات ربِّه، قال لهارون موصياً له على بني إسرائيل من حرصه عليهم وشفقته: ﴿اخْلُفْني في قَوْمي﴾؛ أي: كنْ خليفتي فيهم، واعمل فيهم بما كنت أعمل، ﴿وأصلِحْ﴾؛ أي: اتَّبع طريق الصلاح، ﴿ولا تتَّبِعْ سبيلَ المفسدين﴾: وهم الذين يعملون بالمعاصي."},{"a":"7:143","t":"﴿ولمَّا جاء موسى لميقاتنا﴾: الذي وقَّتْناه له لإنزال الكتاب، ﴿وكلَّمَه ربُّه﴾: بما كلَّمه من وحيه وأمره ونهيه؛ تشوَّق إلى رؤية الله، ونَزَعَتْ نفسُه لذلك حبًّا لربِّه ومودَّة لرؤيته، فـ ﴿قال ربِّ أرني أنظرْ إليك﴾، فقال الله: ﴿لن تَراني﴾؛ أي: لن تقدِرَ الآن على رؤيتي؛ فإنَّ الله تبارك وتعالى أنشأ الخلق في هذه الدار على نشأة لا يقدرون بها ولا يثبتون لرؤية الله، وليس في هذا دليلٌ على أنَّهم لا يرونه في الجنة؛ فإنه قد دلَّت النصوص القرآنيَّة والأحاديث النبويَّة على أن أهل الجنة يرون ربَّهم تبارك وتعالى ويتمتَّعون بالنظر إلى وجهه الكريم. وأنه يُنْشِئُهم نشأةً كاملةً يقدرون معها على رؤية الله تعالى، ولهذا رتَّب الله الرؤية في هذه الآية على ثبوت الجبل، فقال مقنعاً لموسى في عدم إجابتِهِ للرؤية: ﴿ولكِنِ انظرْ إلى الجبل فإنِ استقرَّ مكانَه﴾: إذا تجلَّى اللهُ له، ﴿فسوف تراني فلمَّا تجلَّى ربُّه للجبل﴾: الأصمِّ الغليظ، ﴿جعله دكًّا﴾؛ أي: انهال مثل الرمل انزعاجاً من رؤية الله وعدم ثبوتٍ لها، ﴿وخرَّ موسى﴾: حين رأى ما رأى، صَعِقاً فتبيَّن له حينئذٍ أنه إذا لم يثبت الجبلُ لرؤية الله؛ فموسى أولى أن لا يثبتَ لذلك، واستغفر ربَّه لما صدر منه من السؤال الذي لم يوافقْ موضعاً، و ﴿قالَ سبحانك﴾؛ أي: تنزيهاً لك وتعظيماً عما لا يليق بجلالك، ﴿تبتُ إليك﴾: من جميع الذنوب وسوء الأدب معك، ﴿وأنا أول المؤمنين﴾؛ أي: جدَّد عليه الصلاة والسلام إيمانه بما كمَّل اللهُ له مما كان يجهله قبل ذلك."}],"168":[{"a":"7:144","t":"فلما منعه الله من رؤيته بعدما كان متشوقاً إليها؛ أعطاه خيراً كثيراً، فقال: ﴿يا موسى إنِّي اصطفيتُك على الناس﴾؛ أي: اخترتك واجتبيتك وفضَّلتك وخصصتك بفضائل عظيمة ومناقب جليلة، ﴿برسالاتي﴾: التي لا أجعلها ولا أخصُّ بها إلا أفضل الخلق، ﴿وبكلامي﴾: إيَّاك من غير واسطة، وهذه فضيلة اختُصَّ بها موسى الكليم، وعُرِف بها من بين إخوانه من المرسلين، ﴿فخُذْ ما آتيتُك﴾: من النعم، وخذ ما آتيتُك من الأمر والنهي بانشراح صدرٍ، وتلقَّه بالقَبول والانقياد، ﴿وكن من الشاكرين﴾: لله على ما خصَّك وفضَّلك."},{"a":"7:145","t":"﴿وكتبنا له في الألواح من كلِّ شيء﴾: يحتاج إليه العباد ﴿موعظة﴾: ترغِّب النفوس في أفعال الخير وترهِّبهم من أفعال الشر، ﴿وتفصيلاً لكلِّ شيء﴾: من الأحكام الشرعيَّة والعقائد والأخلاق والآداب، ﴿فخذْها بقوَّةٍ﴾؛ أي: بجدٍّ واجتهاد على إقامتها، ﴿وأمُرْ قومَك يأخذوا بأحسنها﴾: وهي الأوامر الواجبة والمستحبَّة؛ فإنها أحسنها. وفي هذا دليلٌ على أن أوامر الله في كل شريعة كاملة عادلة حسنة. ﴿سأريكم دارَ الفاسقينَ﴾: بعدما أهلكهم الله وأبقى ديارهم عبرةً بعدهم يعتبر بها المؤمنون الموفَّقون المتواضعون."},{"a":"7:146","t":"وأما غيرهم؛ فقال عنهم: ﴿سأصرِفُ عن آياتي﴾؛ أي: عن الاعتبار في الآيات الأفقية والنفسيَّة والفهم لآيات الكتاب، ﴿الذين يتكبَّرون في الأرض بغير الحقِّ﴾؛ أي: يتكبَّرون على عباد الله وعلى الحقِّ وعلى من جاء به؛ فمن كان بهذه الصفة؛ حَرَمَهُ الله خيراً كثيراً، وخَذَلَه، ولم يَفْقَهْ من آيات الله ما ينتفع به، بل ربَّما انقلبت عليه الحقائقُ واستحسن القبيحَ، ﴿وإن يَرَوْا كلَّ آيةٍ لا يؤمنوا بها﴾: لإعراضهم واعتراضهم ومحادَّتهم لله ورسوله، ﴿وإن يَرَوْا سبيلَ الرُّشد﴾؛ أي: الهدى والاستقامة، وهو الصراط الموصل إلى الله وإلى دار كرامته، ﴿لا يتَّخذوه [سبيلاً]﴾؛ أي: لا يسلكوه ولا يرغبوا فيه، ﴿وإن يَرَوْا سبيلَ الغَيِّ﴾؛ أي: الغواية الموصل لصاحبه إلى دار الشقاء، ﴿يتَّخذوه سبيلاً﴾. والسبب في انحرافهم هذا الانحراف، ﴿ذلك بأنَّهم كذَّبوا بآياتنا وكانوا عنها غافلين﴾: فردُّهم لآيات الله وغفلتُهم عمَّا يُراد بها واحتقارهم لها هو الذي أوجب لهم من سلوك طريق الغي وترك طريق الرُّشْدِ ما أوجب."},{"a":"7:147","t":"﴿والذين كذبوا بآياتنا﴾: العظيمة الدالَّة على صحَّة ما أرسلنا به رسلنا، ﴿ولقاء الآخرة حَبِطَتْ أعمالُهم﴾: لأنَّها على غير أساس، وقد فقد شرطها، وهو الإيمان بآيات الله والتصديق بجزائه. ﴿هل يُجْزَوْنَ﴾: في بطلان أعمالهم وحصول ضدِّ مقصودهم ﴿إلَّا ما كانوا يعملونَ﴾: فإن أعمال مَنْ لا يؤمن باليومِ الآخر لا يرجو فيها ثواباً، وليس لها غايةٌ تنتهي إليه؛ فلذلك اضمحلَّت وبطلت."},{"a":"7:148","t":"﴿واتَّخذ قوم موسى مِن بعدِهِ من حُلِيِّهم عجلاً جسداً﴾: صاغه السامِرِيُّ وألقى عليه قبضةً من أثر الرسول فصار ﴿له خُوارٌ﴾ وصوتٌ، فعبدوه واتَّخذوه إلهاً، وقال: هذا إلهكم وإله موسى، فنسي موسى، وذهب يطلبه، وهذا من سفههم وقلة بصيرتهم؛ كيف اشتبه عليهم ربُّ الأرض والسماوات بعجل من أنقص المخلوقات؟! ولهذا قال مبيناً أنه ليس فيه من الصفات الذاتيَّة ولا الفعليَّة ما يوجِب أن يكون إلهاً: ﴿ألم يَرَوْا أنَّه لا يكلِّمهم﴾؛ أي: وعدم الكلام نقصٌ عظيمٌ؛ فهم أكمل حالة من هذا الحيوان أو الجماد الذي لا يتكلَّم، ﴿ولا يهديهم سبيلاً﴾؛ أي: لا يدلُّهم طريقاً دينيًّا ولا يحصِّل لهم مصلحةً دنيويَّةً؛ لأن من المتقرِّر في العقول والفطر أنَّ اتِّخاذَ إلهٍ لا يتكلم ولا ينفع ولا يضرُّ من أبطل الباطل وأسمج السفه، ولهذا قال: ﴿اتَّخذوه وكانوا ظالمينَ﴾: حيث وضعوا العبادة في غير موضعها، وأشركوا بالله ما لم ينزِّل به سلطاناً. وفيها دليلٌ على أنَّ من أنكر كلام الله؛ فقد أنكر خصائص إلهيَّة الله تعالى؛ لأن الله ذكر أن عدم الكلام دليلٌ على عدم صلاحيَّة الذي لا يتكلَّم للإلهيَّة."},{"a":"7:149","t":"﴿ولمَّا﴾: رجع موسى إلى قومه، فوجدهم على هذه الحال، وأخبرهم بضلالهم؛ ندموا، و ﴿سُقِطَ في أيديهم﴾؛ أي: من الهمِّ والندم على فعلهم، ﴿ورأوا أنَّهم قد ضلُّوا﴾: فتنصَّلوا إلى الله وتضرَّعوا، ﴿وقالوا لئن لم يرحَمْنا ربُّنا﴾: فيدُّلنا عليه، ويرزقنا عبادته، ويوفِّقُنا لصالح الأعمال، ﴿ويغفِرْ لنا﴾: ما صدر منا من عبادة العجل؛ ﴿لَنَكونَنَّ من الخاسرينَ﴾: الذين خسروا الدنيا والآخرة."}],"169":[{"a":"7:150","t":"﴿ولما رجع موسى إلى قومِهِ غضبان أسِفاً﴾؛ أي: ممتلئاً غضباً وغيظاً عليهم لتمام غيرته عليه [الصلاة و] السلام وكمال نصحه وشفقته، ﴿قال بئسَما خَلَفْتُموني من بعدي﴾؛ أي: بئس الحالة التي خلفتموني بها من بعد ذهابي عنكم؛ فإنها حالةٌ تفضي إلى الهلاك الأبدي والشقاء السرمديِّ. ﴿أعَجِلْتُم أمرَ ربِّكُم﴾: حيث وَعَدَكم بإنزال الكتاب فبادرتُم برأيكم الفاسد إلى هذه الخصلة القبيحة، ﴿وألقى الألواحَ﴾؛ أي: رماها من الغضب، ﴿وأخذ برأس أخيه﴾: هارونَ ولحيتِهِ، ﴿يجرُّه إليه﴾: وقال له: ﴿ما منعك إذ رأيتَهم ضلُّوا. أن لا تتَّبِعَني أفعصيتَ أمري﴾: لك بقولي: ﴿اخلُفْني في قومي وأصْلِحْ ولا تتَّبِعْ سبيل المفسدين﴾؟! فقال: ﴿يا ابنَ أمَّ لا تأخُذْ بلحيتي ولا برأسي إني خشيتُ أن تقولَ فرَّقْتَ بين بني إسرائيل ولم ترقُبْ قولي﴾ و ﴿قال﴾ هنا: ﴿ابنَ أمَّ﴾: هذا ترقيقٌ لأخيه بذكر الأمِّ وحدها، وإلاَّ فهو شقيقه لأمِّه وأبيه. ﴿إنَّ القوم استضعفوني﴾؛ أي: احتقروني حين قلتُ لهم: يا قوم! إنما فُتِنْتُم به، وإنَّ ربَّكم الرحمن؛ فاتَّبِعوني وأطيعوا أمري، ﴿وكادوا يَقْتُلونَني﴾؛ أي: فلا تظنَّ بي تقصيراً، ﴿فلا تُشْمِتْ بيَ الأعداء﴾: بنهرِك لي ومسِّك إيَّايَ بسوءٍ فإنَّ الأعداء حريصون على أن يجدوا عليَّ عثرةً أو يطَّلعوا لي على زَلَّة، ﴿ولا تجعلني مع القوم الظالمين﴾: فتعامِلُني معاملتهم."},{"a":"7:151","t":"فندم موسى عليه السلام على ما استعجل من صنعِهِ بأخيه قبل أن يعلم براءتَهُ مما ظنَّه فيه من التقصير، و ﴿قال ربِّ اغفِرْ لي ولأخي﴾: هارون، ﴿وأدخِلْنا في رحمتِكَ﴾؛ أي: في وسطها، واجعل رحمتك تحيطُ بنا من كل جانب؛ فإنها حصنٌ حصينٌ من جميع الشرور وثَمَّ كلُّ خير وسرور. ﴿وأنت أرحمُ الراحمين﴾؛ أي: أرحم بنا من كلِّ راحم، أرحم بنا من آبائنا وأمَّهاتنا وأولادنا وأنفسنا."},{"a":"7:152","t":"قال الله تعالى مبيناً حال أهل العجل الذين عبدوه: ﴿إنَّ الذين اتَّخذوا العجل﴾؛ أي: إلهاً، ﴿سينالُهم غضبٌ من ربِّهم وذلَّةٌ في الحياة الدُّنيا﴾: كما أغضبوا ربَّهم واستهانوا بأمره. ﴿وكذلك نجزي المفترين﴾: فكلُّ مفترٍ على الله كاذب على شرعه متقوِّل عليه ما لم يقلْ؛ فإنَّ له نصيباً من الغضب من الله والذُّلِّ في الحياة الدنيا."},{"a":"7:153","t":"وقد نالهم غضبُ الله حيث أمرهم أن يقتُلوا أنفسهم، وأنَّه لا يرضى الله عنهم إلاَّ بذلك، فقتل بعضُهم بعضاً، وانجلت المعركة على قتلى كثيرةٍ، ثم تاب الله عليهم بعد ذلك، ولهذا ذكر حكماً عامًّا يدخُلون فيه هم وغيرهم، فقال: ﴿والذين عمِلوا السيئاتِ﴾: من شرك وكبائر وصغائر، ﴿ثم تابوا من بعدها﴾: بأن ندموا على ما مضى وأقلعوا عنها وعزموا على أن لا يعودوا، ﴿وآمنوا﴾: بالله وبما أوجبَ الله الإيمان به، ولا يتمُّ الإيمان إلا بأعمال القلوب وأعمال الجوارح المترتِّبة على الإيمان. ﴿إنَّ ربَّك من بعدها﴾؛ أي: بعد هذه الحالة ـ حالة التوبة من السيئات والرجوع إلى الطاعات ـ ﴿لغفورٌ﴾: يغفر السيئات ويمحوها، ولو كانت قُراب الأرض. ﴿رحيمٌ﴾: بقبول التوبة والتوفيق لأفعال الخير وقبولها."},{"a":"7:154","t":"﴿ولما سَكَتَ عن موسى الغضبُ﴾؛ أي: سكن غضبه وتراجعت نفسُهُ، وعَرَفَ ما هو فيه؛ اشتغل بأهمِّ الأشياء عنده، فَأَخَذَ ﴿الألواحَ﴾: التي ألقاها، وهي ألواحٌ عظيمة المقدار جليلةٌ ﴿في نُسْخَتِها﴾؛ أي: مشتملة ومتضمِّنة ﴿هدىً ورحمةٌ﴾؛ أي: فيها الهدى من الضَّلالة، وبيان الحقِّ من الباطل، وأعمال الخير وأعمال الشر، والهدى لأحسن الأعمال والأخلاق والآداب، ورحمة وسعادة لمن عمل بها وعلم أحكامها ومعانيها، ولكن؛ ليس كل أحدٍ يقبل هدى الله ورحمته، وإنما يقبلُ ذلك، وينقاد له، ويتلقَّاه بالقَبول، ﴿الذين هُم لربِّهم يرهَبونَ﴾؛ أي: يخافون منه ويخشونه، وأما مَنْ لم يخفِ الله ولا المقام بين يديه؛ فإنه لا يزداد بها إلا عتوًّا ونفوراً، وتقوم عليه حجة الله فيها."},{"a":"7:155","t":"﴿و﴾ لما تاب بنو إسرائيل، وتراجعوا إلى رُشْدِهم، ﴿اختار موسى﴾ منهم ﴿سبعين رجلاً﴾: من خيارهم ليعتذروا لقومهم عند ربِّهم، ووعدهم الله ميقاتاً يحضُرون فيه، فلما حضروا؛ قالوا: يا موسى! أرِنا الله جهرةً! فتجرؤوا على الله جراءة كبيرة، وأساؤوا الأدب معه، فأخذتهم الرجفةُ، فصعقوا وهلكوا، فلم يزل موسى عليه الصلاة والسلام يتضرَّع إلى الله ويتبتَّل ويقول: ﴿ربِّ لو شئتَ أهلكتَهم من قبلُ﴾: أن يحضُروا، ويكونون في حالة يعتذرون فيها لقومهم فصاروا هم الظالمين. ﴿أتُهْلِكُنا بما فعل السفهاءُ منَّا﴾؛ أي: ضعفاء العقول سفهاء الأحلام، فتضرَّع إلى الله، واعتذر بأنَّ المتجرِّئين على الله ليس لهم عقولٌ كاملةٌ تردعُهم عما قالوا وفعلوا، وبأنهم حصل لهم فتنةٌ يخطر بها الإنسان ويخاف من ذهاب دينه، فقال: ﴿إنْ هي إلَّا فتنتُك تُضِلُّ بها من تشاءُ وتهدي من تشاءُ أنت وَلِيُّنا فاغْفِرْ لنا وارْحَمْنا وأنت خير الغافرين﴾؛ أي: أنت خير من غفر، وأولى من رحم، وأكرم من أعطى وتفضَّل، فكأنَّ موسى عليه الصلاة والسلام قال: المقصود يا ربِّ بالقصد الأول لنا كلّنا، هو التزام طاعتك والإيمان بك، وأن من حَضَرَه عقله ورشده وتمَّ على ما وهبته من التوفيق؛ فإنه لم يزل مستقيماً، وأما من ضَعُفَ عقلُه وسَفِه رأيُهُ وصرفته الفتنة؛ فهو الذي فعل ما فعل لذينك السببين، ومع هذا؛ فأنت أرحم الراحمين وخير الغافرين؛ فاغفر لنا وارحمنا! فأجاب الله سؤاله، وأحياهم من بعد موتهم، وغفر لهم ذنوبهم."}],"170":[{"a":"7:156","t":"وقال موسى في تمام دعائه: ﴿واكتبْ لنا في هذه الدنيا حسنةً﴾: من علم نافع ورزق واسع وعمل صالح، ﴿وفي الآخرة﴾: حسنة، وهي ما أعد الله لأوليائه الصالحين من الثواب. ﴿إنَّا هُدْنا إليك﴾؛ أي: رجعنا مقرِّين بتقصيرنا منيبين في جميع أمورنا، ﴿قال﴾ الله تعالى: ﴿عذابي أصيبُ به من أشاءُ﴾: ممَّن كان شقيًّا متعرضاً لأسبابه، ﴿ورحمتي وسعتْ كلَّ شيء﴾: من العالم العلويِّ والسفليِّ؛ البر والفاجر، المؤمن والكافر؛ فلا مخلوق إلا وقد وصلت إليه رحمة الله وغمره فضله وإحسانه، ولكن الرحمة الخاصة المقتضية لسعادة الدنيا والآخرة ليست لكل أحد، ولهذا قال عنها: ﴿فسأكتُبها للذين يتَّقون﴾: المعاصي صغارها وكبارها، ﴿ويؤتون الزَّكاة﴾: الواجبة مستحقيها، ﴿والذين هم بآياتنا يؤمنون﴾."},{"a":"7:157","t":"ومن تمام الإيمان بآيات الله معرفة معناها والعمل بمقتضاها، ومن ذلك اتباع النبي - صلى الله عليه وسلم - ظاهراً وباطناً في أصول الدين وفروعه: ﴿الذين يتَّبِعون الرسول النبيَّ الأميَّ﴾: احترازٌ عن سائر الأنبياء؛ فإن المقصود بهذا محمد بن عبد الله بن عبد المطلب والسياق في أحوال بني إسرائيل، وأن الإيمان بالنبيِّ محمد - صلى الله عليه وسلم - شرطٌ في دخولهم في الإيمان، وأن المؤمنين به المتَّبعين هم أهل الرحمة المطلقة التي كتبها الله لهم، ووصفه بالأمي لأنَّه من العرب الأمة الأميَّة التي لا تقرأ ولا تكتب وليس عندها قبل القرآن كتاب. ﴿الذي يجِدونَهُ مكتوباً عندَهم في التوراة والإنجيل﴾: باسمه وصفته التي من أعظمها وأجلِّها ما يدعو إليه وينهى عنه، وأنه ﴿يأمُرُهم بالمعروف﴾: وهو كل ما عُرِفَ حسنُهُ وصلاحه ونفعه. ﴿وينهاهم عن المنكر﴾: وهو كلُّ ما عرف قبحه في العقول والفطر، فيأمرهم بالصلاة والزكاة والصوم والحج وصلة الأرحام وبر الوالدين والإحسان إلى الجار والمملوك وبذل النفع لسائر الخلق والصدق والعفاف والبر والنصيحة وما أشبه ذلك، وينهى عن الشرك بالله وقتل النفوس بغير حق والزِّنا وشرب ما يسكر العقل والظلم لسائر الخلق والكذب والفجور ونحو ذلك؛ فأعظم دليل يدلُّ على أنه رسول الله ما دعا إليه وأمر به ونهى عنه وأحلَّه وحرَّمه؛ فإنه يُحِلُّ الطيبات: من المطاعم والمشارب والمناكح. ﴿ويحرِّمُ عليهم الخبائث﴾: من المطاعم والمشارب والمناكح والأقوال والأفعال. ﴿ويَضَعُ عنهم إصْرَهُم والأغلال التي كانت عليهم﴾؛ أي: ومِنْ وَصْفِهِ أنَّ دينه سهلٌ سَمْحٌ ميسَّر لا إصر فيه ولا أغلال ولا مشقات ولا تكاليف ثقال. ﴿فالذين آمنوا به وعزَّروه﴾؛ أي: عظَّموه وبجَّلوه، ﴿ونصروه واتَّبعوا النور الذي أنزلَ معه﴾: وهو القرآن الذي يُستضاء به في ظلمات الشَّكِّ والجهالات، ويقتدى به إذا تعارضت المقالات. ﴿أولئك هم المفلحون﴾: الظافرون بخير الدُّنيا والآخرة، والناجون من شرِّهما؛ لأنَّهم أتوا بأكبر أسباب الفلاح، وأما مَن لم يؤمنْ بهذا النبيِّ الأميِّ، ويعزِّره، وينصره، ولم يتَّبع النور الذي أنزل معه؛ فأولئك هم الخاسرون."},{"a":"7:158","t":"ولما دعا أهل التوراة من بني إسرائيل إلى اتباعه، وكان ربما توهَّم متوهِّم أن الحكم مقصورٌ عليهم، أتى بما يدلُّ على العموم، فقال: ﴿قلْ يا أيُّها الناس إني رسولُ الله إليكم جميعاً﴾؛ أي: عربيّكم وعجميّكم، أهل الكتاب منكم وغيرهم، ﴿الذي له ملكُ السموات والأرض﴾: يتصرَّف فيهما بأحكامه الكونيَّة والتدابير السلطانيَّة وبأحكامه الشرعيَّة الدينيَّة، التي من جملتها أن أرسل إليكم رسولاً عظيماً يدعوكم إلى الله وإلى دار كرامته، ويحذِّركم من كلِّ ما يباعدكم منه ومن دار كرامته. ﴿لا إله إلاَّ هو﴾؛ أي: لا معبود بحقٍّ إلا الله وحده لا شريك له، ولا تُعْرَفُ عبادته إلا من طريق رسله. ﴿يحيي ويميتُ﴾؛ أي: من جملة تدابيره الإحياء والإماتة، التي لا يشاركه فيها أحدٌ، التي جعل الله الموت جسراً ومعبراً، يُعبَرُ منه إلى دار البقاء التي من آمن بها صدَّق الرسول محمداً - صلى الله عليه وسلم - قطعاً. ﴿فآمنوا بالله ورسولِهِ النبيِّ الأميِّ﴾: إيماناً في القلب متضمناً لأعمال القلوب والجوارح، ﴿الذي يؤمِنُ بالله وكلماته﴾؛ أي: آمنوا بهذا الرسول المستقيم في عقائده وأعماله، ﴿واتَّبِعوه لعلكم تهتدونَ﴾: في مصالِحِكم الدينيَّة والدنيويَّة؛ فإنكم إذا لم تتَّبعوه؛ ضللتم ضلالاً بعيداً."},{"a":"7:159","t":"﴿ومن قوم موسى أمَّةٌ﴾؛ أي: جماعة، ﴿يهدون بالحقِّ وبه يعدِلونَ﴾؛ أي: يهدون [به] الناس في تعليمهم إياهم وفتواهم لهم، ويعدِلون به بينهم في الحكم بينهم قضاياهم؛ كما قال تعالى: ﴿وَجَعَلْناهم أئمةً يهدون بأمرِنا لما صبروا وكانوا بآياتنا يوقنون﴾. وفي هذا فضيلةٌ لأمة موسى عليه الصلاة والسلام، وأنَّ الله تعالى جعل منهم هُداةً يهدون بأمره. وكأنَّ الإتيان بهذه الآية الكريمة فيه نوعُ احتراز مما تقدَّم؛ فإنه تعالى ذكر فيما تقدَّم جملةً من معايب بني إسرائيل المنافية للكمال المناقضة للهداية، فربما توهَّم متوهِّم أن هذا يعمُّ جميعهم، فذكر تعالى أن منهم طائفة مستقيمة هادية مهدية."}],"171":[{"a":"7:160","t":"﴿وقطَّعناهم﴾؛ أي: قسَّمناهم ﴿اثنتي عشرة أسباطاً أمماً﴾؛ أي: اثنتي عشرة قبيلةً متعارفةً متوالفةً، كل بني رجل من أولاد يعقوب قبيلة، ﴿وأوحينا إلى موسى إذِ استسقاه قومُهُ﴾؛ أي: طلبوا منه أن ي
