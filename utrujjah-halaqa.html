من المصالح الضرورية ما يفوت. ﴿ذلك﴾: التقدير المذكور، ﴿تقديرُ العزيز العليم﴾: الذي من عزَّته انقادت له هذه المخلوقاتُ العظيمة فَجَرَتْ مذلَّلة مسخَّرة بأمره، بحيثُ لا تتعدَّى ما حدَّه الله لها ولا تتقدَّم عنه ولا تتأخَّر، العليم الذي أحاط علمُهُ بالظواهر والبواطن والأوائل والأواخر. ومن الأدلة العقلية على إحاطة علمِهِ تسخيرُ هذه المخلوقات العظيمة على تقديرٍ ونظام بديع تَحير العقول في حسنِهِ وكماله وموافقته للمصالح والحكم."},{"a":"6:97","t":"﴿وهو الذي جعل لكم النُّجومَ لِتَهْتَدوا بها في ظلمات البرِّ والبحر﴾: حين تشتبه عليكم المسالك، ويتحيَّر في سيره السالك، فجعل الله النجوم هدايةً للخلق إلى السبيل التي يحتاجون إلى سلوكها لمصالحهم وتجاراتهم وأسفارهم، منها نجومٌ لا تزال تُرى ولا تسيرُ عن محلِّها، ومنها ما هو مستمرُّ السير يعرِفُ سيرَه أهلُ المعرفة بذلك، ويعرفون به الجهاتِ والأوقاتِ. ودلَّت هذه الآيةُ ونحوها على مشروعيَّة تعلُّم سير الكواكب ومحالِّها الذي يسمَّى علم التسيير؛ فإنه لا تتمُّ الهداية ولا تُمْكِنُ إلاَّ بذلك. ﴿قد فصَّلْنا الآياتِ﴾؛ أي: بيَّناها ووضَّحناها وميَّزنا كل جنس ونوع منها عن الآخر بحيث صارت آياتُ الله باديةً ظاهرة، ﴿لقوم يعلمونَ﴾؛ أي: لأهل العلم والمعرفة؛ فإنَّهم الذين يوجَّه إليهم الخطاب، ويُطلب منهم الجواب؛ بخلاف أهل الجهل والجفاء المعرضين عن آيات الله وعن العلم الذي جاءت به الرسل؛ فإن البيان لا يفيدُهم شيئاً، والتفصيل لا يزيل عنهم ملتبساً، والإيضاح لا يكشف لهم مشكلاً."},{"a":"6:98","t":"﴿وهو الذي أنشأكم من نفس واحدة﴾: وهو آدمُ عليه السلام، أنشأ الله منه هذا العنصر الآدميَّ الذي قد ملأ الأرض، ولم يزل في زيادة ونموٍّ، الذي قد تفاوت في أخلاقه وخلقه وأوصافه تفاوتاً لا يمكن ضبطه، ولا يُدْرَكُ وصفُه، وجعل الله لهم مستقرًّا؛ أي: منتهى ينتهون إليه وغاية يُساقون إليها، وهي دار القرار التي لا مستقرَّ وراءها ولا نهايةَ فوقَها؛ فهذه الدار هي التي خلق الخلق لسكناها، وأوجدوا في الدنيا ليسعوا في أسبابها التي تنشأ عليها وتعمر بها، وأودعهم الله في أصلاب آبائهم وأرحام أمهاتهم، ثم في دار الدنيا، ثم في البرزخ؛ كلُّ ذلك على وجه الوديعة التي لا تستقرُّ ولا تثبت، بل ينتقل منها، حتى يوصل إلى الدار التي هي المستقر، وأما هذه الدار؛ فإنَّها مستودعٌ وممرٌّ. ﴿قد فصَّلْنا الآيات لقوم يفقهون﴾: عن الله آياتِهِ، ويفهمون عنه حججَهُ وبيِّناتِهِ."},{"a":"6:99","t":"وهذا من أعظم مننه العظيمة التي يضطرُّ إليها الخلق من الآدميين، وغيرهم، وهو أنه أنزل من السماء ماء متتابعاً وقت حاجة الناس إليه، فأنبت الله به كل شيء مما يأكل الناس والأنعام، فرتع الخلق بفضل الله وانبسطوا برزقِهِ وفرحوا بإحسانه وزال عنهم الجدب واليأس والقحط، ففرحتِ القلوبُ وأسفرتِ الوجوه وحصل للعباد من رحمة الرحمن الرحيم ما به يتمتَّعون وبه يرتعون، مما يوجِبُ لهم أن يبذُلوا جهدهم في شكر من أسدى النعم وعبادته والإنابة إليه والمحبة له. ولما ذكر عموم ما ينبت بالماء من أنواع الأشجار والنبات؛ ذَكَرَ الزرع والنخل لكثرة نفعهما وكونهما قوتاً لأكثر الناس، فقال: ﴿فأخرجنا منه خَضِراً نخرِجُ منه﴾؛ أي: من ذلك النبات الخضر ﴿حبًّا متراكباً﴾: بعضُه فوق بعض من بُرٍّ وشعير وذرة وأرز وغير ذلك من أصناف الزروع، وفي وصفه بأنه متراكبٌ إشارة إلى أنَّ حبوبه متعددة، وجميعها تستمدُّ من مادةٍ واحدةٍ، وهي لا تختلط، بل هي متفرِّقة الحبوب مجتمعة الأصول، وإشارة أيضاً إلى كثرتها وشمول ريعها وغلتها؛ ليبقى أصل البذر، ويبقى بقية كثيرةٌ للأكل والادِّخار. ﴿ومن النخل﴾: أخرج اللهُ ﴿من طَلْعِها﴾: وهو الكُفُرَّى والوعاء قبل ظهور القنو منه، فيخرج من ذلك الوعاء ﴿قِنْوانٌ دانيةٌ﴾؛ أي: قريبة سهلة التناول متدلية على من أرادها؛ بحيث لا يعسُرُ التناول من النخل، وإن طالت؛ فإنه يوجد فيها كَرَبٌ ومراقي يَسْهُلُ صعودها. ﴿و﴾: أخرج تعالى بالماء ﴿جناتٍ من أعناب والزيتون والرمان﴾: فهذه من الأشجار الكثيرة النفع العظيمة الوقع؛ فلذلك خصَّصها الله بالذِّكر بعد أن عمَّ جميع الأشجار والنوابت. وقوله: ﴿مشتبهاً وغير متشابهٍ﴾: يحتملُ أن يرجعَ إلى الرُّمَّانِ والزيتون؛ أي: مشتبهاً في شجره وورقه غير متشابه في ثمره، ويحتمل أن يرجع ذلك إلى سائر الأشجار والفواكه، وأن بعضها مشتبه؛ يشبه بعضه بعضاً، ويتقارب في بعض أوصافه، وبعضها لا مشابهة بينه وبين غيره، والكل ينتفع به العباد ويتفكَّهون، ويقتاتون ويعتبرون، ولهذا أمر تعالى بالاعتبار به، فقال: ﴿انظروا﴾: نظر فكرٍ واعتبار ﴿إلى ثمره﴾؛ أي: الأشجار كلها، خصوصاً النخل، ﴿إذا أثْمَرَ وينعِهِ﴾؛ أي: انظروا إليه وقت إطلاعه ووقت نضجه وإيناعه؛ فإن في ذلك عبراً وآياتٍ يُستدلُّ بها على رحمة الله وسَعَة إحسانِهِ وجودِهِ وكمال اقتداره وعنايته بعباده، ولكن ليس كل أحدٍ يَعْتَبِرُ ويتفكَّر، وليس كلُّ من تفكَّر؛ أدرك المعنى المقصود، ولهذا قَيَّدَ تعالى الانتفاع بالآيات بالمؤمنين، فقال: ﴿إنَّ في ذلكم لآياتٍ لقوم يؤمنونَ﴾: فإن المؤمنين يحمِلُهم ما معهم من الإيمان على العمل بمقتضياته ولوازمه التي منها التفكر في آيات الله والاستنتاج منها ما يراد منها وما تدلُّ عليه عقلاً وفطرةً وشرعاً."},{"a":"6:100","t":"يخبر تعالى أنه مع إحسانه لعباده وتعرفه إليهم بآياته البينات وحججه الواضحات؛ أن المشركين به من قريش وغيرهم جعلوا له شركاء يدعونهم ويعبُدونهم من الجنِّ والملائكة، الذين هم خَلْقٌ مِن خَلْق الله، ليس فيهم من خصائص الربوبيَّة والألوهيَّة شيء، فجعلوها شركاء لمن له الخلقُ والأمرُ، وهو المنعم بسائر أصناف النعم، الدافع لجميع النقم، وكذلك خَرَقَ المشركون؛ أي: ائتفكوا وافتروا من تلقاء أنفسهم لله بنينَ وبناتٍ بغير علم منهم، ومن أظلم ممن قال على الله بلا علم، وافترى عليه أشنعَ النَّقص الذي يجب تنزيهُ الله عنه، ولهذا نزَّه نفسه عما افتراه عليه المشركون، فقال: ﴿سبحانَه وتعالى عمَّا يَصِفونَ﴾؛ فإنه تعالى الموصوف بكل كمالٍ، المنزَّه عن كل نقصٍ وآفةٍ وعَيْبٍ."},{"a":"6:101","t":"﴿بديع السموات والأرض﴾؛ أي: خالقهما ومتقن صنعتهما على غير مثال سبق بأحسن خلق ونظام وبهاء لا تقترحُ عقول أولي الألباب مثله، وليس له في خلقهما مشارك. ﴿أنَّى يكونُ له ولدٌ ولم تكن له صاحبةٌ﴾؛ أي: كيف يكون لله الولد وهو الإله السيد الصمد الذي لا صاحبةَ له؛ أي: لا زوجة، وهو الغني عن مخلوقاته، وكلها فقيرةٌ إليه مضطرةٌ في جميع أحوالها إليه، والولد لا بدَّ أن يكون من جنس والده، والله خالق كل شيء، وليس شيءٌ من المخلوقات مشابهاً لله بوجه من الوجوه. ولما ذكر عمومَ خَلْقِهِ للأشياء؛ ذكر إحاطة علمه بها، فقال: ﴿وهو بكلِّ شيءٍ عليمٌ﴾، وفي ذكر العلم بعد الخلق إشارة إلى الدليل العقلي إلى ثبوت علمه، وهو هذه المخلوقات وما اشتملت عليه من النظام التامِّ والخلق الباهر؛ فإنَّ في ذلك دلالة على سَعَة علم الخالق وكمال حكمته؛ كما قال تعالى: ﴿ألا يعلمُ مَنْ خَلَقَ وهو اللطيف الخبير﴾، وكما قال تعالى: ﴿وهو الخلاَّقُ العليم﴾."}],"141":[{"a":"6:102","t":"ذلكم الذي خلق ما خلق وقدَّر ما قدَّر؛ ﴿اللهُ ربُّكم﴾؛ أي: المألوهُ المعبودُ الذي يستحقُّ نهاية الذُّلِّ ونهاية الحبِّ، الربُّ الذي ربَّى جميع الخلق بالنعم، وصرف عنهم صنوف النقم، خالق كل شيءٍ لا إله إلا هو ﴿فاعبدوه﴾؛ أي: إذا استقرَّ وثبت أنه الله الذي لا إله إلاَّ هو؛ فاصرِفوا له جميع أنواع العبادة، وأخلصوها لله، واقصدوا بها وجهه؛ فإنَّ هذا هو المقصود من الخلق الذي خُلِقوا لأجله، ﴿وما خَلَقْتُ الجنَّ والإنسَ إلا لِيَعبُدُونِ﴾. ﴿وهو على كل شيء وكيل﴾، أي: جميع الأشياء تحت وكالة الله وتدبيره خلقاً وتدبيراً وتصريفاً. ومن المعلوم أن الأمر المتصرَّف فيه يكون استقامته وتمامه وكمال انتظامه بحسب حال الوكيل عليه، ووكالته تعالى على الأشياء ليست من جنس وكالة الخلق؛ فإن وكالتهم وكالة نيابة، والوكيل فيها تابع لموكله، وأما الباري تبارك وتعالى؛ فوكالته من نفسه لنفسه، متضمنة لكمال العلم وحسن التدبير والإحسان فيه والعدل، فلا يمكن أحداً أن يستدرك على الله، ولا يرى في خلقه خللاً ولا فطوراً، ولا في تدبيره نقصاً وعيباً، ومن وكالته أنه تعالى توكَّل ببيان دينه وحفظه عن المزيلات والمغيِّرات، وأنه تولَّى حفظ المؤمنين وعصمتهم عما يزيل إيمانهم ودينهم."},{"a":"6:103","t":"﴿لا تدركه الأبصار﴾: لعظمته وجلالِهِ وكماله، أي: لا تحيط به الأبصار وإن كانت تراه وتفرح بالنظر إلى وجهه الكريم، فنَفْيُ الإدراك لا يَنْفي الرؤية، بل يثبتها بالمفهوم؛ فإنه إذا نفى الإدراك الذي هو أخص أوصاف الرؤية؛ دلَّ على أن الرؤية ثابتة؛ فإنه لو أراد نفي الرؤية؛ لقال: لا تراه الأبصارُ ... ونحو ذلك، فعلم أنه ليس في الآية حجة لمذهب المعطلة الذين ينفون رؤية ربِّهم في الآخرة، بل فيها ما يدل على نقيض قولهم. ﴿وهو يدرِكُ الأبصار﴾؛ أي: هو الذي أحاط علمُهُ بالظواهر والبواطن، وسمعُهُ بجميع الأصوات الظاهرة والخفية، وبصرُهُ بجميع المبصرات صغارها وكبارها، ولهذا قال: ﴿وهو اللطيف الخبير﴾؛ أي: الذي لَطُفَ علمه وخبرته ودقَّ حتى أدرك السرائر والخفايا والخبايا والبواطن، ومن لطفه أنه يسوقُ عبدَه إلى مصالح دينه، ويوصلها إليه بالطرق التي لا يشعر بها العبد ولا يسعى فيها، ويوصله إلى السعادة الأبدية والفلاح السرمديِّ من حيث لا يحتسب، حتى إنه يقدِّرُ عليه الأمورَ التي يكرهها العبدُ ويتألَّمُ منها ويدعو اللهَ أن يزيلَها؛ لعلمه أن دينَهُ أصلح؛ وأن كمالَه متوقِّفٌ عليها؛ فسبحان اللطيفِ لما يشاء الرحيم بالمؤمنين."},{"a":"6:104","t":"﴿قد جاءكم بصائرُ من ربِّكم فمن أبصر فلنفسِهِ ومن عَمِيَ فعليها وما أنا عليكم بحفيظٍ﴾: لما بيَّن تعالى من الآيات البينات والأدلة الواضحات الدالة على الحقِّ في جميع المطالب والمقاصد؛ نبَّه العباد عليها، وأخبر أن هدايتهم وضدها لأنفسهم، فقال: ﴿قد جاءَكُم بصائِرُ من ربِّكُم﴾؛ أي: آيات تبيِّن الحقَّ وتجعله للقلب بمنزلة الشمس للأبصار؛ لما اشتملت عليه من فصاحة اللفظ وبيانه ووضوحه ومطابقته للمعاني الجليلة والحقائق الجميلة؛ لأنَّها صادرةٌ من الربِّ الذي ربَّى خلقه بصنوف نعمه الظاهرة والباطنة، التي من أفضلها وأجلها تبيين الآيات وتوضيح المشكلات. ﴿فمن أبصر﴾: بتلك الآياتِ مواقعَ العبرة وعمل بمقتضاها ﴿فلنفسه﴾: فإنَّ الله هو الغنيُّ الحميد، ومن عَمِيَ بأن بُصِّرَ فلم يَتَبَصَّر، وزُجِرَ فلم ينزجِرْ، وبُيِّن له الحقُّ فما انقاد له ولا تواضع؛ فإنما عماه مضرَّتُه عليه. ﴿وما أنا﴾: أيها الرسول، ﴿عليكم بحفيظٍ﴾: أحفظ أعمالَكم وأراقِبُها على الدوام، إنما عليَّ البلاغُ المبين، وقد أدَّيته وبلَّغت ما أنزل الله إليَّ؛ فهذه وظيفتي، وما عدا ذلك فلست موظفاً فيه."},{"a":"6:105","t":"ينهى الله المؤمنين عن أمر كان جائزاً بل مشروعاً في الأصل، وهو سبُّ آلهة المشركين التي اتُّخذت أوثاناً وآلهة مع الله، التي يُتَقَرَّب إلى الله بإهانتها وسبها، ولكن لمَّا كان هذا السبُّ طريقاً إلى سبِّ المشركين لربِّ العالمين، الذي يجب تنزيه جنابه العظيم عن كل عيبٍ وآفةٍ وسبٍّ وقدح؛ نهى الله عن سبِّ آلهة المشركين؛ لأنهم يحمون لدينهم ويتعصَّبون له؛ لأن كلَّ أمة زين الله لهم عملهم فرأوه حسناً وذبوا عنه ودافعوا بكل طريق، حتى إنهم يسبُّون الله ربَّ العالمين الذي رسخت عظمتُهُ في قلوب الأبرار والفجار إذا سبَّ المسلمون آلهتهم، ولكن الخلقَ كلَّهم مرجعُهم ومآلُهم إلى الله يوم القيامة، يعرَضون عليه وتعرَضُ أعمالهم، فينبِّئهم بما كانوا يعملون من خيرٍ وشرٍّ. وفي هذه الآية الكريمة دليلٌ للقاعدة الشرعيَّة، وهو أن الوسائل تُعتبر بالأمور التي توصِلُ إليها، وأن وسائل المحرم ـ ولو كانت جائزة ـ تكون محرمةً إذا كانت تفضي إلى الشرِّ."},{"a":"6:106","t":"ينهى الله المؤمنين عن أمر كان جائزاً بل مشروعاً في الأصل، وهو سبُّ آلهة المشركين التي اتُّخذت أوثاناً وآلهة مع الله، التي يُتَقَرَّب إلى الله بإهانتها وسبها، ولكن لمَّا كان هذا السبُّ طريقاً إلى سبِّ المشركين لربِّ العالمين، الذي يجب تنزيه جنابه العظيم عن كل عيبٍ وآفةٍ وسبٍّ وقدح؛ نهى الله عن سبِّ آلهة المشركين؛ لأنهم يحمون لدينهم ويتعصَّبون له؛ لأن كلَّ أمة زين الله لهم عملهم فرأوه حسناً وذبوا عنه ودافعوا بكل طريق، حتى إنهم يسبُّون الله ربَّ العالمين الذي رسخت عظمتُهُ في قلوب الأبرار والفجار إذا سبَّ المسلمون آلهتهم، ولكن الخلقَ كلَّهم مرجعُهم ومآلُهم إلى الله يوم القيامة، يعرَضون عليه وتعرَضُ أعمالهم، فينبِّئهم بما كانوا يعملون من خيرٍ وشرٍّ. وفي هذه الآية الكريمة دليلٌ للقاعدة الشرعيَّة، وهو أن الوسائل تُعتبر بالأمور التي توصِلُ إليها، وأن وسائل المحرم ـ ولو كانت جائزة ـ تكون محرمةً إذا كانت تفضي إلى الشرِّ."},{"a":"6:107","t":"ينهى الله المؤمنين عن أمر كان جائزاً بل مشروعاً في الأصل، وهو سبُّ آلهة المشركين التي اتُّخذت أوثاناً وآلهة مع الله، التي يُتَقَرَّب إلى الله بإهانتها وسبها، ولكن لمَّا كان هذا السبُّ طريقاً إلى سبِّ المشركين لربِّ العالمين، الذي يجب تنزيه جنابه العظيم عن كل عيبٍ وآفةٍ وسبٍّ وقدح؛ نهى الله عن سبِّ آلهة المشركين؛ لأنهم يحمون لدينهم ويتعصَّبون له؛ لأن كلَّ أمة زين الله لهم عملهم فرأوه حسناً وذبوا عنه ودافعوا بكل طريق، حتى إنهم يسبُّون الله ربَّ العالمين الذي رسخت عظمتُهُ في قلوب الأبرار والفجار إذا سبَّ المسلمون آلهتهم، ولكن الخلقَ كلَّهم مرجعُهم ومآلُهم إلى الله يوم القيامة، يعرَضون عليه وتعرَضُ أعمالهم، فينبِّئهم بما كانوا يعملون من خيرٍ وشرٍّ. وفي هذه الآية الكريمة دليلٌ للقاعدة الشرعيَّة، وهو أن الوسائل تُعتبر بالأمور التي توصِلُ إليها، وأن وسائل المحرم ـ ولو كانت جائزة ـ تكون محرمةً إذا كانت تفضي إلى الشرِّ."},{"a":"6:108","t":"ينهى الله المؤمنين عن أمر كان جائزاً بل مشروعاً في الأصل، وهو سبُّ آلهة المشركين التي اتُّخذت أوثاناً وآلهة مع الله، التي يُتَقَرَّب إلى الله بإهانتها وسبها، ولكن لمَّا كان هذا السبُّ طريقاً إلى سبِّ المشركين لربِّ العالمين، الذي يجب تنزيه جنابه العظيم عن كل عيبٍ وآفةٍ وسبٍّ وقدح؛ نهى الله عن سبِّ آلهة المشركين؛ لأنهم يحمون لدينهم ويتعصَّبون له؛ لأن كلَّ أمة زين الله لهم عملهم فرأوه حسناً وذبوا عنه ودافعوا بكل طريق، حتى إنهم يسبُّون الله ربَّ العالمين الذي رسخت عظمتُهُ في قلوب الأبرار والفجار إذا سبَّ المسلمون آلهتهم، ولكن الخلقَ كلَّهم مرجعُهم ومآلُهم إلى الله يوم القيامة، يعرَضون عليه وتعرَضُ أعمالهم، فينبِّئهم بما كانوا يعملون من خيرٍ وشرٍّ. وفي هذه الآية الكريمة دليلٌ للقاعدة الشرعيَّة، وهو أن الوسائل تُعتبر بالأمور التي توصِلُ إليها، وأن وسائل المحرم ـ ولو كانت جائزة ـ تكون محرمةً إذا كانت تفضي إلى الشرِّ."},{"a":"6:109","t":"أي: وأقسم المشركون المكذِّبون للرسول محمد - صلى الله عليه وسلم - ﴿بالله جَهْدَ أيمانِهِم﴾؛ أي: قسماً اجتهدوا فيه وأكَّدوه، ﴿لئن جاءتْهم آيةٌ﴾: تدلُّ على صدق محمد - صلى الله عليه وسلم -، ﴿ليؤمنُنَّ بها﴾: وهذا الكلام الذي صدر منهم لم يكن قصدُهم فيه الرشاد، وإنما قصدُهم دفع الاعتراض عليهم وردُّ ما جاء به الرسول قطعاً؛ فإنَّ الله أيَّد رسوله - صلى الله عليه وسلم - بالآيات البينات والأدلة الواضحات التي عند الالتفات لها لا تَبْقَى أدنى شُبهة ولا إشكال في صحَّة ما جاء به؛ فطلبهم بعد ذلك للآيات من باب التعنُّت الذي لا يلزم إجابته، بل قد يكون المنع من إجابتهم أصلح لهم؛ فإنَّ الله جرت سنَّتُهُ في عباده أن المقترحين للآيات على رسلهم إذا جاءتهم فلم يؤمنوا بها أنه يعاجلهم بالعقوبة، ولهذا قال: ﴿قل إنَّما الآياتُ عند الله﴾؛ أي: هو الذي يرسلها إذا شاء، ويمنعها إذا شاء، ليس لي من الأمر شيء، فطلبُكم مني الآيات ظلمٌ وطلبٌ لما لا أملك، وإنما توجَّهون إلى توضيح ما جئتكم به وتصديقه، وقد حصل، ومع ذلك؛ فليس معلوماً أنَّهم إذا جاءتهم الآيات يؤمنون ويصدِّقون، بل الغالب ممن هذه حاله [أنه] لا يؤمن، ولهذا قال: ﴿وما يشعِرُكم أنها إذا جاءتْ لا يؤمنونَ﴾."},{"a":"6:110","t":"﴿ونُقَلِّبُ أفئدتَهم وأبصارَهم كما لم يؤمِنوا به أولَ مرةٍ ونذرُهم في طُغيانهم يعمَهونَ﴾؛ أي: ونعاقبهم إذا لم يؤمنوا أول مرة يأتيهم فيه الداعي وتقوم عليهم الحجَّة بتقليب القلوب والحيلولة بينهم وبين الإيمان وعدم التوفيق لسلوك الصراط المستقيم، وهذا من عدل الله وحكمته بعباده؛ فإنهم الذين جَنَوْا على أنفسهم، وفُتح لهم الباب فلم يدخلوا، وبُيِّن لهم الطريق فلم يسلكوا؛ فبعد ذلك إذا حُرِموا التوفيق؛ كان مناسباً لأحوالهم."}],"142":[{"a":"6:111","t":"وكذلك تعليقهم الإيمان بإرادتهم ومشيئتهم وحدهم وعدم الاعتماد على الله من أكبر الغلط؛ فإنهم لو جاءتهم الآياتُ العظيمة من تنزيل الملائكة إليهم يشهدون للرسول بالرسالة وتكليم الموتى وبعثهم بعد موتهم، وحشرنا عليهم كلَّ شيءٍ حتى يكلِّمهم قبلاً ومشاهدةً ومباشرة بصدق ما جاء به الرسول؛ ما حَصَلَ لهم الإيمان إذا لم يشأ الله إيمانهم، ولكن أكثرهم يجهلون؛ فلذلك رتَّبوا إيمانهم على مجرد إتيان الآيات، وإنما العقل والعلم أن يكون العبد مقصوده اتِّباع الحق، ويطلبه بالطرق التي بيَّنها الله، ويعمل بذلك، ويستعين ربَّه في اتباعه، ولا يتَّكل على نفسه وحوله وقوته، ولا يطلب من الآيات الاقتراحية ما لا فائدة فيه."},{"a":"6:112","t":"يقول تعالى مسلياً لرسولِه [محمدٍ]- صلى الله عليه وسلم -: وكما جعلنا لك أعداء يردُّون دعوتك ويحاربونك ويحسدونك؛ فهذه سنتنا أن نجعل لكلِّ نبي نرسله إلى الخلق أعداءً من شياطين الإنس والجن يقومون بضد ما جاءت به الرسل، ﴿يوحي بعضُهم إلى بعض زُخْرُفَ القول غروراً﴾؛ أي: يزين بعضُهم لبعض الأمر الذي يدعون إليه من الباطل ويزخرفونَ له العبارات حتى يجعلوه في أحسن صورة ليغترَّ به السفهاءُ وينقادَ له الأغبياءُ الذين لا يفهمون الحقائق ولا يفقهون المعاني، بل تعجبهم الألفاظ المزخرفة والعبارات المموِّهة، فيعتقدون الحقَّ باطلاً والباطل حقًّا."},{"a":"6:113","t":"ولهذا قال تعالى: ﴿ولِتَصْغَى إليه﴾؛ أي: ولتميلَ إلى ذلك الكلام المزخرف ﴿أفئدةُ الذين لا يؤمنون بالآخرة﴾: لأن عدم إيمانهم باليوم الآخر وعدم عقولهم النافعة يحمِلُهم على ذلك، ﴿ولِيَرْضَوْه﴾: بعد أن يَصْغَوا إليه، فيصغَوْن إليه أولاً، فإذا مالوا إليه ورأوا تلك العبارات المستحسنة؛ رضوه وزُيِّن في قلوبهم وصار عقيدةً راسخةً وصفة لازمة، ثم ينتجُ من ذلك أن يقترفوا من الأعمال والأقوال ما هم مقترفون؛ أي: يأتون من الكذب بالقول والفعل ما هو من لوازم تلك العقائد القبيحة؛ فهذه حال المفترين شياطين الإنس والجن المستجيبين لدعوتهم، وأما أهل الإيمان بالآخرة وأولو العقول الوافية والألباب الرزينة؛ فإنهم لا يغترُّون بتلك العبارات، ولا تخلبهم تلك التمويهات، بل همَّتهم مصروفةٌ إلى معرفة الحقائق، فينظرون إلى المعاني التي يدعو إليها الدعاة؛ فإن كانت حقًّا؛ قبلوها وانقادوا لها، ولو كُسِيَتْ عباراتٍ رديةً وألفاظاً غير وافية، وإن كانت باطلاً؛ ردُّوها على من قالها، كائناً مَن كان، ولو ألبست من العبارات المستحسنة ما هو أرقُّ من الحرير. ومن حكمةِ اللهِ تعالى في جعله للأنبياء أعداءً وللباطل أنصاراً قائمين بالدعوة إليه: أن يحصُلَ لعبادِهِ الابتلاءُ والامتحانُ؛ ليتميَّز الصادقُ من الكاذب، والعاقل من الجاهل، والبصير من الأعمى. ومن حكمتِهِ: أنَّ في ذلك بياناً للحقِّ وتوضيحاً له؛ فإنَّ الحقَّ يستنير ويتَّضح إذا قام الباطل يصارعه ويقاومه؛ فإنه حينئذ يتبيَّن من أدلة الحقِّ وشواهده الدالة على صدقه وحقيقته ومن فساد الباطل وبطلانه ما هو من أكبر المطالب التي يتنافس فيها المتنافسون."},{"a":"6:114","t":"أي: قلْ يا أيُّها الرسولُ: ﴿أفغير الله أبتغي حَكَماً﴾: أحاكم إليه وأتقيَّد بأوامره ونواهيه؛ فإن غير الله محكومٌ عليه لا حاكم، وكلُّ تدبير وحكم للمخلوق؛ فإنه مشتمل على النقص والعيب والجور، وإنما الذي يجب أن يُتَّخذ حاكماً؛ فهو الله وحده لا شريك له، الذي له الخلق والأمر ﴿الذي أنزل إليكم الكتاب مفصَّلاً﴾؛ أي: موضحاً فيه الحلال والحرام والأحكام الشرعية وأصول الدين وفروعه، الذي لا بيان فوقَ بيانِهِ، ولا برهانَ أجلى من برهانه، ولا أحسن منه حكماً، ولا أقوم قيلاً؛ لأنَّ أحكامه مشتملة على الحكمة والرحمة، وأهل الكتب السابقة من اليهود والنصارى يعترفون بذلك و ﴿يعلمونَ أنَّه منزَّلٌ من ربِّك بالحقِّ﴾: ولهذا تواطأت الإخبارات، ﴿فلا﴾ تَشُكَّنَّ في ذلك ولا ﴿تكوننَّ من الممترين﴾."},{"a":"6:115","t":"ثم وصف تفصيلها فقال: ﴿وتمَّتْ كلمةُ ربِّك صدقاً وعدلاً﴾؛ أي: صدقاً في الإخبار وعدلاً في الأمر والنهي؛ فلا أصدق من أخبار الله التي أودعها هذا الكتاب العزيز، ولا أعدل من أوامره ونواهيه، ﴿لا مبدِّلَ لكلماتِهِ﴾؛ حيثُ حفظها وأحكمها بأعلى أنواع الصدق وبغاية الحقِّ؛ فلا يمكن تغييرها ولا اقتراح أحسن منها. ﴿وهو السميع﴾: لسائر الأصوات، باختلاف اللغات، على تفنن الحاجات، ﴿العليم﴾: الذي أحاط علمُهُ بالظواهر والبواطن والماضي والمستقبل."},{"a":"6:116","t":"يقول تعالى لنبيِّه محمد - صلى الله عليه وسلم - محذراً عن طاعة أكثر الناس: ﴿وإن تُطِعْ أكثرَ مَنْ في الأرض يضلُّوكَ عن سبيل الله﴾: فإنَّ أكثرهم قدِ انحرفوا في أديانهم وأعمالهم وعلومهم؛ فأديانُهم فاسدةٌ، وأعمالُهم تبعٌ لأهوائِهِم، وعلومُهم ليس فيها تحقيقٌ ولا إيصالٌ لسواء الطريق، بل غايتُهم أنَّهم يتَّبعون الظنَّ الذي لا يغني من الحقِّ شيئاً، ويتخرَّصون في القول على الله ما لا يعلمون."},{"a":"6:117","t":"ومَن كان بهذه المثابة؛ فحريٌّ أن يحذِّر اللهُ منه عبادَه ويصفُ لهم أحواله؛ لأنَّ هذا وإن كان خطاباً للنبي - صلى الله عليه وسلم -؛ فإنَّ أمتَه أسوةٌ له في سائر الأحكام التي ليست من خصائصه، والله تعالى أصدقُ قيلاً وأصدقُ حديثاً، و ﴿هو أعلم بمن يَضِلُّ عن سبيله﴾، وأعلم بمن يهتدي ويهدي، فيجب عليكم أيُّها المؤمنون أن تتَّبعوا نصائحه وأوامره ونواهيه؛ لأنه أعلم بمصالحكم، وأرحم بكم من أنفسكم. ودلت هذه الآية على أنه لا يستدل على الحقِّ بكثرة أهله، ولا يدلُّ قلةُ السالكين لأمرٍ من الأمور أن يكون غير حقٍّ، بل الواقع بخلاف ذلك؛ فإنَّ أهل الحقِّ هم الأقلون عدداً الأعظمون عند الله قدراً وأجراً، بل الواجب أن يستدلَّ على الحق والباطل بالطرق الموصلة إليه."},{"a":"6:118","t":"يأمر تعالى عباده المؤمنين بمقتضى الإيمان، وأنهم إن كانوا مؤمنين؛ فليأكلوا مما ذُكِرَ اسم الله عليه من بهيمة الأنعام وغيرها من الحيوانات المحلَّلة، ويعتقدوا حلَّها، ولا يفعلوا كما يفعله أهل الجاهلية من تحريم كثير من الحلال ابتداعاً من عند أنفسهم وإضلالاً من شياطينهم؛ فذكر الله أنَّ علامة المؤمن مخالفةُ أهل الجاهلية في هذه العادة الذميمة المتضمِّنة لتغيير شرع الله، وأنَّه أي شيء يمنعُهم من أكل ما ذُكِر اسم الله عليه؛ وقد فصَّل الله لعباده ما حرَّم عليهم وبيَّنه ووضَّحه، فلم يبق فيه إشكالٌ ولا شبهةٌ توجِبُ أن يمتنعَ من أكل بعض الحلال خوفاً من الوقوع في الحرام. ودلت الآية الكريمة على أن الأصل في الأشياء والأطعمة الإباحة، وأنه إذا لم يرد الشرعُ بتحريم شيءٍ منها؛ فإنَّه باق على الإباحة؛ فما سكتَ الله عنه؛ فهو حلالٌ؛ لأنَّ الحرام قد فصَّله الله؛ فما لم يفصِّله الله؛ فليس بحرام. ومع ذلك؛ فالحرام الذي قد فصَّله الله وأوضحه قد أباحه عند الضرورة والمخمصة؛ كما قال تعالى: ﴿حُرِّمَتْ عليكمُ الميتةُ والدمُ ولحمُ الخنزيرِ ...﴾ إلى أن قال: ﴿فمنِ اضْطُرَّ في مخمصةٍ غير متجانفٍ لإثم فإنَّ الله غفورٌ رحيمٌ﴾. ثم حذر عن كثير من الناس، فقال: ﴿وإنَّ كثيراً لَيُضِلُّونَ بأهوائهم﴾؛ أي: بمجرَّد ما تهوى أنفسهم ﴿بغيرِ علم﴾: ولا حجَّة؛ فليحذرِ العبد من أمثال هؤلاء، وعلامتُهم كما وصَفَهم الله لعبادِهِ أنَّ دعوتَهم غير مبنيَّة على برهانٍ ولا لهم حجَّة شرعيَّة، وإنما يوجد لهم شبهٌ بحسب أهوائهم الفاسدة، وآرائهم القاصرة؛ فهؤلاء معتدونَ على شرع الله وعلى عبادِ الله، والله لا يحبُّ المعتدين؛ بخلاف الهادين المهتدين؛ فإنهم يدعون إلى الحقِّ والهدى، ويؤيِّدون دعوتهم بالحجج العقليَّة والنقليَّة، ولا يتَّبعون في دعوتهم إلا رضا ربِّهم والقرب منه."}],"143":[{"a":"6:119","t":"يأمر تعالى عباده المؤمنين بمقتضى الإيمان، وأنهم إن كانوا مؤمنين؛ فليأكلوا مما ذُكِرَ اسم الله عليه من بهيمة الأنعام وغيرها من الحيوانات المحلَّلة، ويعتقدوا حلَّها، ولا يفعلوا كما يفعله أهل الجاهلية من تحريم كثير من الحلال ابتداعاً من عند أنفسهم وإضلالاً من شياطينهم؛ فذكر الله أنَّ علامة المؤمن مخالفةُ أهل الجاهلية في هذه العادة الذميمة المتضمِّنة لتغيير شرع الله، وأنَّه أي شيء يمنعُهم من أكل ما ذُكِر اسم الله عليه؛ وقد فصَّل الله لعباده ما حرَّم عليهم وبيَّنه ووضَّحه، فلم يبق فيه إشكالٌ ولا شبهةٌ توجِبُ أن يمتنعَ من أكل بعض الحلال خوفاً من الوقوع في الحرام. ودلت الآية الكريمة على أن الأصل في الأشياء والأطعمة الإباحة، وأنه إذا لم يرد الشرعُ بتحريم شيءٍ منها؛ فإنَّه باق على الإباحة؛ فما سكتَ الله عنه؛ فهو حلالٌ؛ لأنَّ الحرام قد فصَّله الله؛ فما لم يفصِّله الله؛ فليس بحرام. ومع ذلك؛ فالحرام الذي قد فصَّله الله وأوضحه قد أباحه عند الضرورة والمخمصة؛ كما قال تعالى: ﴿حُرِّمَتْ عليكمُ الميتةُ والدمُ ولحمُ الخنزيرِ ...﴾ إلى أن قال: ﴿فمنِ اضْطُرَّ في مخمصةٍ غير متجانفٍ لإثم فإنَّ الله غفورٌ رحيمٌ﴾. ثم حذر عن كثير من الناس، فقال: ﴿وإنَّ كثيراً لَيُضِلُّونَ بأهوائهم﴾؛ أي: بمجرَّد ما تهوى أنفسهم ﴿بغيرِ علم﴾: ولا حجَّة؛ فليحذرِ العبد من أمثال هؤلاء، وعلامتُهم كما وصَفَهم الله لعبادِهِ أنَّ دعوتَهم غير مبنيَّة على برهانٍ ولا لهم حجَّة شرعيَّة، وإنما يوجد لهم شبهٌ بحسب أهوائهم الفاسدة، وآرائهم القاصرة؛ فهؤلاء معتدونَ على شرع الله وعلى عبادِ الله، والله لا يحبُّ المعتدين؛ بخلاف الهادين المهتدين؛ فإنهم يدعون إلى الحقِّ والهدى، ويؤيِّدون دعوتهم بالحجج العقليَّة والنقليَّة، ولا يتَّبعون في دعوتهم إلا رضا ربِّهم والقرب منه."},{"a":"6:120","t":"المراد بالإثم: جميع المعاصي التي تؤثم العبدَ؛ أي: توقعه في الإثم والحَرَج من الأشياء المتعلِّقة بحقوق الله وحقوق عباده، فنهى الله عبادَهُ عن اقتراف الإثم الظاهر والباطن؛ أي: السر والعلانية المتعلِّقة بالبدن والجوارح والمتعلقة بالقلب، ولا يتمُّ للعبد ترك المعاصي الظاهرة والباطنة إلا بعد معرفتها والبحث عنها، فيكون البحث عنها ومعرفة معاصي القلب والبدن والعلم بذلك واجباً متعيناً على المكلَّف، وكثيرٌ من الناس تخفى عليه كثيرٌ من المعاصي، خصوصاً معاصي القلب؛ كالكبر والعجب والرياء ... ونحو ذلك حتى إنّه يكون به كثيرٌ منها وهو لا يحسُّ به ولا يشعر، وهذا من الإعراض عن العلم وعدم البصيرة. ثم أخبر تعالى أن الذين يكسبون الإثم الظاهر والباطن سيُجْزَون على حسب كسبهم وعلى قدر ذنوبهم قلَّت أو كثرت، وهذا الجزاء يكون في الآخرة، وقد يكون في الدُّنيا؛ يعاقَب العبد فيخفَّف عنه بذلك من سيئاته."},{"a":"6:121","t":"ويدخل تحت هذا المنهي عنه ما ذُكِرَ عليه اسم غير الله؛ كالذي يُذبح للأصنام وآلهة المشركين ؛ فإنَّ هذا مما أُهلَّ لغير الله به المحرَّم بالنصِّ عليه خصوصاً. ويدخل في ذلك متروك التسمية مما ذبح لله كالضحايا والهدايا، أو للحم والأكل، إذا كان الذابح متعمِّداً ترك التسمية عند كثير من العلماء، ويخرج من هذا العموم الناسي بالنصوص الأخر الدالة على رفع الحرج عنه. ويدخل في هذه الآية ما مات بغير ذكاة من الميتات؛ فإنها مما لم يذكر اسم الله عليه، ونص الله عليها بخصوصها في قوله: ﴿حُرِّمَتْ عليكم الميتةُ﴾، ولعلها سبب نزول الآية؛ لقوله: ﴿وإنَّ الشياطينَ لَيوحون إلى أوليائهم ليجادِلوكم﴾ بغير علم؛ فإن المشركين حين سمعوا تحريم الله ورسوله للميتة وتحليله للمذكاة، وكانوا يستحلون أكل الميتة قالوا معاندة لله ورسوله ومجادلة بغير حجة ولا برهان: أتأكلونَ ما قتلتُم ولا تأكلون ما قَتَلَ الله يعنون بذلك الميتة؟! وهذا رأي فاسدٌ لا يستند على حجة ولا دليل، بل يستند إلى آرائهم الفاسدة التي لو كان الحق تبعاً لها لفسدت السماوات والأرض ومن فيهن؛ فتبًّا لمن قدَّم هذه العقول على شرع الله وأحكامه الموافقة للمصالح العامة والمنافع الخاصة. ولا يُستغرب هذا منهم؛ فإن هذه الآراء وأشباهها صادرة عن وحي أوليائهم من الشياطين الذين يريدون أن يُضِلُّوا الخلق عن دينهم ويدعوهم ليكونوا من أصحاب السعير. ﴿وإنْ أطعتُموهم﴾: في شركهم وتحليلهم الحرام وتحريمهم الحلال، ﴿إنَّكم لمشركونَ﴾؛ لأنكم اتَّخذتموهم أولياء من دون الله، ووافقتموهم على ما به فارقوا المسلمين؛ فلذلك كان طريقكم طريقهم. ودلت هذه الآية الكريمة على أن ما يقع في القلوب من الإلهامات والكشوف التي يكثر وقوعها عند الصوفية ونحوهم لا تدلُّ بمجرَّدها على أنها حقٌّ ولا تصدَّق حتى تعرض على كتاب الله وسنة رسوله؛ فإن شهدا لها بالقبول؛ قبلت، وإن ناقضتْهما؛ رُدَّتْ، وإن لم يعلم شيء من ذلك؛ توقف فيها ولم تصدَّق ولم تكذَّب؛ لأن الوحي والإلهام يكون من الرحمن ويكون من الشيطان؛ فلا بد من التمييز بينهما والفرقان، وبعدم التفريق بين الأمرين حصل من الغلط والضلال ما لا يحصيه إلا الله."},{"a":"6:122","t":"يقول تعالى: ﴿أوَمَن كان﴾: من قبل هداية الله له ﴿مَيْتاً﴾: في ظلمات الكفر والجهل والمعاصي، ﴿فأحييناهُ﴾: بنور العلم والإيمان والطاعة، فصار يمشي بين الناس في النور، متبصراً في أموره، مهتدياً لسبيله، عارفاً للخير، مؤثراً له، مجتهداً في تنفيذه في نفسه وغيره، عارفاً بالشر، مبغضاً له، مجتهداً في تركه وإزالته عن نفسه وعن غيره، أفيستوي هذا بمن هو في الظلمات؟ ظلمات الجهل والغي والكفر والمعاصي، ﴿ليس بخارج منها﴾، قد التبستْ عليه الطرق، وأظلمت عليه المسالكُ، فحضره الهمُّ والغمُّ والحزن والشقاء، فنبه تعالى العقولَ بما تدركه وتعرفه أنه لا يستوي هذا ولا هذا كما لا يستوي الليل والنهار والضياء والظلمة والأحياء والأموات، فكأنه قيل: فكيف يؤثِرُ مَن له أدنى مُسْكةٍ من عقل أن يكون بهذه الحالة وأن يبقى في الظلمات متحيراً؟! فأجاب بأنه ﴿زُيِّنَ للكافرين ما كانوا يعملونَ﴾، فلم يزل الشيطانُ يحسِّنُ لهم أعمالهم ويزيِّنُها في قلوبهم حتى استحسنوها ورأوها حقًّا وصار ذلك عقيدةً في قلوبهم وصفةً راسخةً ملازمةً لهم؛ فلذلك رضوا بما هم عليه من الشرِّ والقبائح."},{"a":"6:123","t":"وهؤلاء الذين في الظلمات يعمهون وفي باطلهم يتردَّدون غير متساوين؛ فمنهم القادةُ والرؤساء والمتبوعون، ومنهم التابعون المرؤوسون، والأولون منهم الذين فازوا بأشقى الأحوال، ولهذا قال: ﴿وكذلك جَعَلْنا في كلِّ قريةٍ أكابرَ مجرِميها﴾؛ أي: الرؤساء الذين قد كبر جرمهم واشتدَّ طغيانهم؛ ﴿ليمكُروا فيها﴾: بالخديعة والدعوة إلى سبيل الشيطان ومحاربة الرسل وأتباعهم بالقول والفعل، وإنما مكرهم وكيدهم يعود على أنفسهم؛ لأنهم يمكُرون ويمكُر الله والله خير الماكرين. وكذلك يجعل الله كبار أئمة الهدى وأفاضلهم يناضلون هؤلاء المجرمين ويردُّون عليهم أقوالهم، ويجاهدونهم في سبيل الله، ويسلكون بذلك السُّبُل الموصلة إلى ذلك، ويعينهم الله، ويسدِّد رأيهم، ويثبِّت أقدامهم، ويداوِلُ الأيام بينَهم وبين أعدائهم حتى يَدولَ الأمر في عاقبته بنصرِهِم وظهورِهم. والعاقبة للمتقين."},{"a":"6:124","t":"وإنما ثبتَ أكابر المجرمين على باطلهم، وقاموا بردِّ الحقِّ الذي جاءت به الرسل، حسداً منهم وبغياً، فقالوا: ﴿لن نؤمنَ حتَّى نُؤتى مثلَ ما أوتي رسلُ الله﴾: من النبوة والرسالة، وفي هذا اعتراض منهم على الله، وعجبٌ بأنفسهم، وتكبُّرٌ على الحقِّ الذي أنزله على أيدي رسله، وتحجُّرٌ على فضل الله وإحسانه، فردَّ الله عليهم اعتراضهم الفاسد، وأخبر أنهم لا يصلحون للخير، ولا فيهم ما يوجِبُ أن يكونوا من عبادِ الله الصالحين، فضلاً أن يكونوا من النبيين والمرسلين، فقال: ﴿الله أعلم حيثُ يجعلُ رسالَتَه﴾؛ فمَنْ عَلِمَهُ يَصْلُحُ لها ويقوم بأعبائها وهو متَّصفٌ بكلِّ خلق جميل ومتبرئ من كل خلق دنيء، أعطاه الله ما تقتضيه حكمتُه أصلاً وتبعاً، ومَن لم يكن كذلك؛ لم يضع أفضل مواهبه عند من لا يستأهله ولا يزكو عنده. وفي هذه الآية دليل على كمال حكمة الله تعالى: لأنَّه وإن كان تعالى رحيماً واسع الجود كثير الإحسان؛ فإنه حكيمٌ لا يضع جوده إلا عند أهله. ثم توعَّد المجرمين، فقال: ﴿سيصيبُ الذين أجرموا صَغارٌ عند الله﴾؛ أي: إهانةٌ وذُلٌّ؛ كما تكبَّروا على الحقِّ؛ أذلَّهم الله، ﴿وعذابٌ شديدٌ بما كانوا يمكُرون﴾؛ أي: بسبب مكرِهم لا ظلماً منه تعالى."}],"144":[{"a":"6:125","t":"يقول تعالى مبيِّناً لعبادِهِ علامة سعادة العبد وهدايته وعلامة شقاوته وضلاله: إنَّ مَن انشرح صدره للإسلام؛ أي: اتسع وانفسح فاستنار بنور الإيمان وحيي بضوء اليقين فاطمأنت بذلك نفسه وأحبَّ الخير وطوَّعت له نفسُهُ فعلَه متلذذاً به غير مستثقل؛ فإن هذا علامة على أن اللهَ قد هداه ومنَّ عليه بالتوفيق وسلوك أقوم الطريق، وأنَّ علامة من يُرِدِ اللهُ ﴿أن يُضِلَّه﴾: أنه ﴿يجعلْ صدرَه ضيِّقاً حَرَجاً﴾؛ أي: في غاية الضيق عن الإيمان والعلم واليقين، قد انغمس قلبُهُ في الشبهات والشهوات، فلا يصل إليه خير، لا ينشرحُ قلبه لفعل الخير. كأنه من ضيقه وشدَّته يكاد ﴿يَصَّعَّدُ في السماء﴾؛ أي: كأنه يكلَّف الصعود إلى السماء الذي لا حيلة فيه، وهذا سببه عدم إيمانهم؛ هو الذي أوجب أن يجعل الله الرجس عليهم؛ لأنهم سدُّوا على أنفسهم باب الرحمة والإحسان، وهذا ميزان لا يعول وطريق لا يتغير؛ فإنَّ مَن أعطى واتَّقى وصدَّق بالحسنى؛ ييسِّره الله لليسرى، ومن بخل واستغنى وكذب بالحسنى؛ فسيُيَسِّره للعسرى."},{"a":"6:126","t":"أي: معتدلاً موصلاً إلى الله وإلى دار كرامتِهِ، قد بُيِّنَتْ أحكامُه، وفصِّلت شرائعه، وميز الخير من الشر. ولكن هذا التفصيل والبيان ليس لكل أحد، إنما هو ﴿لقومٍ يَذَّكَّرونَ﴾؛ فإنهم الذين علموا فانتفعوا بعلمهم، وأعد الله لهم الجزاء الجزيل والأجر الجميل."},{"a":"6:127","t":"فلهذا قال: ﴿لهم دارُ السلام عند ربِّهم﴾، وسميت الجنة دار السلام لسلامتها من كل عيب وآفة وكَدَرٍ وهمٍّ وغمٍّ وغير ذلك من المنغِّصات، ويلزم من ذلك أن يكون نعيمُها في غاية الكمال ونهاية التمام؛ بحيث لا يقدر على وصفه الواصفون، ولا يتمنَّى فوقه المتمنون؛ من نعيم الروح والقلب والبدن، ولهم فيها ما تشتهيه الأنفس وتلذُّ الأعين وهم فيها خالدون. ﴿وهو وَليُّهم﴾: الذي تولَّى تدبيرهم وتربيتهم، ولطفَ بهم في جميع أمورهم، وأعانهم على طاعتِهِ، ويسَّر لهم كل سبب موصل إلى محبَّته، وإنما تولاَّهم بسبب أعمالهم الصالحة ومقدِّماتهم التي قصدوا بها رضا مولاهم؛ بخلاف مَن أعرض عن مولاه، واتَّبع هواه؛ فإنه سلَّطَ عليه الشيطان، فتولاَّه، فأفسد عليه دينَه ودُنياه."},{"a":"6:128","t":"يقول تعالى: ﴿ويوم يحشُرُهم جميعاً﴾؛ أي: جميع الثقلين من الإنس والجن، مَنْ ضلَّ منهم ومَنْ أضلَّ غيره، فيقول موبخاً للجنِّ الذين أضلُّوا الإنس وزيَّنوا لهم الشرَّ وأزُّوهم إلى المعاصي: ﴿يا معشر الجنِّ قد استكثرتُم من الإنس﴾؛ أي: من إضلالهم وصدِّهم عن سبيل الله؛ فكيف أقدمتم على محارمي، وتجرَّأتم على معاندة رسلي، وقمتم محاربين لله، ساعين في صدِّ عباد الله عن سبيله إلى سبيل الجحيم؟! فاليوم حقَّت عليكم لعنتي، ووجبت لكم نقمتي، وسنزيدكم من العذاب بحسب كفرِكُم وإضلالكم لغيرِكم، وليس لكم عذرٌ به تعتذِرون، ولا ملجأ إليه تلجؤون، ولا شافع يشفع، ولا دعاء يُسمع! فلا تسأل حينئذٍ عما يحل بهم من النَّكال والخِزْي والوَبال، ولهذا لم يذكِر الله لهم اعتذاراً، وأما أولياؤهم من الإنس؛ فأبدوا عذراً غير مقبول، فقالوا: ﴿ربَّنا استمتعَ بعضُنا ببعض﴾؛ أي: تمتَّع كلٌّ من الجني والإنسي بصاحبه وانتفع به؛ فالجنيُّ يستمتع بطاعة الإنسيِّ له وعبادته وتعظيمه واستعاذته به، والإنسيُّ يستمتع بنيل أغراضه وبلوغه بحسب خدمة الجنيِّ له بعض شهواته؛ فإن الإنسيَّ يعبُدُ الجنيَّ فيخدمُهُ الجنيُّ ويحصِّلُ له بعض الحوائج الدنيويَّة؛ أي: حصل منا من الذنوب ما حصل، ولا يمكن ردُّ ذلك. ﴿وبَلَغْنا أجَلَنا الذي أجَّلْتَ لنا﴾؛ أي: وقد وصلنا المحل الذي تُجازي فيه بالأعمال؛ فافعل بنا الآن ما تشاء، واحكم فينا بما تريدُ، قد انقطعت حُجَّتُنا، ولم يبق لنا عذرٌ، والأمر أمرُك والحكم حكمُك، وكأَن في هذا الكلام منهم نوع تضرُّع وترقُّق، ولكن في غير أوانه، ولهذا حكم فيهم بحكمه العادل، الذي لا جَوْر فيه، فقال: ﴿النارُ مَثْواكم خالدين فيها﴾، ولما كان هذا الحكم من مقتضى حكمتِهِ وعلمِهِ؛ ختم الآية بقوله: ﴿إنَّ ربَّك حكيمٌ عليمٌ﴾؛ فكما أن علمه وسع الأشياء كلَّها وعمَّها؛ فحكمتُهُ الغائيةُ شملت الأشياء، وعمَّتها، ووسعتها."},{"a":"6:129","t":"﴿وكذلك نُوَلِّي بعضَ الظالمين بعضاً بما كانوا يكسِبون﴾؛ أي: وكما ولَّيْنا الجنَّ المردة وسلَّطْناهم على إضلال أوليائهم من الإنس وعقَدْنا بينهم عقد الموالاة والموافقة بسبب كسبِهم وسعيهم بذلك؛ كذلك من سنَّتنا أن نولِّي كلَّ ظالم ظالماً مثلَه يؤزُّه إلى الشرِّ ويحثُّه عليه ويزهِّده في الخير وينفِّره عنه، وذلك من عقوبات الله العظيمة الشنيع أثرها البليغ خطرها، والذنب ذنبُ الظالم؛ فهو الذي أدخل الضرر على نفسه وعلى نفسه جنى، وما ربك بظلاَّم للعبيد. ومن ذلك أنَّ العباد إذا كَثُرَ ظلمُهم وفسادُهم ومنعُهم الحقوق الواجبة؛ وُلِّي عليهم ظلمةٌ يسومونهم سوء العذاب، ويأخذون منهم بالظُّلم والجَوْر أضعاف ما منعوا من حقوق الله وحقوق عباده على وجه غير مأجورين فيه ولا محتسبين؛ كما أن العباد إذا صلحوا واستقاموا؛ أصلح الله رعاتهم، وجعلهم أئمة عدل وإنصاف، لا ولاة ظلم واعتساف."},{"a":"6:130","t":"ثم وبَّخ الله جميع من أعرض عن الحق وردَّه من الجنِّ والإنس، وبيَّن خطأهم، فاعترفوا بذلك، فقال: ﴿يا مَعْشَرَ الجنِّ والإنسِ ألم يأتِكُم رسلٌ منكم يقصُّونَ عليكُم آياتي﴾: الواضحات البيِّنات التي فيها تفاصيل الأمر والنهي والخير والشرِّ والوعد والوعيد، ﴿وينذِرونَكم لقاءَ يومِكم هذا﴾: ويعلِّمونكم أنَّ النجاةَ فيه والفوزَ إنَّما هو بامتثال أوامر الله واجتناب نواهيه، وأنَّ الشقاء والخسران في تضييع ذلك، فأقروا بذلك واعترفوا، فقالوا: بلى، ﴿شَهِدْنا على أنفُسِنا وغرَّتْهُمُ الحياةُ الدُّنيا﴾: بزينتها وزُخرفها ونعيمها، فاطمأنوا بها ورضوا وألهتْهم عن الآخرةِ، ﴿وشهِدوا على أنفسهم أنَّهم كانوا كافرين﴾: فقامت عليهم حجةُ الله، وعَلِمَ حينئذٍ كلُّ أحدٍ حتى هم بأنفسهم عدلَ الله فيهم، [فقال لهم حاكماً عليهم بالعذاب الأليم: ادخُلوا في جملة أمم قد خلت من قبلكم من الجنِّ والإنس؛ صنعوا كصنيعكم، واستمتعوا بخلاقهم كما استمتعتم، وخاضوا بالباطل كما خضتم؛ إنهم كانوا خاسرين؛ أي: الأولون من هؤلاء والآخرون، وأيُّ خسرانٍ أعظم من خسران جنات النعيم وحرمان جوار أكرم الأكرمين] ؟!"},{"a":"6:131","t":"ثم وبَّخ الله جميع من أعرض عن الحق وردَّه من الجنِّ والإنس، وبيَّن خطأهم، فاعترفوا بذلك، فقال: ﴿يا مَعْشَرَ الجنِّ والإنسِ ألم يأتِكُم رسلٌ منكم يقصُّونَ عليكُم آياتي﴾: الواضحات البيِّنات التي فيها تفاصيل الأمر والنهي والخير والشرِّ والوعد والوعيد، ﴿وينذِرونَكم لقاءَ يومِكم هذا﴾: ويعلِّمونكم أنَّ النجاةَ فيه والفوزَ إنَّما هو بامتثال أوامر الله واجتناب نواهيه، وأنَّ الشقاء والخسران في تضييع ذلك، فأقروا بذلك واعترفوا، فقالوا: بلى، ﴿شَهِدْنا على أنفُسِنا وغرَّتْهُمُ الحياةُ الدُّنيا﴾: بزينتها وزُخرفها ونعيمها، فاطمأنوا بها ورضوا وألهتْهم عن الآخرةِ، ﴿وشهِدوا على أنفسهم أنَّهم كانوا كافرين﴾: فقامت عليهم حجةُ الله، وعَلِمَ حينئذٍ كلُّ أحدٍ حتى هم بأنفسهم عدلَ الله فيهم، [فقال لهم حاكماً عليهم بالعذاب الأليم: ادخُلوا في جملة أمم قد خلت من قبلكم من الجنِّ والإنس؛ صنعوا كصنيعكم، واستمتعوا بخلاقهم كما استمتعتم، وخاضوا بالباطل كما خضتم؛ إنهم كانوا خاسرين؛ أي: الأولون من هؤلاء والآخرون، وأيُّ خسرانٍ أعظم من خسران جنات النعيم وحرمان جوار أكرم الأكرمين] ؟!"}],"145":[{"a":"6:132","t":"ولكنَّهم وإن اشتركوا في الخسران؛ فإنهم يتفاوتون في مقداره تفاوتاً عظيماً، ﴿ولكلٍّ﴾: منهم ﴿درجات مما عملوا﴾: بحسب أعمالهم، لا يُجعل قليل الشرِّ منهم ككثيره، ولا التابع كالمتبوع، ولا المرؤوس كالرئيس؛ كما أن أهل الثواب والجنة وإن اشتركوا في الربح والفلاح ودخول الجنة؛ فإن بينهم من الفرق ما لا يعلمه إلا الله، مع أنهم كلهم [قد] رضوا بما آتاهم مولاهم وقنعوا بما حباهم، فنسأله تعالى أن يجعلَنا من أهل الفردوس الأعلى التي أعدَّها الله للمقربين من عباده والمصطَفَيْن من خلقه وأهل الصفوة من أهل وداده. ﴿وما ربُّك بغافل عما يعملونَ﴾ فيجازي كلًّا بحسب عمله، وبما يعلمه من مقصده."},{"a":"6:133","t":"وإنما أمر الله العباد بالأعمال الصالحة ونهاهم عن الأعمال السيئة رحمةً بهم وقصداً لمصالحهم، وإلاَّ؛ فهو الغني بذاته عن جميع مخلوقاته؛ فلا تنفعه طاعة الطائعين؛ كما لا تضره معصية العاصين. ﴿إن يشأ يُذْهِبْكم﴾: بالإهلاك، ﴿ويستخلِفْ من بعدِكم ما يشاء كما أنشأكم من ذُرِّيَّة قوم آخرين﴾: فإذا عرفتم بأنكم لا بدَّ أن تنتقلوا من هذه الدار كما انتقل غيركم، وترحلون منها وتخلونها لمن بعدكم كما رَحَلَ عنها مَنْ قبلكم وخلَّوها لكم؛ فَلِمَ اتَّخذتموها قراراً، وتوطنتم بها، ونسيتم أنها دار ممرٍّ، لا دار مقرٍّ وأن أمامكم داراً هي الدار التي جمعتْ كلَّ نعيم وسلمتْ من كلِّ آفة ونقص؟ وهي الدار التي يسعى إليها الأوَّلون والآخرون، ويرتحل نحوها السابقون واللاحقون، التي إذا وصلوها؛ فثم الخلودُ الدائم والإقامة اللازمة والغاية التي لا غاية وراءها والمطلوب الذي ينتهي إليه كل مطلوب والمرغوب الذي يضمحلُّ دونه كل مرغوب، هنالك والله ما تشتهيه الأنفس وتلذُّ الأعين ويتنافس فيه المتنافسون من لذَّة الأرواح وكثرة الأفراح ونعيم الأبدان والقلوب والقرب من علام الغيوب؛ فلله همةٌ تعلَّقت بتلك الكرامات، وإرادة سَمَتْ إلى أعلى الدرجات، وما أبخس حظَّ من رضي بالدُّون، وأدنى همة من اختار صفقة المغبون!"},{"a":"6:134","t":"ولا يستبعد المعرض الغافل سرعة الوصول إلى هذه الدار؛ فإنَّ ﴿ما توعدونَ لآتٍ وما أنتُم بمعجزينَ﴾: لله، فارِّين من عقابه؛ فإنَّ نواصِيَكم تحت قبضته، وأنتم تحت تدبيره وتصرفه."},{"a":"6:135","t":"﴿قل﴾: يا أيها الرسولُ لقومك إذا دعوتَهم إلى الله وبينت لهم مآلهم وما عليهم من حقوقه فامتنعوا من الانقياد لأمرِهِ واتَّبعوا أهواءهم واستمروا على شركهم: ﴿يا قومِ اعملوا على مكانتِكُم﴾؛ أي: على حالتكم التي أنتم عليها ورضيتموها لأنفسكم، ﴿إني عاملٌ﴾: على أمر الله ومتبعٌ لمراضي الله: ﴿فسوف تعلمونَ من تكونُ له عاقبةُ الدار﴾: أنا أو أنتم، وهذا من الإنصاف بموضع عظيم؛ حيث بيَّن الأعمال وعامليها، وجعل الجزاء مقروناً بنظر البصير، ضارباً فيه صفحاً عن التصريح الذي يغني عنه التلويح، وقد علم أن العاقبة الحسنة في الدنيا والآخرة للمتقين، وأن المؤمنين لهم عُقبى الدار، وأنَّ كلَّ معرض عن ما جاءت به الرسل عاقبته عاقبة سوء وشر، ولهذا قال: ﴿إنه لا يفلحُ الظالمونَ﴾: فكلُّ ظالم وإن تمتَّع في الدُّنيا بما تمتع به؛ فنهايته فيه الاضمحلال والتلف؛ إن الله ليملي للظالم حتى إذا أخذه لم يُفْلِتْه."},{"a":"6:136","t":"يخبر تعالى عما عليه المشركون المكذِّبون للنبي - صلى الله عليه وسلم - من سفاهة العقل وخفة الأحلام والجهل البليغ، وعدَّد تبارك وتعالى شيئاً من خرافاتهم؛ لينبِّه بذلك على ضلالهم والحذر منهم، وأن معارضة أمثال هؤلاء السفهاء للحقِّ الذي جاء به الرسول لا تقدح فيه أصلاً؛ فإنَّهم لا أهليَّة لهم في مقابلة الحق، فذكر من ذلك أنهم: ﴿جعلوا للهِ﴾ نصيباً ﴿مما ذَرَأ من الحَرْثِ والأنعام﴾: ولشركائهم من ذلك نصيباً، والحال أنَّ الله تعالى هو الذي ذرأه للعباد وأوجده رزقاً، فجمعوا بين محذورين محظورين، بل ثلاثة محاذير: منَّتهم على الله في جعلهم له نصيباً مع اعتقادهم أنَّ ذلك منهم تبرُّع. وإشراك الشركاء الذين لم يرزُقوهم ولم يوجدوا لهم شيئاً في ذلك. وحكمهم الجائر في أنَّ ما كان للهِ لم يبالوا به ولم يهتمُّوا، ولو كان واصلاً إلى الشركاء وما كان لشركائهم؛ اعتنوا به واحتفظوا به ولم يصلْ إلى الله منه شيءٌ، وذلك أنهم إذا حصل لهم من زروعهم وثمارهم وأنعامهم التي أوجدها الله لهم شيء؛ جعلوه قسمينِ: قسماً قالوا: هذا لله بقولهم وزعمهم، وإلاَّ؛ فالله لا يقبلُ إلا ما كان خالصاً لوجهه ولا يقبلُ عمل مَن أشرك به، وقسماً جعلوه حصة شركائِهِم من الأوثان والأنداد؛ فإن وصل شيء مما جعلوه لله واختلط بما جعلوه لغيره؛ لم يبالوا بذلك، وقالوا: الله غنيٌّ عنه فلا يردُّونه، وإن وصل شيءٌ مما جعلوه لآلهتهم إلى ما جعلوه لله؛ ردُّوه إلى محلِّه، وقالوا: إنها فقراء، لا بدَّ من ردِّ نصيبها؛ فهل أسوأ من هذا الحكم وأظلم حيث جعلوا ما للمخلوق يجتهد فيه وينصح ويحفظ أكثر مما يفعل بحقِّ الله. ويحتمل أن تأويل الآية الكريمة ما ثبت في «الصحيح» عن النبي - صلى الله عليه وسلم -: أنَّه قال عن الله تعالى: أنّه قال: «أنا أغنى الشُّركاءِ عن الشرك، مَنْ أشرك معي شيئاً؛ تركتُه وشِرْكَه» ، وأنَّ معنى الآية أنَّ ما جعلوه وتقربوا به لأوثانهم فهو تقرُّبٌ خالصٌ لغير الله، ليس لله منه شيءٌ، وما جعلوه لله على زعمهم؛ فإنه لا يصل إليه؛ لكونِهِ شركاً، بل يكون حظَّ الشركاء والأنداد؛ لأن الله غنيٌّ عنه، لا يقبل العمل الذي أشرك به معه أحدٌ من الخلق."},{"a":"6:137","t":"ومن سَفَه المشركين وضلالهم أنه ﴿زَيَّنَ لكثيرٍ من المشركين﴾ شركاؤهم ـ أي: رؤساؤهم وشياطينهم ـ قتلَ أولادهم، وهو الوأد الذين يدفنون أولادهم خشية الافتقار والإناث خشية العار، وكل هذا من خدع الشياطين الذين يريدون أن يُرْدوهم بالهلاك ويَلْبِسوا عليهم دينهم فيفعلون الأفعال التي في غاية القبح، ولا يزال شركاؤهم يزيِّنونها لهم حتى تكونَ عندهم من الأمور الحسنة والخصال المستحسنة، ولو شاء الله أن يمنَعَهم ويحَولَ بينهم وبين هذه الأفعال ويمنعَ أولادَهم عن قتل الأبوين لهم؛ ما فعلوه، ولكنِ اقتضتْ حكمتُهُ التخليةَ بينهم وبين أفعالهم؛ استدراجاً منه لهم وإمهالاً لهم وعدم مبالاة بما هم عليه، ولهذا قال: ﴿فذَرْهُم وما يفترونَ﴾؛ أي: دعهم مع كذِبِهم وافترائهم، ولا تحزن عليهم؛ فإنَّهم لن يضرُّوا الله شيئاً."}],"146":[{"a":"6:138","t":"ومن أنواع سفاهتهم أن الأنعام التي أحلَّها الله لهم عموماً وجعلها رزقاً ورحمة يتمتَّعون بها وينتفعون قد اخترعوا فيها بدعاً وأقوالاً من تلقاء أنفسهم؛ فعندهم اصطلاح في بعض الأنعام والحرث أنهم يقولون فيها: ﴿هذه أنعامٌ وحَرْثٌ حِجْرٌ﴾؛ أي: محرم. لا يطعمه ﴿إلا من نشاء﴾؛ أي: لا يجوز أن يَطْعَمُه أحدٌ إلاَّ مَن أردنا أن يُطعمه أو وصفناه بوصفٍ من عندنا، وكلُّ هذا بزعمهم لا مستندَ لهم ولا حجة إلا أهويتهم وآراؤهم الفاسدة. وأنعام ليست محرمةً من كل وجه، بل يحرِّمون ظهورها؛ أي: بالركوب والحمل عليها، ويحمون ظهرها، ويسمونها الحام. وأنعام لا يذكرون اسم الله عليها، بل يذكرون اسم أصنامهم وما كانوا يعبدون من دون الله عليها، وينسبون تلك الأفعال إلى الله، وهم كَذَبَةٌ فُجَّارٌ في ذلك. ﴿سيجزيهم بما كانوا يفترونَ﴾: على الله من إحلال الشرك وتحريم الحلال من الأكل والمنافع."},{"a":"6:139","t":"ومن آرائهم السخيفة أنهم يجعلون بعض الأنعام ويعيِّنونها محرماً ما في بطنها على الإناث دون الذكور، فيقولون: ﴿ما في بطونِ هذه الأنعام خالصةٌ لذكورنا﴾؛ أي: حلال لهم لا يشاركهم فيها النساء. ﴿ومحرَّمٌ على أزواجنا﴾؛ أي: نسائنا، هذا إذا وُلِدَ حيًّا، وإن يكن ما في بطنها يولد ميتاً؛ فهم فيه شركاء؛ أي: فهو حلال للذكور والإناث. ﴿سيَجْزيهم﴾: الله ﴿وَصْفَهُمْ﴾: حيث وصفوا ما أحلَّه الله بأنه حرام، ووصفوا الحرام بالحلال، فناقضوا شرع الله وخالفوه ونسبوا ذلك إلى الله. ﴿إنَّه حكيمٌ﴾؛ حيث أمهل لهم ومكَّنهم مما هم فيه من الضلال، ﴿عليمٌ﴾: بهم لا تخفى عليه خافيةٌ، وهو تعالى يعلم بهم، وبما قالوه عليه، وافتَرَوْه وهو يعافيهم، ويرزقهم جل جلاله."},{"a":"6:140","t":"ثم بيَّن خُسرانهم وسفاهةَ عقولهم، فقال: ﴿قد خَسِرَ الذين قتلوا أولادَهم سفهاً بغير علم﴾؛ أي: خسروا دينهم وأولادهم وعقولهم، وصار وصفهم بعد العقول الرزينة السَّفَه المردي والضلال، ﴿وحرَّموا ما رزقهم الله﴾؛ أي: ما جعله رحمة لهم وساقه رزقاً لهم، فردُّوا كرامة ربِّهم، ولم يكتفوا بذلك، بل وصفوها بأنها حرام وهي من أحلِّ الحلال، وكل هذا ﴿افتراءٌ على الله﴾؛ أي: كذب يَكْذِب به كلُّ معاندٍ كفارٍ، ﴿قد ضَلُّوا وما كانوا مهتدينَ﴾؛ أي: قد ضلُّوا ضلالاً بعيداً ولم يكونوا مهتدينَ في شيءٍ من أمورِهم."},{"a":"6:141","t":"لما ذكر تعالى تصرُّفَ المشركين في كثير مما أحلَّه الله لهم من الحروث والأنعام؛ ذكر تبارك وتعالى نعمتَه عليهم بذلك ووظيفَتَهم اللازمة عليهم في الحروثِ والأنعام، فقال: ﴿وهو الذي أنشأ جناتٍ﴾؛ أي: بساتين فيها أنواع الأشجار المتنوعة والنباتات المختلفة، ﴿معروشاتٍ وغير معروشاتٍ﴾؛ أي: بعض تلك الجنات مجعولٌ لها عريشٌ تنتشر عليه الأشجار ويعاونها في النهوض عن الأرض، وبعضها خالٍ من العروش تنبُتُ على ساقٍ أو تنفرش في الأرض. وفي هذا تنبيهٌ على كَثرة منافعها وخيراتها، وأنه تعالى علَّم العباد كيف يعرشونها وينمونها. ﴿و﴾: أنشأ تعالى ﴿النخل والزرع مختلفاً أُكُلُه﴾؛ أي: كله في محل واحد، ويشرب من ماء واحد، ويفضل الله بعضه على بعض في الأكل، وخص تعالى النخل والزرع على اختلاف أنواعه لكثرة منافعها ولكونها هي القوتُ لأكثر الخلق. ﴿و﴾ أنشأ تعالى ﴿الزيتونَ والرُّمانَ متشابهاً﴾: في شجره، ﴿وغير متشابهٍ﴾: في ثمره وطعمه، كأنه قيل: لأي شيء أنشأ الله هذه الجنات؟ وما عطف عليها؟ فأخبر أنه أنشأها لمنافع العباد، فقال: ﴿كلوا من ثمرِهِ﴾؛ أي: النخل والزرع، ﴿إذا أثمر وآتوا حَقَّه يومَ حصادِهِ﴾؛ أي: أعطوا حقَّ الزرع، وهو الزكاة ذات الأنصباء المقدَّرة في الشرع؛ أمرهم أن يعطوها يوم حصادها، وذلك لأنَّ حصادَ الزرع بمنزلة حَوَلان الحول؛ لأنه الوقت الذي تتشوَّف إليه نفوس الفقراء، ويسهُلُ حينئذٍ إخراجُه على أهل الزرع، ويكون الأمر فيها ظاهراً لمن أخرجها حتى يتميَّز المخرِج ممَّن لا يخرج. وقوله: ﴿ولا تسرفوا﴾؛ يعمُّ النهي عن الإسراف في الأكل، وهو مجاوزة الحدِّ والعادة. وأن يأكلَ صاحبُ الزرعِ أكلاً يضرُّ بالزكاة، والإسراف في إخراج حقِّ الزرع بحيث يخرِجُ فوقَ الواجبِ عليه أو يضرُّ نفسه أو عائلتَه أو غرماءَه؛ فكلُّ هذا من الإسراف الذي نهى الله عنه الذي لا يحبُّه الله بل يبغِضُه، ويمقتُ عليه. وفي هذه الآية دليلٌ على وجوب الزكاة في الثمار، وأنه لا حَوْلَ لها، بل حولُها حصادُها في الزروع وجذاذ النخيل، وأنه لا تتكرَّر فيها الزكاة لو مكثت عند العبد أحوالاً كثيرةً إذا كانت لغير التجارة؛ لأنَّ الله لم يأمر بالإخراج منه إلاَّ وقتَ حصادِهِ، وأنَّه لو أصابها آفةٌ قبل ذلك بغير تفريط من صاحب الزرع والثمر؛ أنه لا يضمنها، وأنه يجوز الأكل من النخل والزرع قبل إخراج الزكاة منه، وأنه لا يُحْسَبُ ذلك من الزكاة، بل يزكِّي المال الذي يبقى بعده، وقد كان النبي - صلى الله عليه وسلم - يَبْعَثُ خارصاً يخرُصُ للناس ثمارَهم ويأمرُهُ أن يَدَعَ لأهلها الثلث أو الربع بحسب ما يعتريها من الأكل وغيره من أهلها وغيرهم."},{"a":"6:142","t":"أي: ﴿و﴾ خلق وأنشأ ﴿من الأنعام حَمُولةً وفَرْشاً﴾؛ أي: بعضها تحملون عليه وتركبونه، وبعضها لا تصلح للحمل والركوب عليها لِصغَرِها كالفُصلان ونحوها، وهي الفرش؛ فهي من جهة الحمل والركوب تنقسم إلى هذين القسمين. وأما من جهة الأكل وأنواع الانتفاع؛ فإنها كلها تؤكل وينتفع بها، ولهذا قال: ﴿كُلوا ممَّا رَزَقَكُمُ الله ولا تتَّبِعوا خطواتِ الشيطانِ﴾؛ أي: طرقه وأعماله التي من جملتها أن تُحَرِّموا بعض ما رزقكم الله. ﴿إنَّه لكم عدوٌّ مبينٌ﴾: فلا يأمركم إلا بما فيه مضرتكم وشقاؤكم الأبدي."}],"147":[{"a":"6:143","t":"وهذه الأنعام التي امتنَّ الله بها على عباده، وجعلها كلَّها حلالاً طيباً، فصَّلها بأنها: ﴿ثمانيةُ أزواجٍ من الضأن اثنين﴾: ذكر وأنثى، ﴿ومن المعز اثنين﴾: كذلك؛ فهذه أربعةٌ، كلُّها داخلةٌ فيما أحلَّ الله، لا فرق بين شيءٍ منها؛ فقلْ لهؤلاء المتكلِّفين الذين يحرمون منها شيئاً دون شيء أو يحرمون بعضها على الإناث دون الذكور ملزماً لهم بعدم وجود الفرق بين ما أباحوا منها وحرموا: ﴿آلذَّكَرَيْنِ﴾: من الضأن والمعز ﴿حرَّمَ﴾: الله فلستم تقولون بذلك وتطردونه، ﴿أم الأُنثيين﴾: حرم الله من الضأن والمعز؛ فليس هذا قولكم؛ لا تحريم الذكور الخُلَّص، ولا الإناث الخُلَّص من الصنفين، بقي إذا كان الرحم مشتملاً على ذكر وأنثى أو على مجهول، فقال: ﴿أم﴾: تحرمون ﴿ما اشتملت عليه أرحام الأنثيين﴾؛ أي: أنثى الضأن وأنثى المعز من غير فرق بين ذكر وأنثى؛ فلستُم تقولون أيضاً بهذا القول؛ فإذا كنتم لا تقولون بأحدِ هذه الأقوال الثلاثة التي حصرت الأقسام الممكنة في ذلك؛ فإلى أي شيء تذهبون؟ ﴿نبِّئوني بعلم إن كنتُم صادقينَ﴾: في قولِكم ودعواكم. ومن المعلوم أنهم لا يمكنهم أن يقولوا قولاً سائغاً في العقل إلا واحداً من هذه الثلاثة، وهم لا يقولون بشيء منها، إنما يقولون: إن بعضَ الأنعام التي يصطَلِحون عليها اصطلاحاتٍ من عند أنفسهم حرامٌ على الإناثِ دون الذكور، أو محرَّمة في وقت من الأوقات، أو نحو ذلك من الأقوال التي يعلم علماً لا شكَّ فيه أنَّ مصدرها من الجهل المركب والعقول المختلة المنحرفة والآراء الفاسدة، وأنَّ الله ما أنزل بما قالوه من سلطان، ولا لهم عليه حجة ولا برهان."},{"a":"6:144","t":"ثم ذكر في الإبل والبقر مثل ذلك، فلما بيَّن بطلان قولهم وفساده؛ قال لهم قولاً لا حيلة لهم في الخروج من تَبِعَتِهِ إلا في اتباع شرع الله، ﴿أم كنتُم شهداءَ إذ وصَّاكم اللهُ﴾؛ أي: لم يبق عليكم إلا دعوى لا سبيل لكم إلى صدقها وصحتها، وهي أن تقولوا: إن الله وصَّانا بذلك وأوحى إلينا كما أوحى إلى رسله، بل أوحى إلينا وحياً مخالفاً لما دعت إليه الرسل ونزلت به الكتب، وهذا افتراءٌ لا يجهلُه أحدٌ، ولهذا قال: ﴿فمن أظلم ممَّنِ افترى على الله كذباً ليضلَّ الناس بغير علم﴾؛ أي: مع كذبه وافترائه على الله قصدُهُ بذلك [إضلال] عباد الله عن سبيل الله بغير بيِّنةٍ منه ولا برهانٍ ولا عقلٍ ولا نقلٍ. ﴿إنَّ الله لا يهدي القوم الظالمين﴾: الذين لا إرادةَ لهم في غير الظلم والجور والافتراء على الله."},{"a":"6:145","t":"لما ذكر تعالى ذمَّ المشركين على ما حرَّموا من الحلال ونسبوه إلى الله وأبطل قولهم؛ أمر تعالى رسولَه أن يبيِّن للناس ما حرَّمه الله عليهم؛ ليعلموا أنَّ ما عدا ذلك حلالٌ؛ مَنْ نسب تحريمه إلى الله فهو كاذب مبطل؛ لأنَّ التحريم لا يكون إلا من عند الله على لسان رسوله، وقد قال لرسوله: ﴿قل لا أجِدُ فيما أوحي إليَّ محرَّماً على طاعم﴾؛ أي: محرَّماً أكله؛ بقطع النظر عن تحريم الانتفاع بغير الأكل وعدمه، ﴿إلاَّ أن يكون ميتةً﴾: والميتة ما مات بغير ذكاةٍ شرعيةٍ؛ فإنَّ ذلك لا يحلُّ؛ كما قال تعالى: ﴿حُرِّمَتْ عليكمُ الميتةُ والدَّمُ ولحمُ الخنزيرِ﴾، ﴿أو دماً مَسْفوحاً﴾: وهو الدمُ الذي يخرج من الذبيحة عند ذكاتها؛ فإنه الدَّمُ الذي يضرُّ احتباسه في البدن؛ فإذا خرج من البدن؛ زال الضرر بأكل اللحم. ومفهوم هذا اللفظ أنَّ الدَّمَ الذي يبقى في اللحم والعروق بعد الذبح أنه حلالٌ طاهرٌ، ﴿أو لحم خنزيرٍ فإنه رجسٌ﴾؛ أي: فإن هذه الأشياء الثلاثة رجسٌ؛ أي: خبث نجس مضرٌّ حرمه الله لطفاً بكم ونزاهة لكم عن مقاربة الخبائث ﴿أو﴾: إلا أن يكونَ ﴿فسقاً أهِلَّ لغيرِ الله به﴾؛ أي: إلا أن تكون الذبيحةُ مذبوحةً لغير الله من الأوثان والآلهة التي يعبُدها المشركون؛ فإن هذا من الفسق الذي هو الخروج عن طاعة الله إلى معصيته. ومع هذا؛ فهذه الأشياء المحرَّمات؛ مَن اضْطُرَّ إليها؛ أي: حملته الحاجة والضرورة إلى أكل شيء منها بأن لم يكن عنده شيء وخاف على نفسه التلف، ﴿غيرَ باغٍ ولا عادٍ﴾؛ أي: ﴿غير باغٍ﴾؛ أي: مريد لأكلها من غير اضطرار، ولا متعدًّ؛ أي: متجاوز للحدِّ؛ بأن يأكل زيادة عن حاجته، ﴿فمَنِ اضطُرَّ غير باغٍ ولا عادٍ فإنَّ ربَّك غفور رحيم﴾؛ أي: فالله قد سامح من كان بهذه الحال. واختلف العلماء رحمهم الله في هذا الحصر المذكور في هذه الآية مع أن ثَمَّ محرماتٌ لم تُذْكَر فيها كالسباع وكل ذي مخلب من الطير ونحو ذلك: فقال بعضهم: إن هذه الآية نازلة قبل تحريم ما زاد على ما ذُكِرَ فيها؛ فلا ينافي هذا الحصر المذكور فيها التحريمَ المتأخِّرَ بعد ذلك؛ لأنه لم يجده فيما أوحي إليه في ذلك الوقت. وقال بعضهم: إن هذه الآية مشتملة على سائرِ المحرَّمات، بعضها صريحاً وبعضها يُؤْخَذ من المعنى وعموم العلة؛ فإنَّ قوله تعالى في تعليل الميتة والدم ولحم الخنزير أو الأخير منها فقط: ﴿فإنَّه رِجْسٌ﴾: وصفٌ شاملٌ لكلِّ محرَّم؛ فإنَّ المحرمات كلَّها رجسٌ وخبثٌ، وهي من الخبائث المستقذرة التي حرَّمها الله على عبادِهِ صيانةً لهم وتكرمةً عن مباشرة الخبيث الرجس، ويؤخذ تفاصيل الرجس المحرَّم من السُّنَّةِ؛ فإنها تفسِّرُ القرآنَ وتبيِّنُ المقصودَ منه. فإذا كان الله تعالى لم يحرِّم من المطاعم إلا ما ذُكِرَ، والتحريمُ لا يكونُ مصدرُهُ إلا شرعَ الله؛ دلَّ ذلك على أن المشركين الذين حَرَّموا ما رزقهم اللهُ مفترون على الله، متقوِّلون عليه ما لم يقلْ. وفي هذه الآية احتمالٌ قويٌّ لولا أن الله ذكر فيها الخنزير، وهو أن السياق في نقض أقوال المشركين المتقدِّمة في تحريمهم لما أحلَّه الله وخوضهم بذلك بحسب ما سوَّلت لهم أنفسهم، وذلك في بهيمة الأنعام خاصة، وليس منها محرم إلاَّ ما ذكر في الآية؛ الميتة منها وما أهِلَّ لغير الله به، وما سوى ذلك؛ فحلال. ولعل مناسبة ذكر الخنزير هنا على هذا الاحتمال أنَّ بعض الجهَّال قد يُدْخِلُهُ في بهيمة الأنعام، وأنه نوعٌ من أنواع الغنم؛ كما قد يتوهَّمه جهلة النصارى وأشباههم، فينمونها كما ينمون المواشي، ويستحلُّونها، ولا يفرِّقون بينها وبين الأنعام."},{"a":"6:146","t":"فهذا المحرَّم على هذه الأمة كلِّها من باب التنزيه لهم والصيانة، وأما ما حُرِّم على أهل الكتاب؛ فبعضه طيب، ولكنه حُرِّم عليهم عقوبةً لهم، ولهذا قال: ﴿وعلى الذين هادوا حَرَّمْنا كلَّ ذي ظُفُرٍ﴾: وذلك كالإبل وما أشبهها. وحرمنا عليهم من البقر والغنم بعضَ أجزائها، وهو شحومها وليس المحرَّم جميع الشحوم منها، بل شحم الإلية والثرب، ولهذا استثنى الشحم الحلال من ذلك، فقال: ﴿إلَّا ما حَمَلَتْ ظهورُهُما أو الحوايا﴾؛ أي: الشحم المخالط للأمعاء، ﴿أو ما اختلط بعظم ذلك﴾ ـ: التحريم على اليهود ـ ﴿جَزَيْناهم بِبَغْيهم﴾؛ أي: ظلمهم وتعدِّيهم في حقوق الله وحقوق عباده، فحرَّم الله عليهم هذه الأشياء عقوبةً لهم ونكالاً. ﴿وإنا لصادقون﴾: في كلِّ ما نقول ونفعل ونحكم به، ومَن أصدقُ من الله حديثاً؟ ومن أحسنُ من الله حكماً لقوم يوقنون؟"}],"148":[{"a":"6:147","t":"أي: فإن كذَّبك هؤلاء المشركون؛ فاسْتَمِرَّ على دعوتهم بالترغيب والترهيب، وأخبرْهم بأن الله ﴿ذو رحمةٍ واسعةٍ﴾؛ أي: عامة شاملة لجميع المخلوقات كلِّها؛ فسارِعوا إلى رحمته بأسبابها التي رأسُها وأُسُّها ومادتها تصديق محمد - صلى الله عليه وسلم - فيما جاء به. ﴿ولا يُرَدُّ بأسُهُ عن القوم المجرمين﴾؛ أي: الذين كَثُرَ إجرامهم وذنوبهم؛ فاحذَروا الجرائم الموصلة لبأس الله التي أعظمها ورأسها تكذيب محمد - صلى الله عليه وسلم -."},{"a":"6:148","t":"هذا إخبار من الله أن المشركين سيحتجُّون على شركهم وتحريمهم ما أحل الله بالقضاء والقدر، ويجعلون مشيئة الله الشاملة لكلِّ شيءٍ من الخير والشرِّ حجةً لهم في دفع اللوم عنهم، وقد قالوا ما أخبر الله أنهم سيقولونه؛ كما قال في الآية الأخرى: ﴿وقال الذين أشْرَكوا لو شاءَ اللهُ ما عَبَدْنا من دونِهِ من شيءٍ ...﴾ الآية فأخبر تعالى أنَّ هذه الحجة لم تزل الأممُ المكذِّبة تدفعُ بها عنهم دعوةَ الرسل ويحتجُّون بها، فلم تُجْدِ فيهم شيئاً ولم تنفعْهم، فلم يزلْ هذا دأبَهم حتى أهلكهم الله وأذاقهم بأسه؛ فلو كانت حجةً صحيحةً؛ لدفعتْ عنهم العقابَ، ولَمَا أحلَّ الله بهم العذاب؛ لأنَّه لا يحلُّ بأسه إلا بمن استحقه فعلم أنها حجة فاسدة وشبهة كاسدة من عدة أوجه: منها: ما ذكر الله من أنها لو كانت صحيحةً لم تحلَّ بهم العقوبة. ومنها: أن الحجة لا بدَّ أن تكون حجةً مستندةً إلى العلم والبرهان، فأما إذا كانت مستندةً إلى مجرَّد الظنِّ والخرص الذي لا يغني من الحقِّ شيئاً؛ فإنها باطلة، ولهذا قال: ﴿قل هل عندَكم من علم فتخرِجوه لنا﴾؛ فلو كان لهم علمٌ ـ وهم خصومٌ ألدَّاء ـ لأخرجوه، فلما لم يخرِجوه؛ عُلِمَ أنه لا علم عندهم. ﴿إن تتَّبعون إلَّا الظَّنَّ وإنْ أنتم إلَّا تَخْرُصُونَ﴾: ومن بنى حُججه على الخرص والظنِّ؛ فهو مبطل خاسر؛ فكيف إذا بناها على البغي والعناد والشرِّ والفساد."},{"a":"6:149","t":"ومنها: أن الحجة لله، البالغة، التي لم تبقِ لأحدٍ عذراً، التي اتَّفقت عليها الأنبياء والمرسلون والكتب الإلهية والآثار النبوية والعقول الصحيحة والفطر المستقيمة والأخلاق القويمة، فعلم بذلك أن كلَّ ما خالف هذه الآية القاطعة باطلٌ؛ لأن نقيض الحقِّ لا يكون إلاَّ باطلاً. ومنها: أن الله تعالى أعطى كلَّ مخلوق قدرةً وإرادةً يتمكَّن بها من فعل ما كُلِّفَ به؛ فلا أوجب الله على أحدٍ ما لا يقدر على فعله، ولا حرَّم على أحدٍ ما لا يتمكَّن على تركه؛ فالاحتجاج بعد هذا بالقضاء والقدر ظلمٌ محضٌ وعنادٌ صرفٌ. ومنها: أن الله تعالى لم يجبر العباد على أفعالهم، بل جعل أفعالهم تبعاً لاختيارهم؛ فإن شاؤوا فعلوا وإن شاؤوا كَفُّوا، وهذا أمر مشاهدٌ لا ينكره إلا مَن كابر وأنكر المحسوسات؛ فإنَّ كلَّ أحد يفرق بين الحركة الاختياريَّة والحركة القسريَّة، وإن كان الجميع داخلاً في مشيئة الله ومندرجاً تحت إرادته. ومنها: أن المحتجِّين على المعاصي بالقضاء والقدر يتناقضون في ذلك؛ فإنهم لا يمكنهم أن يطردوا ذلك؛ بل لو أساء إليهم مسيء بضرب أو أخذ مال أو نحو ذلك، واحتج بالقضاء والقدر لما قبلوا منه هذا الاحتجاج ولغضبوا من ذلك أشد الغضب. فيا عجباً كيف يحتجون به على معاصي الله ومساخطه ولا يرضون من أحد أن يحتج به في مقابلة مساخطهم. ومنها: أن احتجاجهم بالقضاء والقدر ليس مقصوداً، ويعلمون أنَّه ليس بحجةٍ، وإنما المقصود منه دفع الحقِّ ويرون أن الحقَّ بمنزلة الصائل؛ فهم يدفعونه بكلِّ ما يخطر ببالهم من الكلام، [ولو كانوا يعتقدونه خطأً]."},{"a":"6:150","t":"أي: قل لمن حرَّم ما أحل الله ونسب ذلك إلى الله: أحضِروا شهداءكم الذين يشهدون أن الله حرَّم هذا! فإذا قيل لهم هذا الكلام؛ فهم بين أمرين: إما أن لا يحضروا أحداً يشهدُ بهذا، فتكون دعواهم إذاً باطلةً خليةً من الشهود والبرهان. وإما أن يحضِروا أحداً يشهد لهم بذلك، ولا يمكن أن يشهد بهذا إلا كلُّ أفاكٍ أثيم غير مقبول الشهادة، وليس هذا من الأمور التي يصحُّ أن يشهد بها العدولُ، ولهذا قال تعالى ناهياً نبيَّه وأتباعه عن هذه الشهادة: ﴿فإن شهدوا فلا تَشْهَدْ معهم ولا تتَّبِعْ أهواء الذين كذَّبوا بآياتنا والذين لا يؤمنون بالآخرة وهم بربِّهم يعدِلون﴾؛ أي: يسوون به غيره من الأنداد والأوثان؛ فإذا كانوا كافرين باليوم الآخر غير موحدين لله؛ كانت أهويتهم مناسبة لعقيدتهم، وكانت دائرة بين الشرك والتكذيب بالحق، فحريٌّ بهوىً هذا شأنه أن ينهى الله خيارَ خلقه عن اتِّباعه، وعن الشهادة مع أربابه، وعُلِمَ حينئذٍ أن تحريمهم لما أحلَّ اللهُ صادرٌ عن تلك الأهواء المضلَّة."},{"a":"6:151","t":"يقول تعالى لنبيِّه - صلى الله عليه وسلم -: ﴿قل﴾: لهؤلاء الذين حرَّموا ما أحلَّ الله: ﴿تعالَوْا أتلُ ما حرَّمَ ربُّكم عليكم﴾: تحريماً عامًّا شاملاً لكل أحد، محتوياً على سائر المحرَّمات من المآكل والمشارب والأقوال والأفعال، ﴿أن لا تشركوا به شيئاً﴾؛ أي: لا قليلاً ولا كثيراً. وحقيقة الشرك بالله أن يُعْبَدَ المخلوق كما يُعْبَدُ الله أو يعظَّمَ كما يعظَّمُ الله أو يصرفَ له نوعٌ من خصائص الربوبيَّة والإلهيَّة، وإذا تَرَكَ العبدُ الشرك كلَّه؛ صار موحِّداً مخلصاً لله في جميع أحواله؛ فهذا حقُّ الله على عباده: أن يعبُدوه ولا يشرِكوا به شيئاً. ثم بدأ بآكد الحقوق بعد حقه، فقال: ﴿وبالوالدينِ إحساناً﴾: من الأقوال الكريمة الحسنة والأفعال الجميلة المستحسنة؛ فكلُّ قول وفعل يحصُلُ به منفعة للوالدين أو سرور لهما؛ فإنَّ ذلك من الإحسان، وإذا وُجِدَ الإحسان؛ انتفى العقوق، ﴿ولا تقتلوا أولادكم﴾: من ذكور وإناث ﴿من إملاق﴾؛ أي: بسبب الفقر وضيقكم من رزقهم؛ كما كان ذلك موجوداً في الجاهلية القاسية الظالمة، وإذا كانوا منهيِّين عن قتلهم في هذه الحال وهم أولادهم؛ فنهيهم عن قتلهم لغير موجب أو قتل أولاد غيرهم من باب أولى وأحرى. ﴿نحن نرزُقُكم وإياهم﴾؛ أي: قد تكفَّلنا برزق الجميع، فلستم الذين ترزقون أولادكم، بل ولا أنفسكم، فليس عليكم منهم ضيق. ﴿ولا تقرَبوا الفواحش﴾: وهي الذنوب العظام المستفحشة ﴿ما ظهر منها وما بطن﴾؛ أي: لا تقربوا الظاهر منها والخفي أو المتعلق منها بالظاهر والمتعلق بالقلب والباطن، والنهي عن قربان الفواحش أبلغ من النهي عن مجرَّد فعلها؛ فإنه يتناول النهي عن مقدِّماتها ووسائلها الموصلة إليها. ﴿ولا تقتُلوا النفس التي حرَّم الله﴾: وهي النفس المسلمة من ذكر وأنثى صغير وكبير بَرٍّ وفاجر: والكافرة التي قد عُصِمَتْ بالعهد والميثاق، ﴿إلَّا بالحقِّ﴾: كالزاني المحصن والنفس بالنفس والتارك لدينه المفارق للجماعة. ﴿ذلكم﴾: المذكور، ﴿وصَّاكم﴾ [الله] ﴿به لعلَّكم تعقِلون﴾: عن الله وصيَّته ثم تحفظونها ثم تراعونها وتقومونَ بها. ودلَّت الآية على أنه بحسب عقل العبد يكون قيامه بما أمر الله به."}],"149":[{"a":"6:152","t":"﴿ولا تقربوا مال اليتيم﴾: بأكل أو معاوضة على وجه المحاباة لأنفسكم أو أخذ من غير سبب، ﴿إلا بالتي هي أحسنُ﴾؛ أي: إلاَّ بالحال التي تصلُحُ بها أموالهم وينتفعون بها، فدل هذا على أنه لا يجوز قربانها والتصرُّف بها على وجه يضرُّ اليتامى أو على وجه لا مضرَّة فيه ولا مصلحة. ﴿حتى يبلغَ﴾: اليتيم ﴿أشدَّه﴾؛ أي: حتى يبلغ ويرشد ويعرف التصرف؛ فإذا بلغ أشُدَّه؛ أعطي حينئذ ماله، وتصرف فيه على نظره. وفي هذا دلالة على أن اليتيم قبل بلوغ الأشدِّ محجورٌ عليه، وأن وليَّه يتصرَّف في ماله بالأحظ، وأنَّ هذا الحجر ينتهي ببلوغ الأشدِّ. ﴿وأوفوا الكيلَ والميزان بالقسْط﴾؛ أي: بالعدل والوفاء التامِّ؛ فإذا اجتهدتم في ذلك؛ فلا ﴿نُكَلِّفُ نفساً إلَّا وُسْعَها﴾؛ أي بقدر ما تسعه ولا تضيق عنه؛ فمن حرص على الإيفاء في الكيل والوزن، ثم حصل منه تقصيرٌ؛ لم يفرِّط فيه ولم يعلَمْه؛ فإن الله غفور رحيم. وبهذه الآية [ونحوها] استدل الأصوليون بأن الله لا يكلِّف أحداً ما لا يطيق، وعلى أنَّ من اتَّقى الله فيما أمر وفَعَلَ ما يمكِنُهُ من ذلك؛ فلا حرج عليه فيما سوى ذلك. ﴿وإذا قلتُم﴾: قولاً تحكمون به بين الناس، وتفصلون بينهم الخطاب، وتتكلَّمون به على المقالات والأحوال، ﴿فاعدِلوا﴾: في قولكم بمراعاة الصدق فيمن تحبُّون ومَنْ تكرهون والإنصافِ وعدم كتمان ما يلزمُ بيانُهُ؛ فإنَّ الميل على من تكره بالكلام فيه أو في مقالته من الظلم المحرم، بل إذا تكلَّم العالم على مقالات أهل البدع؛ فالواجبُ عليه أن يعطي كلَّ ذي حقٍّ حقَّه وأن يبيِّن ما فيها من الحقِّ والباطل، ويعتبرَ قربَها من الحقِّ وبعدها منه، وذكر الفقهاء أنَّ القاضي يجب عليه العدلُ بين الخصمين في لحظِهِ ولفظِهِ. ﴿وبعهد الله أوفوا﴾: وهذا يشملُ العهد الذي عاهده عليه العباد؛ من القيام بحقوقه والوفاء بها، ومن العهد الذي يقع التعاهد به بين الخلق؛ فالجميع يجب الوفاءُ به، ويحرُم نقضُه والإخلال به. ﴿ذلكم﴾: الأحكام المذكورة، ﴿وصَّاكُم﴾ [الله] ﴿به لعلَّكم تَذَكَّرونَ﴾: ما بيَّنه لكم من الأحكام، وتقومون بوصية الله لكم حقَّ القيام، وتعرفون ما فيها من الحِكم والأحكام."},{"a":"6:153","t":"ولما بيَّن كثيراً من الأوامر الكبار والشرائع المهمَّة؛ أشار إليها وإلى ما هو أعمُّ منها، فقال: ﴿وأنَّ هذا صراطي مستقيماً﴾؛ أي: هذه الأحكام وما أشبهها مما بيَّنه الله في كتابه ووضَّحه لعباده صراطُ الله الموصل إليه وإلى دار كرامته المعتدل السهل المختصر. ﴿فاتَّبِعوه﴾: لتنالوا الفوزَ والفلاح، وتدركوا الآمالَ والأفراح، ﴿ولا تتَّبِعوا السُّبُلَ﴾؛ أي: الطرق المخالفة لهذا الطريق، ﴿فتفرَّقَ بكم عن سبيلِهِ﴾؛ أي: تضلُّكم عنه وتفرِّقكم يميناً وشمالاً؛ فإذا ضللتُم عن الصراط المستقيم؛ فليس ثمَّ إلا طرق توصِلُ إلى الجحيم. ﴿ذلكم وصَّاكم به لعلَّكم تتَّقون﴾: فإنكم إذا قمتُم بما بيَّنه الله لكم علماً وعملاً؛ صرتُم من المتَّقين وعباد الله المفلحين. ووحَّد الصراطَ وأضافه إليه؛ لأنَّه سبيلٌ واحدٌ موصلٌ إليه، والله هو المعين للسالكين على سلوكِهِ."},{"a":"6:154","t":"﴿ثم﴾ في هذا الموضع ليس المراد منها الترتيب الزماني؛ فإن زمن موسى عليه السلام متقدِّم على تلاوة الرسول محمد - صلى الله عليه وسلم - هذا الكتاب، وإنما المراد الترتيب الإخباري،. فأخبر أنه آتى ﴿موسى الكتاب﴾: وهو التوراة ﴿تماماً﴾: لنعمته وكمالاً لإحسانه، ﴿على الذي أحسن﴾: من أمة موسى؛ فإنَّ الله أنعم على المحسِنين منهم بنعم لا تُحصى من جُملتها وتمامها إنزال التوراة عليهم، فتمت عليهم نعمةُ الله ووَجَبَ عليهم القيام بشكرها، ﴿وتفصيلاً لكلِّ شيء﴾: يحتاجون إلى تفصيله من الحلال والحرام والأمر والنهي والعقائد ونحوها، ﴿وهدىً ورحمةً﴾؛ أي: يهديهم إلى الخير ويعرِّفهم بالشرِّ في الأصول والفروع، ﴿ورحمة﴾: يحصُلُ به لهم السعادة والرحمة والخير الكثير، ﴿لعلَّهم﴾: بسبب إنزالنا الكتاب والبيِّنات عليهم ﴿بلقاءِ ربِّهم يؤمنونَ﴾؛ فإنه اشتمل من الأدلَّة القاطعة على البعث والجزاء بالأعمال، [ما] يوجب لهم الإيمان بلقاء ربِّهم والاستعداد له."},{"a":"6:155","t":"﴿وهذا﴾: القرآن العظيم والذِّكْر الحكيم، ﴿كتابٌ أنزلْناه مبارَكٌ﴾؛ أي: فيه الخير الكثير والعلم الغزير، وهو الذي تستمدُّ منه سائر العلوم وتستخرجُ منه البركاتُ؛ فما من خيرٍ إلاَّ وقد دعا إليه ورغَّب فيه وذكر الحِكَمَ والمصالح التي تحثُّ عليه، وما من شرٍّ إلا وقد نهى عنه وحذَّر منه وذكر الأسباب المنفِّرة عن فعله وعواقبها الوخيمة. ﴿فاتَّبعوه﴾: فيما يأمر به وينهى، وابنوا أصولَ دينِكُم وفروعه عليه. ﴿واتَّقوا﴾: الله تعالى أن تخالفوا له أمراً ﴿لعلَّكم﴾: إن اتَّبعتموه ﴿تُرْحَمونَ﴾: فأكبر سبب لنيل رحمة الله اتِّباعُ هذا الكتاب علماً وعملاً."},{"a":"6:156","t":"﴿أن تقولوا إنَّما أنزِلَ الكتاب على طائفتين من قبلنا وإن كنَّا عن دراستِهِم لغافلينَ﴾؛ أي: أنزلنا إليكم هذا الكتاب المبارك قطعاً لحجَّتكم وخشيةَ أن تقولوا إنما أنزل الكتابُ على طائفتين من قبلنا؛ أي اليهود والنصارى. ﴿وإن كنَّا عن دراستِهِم لغافلينَ﴾؛ أي: تقولون: لم تنزِلْ علينا كتاباً، والكتب التي أنزلتها على الطائفتين ليس لنا بها علمٌ ولا معرفةٌ، فأنزلنا إليكم كتاباً لم ينزل من السماء كتابٌ أجمع ولا أوضح ولا أبين منه."},{"a":"6:157","t":"﴿أو تقولوا لو أنَّا أنزِلَ علينا الكتابُ لَكُنَّا أهدى منهم﴾؛ أي: إما أن تعتذروا بعدم وصول أصل الهداية إليكم، وإما أن تعتذِروا بعدم كمالها وتمامها، فحصل لكم بكتابكم أصل الهداية وكمالها، ولهذا قال: ﴿فقد جاءكم بينة من ربكم﴾: وهذا اسم جنسٍ يدخل فيه كل ما يبين الحق، ﴿وهدىً﴾: من الضلالة، ﴿ورحمةٌ﴾؛ أي: سعادة لكم في دينكم ودنياكم؛ فهذا يوجِبُ لكم الانقياد لأحكامه والإيمان بأخباره وأنَّ مَنْ لم يرفعْ به رأساً وكذَّب به؛ فإنه أظلم الظالمين. ولهذا قال: ﴿فمَنْ أظلمُ ممَّن كذَّبَ بآيات الله وصَدَفَ عنها﴾؛ أي: أعرض ونأى بجانبه، ﴿سنجزي الذين يصدِفونَ عن آياتنا سوءَ العذاب﴾؛ [أي: العذاب] الذي يَسوءُ صاحبه ويشقُّ عليه، ﴿بما كانوا يصدِفونَ﴾: لأنفسهم ولغيرهم جزاءً لهم على عملهم السيئ، وما ربُّك بظلام للعبيد. وفي هذه الآيات دليلٌ على أنَّ علم القرآن أجلُّ العلوم وأبركُها وأوسعُها، وأنه به تحصُل الهداية إلى الصراط المستقيم هدايةً تامةً لا يحتاج معها إلى تخرُّص المتكلمين ولا إلى أفكار المتفلسفين ولا لغير ذلك من علوم الأوَّلين والآخرين. وأنَّ المعروف أنَّه لم ينزل جنسُ الكتاب إلا على الطائفتين؛ من اليهود والنصارى؛ فهم أهل الكتاب عند الإطلاق، لا يدخل فيهم سائر الطوائف؛ لا المجوس ولا غيرهم. وفيه ما كان عليه الجاهلية قبل نزول القرآن من الجهل العظيم وعدم العلم بما عند أهل الكتاب الذين عندهم، مادةُ العلم، وغفلتُهم عن دراسة كتبهم."}],"150":[{"a":"6:158","t":"يقول تعالى: هل ينظر هؤلاء الذين استمر ظلمُهُم وعنادهم، ﴿إلَّا أن يأتِيَهم﴾؛ مقدمات العذاب ومقدمات الآخرة؛ بأن تأتيهم ﴿الملائكة﴾ لقبض أرواحهم؛ فإنهم إذا وصلوا إلى تلك الحال؛ لم ينفعهم الإيمان ولا صالح الأعمال، ﴿أو يأتي ربُّك﴾: لفصل القضاء بين العباد ومجازاة المحسنين والمسيئين ﴿أو يأتي بعض آيات ربك﴾: الدالَّة على قرب الساعة. ﴿يوم يأتي بعضُ آيات ربِّك﴾: الخارقة للعادة، التي يعلم بها أن الساعة قد دنت وأن القيامة قد اقتربت. ﴿لا ينفعُ نفساً إيمانُها لم تكنْ آمنتْ من قبلُ أو كسبتْ في إيمانها خيراً﴾؛ أي: إذا وجد بعض آيات الله؛ لم ينفع الكافرَ إيمانُه إنْ آمنَ ولا المؤمنَ المقصرَ أن يزدادَ خيرُهُ بعد ذلك، بل ينفعه ما كان معه من الإيمان قبل ذلك، وما كان له من الخير الموجود قبل أن يأتي بعضُ الآيات. والحكمة في هذا ظاهرة؛ فإنه إنَّما كان الإيمان ينفع إذا كان إيماناً بالغيب وكان اختياراً من العبد. فأما إذا وجدت الآيات؛ صار الأمر شهادةً، ولم يبق للإيمان فائدةٌ؛ لأنه يشبه الإيمان الضروري؛ كإيمان الغريق والحريق ونحوهما ممَّن إذا رأى الموت أقلع عمَّا هو فيه؛ كما قال تعالى: ﴿فلمَّا رأوا بأسنا قالوا آمنَّا بالله وحدَه وكَفَرْنا بما كنا به مشركينَ. فلم يَكُ ينفعُهم إيمانُهم لما رأوا بأسنا سُنَّةَ اللَّهِ التي قد خلتْ في عبادِهِ﴾ وقد تكاثرت الأحاديث الصحيحة عن النبي - صلى الله عليه وسلم - أنَّ المرادَ ببعض آيات الله طلوعُ الشمس من مغربها، وأنَّ الناس إذا رأوْها؛ آمنوا، فلم ينفعْهم إيمانُهم، ويغلقُ حينئذٍ باب التوبة. ولمَّا كان هذا وعيداً للمكذِّبين بالرسول - صلى الله عليه وسلم - مُنْتَظَراً وهم ينتظرون بالنبي - صلى الله عليه وسلم - وأتباعه قوارعَ الدهر ومصائب الأمور؛ قال: ﴿قل انتَظِروا إنَّا منتَظِرون﴾: فستعلمون أيُّنا أحقُّ بالأمن. وفي هذه الآية دليل لمذهب أهل السنة والجماعة في إثبات الأفعال الاختيارية لله تعالى؛ كالاستواء والنزول والإتيان لله تبارك وتعالى من غير تشبيه له بصفات المخلوقين، وفي الكتاب والسنة من هذا شيءٌ كثير. وفيه أن من جملة أشراط الساعة طلوعَ الشمس من مغربها. وأنَّ الله تعالى حكيمٌ قد جرت عادته وسنَّته أن الإيمان إنما ينفع إذا كان اختياريًّا لا اضطراريًّا كما تقدَّم، وأن الإنسان يكتسب الخير بإيمانه؛ فالطاعة والبرُّ والتقوى إنما تنفع وتنمو إذا كان مع العبد إيمانٌ، فإذا خلا القلب من الإيمان؛ لم ينفعْه شيءٌ من ذلك."},{"a":"6:159","t":"يتوعَّد تعالى الذين فرَّقوا دينهم؛ أي: شتَّتوه وتفرَّقوا فيه، وكلٌّ أخذ لنفسه نصيباً من الأسماء التي لا تفيد الإنسان في دينه شيئاً؛ كاليهودية والنصرانية والمجوسية، أو لا يكمل بها إيمانه؛ بأن يأخذ من الشريعة شيئاً ويجعله دينه ويدع مثله أو ما هو أولى منه؛ كما هو حال أهل الفرقة من أهل البدع والضلال والمفرقين للأمة. ودلَّت الآية الكريمة أن الدين يأمر بالاجتماع والائتلاف وينهى عن التفرق والاختلاف في أهل الدين وفي سائر مسائله الأصوليَّة والفروعيَّة، وأمره أن يتبرأ ممَّن فرَّقوا دينهم، فقال: ﴿لستَ منهم في شيءٍ﴾؛ أي: لست منهم وليسوا منك؛ لأنهم خالفوك وعاندوك. ﴿إنَّما أمرُهم إلى الله﴾: يردُّون إليه فيجازيهم بأعمالهم، ﴿ثم ينبِّئهم بما كانوا يفعلونَ﴾."},{"a":"6:160","t":"ثم ذكر صفة الجزاء فقال: ﴿من جاء بالحسنة﴾: القوليَّة والفعليَّة، الظاهرة والباطنة، المتعلقة بحقِّ الله أو حقِّ خلقه، ﴿فله عشرُ أمثالها﴾: هذا أقل ما يكون من التضعيف، ﴿ومن جاء بالسيئةِ فلا يُجْزى إلَّا مثلَها﴾: وهذا من تمام عدله تعالى وإحسانه، وأنه لا يظلم مثقال ذرَّة، ولهذا قال: ﴿وهم لا يُظْلَمون﴾."},{"a":"6:161","t":"يأمر تعالى نبيَّه - صلى الله عليه وسلم - أنْ يقول ويعلن بما هو عليه من الهداية إلى الصراط المستقيم، الدِّين المعتدل، المتضمِّن للعقائد النافعة والأعمال الصالحة والأمر بكل حسن والنهي عن كل قبيح، الذي عليه الأنبياء والمرسلون، خصوصاً إمام الحنفاء ووالد من بُعِثَ من بعد موته من الأنبياء خليل الرحمن إبراهيم عليه الصلاة والسلام، وهو الدين الحنيف، المائل عن كل دين غير مستقيم من أديان أهل الانحراف كاليهود والنصارى والمشركين. وهذا عمومٌ."},{"a":"6:162","t":"ثم خصَّص من ذلك أشرف العبادات، فقال: ﴿قلْ إنَّ صلاتي ونسكي﴾؛ أي: ذبحي، وذلك لشرف هاتين العبادتين وفضلهما ودلالتهما على محبَّة الله تعالى وإخلاص الدين له والتقرُّب إليه بالقلب واللسان والجوارح وبالذبح الذي هو بذل ما تحبُّه النفس من المال لما هو أحبُّ إليها وهو الله تعالى، ومن أخلص في صلاته ونُسُكه؛ استلزم ذلك إخلاصه لله في سائر أعماله. وقوله: ﴿ومحيايَ ومماتي﴾؛ أي: ما آتيه في حياتي وما يجريه الله عليَّ وما يقدِّر عليَّ في مماتي؛ الجميعُ ﴿للهِ ربِّ العالمين﴾."},{"a":"6:163","t":"﴿لا شريكَ له﴾: في العبادة؛ كما أنه ليس له شريكٌ في الملك والتدبير، وليس هذا الإخلاص لله ابتداعاً مني وبدعاً أتيته من تلقاء نفسي، بل ﴿بذلك أمِرْتُ﴾: أمراً حتماً لا أخرج من التبعة إلا بامتثاله، ﴿وأنا أول المسلمين﴾: من هذه الأمة."},{"a":"6:164","t":"﴿قل أغير الله﴾: من المخلوقين ﴿أبغي ربًّا﴾؛ أي: يحسن ذلك، ويليق بي أن أتَّخذ غيره مربياً ومدبراً، والله ربُّ كلِّ شيءٍ؛ فالخلق كلهم داخلون تحت ربوبيته، منقادون لأمره، فتعيَّن عليَّ وعلى غيري أن يَتَّخِذَ اللهَ رَبًّا ويرضى به وأن لا يتعلَّق بأحد من المربوبين الفقراء العاجزين. ثم رغَّب ورهَّب بذلك الجزاء، فقال: ﴿ولا تكسِبُ كلُّ نفس﴾: ـ من خير وشر.- ﴿إلَّا عليها﴾؛ كما قال تعالى: ﴿من عمل صالحاً فلنفسِهِ ومن أساءَ فعَلَيْها﴾، ﴿ولا تزِرُ وازرةٌ وزرَ أخرى﴾: بل كلٌّ عليه وزرُ نفسِهِ، وإن كان أحد قد تسبَّب في ضلال غيره ووزره؛ فإن عليه وزر التسبب من غير أن ينقص من وِزْرِ المباشر شيء، ﴿ثم إلى ربِّكم مرجِعُكم﴾: يوم القيامة، ﴿فينبِّئُكم بما كنتُم فيه تختلفونَ﴾: من خير وشرٍّ، ويجازيكم على ذلك أوفى الجزاء."},{"a":"6:165","t":"﴿وهو الذي جعلكم خلائفَ الأرض﴾؛ أي: يخلُفُ بعضُكم بعضاً، واستخلفكم الله في الأرض، وسخَّر لكم جميع ما فيها، وابتلاكم لينظر كيف تعملونَ، ﴿ورَفَعَ بعضَكم فوق بعضٍ درجات﴾: في القوة والعافية والرزق والخَلْق والخُلُق؛ ﴿ليبلُوَكُم فيما آتاكم﴾: فتفاوتت أعمالُكم. ﴿إنَّ ربَّك سريعُ العقاب﴾: لمن عصاه وكذَّب بآياتِهِ، ﴿وإنَّه لغفورٌ رحيمٌ﴾: لمن آمن به وعمل صالحاً، وتاب من الموبقات. آخر تفسير سورة الأنعام. فلله الحمد والثناء. وصلى الله على محمد وعلى آله وصحبه وسلم تسليماً كثيراً إلى يوم الدين. * * *"}],"151":[{"a":"7:1","t":"يقول تعالى لرسوله محمد - صلى الله عليه وسلم - مبيناً له عظمة القران: ﴿كتابٌ أنْزِلَ إليك﴾؛ أي: كتابٌ جليلٌ حوى كلَّ ما يحتاج إليه العباد وجميع المطالب الإلهيَّة والمقاصد الشرعيَّة محكماً مفصلاً. فلا يكنْ في صدرِكَ منه ﴿حَرَجٌ﴾؛ أي: ضيقٌ وشكٌّ واشتباهٌ، بل لتعلمْ أنه تنزيلٌ من حكيم حميد، لا يأتيه الباطل من بين يديه ولا من خلفه ، فلينشرِحْ له صدرُك، ولتطمئنَّ به نفسُك، ولْتصدعْ بأوامره ونواهيه، ولا تخش لائماً ومعارضاً؛ ﴿لتنذرَ به﴾: الخلق وتَعِظهم وتذكِّرهم فتقوم الحجة على المعاندين، ﴿و﴾ ليكنْ ﴿ذكرى للمؤمنينَ﴾؛ كما قال تعالى: ﴿وذكِّرْ فإنَّ الذِّكرى تنفعُ المؤمنينَ﴾: يتذكَّرون به الصراط المستقيم، وأعماله الظاهرة والباطنة، وما يحول بين العبد وبين سلوكه."},{"a":"7:2","t":"يقول تعالى لرسوله محمد - صلى الله عليه وسلم - مبيناً له عظمة القران: ﴿كتابٌ أنْزِلَ إليك﴾؛ أي: كتابٌ جليلٌ حوى كلَّ ما يحتاج إليه العباد وجميع المطالب الإلهيَّة والمقاصد الشرعيَّة محكماً مفصلاً. فلا يكنْ في صدرِكَ منه ﴿حَرَجٌ﴾؛ أي: ضيقٌ وشكٌّ واشتباهٌ، بل لتعلمْ أنه تنزيلٌ من حكيم حميد، لا يأتيه الباطل من بين يديه ولا من خلفه ، فلينشرِحْ له صدرُك، ولتطمئنَّ به نفسُك، ولْتصدعْ بأوامره ونواهيه، ولا تخش لائماً ومعارضاً؛ ﴿لتنذرَ به﴾: الخلق وتَعِظهم وتذكِّرهم فتقوم الحجة على المعاندين، ﴿و﴾ ليكنْ ﴿ذكرى للمؤمنينَ﴾؛ كما قال تعالى: ﴿وذكِّرْ فإنَّ الذِّكرى تنفعُ المؤمنينَ﴾: يتذكَّرون به الصراط المستقيم، وأعماله الظاهرة والباطنة، وما يحول بين العبد وبين سلوكه."},{"a":"7:3","t":"ثم خاطب الله العباد، ولفتهم إلى الكتاب، فقال: ﴿اتَّبِعوا ما أنزِلَ إليكم من ربِّكم﴾؛ أي: الكتاب الذي أريد إنزاله لأجلكم، وهو ﴿من ربِّكم﴾، الذي يريد أن يُتِمَّ تربيتَه لكم، فأنزل عليكم هذا الكتاب الذي إن اتبعتموه كملتْ تربيتُكم وتمَّتْ عليكم النعمةُ وهُديتم لأحسن الأعمال والأخلاق ومعاليها، ﴿ولا تتَّبِعوا من دونِهِ أولياءَ﴾؛ أي: تتولَّونهم، وتتَّبعون أهواءهم، وتتركون لأجلها الحقَّ، ﴿قليلاً ما تَذَكَّرونَ﴾: فلو تذكَّرتم وعرفتم المصلحة؛ لما آثرتُم الضارَّ على النافع والعدوَّ على الولي."},{"a":"7:4","t":"ثم حذرهم عقوباته للأمم الذين كذبوا ما جاءتهم به رسلهم فلا يشابهوهم، فقال: ﴿وكم من قريةٍ أهلكْناها فجاءها بأسُنا﴾؛ أي: عذابُنا الشديد، ﴿بياتاً أو هم قائلونَ﴾؛ أي: في حين غفلتهم وعلى غِرَّتهم غافلون، لم يخطر الهلاكُ على قلوبهم، فحين جاءهم العذاب؛ لم يدفعوه عن أنفسهم، ولا أغنت عنهم آلهتهم التي كانوا يرجونهم، ولا أنكروا ما كانوا يفعلونه من الظلم والمعاصي."},{"a":"7:5","t":"﴿فما كان دَعْواهم إذ جاءَهُم بأسُنا إلَّا أن قالوا إنا كنَّا ظالمينَ﴾؛ كما قال تعالى: ﴿وكم قَصَمْنا من قريةٍ كانت ظالمةً وأنشأنا بعدَها قوماً آخرينَ. فلما أحسُّوا بأسَنا إذا هُم منها يركُضونَ. لا تركُضوا وارجِعوا إلى ما أُتْرِفْتُم فيه ومساكِنِكُم لعلَّكم تُسْألونَ. قالوا يا وَيْلنا إنَّا كنَّا ظالمينَ. فما زالتْ تلك دعواهُم حتَّى جَعَلْناهم حصيداً خامدينَ﴾."},{"a":"7:6","t":"وقوله: ﴿فَلَنَسْأَلَنَّ الذين أرسِل إليهم﴾؛ أي: لنسألن الأمم الذين أرسل الله إليهم المرسلين عما أجابوا [به] رسلهم، ﴿وَيَوْمَ يُناديهم فَيَقولُ ماذا أجبتُمُ المرسلينَ ...﴾ الآيات، ﴿وَلَنَسْأَلَنَّ المرسلينَ﴾: عن تبليغهم لرسالات ربِّهم وعما أجابتهم به أممهم."},{"a":"7:7","t":"﴿فَلَنَقُصَّنَّ عليهم﴾؛ أي: على الخلق كلهم ما عملوا، ﴿بعلم﴾: منه تعالى لأعمالهم، ﴿وما كُنا غائبينَ﴾: في وقت من الأوقات؛ كما قال تعالى: ﴿أحصاه الله وَنَسُوه﴾، وقال تعالى: ﴿ولقد خَلَقْنا فوقَكم سبعَ طرائقَ وما كُنَّا عن الخلق غافلين﴾. ثم ذكر الجزاء على الأعمال، فقال:"},{"a":"7:8","t":"أي: والوزن يوم القيامة يكون بالعدل والقسط الذي لا جَوْر فيه ولا ظلم بوجه. ﴿فمن ثَقُلَتْ موازينُه﴾: بأن رَجَحَتْ كفةُ حسناته على سيئاته، ﴿فأولئك هم المفلحونَ﴾؛ أي: الناجون من المكروه، المدركون للمحبوب، الذين حصل لهم الربح العظيم والسعادة الدائمة."},{"a":"7:9","t":"﴿ومن خفَّتْ موازينُه﴾: بأن رجحتْ سيئاتُه وصار الحكم لها، ﴿فأولئك الذين خسروا أنفسهم﴾: إذ فاتهم النعيمُ المقيمُ وحصل لهم العذابُ الأليم، ﴿بما كانوا بآياتِنا يَظْلِمونَ﴾: فلم ينقادوا لها كما يجبُ عليهم ذلك."},{"a":"7:10","t":"يقول تعالى ممتنًّا على عباده بذكر المسكن والمعيشة: ﴿ولقد مكَّنَّاكم في الأرض﴾؛ أي: هيأناها لكم بحيث تتمكَّنون من البناء عليها وحرثها ووجوه الانتفاع بها، ﴿وجَعَلْنا لكم فيها معايشَ﴾: مما يخرج من الأشجار والنبات ومعادن الأرض وأنواع الصنائع والتجارات؛ فإنه هو الذي هيَّأها وسخَّر أسبابها، ﴿قليلاً ما تشكُرون﴾: الله الذي أنعم عليكم بأصناف النعم، وصَرَفَ عنكم النقم."},{"a":"7:11","t":"يقول تعالى مخاطباً لبني آدم: ﴿ولقد خَلَقْناكم﴾: بخلق أصلِكم ومادَّتكم التي منها خرجتُم؛ أبيكم آدم عليه السلام، ﴿ثم صوَّرْناكم﴾: في أحسن صورة وأحسن تقويم، وعلَّمه [اللهُ] تعالى ما به تكمُلُ صورتُه الباطنةُ؛ أسماءَ كل شيء، ثم أمر الملائكة الكرام أن يسجُدوا لآدم إكراماً واحتراماً وإظهاراً لفضلِهِ، فامتثلوا أمر ربهم، ﴿فَسَجدوا﴾ كلُّهم أجمعون ﴿إلا إبليس﴾: أبى أن يسجدَ له تكبُّراً عليه وإعجاباً بنفسه."}],"152":[{"a":"7:12","t":"فوبَّخه الله على ذلك، وقال ما منعك أن تسجد لما خلقت بيديَّ أي شرفته وفضلته بهذه الفضيلة التي لم تكن لغيرِهِ، فعصيتَ أمري وتهاونت بي. ﴿قال﴾ إبليسُ معارضاً لربِّه: ﴿أنا خيرٌ منه﴾، ثم برهن على هذه الدعوى الباطلة بقوله له: ﴿خلَقْتَني من نارٍ وخلقتَهُ من طينٍ﴾: وموجب هذا أن المخلوق من نار أفضل من المخلوق من طين لعلوِّ النار على الطين وصعودها. وهذا القياس من أفسد الأقيسة؛ فإنه باطلٌ من عدة أوجه: منها: أنه في مقابلة أمر الله له بالسجود، والقياس إذا عارض النصَّ فإنه قياسٌ باطل؛ لأنَّ المقصود بالقياس أن يكون الحكم الذي لم يأت فيه نصٌّ يقارب الأمور المنصوص عليها ويكون تابعاً لها، فأما قياس يعارضها ويلزم من اعتباره إلغاء النصوص؛ فهذا القياس من أشنع الأقيسة. ومنها: أنَّ قولَه: ﴿أنا خيرٌ منه﴾؛ بمجرَّدها كافية لنقص إبليس الخبيث؛ فإنَّه برهن على نقصه بإعجابه بنفسه وتكبُّره والقول على الله بلا علم، وأيُّ نقص أعظم من هذا؟! ومنها: أنه كَذَبَ في تفضيل مادة النار على مادة الطين والتراب؛ فإنَّ مادة الطين فيها الخشوعُ والسكونُ والرزانةُ، ومنها تظهر بركات الأرض من الأشجار وأنواع النبات على اختلاف أجناسه وأنواعه، وأما النار؛ ففيها الخفة والطيش والإحراق."},{"a":"7:13","t":"ولهذا؛ لما جرى من إبليس ما جرى؛ انحطَّ من مرتبته العالية إلى أسفل السافلين، فقال الله له: اهبطْ ﴿منها﴾ أي: من الجنة، ﴿فما يكونُ لك أن تتكبَّرَ فيها﴾: لأنها دار الطيبين الطاهرين، فلا تَليقُ بأخبث خَلْق الله وأشرهم، ﴿فاخرُجْ إنَّك من الصاغرين﴾؛ أي: المهانين الأذلين؛ جزاء على كبره وعجبه بالإهانة والذل."},{"a":"7:14","t":"فلما أعلن عدوُّ الله بعداوة الله وعداوة آدم وذريَّته؛ سأل الله النَّظِرة والإمهال إلى يوم البعث؛ ليتمكَّنَ من إغواءِ ما يقدِرُ عليه من بني آدم، ولما كانت حكمة الله مقتضيةً لابتلاء العباد واختبارهم ليتبيَّنَ الصادق من الكاذب ومَن يطيعه ومن يطيع عدوَّه؛ أجابه لما سأل، فقال: ﴿إنَّك من المُنظَرينَ﴾."},{"a":"7:15","t":"فلما أعلن عدوُّ الله بعداوة الله وعداوة آدم وذريَّته؛ سأل الله النَّظِرة والإمهال إلى يوم البعث؛ ليتمكَّنَ من إغواءِ ما يقدِرُ عليه من بني آدم، ولما كانت حكمة الله مقتضيةً لابتلاء العباد واختبارهم ليتبيَّنَ الصادق من الكاذب ومَن يطيعه ومن يطيع عدوَّه؛ أجابه لما سأل، فقال: ﴿إنَّك من المُنظَرينَ﴾."},{"a":"7:16","t":"أي: قال إبليس لَمَّا أُبْلِسَ وأَيِسَ من رحمة الله: ﴿فبما أغْوَيْتَني لأقعدنَّ لهم﴾؛ أي: للخلق ﴿صراطك المستقيم﴾؛ أي: لألزمنَّ الصِّراط، ولأسعى غاية جهدي على صدِّ الناس عنه وعدم سلوكهم إياه."},{"a":"7:17","t":"﴿ثمَّ لآتِيَنَّهُم مِنْ بينِ أيديهم ومن خلفِهم وعن أيمانِهِم وعن شمائِلِهم﴾؛ أي: من جميع الجهات والجوانب، ومن كل طريق يتمكن فيه من إدراك بعض مقصوده فيهم، ولما علم الخبيثُ أنهم ضعفاء قد تغلب الغفلةُ على كثير منهم، وكان جازماً ببذل مجهوده على إغوائهم؛ ظنَّ ـ وصدق ظنُّه ـ فقال: ﴿ولا تجدُ أكثرَهُم شاكرينَ﴾: فإنَّ القيام بالشكر من سلوك الصراط المستقيم، وهو يريدُ صدَّهم عنه وعدم قيامهم به؛ قال تعالى: ﴿إنَّما يَدْعو حِزْبَه ليكونوا من أصحابِ السَّعير﴾، وإنما نَبَّهَنا الله على ما قال، وعزم على فعله، لنأخذَ منه حِذْرَنا، ونستعدَّ لعدوِّنا، ونحترزَ منه بعلْمِنا بالطُرُق التي يأتي منها ومداخله التي ينفذ منها؛ فله تعالى علينا بذلك أكمل نعمة."},{"a":"7:18","t":"أي: قال الله لإبليس لما قال ما قال: ﴿اخرُجْ منها﴾: خروج صَغار واحتقار، لا خروج إكرام، بل ﴿مذؤوماً﴾؛ أي: مذموماً، ﴿مدحوراً﴾: مبعداً عن الله وعن رحمته وعن كل خير. ﴿لأملأنَّ جهنَّم﴾: منك وممَّن تَبِعَكَ منهم ﴿أجمعين﴾: وهذا قَسَمٌ من الله تعالى أن النار دار العصاة، لا بد أن يملأها من إبليس وأتباعه من الجن والإنس. ثم حذَّر آدَمَ شرَّه وفتنته فقال:"},{"a":"7:19","t":"أي: أمر الله تعالى آدم وزوجته حواء التي أنعم الله بها عليه ليسكن إليها أن يأكلا من الجنة حيث شاءا ويتمتعا فيها بما أرادا؛ إلا أنه عيَّن لهما شجرةً ونهاهما عن أكلها، والله أعلم ما هي، وليس في تعيينها فائدةٌ لنا، وحرَّم عليهما أكلها؛ بدليل قوله: ﴿فتكونا من الظالمين﴾."},{"a":"7:20","t":"فلم يزالا ممتثلينِ لأمر الله حتى تغلغل إليهما عدوُّهما إبليس بمكره، فوسوس لهما وسوسةً خدَعَهما بها وموَّه عليهما وقال: ﴿ما نهكُما ربُّكما عن هذه الشجرة إلَّا أن تكونا مَلَكَيْن﴾؛ أي: من جنس الملائكة، ﴿أو تكونا مِنَ الخالدينَ﴾: كما قال في الآية الأخرى: ﴿هل أدُلُّكَ على شجرةِ الخُلْدِ وملكٍ لا يَبْلى﴾."},{"a":"7:21","t":"ومع قوله هذا أقسم لهما بالله: ﴿إني لكما لمن الناصحين﴾؛ أي: من جملة الناصحين؛ حيث قلت لكما ما قلتُ."},{"a":"7:22","t":"فاغترَّا بذلك، وغلبت الشهوة في تلك الحال على العقل، ﴿فدلاَّهما﴾؛ أي: أنزلهما عن رتبتهما العالية التي هي البعدُ عن الذنوب والمعاصي إلى التلوُّث بأوضارِها، فأقدما على أكلها، ﴿فلمَّا ذاقا الشجرةَ بَدَتْ لهما سوآتُهما﴾؛ أي: ظهرت عورة كل منهما بعدما كانت مستورةً، فصار للعري الباطن من التقوى في هذه الحال أثرٌ في اللباس الظاهر حتى انخلع، فظهرت عوراتُهما، ولما ظهرتْ عوراتُهما؛ خَجِلا وجَعَلا يخصِفان على عوراتهما من أوراق شجر الجنة ليستترا بذلك، ﴿وناداهما ربهما﴾: وهما بتلك الحال ـ موبِّخاً ومعاتباً ـ: ﴿ألم أنْهَكُما عن تلكما الشجرةِ وأقل لكما إنَّ الشيطان لكما عدوٌّ مبينٌ﴾: فَلِمَ اقترفتُما المنهيَّ وأطعتما عدوَّكما؟!"}],"153":[{"a":"7:23","t":"فحينئذٍ مَنَّ الله عليهما بالتوبة وقَبولها، فاعترفا بالذنب، وسألا من الله مغفرتَه، فقالا: ﴿ربَّنا ظَلمْنا أنفُسَنا وإن لم تغفرْ لنا وترحَمْنا لَنَكونَنَّ من الخاسرينَ﴾؛ أي: قد فعلنا الذنب الذي نبَّهتنا عنه وأضررنا بأنفسنا باقتراف الذنب، وقد فعلنا سببَ الخسار إن لم تغفرْ لنا بمحو أثر الذنب وعقوبته وترحَمْنا بقَبول التوبة والمعافاة من أمثال هذه الخطايا، فغفر الله لهما ذلك، وعصى آدمُ ربَّه فغوى. ثم اجتباه ربُّه فتاب عليه وهَدَى. هذا وإبليس مستمرٌّ على طغيانِهِ، غير مقلع من عصيانه؛ فمن أشبه آدم بالاعتراف وسؤال المغفرة والندم والإقلاع إذا صدرت منه الذُّنوب؛ اجتباهُ ربُّه وهداه، ومن أشبهَ إبليس إذا صدر منه الذنبُ لا يزالُ يزدادُ من المعاصي؛ فإنه لا يزداد من الله إلا بعداً."},{"a":"7:24","t":"أي: لما أهبط الله آدم وزوجته وذريتهما إلى الأرض؛ أخبرهما بحال إقامتهم فيها، وأنه جعل لهم فيها حياةً، يتلوها الموتُ مشحونةً بالامتحان والابتلاء، وأنهم لا يزالون فيها، يرسِلُ إليهم رسلَه، ويُنْزِلُ عليهم كتبه، حتى يأتِيَهُمُ الموت فيدفَنون فيها، ثم إذا استكملوا بَعَثَهم اللهُ، وأخرجهم منها إلى الدارِ التي هي الدار حقيقة، التي هي دار المقامة."},{"a":"7:25","t":"أي: لما أهبط الله آدم وزوجته وذريتهما إلى الأرض؛ أخبرهما بحال إقامتهم فيها، وأنه جعل لهم فيها حياةً، يتلوها الموتُ مشحونةً بالامتحان والابتلاء، وأنهم لا يزالون فيها، يرسِلُ إليهم رسلَه، ويُنْزِلُ عليهم كتبه، حتى يأتِيَهُمُ الموت فيدفَنون فيها، ثم إذا استكملوا بَعَثَهم اللهُ، وأخرجهم منها إلى الدارِ التي هي الدار حقيقة، التي هي دار المقامة."},{"a":"7:26","t":"ثم امتنَّ عليهم بما يسَّر لهم من اللباس الضروري واللباس الذي المقصود منه الجمال، وهكذا سائر الأشياء كالطعام والشراب والمراكب والمناكح، ونحوها قد يسر الله للعباد ضروريَّها ومكمِّل ذلك، وبيَّن لهم أن هذا ليس مقصوداً بالذات، وإنَّما أنزله الله ليكون معونةً لهم على عبادته وطاعته، ولهذا قال: ﴿ولباسُ التَّقوى ذلك خيرٌ﴾: من اللباس الحسيِّ؛ فإن لباس التقوى يستمرُّ مع العبد ولا يبلى ولا يبيد، وهو جمال القلب والروح، وأما اللباس الظاهريُّ؛ فغايتُه أن يستُر العورة الظاهرة في وقت من الأوقات، أو يكون جمالاً للإنسان، وليس وراء ذلك منه نفع. وأيضاً؛ فبتقدير عدم هذا اللباس تنكشف عورتُهُ الظاهرةُ التي لا يضرُّه كشفُها مع الضرورة، وأما بتقدير عدم لباس التقوى؛ فإنها تنكشف عورته الباطنة، وينال الخزيَ والفضيحة. وقوله: ﴿ذلك من آيات الله لعلَّهم يذَّكَّرونَ﴾؛ أي: ذلك المذكور لكم من اللباس مما تذكرون به ما ينفعُكم، ويضرُّكم، وتستعينون باللباس الظاهر على الباطن."},{"a":"7:27","t":"يقول تعالى محذِّراً لبني آدم أن يفعل بهم الشيطان كما فعل بأبيهم: ﴿يا بني آدم لا يَفْتِنَنَّكُمُ الشيطانُ﴾: بأن يزيِّن لكم العصيانَ ويدعوكم إليه ويرغِّبكم فيه فتنقادون له، ﴿كما أخرجَ أبَوَيْكم من الجنة﴾: وأنزلهما من المحلِّ العالي إلى أنزل منه؛ فأنتم يريد أن يفعل بكم كذلك ولا يألو جهده عنكم حتى يفتِنَكم إن استطاع؛ فعليكم أن تجعلوا الحَذَرَ منه في بالكم، وأن تَلْبَسوا لامةَ الحرب بينَكم وبينه، وأن لا تغفلوا عن المواضع التي يدخل منها إليكم. فإنَّه يراقِبُكم على الدوام، و ﴿يراكم هو وقَبيلُهُ﴾: من شياطين الجن ﴿من حيث لا تَرَوْنَهم إنا جعلنا الشياطينَ أولياءَ للذين لا يؤمنونَ﴾: فعدمُ الإيمان هو الموجبُ لعقد الولاية بين الإنسان والشيطان. ﴿إنَّه ليسَ له سلطانٌ على الذين آمنوا وَعلى ربِّهِمْ يَتَوَكَّلونَ. إنَّما سلطانُهُ على الذين يَتَوَلَّوْنَهُ والذين هم بِهِ مشركونَ﴾."},{"a":"7:28","t":"يقول تعالى مبيِّناً لقبح حال المشركين الذين يفعلون الذنوب وينسبون أن اللهَ أمرهم بها: ﴿وإذا فعلوا فاحشةً﴾: وهي كل ما يُستفحش ويُستقبح، ومن ذلك طوافهم بالبيت عراة، ﴿قالوا وَجَدْنا عليها آباءَنا﴾: وصَدَقوا في هذا، ﴿واللهُ أمَرَنا بها﴾: وكذبوا في هذا، ولهذا ردَّ الله عليهم هذه النسبة، فقال: ﴿قل إنَّ الله لا يأمرُ بالفحشاء﴾؛ أي: لا يليق بكماله وحكمته أن يأمر عبادَه بتعاطي الفواحش، لا هذا الذي يفعله المشركون ولا غيره، ﴿أتقولونَ على الله ما لا تَعْلَمونَ﴾: وأيُّ افتراء أعظم من هذا؟"},{"a":"7:29","t":"ثم ذكر ما يأمر به، فقال: ﴿قل أمَرَ ربِّي بالقِسْط﴾؛ أي: بالعدل في العبادات والمعاملات، لا بالظلم والجور، ﴿وأقيموا وجوهَكم عند كلِّ مسجدٍ﴾؛ أي: توجَّهوا لله، واجتهدوا في تكميل العبادات، خصوصاً الصلاة، أقيموها ظاهراً وباطناً، ونقُّوها من كل مُنَقِّص ومفسد. ﴿وادعوه مخلصين له الدينَ﴾؛ أي: قاصدين بذلك وجهه وحدَه لا شريك له، والدعاء يشمل دعاء المسألة ودعاء العبادة؛ أي: لا تريدُون ولا تقصدون من الأغراض في دعائكم سوى عبودية الله ورضاه، ﴿كما بدأكم﴾: أول مرة ﴿تعودونَ﴾: للبعث؛ فالقادر على بدء خلقكم قادرٌ على إعادته، بل الإعادةُ أهون من البداءَة."},{"a":"7:30","t":"﴿فريقاً﴾: منكم، ﴿هَدَى﴾: اللهُ؛ أي: وفَّقهم للهداية ويسَّر لهم أسبابها وصرف عنهم موانعها، ﴿وفريقاً حقَّ عليهم الضَّلالة﴾؛ أي: وجبت عليهم الضَّلالة بما تسبَّبوا لأنفسهم وعملوا بأسباب الغواية. فإنَّهم ﴿اتَّخذوا الشياطينَ أولياء من دون اللهِ﴾؛ ومن يتَّخذ الشيطان وليًّا من دون الله؛ فقد خسر خسراناً مُبِيناً؛ فحين انسلخوا من ولاية الرحمن واستحبوا ولاية الشيطان؛ حصل لهم النصيبُ الوافر من الخذلان، ووُكِلوا إلى أنفسهم فخسروا أشد الخسران. وهم يحسبونَ ﴿أنَّهم مهتدونَ﴾: لأنهم انقلبت عليهم الحقائقُ، فظنُّوا الباطل حقًّا والحقَّ باطلاً. وفي هذه الآيات دليلٌ على أن الأوامر والنواهي تابعة للحكمة والمصلحة؛ حيث ذكر تعالى أنه لا يُتَصَوَّر أن يأمر بما تستفحشه وتنكره العقول، وأنه لا يأمر إلا بالعدل والإخلاص. وفيه دليلٌ على أن الهداية بفضل الله ومَنِّه، وأن الضلالة بخذلانه للعبد إذ تولى ـ بجهله وظلمه ـ الشيطانَ، وتسبَّب لنفسه بالضلال، وأن من حسب أنه مهتدٍ وهو ضالٌّ فإنه لا عذر له؛ لأنه متمكِّن من الهدى، وإنما أتاه حسبانه من ظلمه بترك الطريق الموصل إلى الهدى."}],"154":[{"a":"7:31","t":"يقول تعالى بعدما أنزل على بني آدم لباساً يواري سوآتهم وريشاً: ﴿يا بني آدم خُذوا زينتكم عند كل مسجدٍ﴾؛ أي: استروا عوراتكم عند الصلاة كلِّها فرضها ونفلها؛ فإن سترها زينة للبدن؛ كما أن كشفها يدع البدن قبيحاً مشوهاً، ويحتمل أنَّ المراد بالزينة هنا ما فوق ذلك من اللباس النظيف الحسن. ففي هذا الأمر بستر العورة في الصلاة وباستعمال
