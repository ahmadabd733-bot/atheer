<title>حلقة الأترجة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#EDF1E7; --surface:#FFFFFF; --surface-2:#F5F8F1; --surface-3:#E8EEE1;
  --line:#D4DDCA; --line-soft:#E4EADC;
  --ink:#16241C; --ink-2:#4C5C52; --ink-3:#78867C;
  --brand:#1F5B43; --brand-2:#2C7A5B; --brand-soft:#E1EDE6; --on-brand:#FFFFFF;
  --peel:#A8791A; --peel-soft:#F5EBD2;
  --r-exc:#2E7D52; --r-vg:#C99B10; --r-good:#D4711F; --r-weak:#BC382B;
  --r-exc-bg:#E2F0E8; --r-vg-bg:#F8EFCE; --r-good-bg:#FAE7D5; --r-weak-bg:#F8E1DE;
  --shadow:0 1px 2px rgba(20,40,28,.05), 0 10px 26px -16px rgba(20,40,28,.30);
  --radius:14px;
  --f-disp:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-ui:"Noto Naskh Arabic","Amiri","Segoe UI",serif;
  --f-scr:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1310; --surface:#151E18; --surface-2:#1B261E; --surface-3:#212D24;
    --line:#2A382E; --line-soft:#222E26;
    --ink:#E3EBE0; --ink-2:#A6B4A9; --ink-3:#7E8C82;
    --brand:#5CBE90; --brand-2:#78CFA6; --brand-soft:#162C22; --on-brand:#07130D;
    --peel:#D8AB43; --peel-soft:#2A2314;
    --r-exc:#4FBB80; --r-vg:#DFBA47; --r-good:#E5904C; --r-weak:#E06B5C;
    --r-exc-bg:#14291E; --r-vg-bg:#2A2413; --r-good-bg:#2C2015; --r-weak-bg:#2C1917;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1310; --surface:#151E18; --surface-2:#1B261E; --surface-3:#212D24;
  --line:#2A382E; --line-soft:#222E26;
  --ink:#E3EBE0; --ink-2:#A6B4A9; --ink-3:#7E8C82;
  --brand:#5CBE90; --brand-2:#78CFA6; --brand-soft:#162C22; --on-brand:#07130D;
  --peel:#D8AB43; --peel-soft:#2A2314;
  --r-exc:#4FBB80; --r-vg:#DFBA47; --r-good:#E5904C; --r-weak:#E06B5C;
  --r-exc-bg:#14291E; --r-vg-bg:#2A2413; --r-good-bg:#2C2015; --r-weak-bg:#2C1917;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; font-weight:500; line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
.app{direction:rtl; min-height:100vh; display:flex; flex-direction:column}
.wrap{width:min(1180px,100%); margin-inline:auto; padding-inline:20px}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:700; margin:0; text-wrap:balance; line-height:1.5}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* ---------- top bar ---------- */
.topbar{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:40;
}
.topbar .wrap{display:flex; align-items:center; gap:16px; min-height:64px; flex-wrap:wrap; padding-block:10px}
.mark{display:flex; align-items:center; gap:11px; margin-inline-end:auto}
.mark .seal{
  width:38px; height:38px; border-radius:11px; flex:none;
  background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; font-family:var(--f-disp); font-size:20px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.mark b{font-family:var(--f-disp); font-size:18px; font-weight:700; display:block; letter-spacing:.2px; line-height:1.5}
.mark span{display:block; font-size:11.5px; color:var(--ink-3); letter-spacing:.9px}

.switch{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:3px}
.switch button{
  border:0; background:transparent; padding:7px 15px; border-radius:8px; cursor:pointer;
  font-size:13.5px; font-weight:500; color:var(--ink-2);
}
.switch button[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}

.sync{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-3);
  border:1px solid var(--line); border-radius:99px; padding:4px 10px; background:var(--surface-2);
}
.sync i{width:7px; height:7px; border-radius:50%; background:var(--ink-3); display:block}
.sync.on i{background:var(--r-exc)}

main{flex:1; padding-block:26px 60px}

/* ---------- generic ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px;
}
.card > header{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.card > header h3{font-size:16.5px; margin-inline-end:auto}
.eyebrow{
  font-size:11px; letter-spacing:1.6px; color:var(--peel); font-weight:600;
  font-family:var(--f-ui); text-transform:uppercase;
}
.muted{color:var(--ink-3)}
.grid{display:grid; gap:16px; grid-template-columns:minmax(0,1fr)}
.rule{height:1px; background:var(--line-soft); border:0; margin:14px 0}

.btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:9px; padding:8px 14px; cursor:pointer; font-size:13.5px; font-weight:600;
  transition:background .15s, border-color .15s;
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  line-height:1.5; white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2)}
.btn.sm{padding:5px 10px; font-size:12.5px; border-radius:7px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}

.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-size:12.5px; font-weight:500; color:var(--ink-2)}
input[type=text],input[type=time],input[type=number],input[type=url],input[type=password],select,textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
  padding:9px 11px; font-size:14px; font-family:var(--f-ui);
}
textarea{resize:vertical; min-height:96px; line-height:1.75}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); background:var(--surface)}

.pill{
  display:inline-flex; align-items:center; gap:6px; border-radius:99px;
  padding:4px 11px; font-size:12.5px; font-weight:500; border:1px solid transparent;
}
.pill .dot{width:8px; height:8px; border-radius:50%; background:currentColor; flex:none}

.tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:4px; overflow-x:auto}
.tabs button{
  border:0; background:transparent; padding:8px 14px; border-radius:8px; cursor:pointer;
  font-size:13.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:620px; font-size:13.5px}
th,td{padding:11px 13px; text-align:start; border-bottom:1px solid var(--line-soft); vertical-align:middle}
th{background:var(--surface-2); font-weight:600; font-size:12px; color:var(--ink-2); letter-spacing:.4px; white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- student: greeting ---------- */
.hello{
  display:flex; gap:20px; align-items:center; flex-wrap:wrap;
  background:
    radial-gradient(120% 160% at 100% 0%, var(--brand-soft) 0%, transparent 62%),
    var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow);
}
.hello .who{margin-inline-end:auto; min-width:220px}
.hello h2{font-size:24px}
.hello p{margin:7px 0 0; color:var(--ink-2); font-size:14px; max-width:60ch}
.teacherline{
  display:inline-block; margin-top:7px; font-family:var(--f-disp); font-size:14px;
  color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand);
  border-radius:99px; padding:3px 13px;
}

.streak{
  display:flex; align-items:center; gap:13px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:12px; padding:11px 15px;
}
.streak .flame{font-size:26px; line-height:1}
.streak b{display:block; font-size:22px; font-family:var(--f-disp); line-height:1.15}
.streak span{font-size:11.5px; color:var(--ink-3)}
.dots{display:flex; gap:4px; margin-top:6px}
.dots i{width:9px; height:9px; border-radius:3px; background:var(--line); display:block}
.dots i.p{background:var(--r-exc)} .dots i.a{background:var(--r-weak)} .dots i.e{background:var(--r-vg)}

/* ---------- portion + clock ---------- */
.face{font-family:var(--f-disp); font-size:30px; line-height:1.3; margin:6px 0 0}
.sub{color:var(--ink-2); font-size:14px; margin-top:8px}
@media (max-width:520px){.face{font-size:24px}}

.clock{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:190px}
.ring{position:relative; width:168px; height:168px}
.ring svg{transform:rotate(-90deg); display:block}
.ring .track{stroke:var(--line); fill:none; stroke-width:9}
.ring .prog{stroke:var(--brand); fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .5s linear}
.ring .inner{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
}
.ring .t{font-family:var(--f-disp); font-weight:700; font-size:29px; font-variant-numeric:tabular-nums; line-height:1.25}
.ring .l{font-size:11.5px; color:var(--ink-3)}

.timestrip{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:11px 15px;
}
.timestrip .clk{
  width:34px; height:34px; border-radius:10px; background:var(--brand-soft); color:var(--brand);
  display:grid; place-items:center; flex:none;
}
.timestrip .clk svg{width:18px; height:18px}
.timestrip b{display:block; font-size:15.5px; font-variant-numeric:tabular-nums; letter-spacing:.3px}
.timestrip .eyebrow{display:block; margin-bottom:1px}

.segbar{display:flex; height:9px; border-radius:99px; overflow:hidden; border:1px solid var(--line); background:var(--surface-2)}
.segbar > i{display:block; height:100%; opacity:.35}
.segbar > i.now{opacity:1}
.seglegend{display:flex; gap:14px; flex-wrap:wrap; margin-top:9px; font-size:12.5px; color:var(--ink-2)}
.seglegend span{display:inline-flex; align-items:center; gap:6px}
.seglegend b{width:9px; height:9px; border-radius:3px; display:block}

.lessonhead{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
.lessonhead .ic{
  width:52px; height:52px; border-radius:14px; flex:none;
  background:var(--brand); color:var(--on-brand); display:grid; place-items:center;
}
.lessonhead .ic svg{width:27px; height:27px}

/* ---------- lesson link ---------- */
.lesson{
  display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
  background:var(--peel-soft); border:1px solid var(--peel); border-radius:12px; padding:14px 16px;
}
.lesson .ic{
  width:42px; height:42px; border-radius:11px; background:var(--peel); color:#fff;
  display:grid; place-items:center; flex:none;
}
.lesson .ic svg{width:21px; height:21px}
.lesson b{display:block; font-size:15px}
.lesson span{font-size:12.5px; color:var(--ink-2)}
.lesson.off{opacity:.6; border-style:dashed; background:var(--surface-2); border-color:var(--line); pointer-events:none}
.lesson.off .ic{background:var(--ink-3)}

/* ---------- mushaf page ---------- */
.mushafbox{
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  padding:10px; display:flex; justify-content:center; overflow-x:auto;
}
.mushafimg{
  display:block; max-width:100%; height:auto; border-radius:8px;
  background:#fff; box-shadow:0 2px 10px -6px rgba(20,40,28,.5);
}
.mushafbox .fallback{display:none; text-align:center; padding:26px 12px}
.mushafbox .fallback p{margin:0 0 12px; font-size:13.5px}
.mushafbox.failed{padding:0}
.mushafbox.failed .mushafimg{display:none}
.mushafbox.failed .fallback{display:block}
.audiorow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.audiorow audio{flex:1; min-width:230px; height:40px}
.audiolink{font-size:13.5px}
.audioctl{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin-top:11px; font-size:13px; color:var(--ink-2)}
.audioctl label{display:inline-flex; align-items:center; gap:7px}
.audioctl input[type=checkbox]{width:17px; height:17px; accent-color:var(--brand)}
.audioctl select{width:auto; padding:5px 9px; font-size:13px}
.no-remote .audioctl{display:none}

/* ---------- mode banner ---------- */
.mode{
  display:flex; align-items:flex-start; gap:12px; border-radius:12px; padding:13px 16px;
  border:1px solid var(--line); background:var(--surface-2); font-size:13.5px; line-height:1.75;
}
.mode .badge{
  flex:none; border-radius:8px; padding:3px 10px; font-size:12px; font-weight:700;
  background:var(--surface-3); color:var(--ink-2);
}
.mode.ok{border-color:var(--r-exc); background:var(--r-exc-bg)}
.mode.ok .badge{background:var(--r-exc); color:#fff}
.mode.warn{border-color:var(--r-vg); background:var(--r-vg-bg)}
.mode.warn .badge{background:var(--r-vg); color:#fff}
.mode b{color:var(--ink)}
/* عند حجب المصادر الخارجية: يختفي المشغّل ويبرز الرابط */
.no-remote .audiorow audio{display:none}
.no-remote .audiolink{
  background:var(--brand); border-color:var(--brand); color:var(--on-brand);
  padding:10px 18px; font-size:14.5px;
}

/* ---------- tafsir ---------- */
.scripture{font-family:var(--f-scr); font-size:19px; line-height:2.05; color:var(--ink); white-space:pre-wrap}
.ghareeb{list-style:none; margin:0; padding:0; display:grid; gap:0}
.ghareeb li{display:grid; grid-template-columns:minmax(90px,auto) 1fr; gap:16px; padding:10px 2px; border-bottom:1px dashed var(--line-soft)}
.ghareeb li:last-child{border-bottom:0}
.ghareeb b{font-family:var(--f-scr); font-size:19px; color:var(--brand); font-weight:700}
.ghareeb span{font-family:var(--f-scr); font-size:17px; line-height:1.9; color:var(--ink-2)}

/* ---------- rating ---------- */
.ratebox{display:flex; align-items:center; gap:15px; border-radius:12px; padding:16px 18px; border:1px solid}
.ratebox .big{font-family:var(--f-disp); font-size:24px}
.ratebox .sm{font-size:12.5px; opacity:.85}
.ratebox .mark{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; flex:none; color:#fff; font-size:22px}
.rate-legend{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}

/* ---------- tasks ---------- */
.tasks{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.tasks li{
  display:flex; align-items:flex-start; gap:11px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:10px; padding:11px 13px;
}
.tasks li.done{opacity:.55}
.tasks li.done .txt{text-decoration:line-through}
.tasks input[type=checkbox]{width:18px; height:18px; accent-color:var(--brand); margin-top:2px; flex:none; cursor:pointer}
.tasks .txt{flex:1; font-size:14px}
.tag{font-size:11px; border-radius:6px; padding:2px 7px; background:var(--brand-soft); color:var(--brand); font-weight:600; flex:none}

/* ---------- faces ---------- */
.faces{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:620px){.faces{grid-template-columns:minmax(0,1fr)}}
.facelist{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:7px}
.facelist li{
  font-size:12.5px; border-radius:8px; padding:5px 10px; border:1px solid; font-family:var(--f-ui);
  display:flex; align-items:center; gap:7px;
}
.facelist.good li{background:var(--r-exc-bg); border-color:var(--r-exc); color:var(--r-exc)}
.facelist.bad li{background:var(--r-weak-bg); border-color:var(--r-weak); color:var(--r-weak)}
.facelist .x{border:0; background:transparent; cursor:pointer; color:inherit; font-size:14px; line-height:1; padding:0}

/* ---------- benefits ---------- */
.benefit{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:13px 15px}
.benefit .hd{display:flex; align-items:center; gap:9px; margin-bottom:5px; font-size:12.5px; color:var(--ink-3)}
.benefit .hd b{color:var(--ink); font-size:13.5px; font-weight:600}
.benefit p{margin:0; font-family:var(--f-scr); font-size:17px; line-height:1.95}
.benefit.approved{border-color:var(--brand); background:var(--brand-soft)}

/* ---------- notice ---------- */
.notice{border-inline-start:3px solid var(--r-weak); background:var(--r-weak-bg); border-radius:10px; padding:14px 16px}
.notice h4{font-size:15px; color:var(--r-weak); margin-bottom:5px}
.notice p{margin:0 0 8px; font-size:14px; line-height:1.8}
.notice p:last-child{margin-bottom:0}

/* ---------- teacher roster ---------- */
.attgroup{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.attgroup button{
  border:0; background:var(--surface-2); padding:6px 11px; cursor:pointer; font-size:12.5px;
  border-inline-start:1px solid var(--line); color:var(--ink-2); white-space:nowrap;
}
.attgroup button:first-child{border-inline-start:0}
.attgroup button:hover{background:var(--surface-3)}
.attgroup button[aria-pressed="true"]{color:#fff; font-weight:600}
.attgroup button[data-att=present][aria-pressed="true"]{background:var(--r-exc)}
.attgroup button[data-att=excused][aria-pressed="true"]{background:var(--r-vg)}
.attgroup button[data-att=absent][aria-pressed="true"]{background:var(--r-weak)}

.rategroup{display:inline-flex; gap:5px}
.rategroup button{
  width:29px; height:29px; border-radius:8px; cursor:pointer; border:2px solid transparent;
  background:var(--surface-3); position:relative;
}
.rategroup button[aria-pressed="true"]{border-color:var(--ink); transform:scale(1.08)}
.rategroup button[data-rate=excellent]{background:var(--r-exc)}
.rategroup button[data-rate=vgood]{background:var(--r-vg)}
.rategroup button[data-rate=good]{background:var(--r-good)}
.rategroup button[data-rate=weak]{background:var(--r-weak)}
.rategroup button[aria-pressed="false"]{opacity:.42}
.rategroup button:hover{opacity:1}

/* ---------- wheel ---------- */
.wheelwrap{display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; justify-content:center}
.wheelstage{position:relative; width:330px; max-width:100%; display:flex; flex-direction:column; align-items:center; gap:14px}
.wheelstage canvas{width:330px; height:330px; max-width:100%; display:block}
.pointer{
  position:absolute; top:-4px; inset-inline-start:50%; transform:translateX(50%);
  width:0; height:0; border-inline:12px solid transparent; border-top:22px solid var(--peel); z-index:2;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
}
.winner{
  text-align:center; background:var(--brand-soft); border:1px solid var(--brand);
  border-radius:12px; padding:14px 20px; min-width:230px;
}
.winner span{font-size:12px; color:var(--brand); letter-spacing:1px; font-weight:600}
.winner b{display:block; font-family:var(--f-disp); font-size:26px; margin-top:3px}

/* ---------- stats ---------- */
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.tile span{font-size:12px; color:var(--ink-3); display:block}
.tile b{font-family:var(--f-disp); font-weight:700; font-size:27px; display:block; line-height:1.4; font-variant-numeric:tabular-nums}
.bar{height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-top:7px}
.bar > i{display:block; height:100%; background:var(--brand)}

/* ---------- gate ---------- */
.gate{max-width:430px; margin:70px auto; text-align:center}
.gate .seal{
  width:64px; height:64px; border-radius:18px; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; font-family:var(--f-disp); font-size:32px; margin:0 auto 16px;
}
.gate h2{font-size:23px}

<script>window.SAADI_STORE=/*SAADI-DATA*/{"128":[{"a":"6:1","t":"هذا إخبارٌ عن حمدِهِ والثناء عليه بصفات الكمال ونعوت العظمة والجلال عموماً وعلى هذه المذكورات خصوصاً؛ فحمد نفسه على خلقه السماوات والأرض الدالَّةِ على كمال قدرته وسعة علمه ورحمته وعموم حكمته وانفراده بالخلق والتدبير، وعلى جَعْلِهِ الظلماتِ والنور، وذلك شاملٌ للحسيِّ من ذلك؛ كالليل والنهار والشمس والقمر، والمعنوي؛ كظلمات الجهل والشَّكِّ والشِّرك والمعصية والغفلة ونور العلم والإيمان واليقين والطاعة، وهذا كلُّه يدلُّ دلالة قاطعة أنه تعالى هو المستحقُّ للعبادة وإخلاص الدين له، ومع هذا الدليل ووضوح البرهان: ﴿ثم الذين كَفَروا بربِّهم يعدِلون﴾؛ [أي: يعدلون] به سواه؛ يسوُّونهم به في العبادة والتعظيم، مع أنَّهم لم يساووا الله في شيء من الكمال، وهم فقراء عاجزون ناقصون من كل وجه."},{"a":"6:2","t":"﴿هو الذي خَلَقَكُم من طينٍ﴾: وذلك بخَلْقِ مادَّتكم وأبيكم آدم عليه السلام. ﴿ثم قضى أجلاً﴾؛ أي: ضرب لمدَّة إقامتكم في هذه الدار أجلاً تتمَتَّعون به، وتُمْتَحنون، وتُبْتَلَون بما يرسل إليهم به رسله؛ ليبلُوَكُم أيُّكم أحسنُ عملاً، ويعمِّرَكُم، ما يتذكَّر فيه من تذكَّر. ﴿وأجلٌ مسمًّى عنده﴾: وهي الدار الآخرةُ التي ينتقل العباد إليها من هذه الدار، فيجازيهم بأعمالهم من خير وشر، ﴿ثمَّ﴾: مع هذا البيان التامِّ وقطع الحجة ﴿أنتم تَمْتَرون﴾؛ أي: تشكُّون في وعد الله ووعيدِهِ ووقوع الجزاء يوم القيامة. وذكر الله الظُّلمات بالجمع لكثرة موادِّها وتنوُّع طرقها، ووحَّد النور لكون الصراط الموصلة إلى الله واحدةً لا تعدُّد فيها، وهي الصراط المتضمِّنة للعلم بالحق والعمل به؛ كما قال تعالى: ﴿وأنَّ هذا صراطي مستقيماً فاتَّبِعوه ولا تَتَّبعوا السُّبُلَ فَتَفَرَّق بكم عن سبيلِهِ﴾."},{"a":"6:3","t":"أي: وهو المألوهُ المعبودُ، ﴿في السموات وفي الأرض﴾: فأهلُ السماء والأرض متعبِّدون لربِّهم خاضعون لعظمتِهِ مستكينون لعزِّه وجلاله؛ الملائكةُ المقرَّبون والأنبياءُ والمرسلون والصِّدِّيقون والشهداء والصالحون. وهو تعالى ﴿يَعْلَمُ سِرَّكم وجَهْرَكم ويعلمُ ما تكسِبون﴾: فاحذروا معاصيه وارغبوا في الأعمال التي تقرِّبكم منه، وتُدْنيكم من رحمتِهِ، واحذروا من كلِّ عمل يبعدكم منه ومن رحمته."},{"a":"6:4","t":"هذا إخبارٌ منه تعالى عن إعراض المشركين وشدَّة تكذيبهم وعداوتهم، وأنهم لا تنفع فيهم الآيات حتى تَحِلَّ بهم المَثُلات، فقال: ﴿وما تأتيهم من آيةٍ من آيات ربِّهم﴾: الدالَّة على الحقِّ دلالة قاطعة، الداعية لهم إلى اتِّباعه وقبوله، ﴿إلَّا كانوا عنها معرِضين﴾: لا يُلقون لها بالاً ولا يُصْغونَ لها سمعاً، قد انصرفت قلوبُهم إلى غيرها، وولَّوْها أدبارَهم."},{"a":"6:5","t":"﴿فقد كذَّبوا بالحقِّ لما جاءهم﴾: والحقُّ حقُّه أن يُتَّبع ويُشكر الله على تيسيره لهم وإتيانهم به، فقابلوه بضدِّ ما يجب مقابلته به، فاستحقوا العقاب الشديد. ﴿فسوف يأتيهم أنباء ما كانوا به يستهزِئون﴾؛ أي: فسوف يَرَوْن ما استهزؤوا به أنَّه الحقُّ والصدق، ويُبَيِّنُ الله للمكذِّبين كذبهم وافتراءهم، وكانوا يستهزئون بالبعث والجنة والنار؛ فإذا كان يوم القيامة؛ قيل للمكذبين: هذه النارُ التي كنتم بها تكذِّبون، وقال تعالى: ﴿وأقْسَموا باللهِ جَهْدَ أيْمانِهِمْ لا يَبْعَثُ اللهُ مَنْ يَموتُ بَلى وَعْداً عليهِ حقًّا ولكنَّ أكْثَرَ الناس لا يعلمونَ. لِيُبَيِّنَ لهم الذي يختلفونَ فيه ولِيَعْلَمَ الذين كفروا أنَّهم كانوا كاذبين﴾."},{"a":"6:6","t":"ثم أمرهم أن يعتبروا بالأمم السابقة، فقال: ﴿ألَم يَرَوْا كم أهلكنا من قبلهم من قرنٍ﴾؛ أي: كم تتابع إهلاكنا للأمم المكذِّبين وأمهلناهم قبل ذلك الإهلاك بأن ﴿مَكَّنَّاهم في الأرض ما لم نمكِّنْ﴾: لهؤلاء من الأموال والبنين والرفاهية، ﴿وأرْسَلْنا السماءَ عليهم مِدراراً وجعلنا الأنهار تجري من تحتهم﴾: تُنْبِتُ لهم بذلك ما شاء الله من زروع وثمار يتمتَّعون بها ويتناولون منها ما يشتهون، فلم يشكروا الله على نِعَمِهِ، بل أقبلوا على الشهوات، وألهتهم [أنواع] اللَّذَّات، فجاءتهم رسلهم بالبينات، فلم يصدِّقوها، بل ردُّوها وكذَّبوها، فأهلكهم الله بذُنوبهم، وأنشأ من بعدهم قَرْناً آخرين؛ فهذه سُنَّةُ الله ودأبه في الأمم السابقين واللاحقين؛ فاعتبروا بمن قَصَّ الله عليكم نبأهم."},{"a":"6:7","t":"هذا إخبارٌ من الله لرسوله عن شدَّة عناد الكافرين، وأنَّه ليس تكذيبهم لقصورٍ فيما جئتهم به ولا لجهل منهم بذلك، وإنما ذلك ظلمٌ وبغيٌ لا حيلة لكم فيه، فقال: ﴿ولو نزَّلْنا عليك كتاباً في قِرْطاس فلَمَسوه بأيديهم﴾: وتيقَّنوه، ﴿لقال الذين كفروا﴾: ظلماً وعلواً: ﴿إن هذا إلا سحرٌ مبينٌ﴾؛ فأيُّ بينةٍ أعظم من هذه البينة، وهذا قولهم الشنيع فيها، حيث كابروا المحسوس الذي لا يمكن من له أدنى مُسْكَةٍ من عقله دفعه؟!"},{"a":"6:8","t":"﴿وقالوا﴾ أيضاً تعنُّتاً مبنيًّا على الجهل وعدم العلم بالمعقول: ﴿لولا أُنزِلَ عليه مَلَكٌ﴾؛ أي: هلاَّ أُنْزِل مع محمدٍ مَلَك يعاوِنُه ويساعده على ما هو عليه؛ بزعمهم أنَّه بشرٌ وأنَّ رسالة الله لا تكون إلا على أيدي الملائكة. قال الله في بيان رحمته ولطفه بعباده حيث أرسل إليهم بشراً منهم يكون الإيمان بما جاء به عن علم وبصيرةٍ وغيبٍ: ﴿ولو أنزَلْنا مَلَكاً﴾: برسالتنا؛ لكان الإيمانُ لا يصدُرُ عن معرفةٍ بالحقِّ، ولكان إيماناً بالشهادة الذي لا ينفع شيئاً وحده، هذا إن آمنوا، والغالب أنهم لا يؤمنون بهذه الحالة، فإذا لم يؤمنوا؛ ﴿لَقُضِيَ الأمرُ﴾: بتعجيل الهلاك عليهم وعدم إنظارِهم؛ لأنَّ هذه سنة الله فيمن طَلَبَ الآيات المقترحة فلم يؤمن بها؛ فإرسال الرسول البشريِّ إليهم بالآيات البيِّنات التي يعلمُ الله أنها أصلحُ للعباد وأرفق بهم مع إمهال الله للكافرين والمكذِّبين خيرٌ لهم وأنفعُ، فطلبُهم لإنزال المَلَكِ شرٌّ لهم لو كانوا يعلمون."}],"129":[{"a":"6:9","t":"ومع ذلك؛ فالمَلَك لو أُنزِل عليهم وأُرْسِل؛ لم يطيقوا التلقِّي عنه ولا احتملوا ذلك ولا أطاقته قُواهم الفانية، فلو ﴿جَعَلْناه ملكاً لجعلناه رجلاً﴾: لأنَّ الحكمة لا تقتضي سوى ذلك، ﴿ولَلَبَسْنا عليهم ما يَلْبِسونَ﴾؛ أي: ولكان الأمر مختلطاً عليهم وملبوساً، وذلك بسبب ما لَبَّسوه على أنفسهم؛ فإنهم بَنَوا أمرهم على هذه القاعدة التي فيها اللَّبْس وعدم بيان الحق، فلما جاءهم الحقُّ بطرقه الصحيحة وقواعده التي هي قواعدُه؛ لم يكنْ ذلك هدايةً لهم إذا اهتدى بذلك غيرهم، والذنب ذنبهم؛ حيث أغلقوا على أنفسهم باب الهدى، وفتحوا أبواب الضلال."},{"a":"6:10","t":"يقول تعالى مسلياً لرسوله ومصبِّراً ومتهدداً أعداءه ومتوعداً: ﴿ولقد استُهْزِئ برسل من قبلِكَ﴾: لما جاؤوا أممهم بالبينات؛ كذَّبوهم واستهزؤوا بهم وبما جاؤوا به، فأهلكهم الله بذلك الكفر والتكذيب، ووفَّى لهم من العذاب أكمل نصيب، ﴿فحاق بالذين سَخِروا منهم ما كانوا به يستهزِئونَ﴾: فاحذروا أيُّها المكذبون أن تستمِرُّوا على تكذيبكم، فيصيبكم ما أصابهم."},{"a":"6:11","t":"فإن شككتُم في ذلك أو ارتَبْتم؛ ﴿فسيروا في الأرض ثم انظُروا كيف كان عاقبةُ المكذِّبين﴾؛ فلن تجدوا إلا قوماً مُهْلَكين، وأمماً في المَثُلات تالفين، قد أوحشت منهم المنازل، وعَدِمَ من تلك الرُّبوع كلُّ متمتِّع بالسرور نازل، أبادهم الملك الجبار، وكان نبؤهم عِبرةً لأولي الأبصار. وهذا السير المأمور به سير القلوب والأبدان الذي يتولَّد منه الاعتبار، وأما مجرَّد النظر من غير اعتبار؛ فإن ذلك لا يفيد شيئاً."},{"a":"6:12","t":"يقول تعالى لنبيه - صلى الله عليه وسلم -: ﴿قُلْ﴾ لهؤلاء المشركين [باللهِ] مقرِّراً لهم وملزماً بالتوحيد: ﴿لِمَن ما في السموات والأرض﴾؛ أي: من الخالق لذلك المالك له المتصرِّف فيه؟ ﴿قُلْ﴾ لهم: ﴿لله﴾، وهم مقرُّون بذلك لا ينكرونه، أفلا حين اعترفوا بانفرادِ الله بالملك والتدبير أن يعترِفوا له بالإخلاص والتوحيد؟ وقوله: ﴿كَتَبَ على نفسه الرحمةَ﴾؛ أي: العالم العلويُّ والسفليُّ تحت ملكه وتدبيرِهِ، وهو تعالى قد بَسَطَ عليهم رحمته وإحسانه، وتغمَّدهم برحمته وامتنانه، وكتب على نفسه كتاباً: أنَّ رحمته تغلب غضبه، وأن العطاء أحبُّ إليه من المنع، وأن الله قد فتح لجميع العباد أبواب الرحمة إن لم يغلقوا عليهم أبوابها بذُنوبهم، ودعاهم إليها إن لم تمنعهم من طلبها معاصيهم وعيوبهم. وقوله: ﴿لَيَجْمَعَنَّكم إلى يوم القيامة لا ريبَ فيه﴾: وهذا قَسَمٌ منه، وهو أصدق المخبرين، وقد أقام على ذلك من الحجج والبراهين ما يجعله حقَّ اليقين، ولكن أبى الظالمون إلا جحوداً، وأنكروا قدرة الله على بعث الخلائِق، فأوضعوا في معاصيه، وتجرَّؤوا على الكفر به، فخسروا دنياهم وأخراهم، ولهذا قال: ﴿الذين خَسِروا أنفسَهم فهم لا يؤمنونَ﴾."},{"a":"6:13","t":"اعلم أنَّ هذه السورة الكريمة قد اشتملتْ على تقريرِ التوحيدِ بكلِّ دليل عقليٍّ ونقليٍّ، بل كادت أن تكون كلُّها في شأن التوحيد ومجادلة المشركين بالله المكذِّبين لرسوله؛ فهذه الآيات ذكر الله فيها ما يتبين به الهدى، وينقمع به الشرك: فذكر أن ﴿له﴾ تعالى ﴿ما سَكَنَ في الليل والنهار﴾، وذلك هو المخلوقاتُ كلُّها من آدميِّها وجنِّها وملائكتها وحيواناتها وجماداتها؛ فالكلُّ خَلْقٌ مدبَّرون وعبيدٌ مسخَّرون لربِّهم العظيم القاهر المالك؛ فهل يصحُّ في عقل ونقل أن يُعْبَدَ من هؤلاء المماليك الذي لا نفع عنده ولا ضُرَّ ويُتْرَكَ الإخلاصُ للخالق المدبِّر المالك الضارِّ النافع؟! أم العقول السليمة والفطر المستقيمة تدعو إلى إخلاص العبادة والحبِّ والخوف والرجاء لله ربِّ العالمين؟ ﴿السميع﴾: لجميع الأصوات على اختلاف اللُّغات بتفنُّن الحاجات. ﴿العليم﴾: بما كان وما يكونُ وما لم يكنْ لو كان كيف كان يكونُ، المطَّلع على الظواهر والبواطن."},{"a":"6:14","t":"﴿قل﴾ لهؤلاء المشركين بالله: ﴿أغيرَ الله أتَّخِذُ وليًّا﴾: من هؤلاء المخلوقات العاجزة يتولاَّني وينصُرُني؛ فلا أتَّخذ من دونه تعالى وليًّا؛ لأنَّه ﴿فاطر السموات والأرض﴾؛ أي: خالقهما ومدبِّرهما، ﴿وهو يُطْعِمُ ولا يُطْعَمُ﴾؛ أي: وهو الرازق لجميع الخلق من غير حاجةٍ منه تعالى إليهم؛ فكيف يَليقُ أن أتَّخِذَ وليًّا غير الخالق الرازق الغني الحميد. ﴿قل إنِّي أمِرْتُ أن أكونَ أولَ من أسلم﴾: لله بالتوحيدِ وأنقاد له بالطاعةِ؛ لأنِّي أولى من غيري بامتثال أوامر ربِّي، ﴿ولا تكوننَّ من المشركين﴾؛ أي: ونُهيت أيضاً عن أن أكون من المشركين؛ لا في اعتقادِهِم، ولا في مجالستهم، ولا في الاجتماع بهم؛ فهذا أفرضُ الفروض عليَّ وأوجب الواجبات."},{"a":"6:15","t":"﴿قل إنِّي أخافُ إن عصيتُ ربِّي عذابَ يوم عظيم﴾: فإنَّ المعصية في الشرك توجِبُ الخلود في النار وسَخَطَ الجبار."},{"a":"6:16","t":"وذلك اليوم هو اليوم الذي يُخاف عذابُه ويُحذر عقابُه؛ لأنه من صُرِفَ عنه العذابُ يومئذٍ فهو المرحومُ، ومن نجا فيه فهو الفائز حَقًّا؛ كما أنَّ من لم ينجُ منه؛ فهو الهالك الشقيُّ."},{"a":"6:17","t":"ومن أدلة توحيده أنه تعالى المنفرد بكشف الضَّرَّاء وجلب الخير والسَّرَّاء، ولهذا قال: ﴿وإن يَمسَسْكَ الله بضُرٍّ﴾: من فقرٍ أو مرضٍ أو عسرٍ أو غمٍّ أو همٍّ أو نحوه، ﴿فلا كاشفَ له إلَّا هو وإن يَمْسَسْكَ بخيرٍ فهو على كل شيء قديرٌ﴾: فإذا كان وحدَه النافعَ الضارَّ؛ فهو الذي يستحقُّ أن يُفْرَدَ بالعبوديَّة والإلهيَّة."},{"a":"6:18","t":"﴿وهو القاهرُ فوق عبادِهِ﴾: فلا يتصرَّفُ منهم متصرِّف ولا يتحرَّك متحرِّك ولا يسكن ساكنٌ إلا بمشيئتِهِ، وليس للملوك وغيرهم الخروجُ عن ملكه وسلطانِهِ، بل هم مدبَّرون مقهورون؛ فإذا كان هو القاهرَ وغيرُه مقهوراً؛ كان هو المستحقَّ للعبادة. ﴿وهو الحكيم﴾: فيما أمَرَ به ونهى، وأثابَ وعاقبَ، وفيما خَلَقَ وقدَّر، ﴿الخبير﴾: المطَّلع على السرائر والضمائر وخفايا الأمور، وهذا كلُّه من أدلة التوحيد."}],"130":[{"a":"6:19","t":"﴿قل﴾ لهم لمَّا بيَّنَّا لهم الهدى وأوضحنا لهم المسالك: ﴿أيُّ شيء أكبرُ شهادةً﴾: على هذا الأصل العظيم، ﴿قل اللهُ﴾ أكبرُ شهادةً؛ فهو ﴿شهيدٌ بيني وبينَكم﴾؛ فلا أعظمَ منه شهادةً ولا أكبرَ، وهو يشهدُ لي بإقراره وفعلِهِ، فَيُقِرُّني على ما قلتُ لكم؛ كما قال تعالى: ﴿ولو تَقَوَّلَ عَلَيْنا بَعْضَ الأقاويل لأخَذْنا منه باليمين ثم لَقَطَعْنا منه الوتينَ﴾؛ فالله حكيمٌ قديرٌ، فلا يليق بحكمتِهِ وقدرتِهِ أن يقرَّ كاذباً عليه، زاعماً أنَّ الله أرسلَه ولم يرسِلْه، وأن الله أمره بدعوة الخلق ولم يأمره، وأن الله أباح له دماء من خالفَه وأموالهم ونساءهم وهو مع ذلك يصدِّقه بإقرارِهِ وبفعلِهِ، فيؤيِّده على ما قال بالمعجزاتِ الباهرةِ والآياتِ الظاهرة، وينصرُهُ ويخذِلُ مَن خالفه وعاداه؛ فأيُّ شهادةٍ أكبرُ من هذه الشهادة. وقوله: ﴿وأُوْحيَ إليَّ هذا القرآن لأنذِرَكُم به ومَن بَلَغَ﴾؛ أي: وأوحى الله إليَّ هذا القرآن الكريم لمنفعتِكم ومصلحتِكم؛ لأنْذِرَكُم به من العقاب الأليم، والنّذارة إنما تكون بذكر ما ينذِرُهم به من الترغيب والترهيب وببيان الأعمال والأقوال الظاهرة والباطنة التي مَن قام بها فقد قَبِلَ النذارة؛ فهذا القرآن فيه النذارةُ لكم أيُّها المخاطَبون وكل مَن بَلَغَهُ القرآن إلى يوم القيامة؛ فإن فيه بيان كلِّ ما يُحتاج إليه من المطالب الإلهية. لما بيَّن تعالى شهادَته التي هي أكبر الشهادات على توحيدِهِ؛ قال: قلْ لهؤلاء المعارضين لخبر الله والمكذِّبين لرسله: ﴿أئنَّكم لَتشهدونَ أنَّ مع الله آلهةً أخرى قل لا أشهدُ﴾؛ أي: إن شهدوا؛ فلا تشهدْ معهم، فوازنْ بين شهادةِ أصدق القائلين وربِّ العالمين، وشهادة أزكى الخلق المؤيَّدة بالبراهين القاطعة والحجج الساطعة على توحيد الله وحدَه لا شريك له، وشهادةِ أهل الشِّرك الذين مَرَجَتْ عقولُهم وأديانُهم وفَسَدَتْ آراؤهم وأخلاقهم وأضحكوا على أنفسهم العقلاءَ، بل خالفتْ شهادتُهم فِطَرَهم وتناقضتْ أقوالُهم على إثبات أنَّ مع الله آلهةً أخرى مع أنه لا يقومُ على ما خالفوه أدنى شُبهة فضلاً عن الحُجج، واختر لنفسك أيَّ الشهادتين إن كنت تعقلُ، ونحن نختارُ لأنفسنا ما اختارَه الله لنبيِّه الذي أمرنا الله بالاقتداء به فقال: ﴿قلْ إنَّما هو إله واحدٌ﴾؛ أي: منفرد لا يستحقُّ العبوديَّة والإلهية سواه كما أنه المنفرد بالخلق والتدبير. ﴿وإنني بريءٌ مما تشرِكون﴾ به من الأوثان والأنداد وكل ما أُشْرِكَ به مع الله. فهذا حقيقة التوحيد: إثبات الإلهية لله، ونفيها عما عداه."},{"a":"6:20","t":"لما بيَّن شهادته وشهادة رسوله على التوحيد وشهادة المشركين الذين لا علمَ لديهم على ضدِّه؛ ذكر أنَّ أهل الكتاب من اليهود والنصارى ﴿يعرِفونَه﴾؛ أي: يعرفون صحة التوحيد، ﴿كما يعرِفون أبناءَهم﴾؛ أي: لا شكَّ عندهم فيه بوجهٍ؛ كما أنهم لا يشتَبِهون بأولادهم، خصوصاً البنين الملازمين في الغالب لآبائهم، ويُحتمل أن الضمير عائد إلى الرسول محمد - صلى الله عليه وسلم -، وأن أهل الكتاب لا يشتبِهون بصحَّة رسالته ولا يمترون بها لما عندهم من البشارات به ونعوتِهِ التي تنطبق عليه ولا تَصْلُحُ لغيره، والمعنيان متلازمان. قوله: ﴿الذين خَسِروا أنفُسَهم﴾؛ أي: فَوَّتوها ما خُلِقَتْ له من الإيمان والتوحيد وحَرَموها الفضل من الملك المجيد، ﴿فهم لا يؤمنون﴾: فإذا لم يوجدِ الإيمان منهم؛ فلا تسألْ عن الخسارِ والشرِّ الذي يحصل لهم."},{"a":"6:21","t":"أي: لا أعظم ظلماً وعناداً ممَّن كان فيه أحد الوصفين؛ فكيف لو اجتمعا: افتراء الكذب على الله، أو التكذيب بآياته التي جاءت بها المرسلون؟! فإنَّ هذا أظلم الناس، والظالم لا يفلِحُ أبداً، ويدخل في هذا كلُّ من كذب على الله بادِّعاء الشريك له والعوين، أو زعم أنه ينبغي أن يُعْبَدَ غيره، أو اتَّخذ له صاحبةً أو ولداً، وكلُّ من ردَّ الحقَّ الذي جاءت به الرسل أو من قام مقامهم."},{"a":"6:22","t":"يخبر تعالى عن مآل أهل الشرك يوم القيامة، وأنهم يُسْألون ويُوَبَّخُونَ فيُقال لهم: أين شركائي الذين كُنْتُم تزعمونَ؛ أي: إن الله ليس له شريك، وإنَّما ذلك على وجه الزعم منهم والافتراء."},{"a":"6:23","t":"﴿ثم لم تكن فتنتُهم﴾؛ أي: لم يكن جوابُهم حين يُفتنون ويُختبرون بذلك السؤال إلاَّ إنكارَهم لشِرْكهم وحَلِفَهم أنهم ما كانوا مشركين."},{"a":"6:24","t":"﴿انظر﴾: متعجباً منهم ومن أحوالهم، ﴿كيف كَذَبوا على أنفسهم﴾؛ أي: كذبوا كذباً عاد بالخَسارِ على أنفسهم وضَرَّهُم ـ واللهِ ـ غايةَ الضَّرر، ﴿وَضَلَّ عنهم ما كانوا يفترونَ﴾: من الشُّركاء الذين زعَموهم مع الله، تعالى الله عن ذلك علوًّا كبيراً."},{"a":"6:25","t":"أي: ومن هؤلاء المشركين قومٌ يحمِلُهم بعض الأوقات بعض الدواعي إلى الاستماع [لما تقول]، ولكنه استماعٌ خالٍ من قصد الحقِّ واتباعِهِ، ولهذا لا ينتفعونَ بذلك الاستماع لعدم إرادتِهِم للخير. ﴿وجَعَلْنا على قلوبهم أكِنَّةً﴾؛ أي: أغطيةً وأغشيةً لئلاَّ يَفْقَهوا كلام الله، فصان كلامَه عن أمثال هؤلاء. ﴿وفي آذانِهِم﴾: جعلنا ﴿وَقْراً﴾؛ أي: صمماً، فلا يستمِعون ما ينفعهم، ﴿وإن يَرَوْا كلَّ آيةٍ لا يؤمنوا بها﴾: وهذا غاية الظُّلم والعناد: أنَّ الآيات البيِّنات الدالَّة على الحقِّ لا ينقادون لها ولا يصدِّقون بها، بل يجادِلون الحق بالباطل لِيُدْحِضوه، ولهذا قال: ﴿حتَّى إذا جاؤوك يجادِلونك يقولُ الذين كفروا إنْ هذا إلَّا أساطيرُ الأوَّلين﴾؛ أي: مأخوذ من صحف الأولين المسطورة التي ليست عن الله ولا عن رسله، وهذا من كفرِهم، وإلاَّ؛ فكيف يكون هذا الكتاب الحاوي لأنباء السابقين واللاحقين والحقائق التي جاءت بها الأنبياء والمرسلون والحق والقسط والعدل التام من كل وجهٍ أساطير الأولين؟!"},{"a":"6:26","t":"﴿وهم﴾؛ أي: المشركون بالله المكذِّبون لرسوله يجمعون بين الضَّلال والإضلال؛ ينهون الناس عن اتباع الحقِّ، ويحذِّرونهم منه، ويبعدون بأنفسهم عنه، ولن يضرُّوا الله ولا عباده المؤمنين بفعلهم هذا شيئاً. ﴿إن يُهلكون إلا أنفُسَهم وما يشعرونَ﴾: بذلك."},{"a":"6:27","t":"يقول تعالى مخبراً عن حال المشركين يوم القيامة وإحضارهم النار: ﴿ولو ترى إذْ وُقِفوا على النار﴾: ليوبَّخوا ويُقَرَّعوا؛ لرأيت أمراً هائلاً وحالاً مفظعة، ولرأيتهم كيف أقرُّوا على أنفسهم بالكفر والفسوق، وتمنَّوا أنْ لو يُرَدُّوا إلى الدُّنيا، ﴿فقالوا يا لَيْتَنا نُرَدُّ ولا نكذِّبَ بآيات ربِّنا ونكونَ من المؤمنين﴾."}],"131":[{"a":"6:28","t":"﴿بل بدا لهم ما كانوا يُخفون من قبلُ﴾: فإنهم كانوا يُخفون في أنفسهم أنَّهم كانوا كاذبين، ويبدو في قلوبهم في كثير من الأوقات، ولكن الأغراض الفاسدة صدَّتهم عن ذلك وصَدَفَتْ قلوبَهم عن الخير، وهم كَذَبَةٌ في هذه الأمنية، وإنما قصدهم أن يدفعوا بها عن أنفسهم العذاب. فلو ﴿رُدُّوا لعادوا لما نُهوا عنه وإنَّهم لكاذبون﴾."},{"a":"6:29","t":"﴿وقالوا﴾ منكرين للبعثِ: ﴿إن هي إلَّا حياتُنا الدُّنيا﴾؛ أي: ما حقيقة الحال والأمر وما المقصودُ من إيجادِنا إلاَّ الحياة الدُّنيا وحدها، ﴿وما نحن بمبعوثينَ﴾."},{"a":"6:30","t":"أي: ﴿ولو ترى﴾ الكافرينَ ﴿إذ وُقِفوا على ربِّهم﴾؛ لرأيت أمراً عظيماً وهولاً جسيماً، ﴿قال﴾ لهم موبخاً ومقرعاً: ﴿أليس هذا﴾ الذي تَرَوْنَ من العذاب ﴿بالحقِّ قالوا بلى وربِّنا﴾: فأقرُّوا واعترفوا حيث لا ينفعُهم ذلك، ﴿قال فذوقوا العذابَ بما كنتُم تكفُرون﴾."},{"a":"6:31","t":"أي: قد خاب وخَسِرَ وحُرِمَ الخيرُ كلُّه من كذَّب بلقاء الله، فأوجب له هذا التكذيبُ الاجتراء على المحرَّمات واقتراف الموبقات، ﴿حتى إذا جاءتْهم الساعةُ﴾: وهم على أقبح حال وأسوئهِ، فأظهروا غايةَ الندم، ﴿وقالوا يا حسرتنا على ما فرطنا فيها﴾: ولكن هذا تحسر ذهب وقته، ﴿وهم يحملون أوزارهم على ظهورهم ألا ساء ما يزِرونَ﴾: فإنَّ وِزْرَهُم وزرٌ يُثْقِلُهم ولا يقدرون على التخلُّص منه، ولهذا خُلِّدوا في النار، واستحقوا التأبيد في غضب الجبار."},{"a":"6:32","t":"هذه حقيقة الدُّنيا وحقيقة الآخرة: أما حقيقة الدنيا؛ فإنها لعب ولهو، لعب في الأبدان، ولهو في القلوب؛ فالقلوب لها والهةٌ، والنفوس لها عاشقةٌ، والهموم فيها متعلقةٌ، والاشتغال بها كلعب الصبيان. وأما الآخرة؛ فإنَّها ﴿خيرٌ للذين يتَّقون﴾؛ في ذاتها وصفاتها، وبقائها ودوامها، وفيها ما تشتهيه الأنفُسُ وتَلَذُّ الأعينُ؛ من نعيم القلوب والأرواح، وكثرة السرور والأفراح، ولكنها ليست لكلِّ أحدٍ، وإنما هي للمتَّقين، الذين يفعلون أوامر الله، ويتركون نواهِيَهُ وزواجِرَه، ﴿أفلا تعقِلون﴾؛ أي: أفلا يكون لكم عقولٌ بها تدرِكون أيَّ الدارين أحق بالإيثارِ؟!"},{"a":"6:33","t":"أي: قد نعلم أنَّ الذي يقول المكذِّبون فيك يَحْزُنُك ويسوؤك، ولم نأمُرْك بما أمَرْناك به من الصبر إلاَّ لِتَحْصَلَ لك المنازلُ العالية، والأحوال الغاليةُ؛ فلا تظنَّ أنَّ قولَهم صادرٌ عن اشتباهٍ في أمرك وشكٍّ فيك؛ ﴿فإنَّهم لا يكذِّبونَك﴾: لأنهم يعرفون صِدْقَكَ ومَدْخَلَك ومَخْرَجَك وجميع أحوالك، حتى إنَّهم كانوا يسمُّونه قبل بعثتِهِ الأمين، ﴿ولكنَّ الظالمينَ بآياتِ الله يَجْحَدونَ﴾؛ أي: فإنَّ تكذيبهم لآيات الله التي جعلها الله على يديك."},{"a":"6:34","t":"﴿ولقد كُذِّبَتْ رسلٌ من قبلك فصبروا على ما كُذِّبوا وأوذوا حتى أتاهم نصرُنا﴾: فاصبرْ كما صبروا؛ تظفرْ كما ظفروا، ﴿ولقد جاءك من نبإِ المرسلين﴾؛ ما به يَثْبُتُ فؤادُك، ويطمئنُّ به قلبك."},{"a":"6:35","t":"﴿وإن كان كَبُرَ عليك إعراضُهم﴾؛ أي: شقَّ عليك من حرصِك عليهم ومحبَّتِك لإيمانهم؛ فابذلْ وسعكَ في ذلك؛ فليس في مقدورك أن تهدي من لم يُرِدِ الله هدايَتَه. ﴿فإنِ استطعتَ أن تبتغيَ نفقاً في الأرض أو سُلَّماً في السماء فتأتيهم بآية﴾؛ أي: فافعل ذلك؛ فإنه لا يفيدُهم شيئاً، وهذا قطعٌ لطمعه في هدايته أشباه هؤلاء المعاندين، ﴿ولو شاء الله لَجَمعهم على الهُدى﴾: ولكنَّ حكمته تعالى اقتضت أنَّهم يَبْقَوْن على الضلال، ﴿فلا تكوننَّ من الجاهلينَ﴾: الذين لا يعرِفون حقائق الأمور ولا ينزِلونها على منازلها."}],"132":[{"a":"6:36","t":"يقول تعالى لنبيِّه - صلى الله عليه وسلم -: ﴿إنَّما يستجيب﴾ لدعوتك ويلبِّي رسالتك وينقادُ لأمرك ونهيك، ﴿الذين يسمعونَ﴾: بقلوبهم ما ينفعُهم، وهم أولو الألباب والأسماع، والمراد بالسماع هنا سماعُ القلب والاستجابة، وإلا فمجرَّد سماع الأذن يشترك فيه البَرُّ والفاجر، فكل المكلَّفين قد قامت عليهم حجة الله تعالى باستماع آياته، فلم يبق لهم عذرٌ في عدم القبول. ﴿والموتى يبعثُهُم اللهُ ثم إليه يُرْجَعون﴾: يُحتمل أنَّ المعنى مقابل للمعنى المذكور؛ أي: إنما يستجيب لك أحياءُ القلوب، وأما أموات القلوب الذين لا يشعرون بسعادتهم ولا يُحِسُّون بما ينجيهم؛ فإنهم لا يستجيبون لك ولا ينقادون، وموعدهم القيامة، يبعثهم الله ثم إليه يُرْجَعون. ويحتمل أنَّ المراد بالآية على ظاهرِها، وأنَّ الله تعالى يقرِّر المعادَ، وأنه سيبعث الأموات يوم القيامة، ثم ينبِّئهم بما كانوا يعملون، ويكون هذا متضمِّنا للترغيب في الاستجابة لله ورسوله، والترهيب من عدم ذلك."},{"a":"6:37","t":"﴿وقالوا﴾؛ أي: المكذبون بالرسول تعنُّتاً وعناداً: ﴿لولا نُزِّلَ عليه آيةٌ من ربِّه﴾؛ يعنون بذلك آيات الاقتراح التي يقترِحونها بعقولهم الفاسدة وآرائهم الكاسدة؛ كقولهم: ﴿وقالوا لن نؤمنَ لك حتى تَفْجُرَ لنا من الأرض يَنبوعاً. أو تكون لك جنَّةٌ من نخيل وعنبٍ فتفجِّرَ الأنهار خلالها تفجيراً. أو تُسْقِطَ السماءَ كما زعمتَ علينا كِسَفاً أو تأتي بالله والملائكة قبيلاً ...﴾ الآيات. ﴿قل﴾: مجيباً لقولهم: ﴿إن الله قادرٌ على أن ينزِّل آيةً﴾: فليس في قدرته قصور عن ذلك، كيف وجميع الأشياء منقادةٌ لعزَّته مذعنة لسلطانه. ولكنَّ أكثر الناس لا يعلمونَ، فهم لجهلهم وعدم علمهم يطلبون ما هو شرٌّ لهم من الآيات، التي لو جاءتهم فلم يؤمنوا بها؛ لَعوجِل ﴿وَمَا مِنْ دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُمْ مَا فَرَّطْنَا فِي الْكِتَابِ مِنْ شَيْءٍ ثُمَّ إِلَى رَبِّهِمْ يُحْشَرُونَ (38)﴾ وا بالعقاب؛ كما هي سنة الله التي لا تبديل لها، ومع هذا؛ فإنْ كان قصدُهم الآيات التي تبيِّن لهم الحقَّ وتوضِّح السبيل؛ فقد أتى محمدٌ - صلى الله عليه وسلم - بكلِّ آية قاطعةٍ، وحُجَّةٍ ساطعةٍ، دالَّةٍ على ما جاء به من الحق، بحيث يتمكَّن العبدُ في كل مسألة من مسائل الدين أن يَجِدَ فيما جاء به عدَّة أدلَّة عقليَّة ونقليَّة؛ بحيث لا تبقي في القلوب أدنى شكٍّ وارتياب، فتبارك الذي أرسل رسوله بالهدى ودين الحقِّ وأيَّده بالآيات البيِّنات لِيَهْلِكَ من هَلَكَ عن بينة ويحيا من حَيَّ عن بينةٍ، وإن الله لسميعٌ عليمٌ."},{"a":"6:38","t":"أي: جميع الحيوانات الأرضية والهوائية من البهائم والوحوش والطيور كلُّها أممٌ أمثالُكم، خلَقْناها كما خلَقْناكم، ورزقْناها كما رزقناكم، ونفذتْ فيها مشيئتُنا وقدرتُنا كما كانت نافذة فيكم. ﴿ما فرَّطْنا في الكتاب من شيء﴾؛ أي: ما أهملنا ولا أغفلنا في اللوح المحفوظ شيئاً من الأشياء، بل جميعُ الأشياء ـ صغيرها وكبيرها ـ مثبتةٌ في اللوح المحفوظ على ما هي عليه، فتقع جميع الحوادث طِبْقَ ما جرى به القلم. وفي هذه الآية دليلٌ على أن الكتاب الأول قد حوى جميع الكائنات، وهذا أحدُ مراتب القضاء والقدر؛ فإنها أربعُ مراتب: علمُ الله الشامل لجميع الأشياء، وكتابُهُ المحيط بجميع الموجودات، ومشيئتُهُ وقدرتُهُ النافذة العامَّة لكلِّ شيءٍ، وخَلْقُه لجميع المخلوقات حتى أفعال العباد. ويُحتمل أنَّ المراد بالكتاب هذا القرآن، وأنَّ المعنى كالمعنى في قوله تعالى: ﴿ونَزَّلْنا عَلَيْكَ الكِتابَ تِبيْاناً لِكُلِّ شيءٍ﴾. وقوله: ﴿ثمَّ إلى رَبِّهِمْ يُحْشَرونَ﴾؛ أي: جميع الأمم تُحشر وتُجمع إلى الله في موقف القيامة، في ذلك الموقف العظيم الهائل، فيجازيهم بعدلِهِ وإحسانِهِ، ويُمضي عليهم حُكمَهُ الذي يَحْمَدُه عليه الأولون والآخرون؛ أهل السماء وأهل الأرض."},{"a":"6:39","t":"هذا بيانٌ لحال المكذِّبين بآيات الله المكذِّبين لرسله: أنَّهم قد سدُّوا على أنفسهم باب الهُدى، وفتحوا باب الرَّدى، وأنهم ﴿صُمٌّ﴾ عن سماع الحقِّ، ﴿بُكْمٌ﴾ عن النُّطق به؛ فلا ينطِقون إلا بالباطل ، ﴿في الظُّلمات﴾؛ أي: منغمِسون في ظلمات الجهل والكفر والظُّلم والعناد والمعاصي، وهذا من إضلال اللهِ إيَّاهم؛ فمن ﴿يَشَإِ اللهُ يُضْلِلْهُ ومن يَشَأ يَجْعَلْهُ على صراطٍ مستقيم﴾؛ لأنَّه المنفرد بالهداية والإضلال بحسبِ ما اقتضاه فضله وحكمته."},{"a":"6:40","t":"يقول تعالى لرسوله: ﴿قُلْ﴾ للمشركين بالله العادلينَ به غيره: ﴿أرأيْتَكُم إن أتاكم عذابُ اللهِ أو أتَتْكُمُ الساعةُ أغير الله تدعونَ إن كنتم صادقين﴾؛ أي: إذا حَصَلَتْ هذه المشقات وهذه الكروب التي يُضْطَرُّ إلى دفعِها؛ هل تدعونَ آلهتكم وأصنامكم أم تدعونَ ربَّكم المَلِكَ الحقَّ المبين؟"},{"a":"6:41","t":"﴿بل إيَّاه تدعونَ فيكشِفُ ما تدعونَ إليه إن شاءَ وَتَنْسَوْنَ ما تُشْرِكون﴾: فإذا كانت هذه حالُكم مع أندادِكُم عند الشدائد؛ تَنْسَوْنَهم لعلمِكُم أنهم لا يملِكون لكم ضَرًّا ولا نفعاً ولا موتاً ولا حياة ولا نشوراً، وتخلِصونَ لله الدعاءَ؛ لِعلْمِكُم أنَّه هو الضارُّ النافعُ المجيبُ لدعوةِ المضطرِّ؛ فما بالُكم في الرخاء تُشْرِكونَ به وتجعلونَ له شركاء؟! هل دلَّكم على ذلك عقلٌ أو نقلٌ؟ أم عندَكم من سلطان بهذا؟ أم تفترونَ على الله الكذب؟"},{"a":"6:42","t":"يقول تعالى: ﴿ولقد أرْسَلْنا إلى أمم من قبلِكَ﴾: من الأمم السالفينَ، والقرونِ المتقدِّمينَ، فكذَّبوا رُسَلنا، وجحدوا بآياتنا، ﴿فأخذْناهم بالبأساءِ والضَّرَّاء﴾؛ أي: بالفقر والمرض والآفات والمصائب رحمةً منَّا بهم، ﴿لعلَّهم يَتَضَرَّعونَ﴾ إلينا، ويلجؤون عند الشدةِ إلينا."},{"a":"6:43","t":"﴿فلولا إذ جاءهم بأسنا تضرعوا ولكن قست قلوبهم﴾؛ أي: استحجرت فلا تلين للحقِّ، ﴿وزيَّن لهم الشيطانُ ما كانوا يعملونَ﴾: فظنُّوا أنَّ ما هم عليه دينُ الحق، فتمتَّعوا في باطلهم برهةً من الزمان، ولعب بعقولهم الشيطان."},{"a":"6:44","t":"﴿فلمَّا نَسُوا ما ذُكِّروا به فَتَحْنا عليهم أبوابَ كلِّ شيءٍ﴾: من الدنيا ولذَّاتها وغفلاتها، ﴿حتى إذا فرحوا بما أوتوا أخَذْناهم بغتةً فإذا هم مُبْلِسونَ﴾؛ أي: آيسون من كل خيرٍ، وهذا أشدُّ ما يكون من العذاب: أن يُؤْخَذوا على غِرَّةٍ وغفلةٍ وطمأنينةٍ؛ ليكون أشد لعقوبتهم، وأعظم لمصيبتهم."}],"133":[{"a":"6:45","t":"﴿فقُطِعَ دابرُ القوم الذين ظلموا﴾؛ أي: اصطلموا العذاب، وتقطَّعت بهم الأسباب ﴿والحمدُ لله ربِّ العالمين﴾: على ما قضاه وقدَّره من هلاك المكذِّبين؛ فإنَّ بذلك تتبيَّن آياتُهُ وإكرامُهُ لأوليائِهِ، وإهانتُهُ لأعدائِهِ، وصدقُ ما جاءت به المرسلون."},{"a":"6:46","t":"يخبر تعالى أنَّه كما هو المتفرِّد بخَلْق الأشياء وتدبيرها؛ فإنَّه المنفرد بالوحدانيَّةِ والإلهية، فقال: قل: ﴿أرأيتُم إن أخذ الله سمعكم وأبصاركم وخَتَمَ على قلوبكم﴾: فبقيتُم بلا سمع ولا بصر ولا عقل. ﴿من إلهٌ غيرُ الله يأتيكم به﴾: فإذا لم يكن غير الله يأتي بذلك؛ فلم عبدتُم معه من لا قدرةَ له على شيءٍ إلاَّ إذا شاءه الله؟ وهذا من أدلة التوحيد وبطلان الشرك، ولهذا قال: ﴿انظرْ كيف نصرِّفُ الآياتِ﴾؛ أي: ننوِّعها، ونأتي بها في كلِّ فنٍّ، ولتنير الحقَّ، وتتبيَّن سبيل المجرمين. ﴿ثم هم﴾: مع هذا البيان التامِّ، ﴿يصدِفونَ﴾: عن آيات الله، ويعرِضون عنها."},{"a":"6:47","t":"﴿قل أرأيْتَكُم﴾؛ أي: أخبروني ﴿إن أتاكم عذابُ الله بغتةً أو جهرةً﴾؛ أي: مفاجأةً أو قد تقدَّم أمامه مقدماتٌ تعلمون بها وقوعَه، ﴿هل يُهْلَكُ إلَّا القومُ الظالمون﴾: الذين صاروا سبباً لوقوع العذابِ بهم بظلمِهم وعنادِهم؛ فاحذروا أن تقيموا على الظُّلم؛ فإنه الهلاك الأبدي، والشقاءُ السرمديُّ."},{"a":"6:48","t":"يذكر تعالى زبدةَ ما أرسل به المرسلين أنَّه البِشارة والنِّذارة، وذلك مستلزمٌ لبيان: المبشِّر والمبَشَّر به والأعمال التي إذا عملها العبدُ حصلت له البشارة، والمنْذِر والمنذَر والمنْذَر به والأعمال التي من عَمِلَها حقَّت عليه النِّذارة، ولكن الناس انقَسموا بحسب إجابتهم لدعوتهم وعدمها إلى قسمين: ﴿فَمنْ آمنَ وأصلحَ﴾؛ أي: آمن باللهِ وملائكته وكتبه ورسله واليوم الآخر، وأصلح إيمانه وأعماله ونيَّته، ﴿فلا خوفٌ عليهم﴾: فيما يُستقبل، ﴿ولا هم يحزنونَ﴾: على ما مضى."},{"a":"6:49","t":"﴿والذين كذَّبوا بآياتِنا يَمَسُّهُم العذابُ﴾؛ أي: ينالُهم ويذوقونه، ﴿بما كانوا يفسقون﴾."},{"a":"6:50","t":"يقول تعالى لنبيِّه - صلى الله عليه وسلم - المقترِحين عليه الآياتِ، أو القائلينَ له إنَّما تدعونا لنتَّخِذَك إلهاً مع الله: ﴿لا أقولُ لكم عندي خزائنُ الله﴾؛ أي: مفاتيح رزقِهِ ورحمتِهِ، ﴿ولا أعلم الغيبَ﴾: وإنَّما ذلك كلُّه عند الله؛ فهو الذي ما يفتحُ للناس من رحمةٍ فلا ممسك لها وما يمسكُ فلا مرسلَ له من بعدِهِ، وهو وحده عالمُ الغيب والشهادة فلا يُظْهِرُ على غيبِهِ أحداً إلا من ارتضى من رسول. ﴿ولا أقولُ لكم إني مَلَكٌ﴾: فأكون نافذَ التصرُّف قويًّا، فلست أدَّعي فوق منزلتي التي أنزلني الله بها، ﴿إن أتَّبِعُ إلَّا ما يُوحى إليَّ﴾؛ أي: هذا غايتي ومنتهى أمري وأعلاه، إنْ أتَّبِع إلاَّ ما يوحى إليَّ، فأعمل به في نفسي، وأدعو الخلق كلَّهم إلى ذلك؛ فإذا عُرِفت منزلتي؛ فلأي شيء يبحثُ الباحث معي أو يطلب مني أمراً لست أدَّعيه؟! وهل يُلْزَمُ الإنسان بغير ما هو بصددِهِ؟! ولأي شيء إذا دعوتكم بما يوحى إليَّ أن تلزموني أني أدَّعي لنفسي غير مرتبتي؟! وهل هذا إلا ظلمٌ منكم وعنادٌ وتمرُّدٌ؟! قل لهم في بيان الفرق بينَ مَنْ قَبِلَ دعوتي وانقاد لما أوحي إليَّ وبين من لم يكن كذلك: ﴿قُلْ هل يَسْتوي الأعمى والبصيرُ أفلا تتفكَّرونَ﴾: فتنزِلون الأشياءَ منازلَها وتختارون ما هو أولى بالاختيار والإيثار."},{"a":"6:51","t":"هذا القرآن نذارةٌ للخلق كلِّهم، ولكن إنَّما ينتفع به ﴿الذين يخافون أن يُحْشَروا إلى ربِّهم﴾؛ فهم متيقِّنون للانتقال من هذه الدار إلى دار القرار؛ فلذلك يستصحِبون ما ينفعهم ويَدَعون ما يضرُّهم. ﴿ليس لهم من دونه﴾؛ أي: من دون الله ﴿وليٌّ ولا شفيعٌ﴾؛ أي: لا من يتولى أمرهم فيحصِّلُ لهم المطلوب، ويدفعُ عنهم المحذور، ولا من يشفعُ لهم؛ لأن الخلق كلَّهم ليس لهم من الأمر شيء. ﴿لعلهم يتَّقون﴾: الله بامتثال أوامرِهِ واجتنابِ نواهيه؛ فإنَّ الإنذار موجب لذلك وسبب من أسبابه."},{"a":"6:52","t":"﴿ولا تطردِ الذين يدعون ربَّهم بالغداة والعشي يريدون وجهه﴾؛ أي: لا تطرد عنك وعن مجالستك أهل العبادة والإخلاص رغبةً في مجالسة غيرهم، من الملازمين لدعاءِ ربِّهم دعاء العبادة بالذِّكر والصلاة ونحوها ودعاء المسألة في أول النهار وآخره، وهم قاصدون بذلك وجه الله، ليس لهم من الأغراض سوى ذلك الغرض الجليل؛ فهؤلاء ليسوا مستحقين للطرد والإعراض عنهم، بل هم مستحقُّون لموالاتهم ومحبتهم وإدنائهم وتقريبهم؛ لأنهم الصفوة من الخلق ـ وإن كانوا فقراء ـ الأعزاء في الحقيقة، وإن كانوا عند الناس أذلاء. ﴿ما عليك من حسابِهِم من شيءٍ وما من حسابِكَ عليهم من شيءٍ﴾؛ أي: كلٌّ له حسابُهُ وله عملُهُ الحسنُ وعملُهُ القبيحُ، ﴿فتطرُدَهم فتكونَ من الظالمين﴾: وقد امتثلَ - صلى الله عليه وسلم - هذا الأمر أشدَّ امتثال، فكان إذا جلس الفقراء من المؤمنين؛ صبَّر نفسه معهم، وأحسن معاملتهم، وألان لهم جانبه، وحسَّن خلقه، وقرَّبهم منه، بل كانوا هم أكثر أهل مجلسِهِ رضي الله عنهم. وكان سبب نزول هذه الآيات أن أناساً من قريش أو من أجلاف العرب قالوا للنبيِّ - صلى الله عليه وسلم -: إن أردتَ أن نؤمنَ لك ونتَّبِعَكَ؛ فاطردْ فلاناً وفلاناً ـ أناساً من فقراء الصحابة ـ؛ فإنا نستحي أن ترانا العرب جالسين مع هؤلاء الفقراء. فحَمَلَهُ حبُّه لإسلامهم واتِّباعهم له فحدَّثته نفسُه بذلك، فعاتبه الله بهذه الآيات ونحوها."}],"134":[{"a":"6:53","t":"﴿وكذلك فَتَنَّا بعضَهم ببعضٍ ليقولوا أهؤلاءِ مَنَّ الله عليهم من بيننا﴾؛ أي: هذا من ابتلاء الله لعبادِهِ حيث جعل بعضَهم غنيًّا وبعضهم فقيراً وبعضهم شريفاً وبعضهم وضيعاً؛ فإذا مَنَّ الله بالإيمان على الفقير أو الوضيع، كان ذلك محلَّ محنةٍ للغني والشريف؛ فإنْ كان قصدُهُ الحقَّ واتباعه؛ آمن وأسلم ولم يمنعْه من ذلك مشاركة الذي يراه دونه بالغنى أو الشرف، وإن لم يكن صادقاً في طلب الحقِّ؛ كانت هذه عقبةً تردُّه عن اتِّباع الحق، وقالوا محتقرين لمن يَرَوْنَهم دونهم: ﴿أهؤلاءِ مَنَّ الله عليهم من بيننا﴾: فمنعهم هذا من اتباع الحق لعدم زكائهم. قال الله مجيباً لكلامهم المتضمِّن الاعتراض على الله في هداية هؤلاء وعدم هدايتهم هم: ﴿أليس اللهُ بأعلمَ بالشاكرينَ﴾ الذين يعرِفون النعمةَ ويُقِرُّون بها ويقومون بما تقتضيه من العمل الصالح، فيضع فضلَه ومنَّته عليهم دون من ليس بشاكرٍ؛ فإنَّ الله تعالى حكيمٌ لا يضع فضله عند من ليس له بأهل، وهؤلاء المعترضون بهذا الوصف بخلاف مَنْ مَنَّ الله عليهم بالإيمان من الفقراء وغيرهم؛ فإنهم هم الشاكرون."},{"a":"6:54","t":"ولما نهى الله رسوله عن طردِ المؤمنين القانتين؛ أمره بمقابلتِهِم بالإكرام والإعظام والتبجيل والاحترام، فقال: ﴿وإذا جاءَكَ الذين يؤمنونَ بآياتِنا فَقُلْ سلامٌ عليكم﴾؛ أي: وإذا جاءك المؤمنون؛ فحيِّهم، ورحِّبْ بهم، ولقِّهم منك تحيةً وسلاماً، وبشِّرهم بما ينشِّط عزائمهم وهممهم من رحمة الله وسعة جوده وإحسانه، وحُثَّهم على كل سبب وطريق يوصِلُ لذلك، ورهِّبْهم من الإقامة على الذُّنوب، وأمُرْهم بالتوبة من المعاصي لينالوا مغفرةَ ربِّهم وجوده، ولهذا قال: ﴿كَتَبَ ربُّكم على نفسِهِ الرحمةَ أنَّه من عَمِلَ منكم سوءاً بجهالةٍ ثمَّ تاب من بعدِهِ وأصلحَ﴾؛ أي: فلا بدَّ مع ترك الذُّنوب والإقلاع والندم عليها من إصلاح العمل وأداء ما أوجبَ الله وإصلاح ما فَسَدَ من الأعمال الظاهرة والباطنة؛ فإذا وُجِدَ ذلك كله؛ ﴿فإنَّه غفورٌ رحيمٌ﴾؛ أي: صبَّ عليهم من مغفرتِهِ ورحمتِهِ بحسب ما قاموا به مما أمرهم به."},{"a":"6:55","t":"﴿وكذلك نفصِّلُ الآياتِ﴾؛ أي: نوضِّحها ونبيِّنها ونميِّز بين طريق الهدى من الضلال والغي والرشاد؛ ليهتديَ بذلك المهتدون ويتبيَّن الحقُّ الذي ينبغي سلوكه. ﴿ولتستبينَ سبيلُ المجرمين﴾: الموصلةُ إلى سَخَطِ الله وعذابه؛ فإنَّ سبيل المجرمين إذا استبانت واتَّضحت؛ أمكنَ اجتنابُها والبعدُ منها؛ بخلاف ما لو كانت مشتبهةً ملتبسةً؛ فإنه لا يحصُلُ هذا المقصود الجليل."},{"a":"6:56","t":"يقول تعالى لنبيِّه - صلى الله عليه وسلم -: ﴿قُلْ﴾ لهؤلاء المشركين الذين يَدْعون مع الله آلهةً أخرى: ﴿إني نُهيت أن أعبدَ الذين تدعون من دونِ الله﴾: من الأنداد والأوثان التي لا تملك نفعاً ولا ضرًّا ولا موتاً ولا حياةً ولا نشوراً؛ فإن هذا باطلٌ، وليس لكم فيه حجةٌ ولا شبهةٌ إلاَّ اتباع الهوى الذي اتِّباعه أعظم الضلال. ولهذا قال: ﴿قل لا أتَّبِعُ أهواءَكم قد ضللتُ إذاً﴾؛ أي: إن اتَّبعت أهواءكم، ﴿وما أنا من المهتدينَ﴾: بوجهٍ من الوجوه."},{"a":"6:57","t":"وأما ما أنا عليه من توحيد الله وإخلاص العمل له؛ فإنه هو الحقُّ الذي تقوم عليه البراهين والأدلة القاطعة، وأنا ﴿على بيِّنة من ربي﴾؛ أي: على يقين مبينٍ بصحته وبطلان ما عداه. وهذه شهادةٌ من الرسول جازمةٌ لا تقبل التردُّد، وهو أعدل الشهود [من الخلق] على الإطلاق، فصدَّق بها المؤمنون، وتبيَّن لهم من صحَّتها وصدقها بحسب ما مَنَّ الله به عليهم، ولكنكم أيها المشركون ﴿كذبتم به﴾، وهو لا يستحقُّ هذا منكم، ولا يَليقُ به إلاَّ التصديق، وإذا استمررتُم على تكذيبكم؛ فاعلموا أنَّ العذابَ واقعٌ بكم لا محالةَ، وهو عند الله، هو الذي ينزله عليكم إذا شاء وكيف شاء، وإن استعجلتم به؛ فليس بيدي من الأمر شيء، ﴿إن الحُكْمُ إلا للهِ﴾؛ فكما أنه هو الذي حكم بالحكم الشرعيِّ فأمر ونهى؛ فإنه سيحكم بالحكم الجزائيِّ فيثيب ويعاقب بحسب ما تقتضيه حكمته؛ فالاعتراض على حكمه مطلقاً مدفوع، وقد أوضح السبيل وقصَّ على عباده الحقَّ قصًّا قَطَعَ به معاذيرَهم وانقطعتْ له حُجَّتُهم؛ ليهلِك مَن هَلَكَ عن بيِّنة ويحيا من حيَّ عن بيِّنة. ﴿وهو خيرُ الفاصلينَ﴾: بين عبادِهِ في الدُّنيا والآخرة، فيفصل بينهم فصلاً يحمدُه عليه حتى من قضى عليه ووجَّه الحق نحوه."},{"a":"6:58","t":"﴿قل﴾ للمستعجلين بالعذاب جهلاً وعناداً وظلماً: ﴿لو أنَّ عندي ما تستعجلونَ به لَقُضِيَ الأمرُ بيني وبينكم﴾: فأوقعتُه بكم، ولا خير لكم في ذلك، ولكنَّ الأمر عند الحليم الصبور الذي يعصيه العاصون ويتجرَّأ عليه المتجرِّئون وهو يعافيهم ويرزقُهم ويسدي عليهم نعمه الظاهرة والباطنة. ﴿والله أعلم بالظالمين﴾: لا يخفى عليه من أحوالهم شيءٌ فيمهِلُهم ولا يهمِلُهم."},{"a":"6:59","t":"هذه الآية العظيمة من أعظم الآيات تفصيلاً لعلمه المحيط، وأنَّه شامل للغيوب كلِّها، التي يُطْلِعُ منها ما شاء من خلقه، وكثير منها طوى علمَهُ عن الملائكة المقرَّبين والأنبياء المرسلين فضلاً عن غيرهم من العالمين، وأنَّه يعلم ما في البراري والقفار من الحيوانات والأشجار والرمال والحصى والتراب، وما في البحار من حيواناتها ومعادنها وصيدها وغير ذلك مما تحتويه أرجاؤها ويشتمل عليه ماؤها. ﴿وما تسقُطُ من ورقةٍ﴾: من أشجار البر والبحر والبلدان والقفر والدنيا والآخرة إلاَّ يعلمها، ﴿ولا حبةٍ في ظلمات الأرض﴾: من حبوب الثمار والزُّروع وحبوب البذور التي يبذرها الخلقُ وبذور النوابت البريَّة التي ينشأ منها أصناف النباتات، ﴿ولا رطبٍ ولا يابس﴾: هذا عموم بعد خصوص ﴿إلَّا في كتابٍ مبينٍ﴾: وهو اللوحُ المحفوظُ؛ قد حواها واشتمل عليها، وبعضُ هذا المذكور يبهر عقول العقلاء، ويذهِلُ أفئدة النبلاء، فدلَّ هذا على عظمة الربِّ العظيم وسعته في أوصافه كلِّها، وأنَّ الخلق من أولهم إلى آخرهم لو اجتمعوا على أن يحيطوا ببعض صفاته؛ لم يكنْ لهم قدرةٌ ولا وسعٌ في ذلك، فتبارك الربُّ العظيم الواسع العليم الحميد المجيد الشهيد المحيط، وجلَّ مِن إلهٍ لا يُحْصي أحدٌ ثناءً عليه، بل هو كما أثنى على نفسِهِ وفوق ما يثني عليه عباده. فهذه الآية دلَّت على علمه المحيط بجميع الأشياء وكتابه المحيط بجميع الحوادث."}],"135":[{"a":"6:60","t":"هذا كلُّه تقريرٌ لألوهيته واحتجاجٌ على المشركين به وبيانُ أنه تعالى المستحقُّ للحبِّ والتعظيم والإجلال والإكرام. فأخبر أنه وحده المتفرِّدُ بتدبير عباده في يقظتهم ومنامهم، وأنه يتوفَّاهم بالليل وفاة النوم، فتهدأ حركاتهم وتستريح أبدانهم، ويبعثهم في اليقظة من نومهم؛ ليتصرَّفوا في مصالحهم الدينيَّة والدنيويَّة، وهو تعالى يعلم ما جَرَحوا وما كَسَبوا من تلك الأعمال، ثم لا يزال تعالى هكذا يتصرَّف فيهم حتى يستوفوا آجالهم، فيَقضي بهذا التدبير أجلٌ مسمّى، وهو أجل الحياة، وأجل آخر فيما بعد ذلك، وهو البعث بعد الموت، ولهذا قال: ﴿ثم إليه مرجِعُكم﴾: لا إلى غيره، ﴿ثم ينبِّئكُم بما كنتم تعملون﴾: من خير وشر."},{"a":"6:61","t":"﴿وهو﴾ تعالى ﴿القاهرُ فوقَ عبادِهِ﴾: يُنَفِّذُ فيهم إرادته الشاملةَ ومشيئته العامة، فليسوا يملكون من الأمر شيئاً، ولا يتحرَّكون ولا يسكنون إلاَّ بإذنه، ومع ذلك؛ فقد وَكَّلَ بالعباد حفظةً من الملائكة يحفظون العبدَ ويحفظون عليه ما عَمِلَ؛ كما قال تعالى: ﴿وإنَّ عليكم لَحافظينَ. كراماً كاتبينَ. يعلمونَ ما تفعلونَ﴾، ﴿عن اليمينِ وعن الشمال قعيدٌ. ما يَلْفِظُ من قول إلا لَدَيْهِ رقيبٌ عتيدٌ﴾: فهذا حفظه لهم في حال الحياة. ﴿حتى إذا جاء أحَدَكُمُ الموتُ توفَّتْه رُسُلُنا﴾؛ أي: الملائكة الموكلون بقبض الأرواح، ﴿وهم لا يُفَرِّطون﴾ في ذلك؛ فلا يزيدون ساعةً مما قَدَّرَ اللهُ، وقضاه، ولا يُنْقِصون، ولا ينفِّذون من ذلك إلا بحسب المراسيم الإلهيَّة والتقادير الربانيَّة."},{"a":"6:62","t":"﴿ثم﴾: بعد الموت والحياة البرزخيَّة وما فيها من الخير والشر، ﴿رُدُّوا إلى الله مولاهم الحقِّ﴾؛ أي: الذي تولاَّهم بحكمه القدري فنفذ فيهم ما شاء من أنواع التدبير، ثم تولاَّهم بأمره ونهيه وأرسل إليهم الرسل وأنزل عليهم الكتب، ثم رُدُّوا إليه ليتولَّى الحكم فيهم بالجزاء. ويثيبَهم على ما عملوا من الخيرات ويعاقِبَهم على الشرور والسيئات، ولهذا قال: ﴿ألا له الحكمُ﴾: وحدَه لا شريك له، ﴿وهو أسرعُ الحاسبينَ﴾: لكمال علمِهِ وحفظِهِ لأعمالهم بما أثبته في اللوح المحفوظ ثم أثبتته ملائكته في الكتاب الذي بأيديهم. فإذا كان تعالى هو المنفرد بالخلق والتدبير، وهو القاهر فوق عباده، وقد اعتنى بهم كل الاعتناء في جميع أحوالهم، وهو الذي له الحكم القدري والحكم الشرعي والحكم الجزائي؛ فأين للمشركين العدول عن مَن هذا وصفه ونعته إلى عبادة من ليس له من الأمر شيء ولا عنده مثقال ذرةٍ من النفع ولا له قدرة وإرادة، أما والله؛ لو علموا حلم الله عليهم، وعفوه ورحمته بهم، وهم يبارزونه بالشرك والكفران، ويتجرؤون على عظمته بالإفك والبهتان، وهو يعافيهم ويرزقهم؛ لانجذبت دواعيهم إلى معرفته، وذهلت عقولهم في حبِّه، ولمقتوا أنفسهم أشدَّ المقت حيث انقادوا لداعي الشيطان، الموجب للخزي والخسران، ولكنهم قومٌ لا يعقلون."},{"a":"6:63","t":"أي: ﴿قل﴾: للمشركين بالله الداعين معه آلهةً أخرى ملزماً لهم بما أثبتوه من توحيد الربوبية على ما أنكروه من توحيد الإلهية، ﴿مَنْ يُنَجِّيكم من ظلماتِ البرِّ والبحر﴾؛ أي: شدائدهما ومشقاتهما وحين يتعذَّر أو يتعسَّر عليكم وجه الحيلة، فتدعون ربكم تضرُّعاً بقلبٍ خاضع ولسان لا يزال يَلْهَجُ بحاجته في الدُّعاء وتقولون وأنتم في تلك الحال: ﴿لَئِنْ أنجانا من هذه﴾: الشدة التي وقعنا فيها، ﴿لَنَكونَنَّ من الشاكرينَ﴾: لله؛ أي: المعترفين بنعمتِهِ، الواضعينَ لها في طاعة ربِّهم، الذين حفظوها عن أن يبذلوها في معصيته."},{"a":"6:64","t":"﴿قل الله ينجيكم منها ومن كل كربٍ﴾؛ أي: من هذه الشدة الخاصة، ومن جميع الكروب العامة، ﴿ثم أنتم تشركونَ﴾: لا تفون لله بما قلتُم، وتنسَوْن نعمه عليكم؛ فأي برهان أوضح من هذا على بطلان الشرك وصحة التوحيد."},{"a":"6:65","t":"أي: هو تعالى قادرٌ على إرسال العذاب إليكم من كل جهة، ﴿من فوقِكم أو من تحتِ أرجُلِكم أو يَلْبِسَكُم﴾؛ أي: يَخْلُطَكم ﴿شيعاً ويذيقَ بعضَكم بأسَ بعض﴾؛ أي: في الفتنة وقتل بعضكم بعضاً؛ فهو قادر على ذلك كله؛ فاحذروا من الإقامة على معاصيه فيصيبكم من العذاب ما يتلفكم ويمحقكم، ومع هذا؛ فقد أخبر أنه قادر على ذلك، ولكن من رحمته أن رفع عن هذه الأمة العذاب من فوقهم بالرجم والحصب ونحوه ومن تحت أرجلهم بالخسف، ولكن عاقَبَ من عاقَبَ منهم بأن أذاق بعضهم بأس بعض وسلَّط بعضهم على بعض بهذه العقوبات المذكورة عقوبةً عاجلةً يراها المعتبرون ويشعر بها العاملون. ﴿انظر كيف نصرِّفُ الآياتِ﴾؛ أي: ننوِّعُها ونأتي بها على أوجهٍ كثيرةٍ، وكلُّها دالةٌ على الحق، ﴿لعلَّهم يفقهون﴾؛ أي: يفهمون ما خُلقوا من أجله ويفقهون الحقائق الشرعية والمطالب الإلهية."},{"a":"6:66","t":"﴿وكذَّب به﴾؛ أي: بالقرآن ﴿قومُك وهو الحقُّ﴾: الذي لا مِرْيَةَ فيه ولا شك يعتريه. ﴿قل لستُ عليكم بوكيل﴾: أحفظُ أعمالَكم وأجازيكم عليها، وإنَّما أنا منذرٌ ومبلِّغ."},{"a":"6:67","t":"﴿لكلِّ نبإٍ مستقرٌّ﴾؛ أي: وقتٌ يستقرُّ فيه وزمانٌ لا يتقدَّم عنه ولا يتأخر، ﴿وسوف تعلمونَ﴾: ما توعدون به من العذاب."},{"a":"6:68","t":"المراد بالخوض في آيات الله التكلُّم بما يخالف الحقَّ من تحسين المقالات الباطلة والدعوة إليها ومدح أهلها والإعراض عن الحقِّ والقدح فيه وفي أهله؛ فأمر الله رسوله أصلاً وأمته تبعاً إذا رأوا من يخوض بآياتِ الله بشيء مما ذُكِرَ بالإعراض عنهم وعدم حضور مجالس الخائضين بالباطل والاستمرار على ذلك حتى يكونَ البحثُ والخوضُ في كلام غيره؛ فإذا كان في كلام غيره؛ زال النهي المذكور؛ فإن كان مصلحةً؛ كان مأموراً به، وإن كان غير ذلك؛ كان غير مفيد ولا مأمور به، وفي ذمِّ الخوض بالباطل حثٌّ على البحث والنظر والمناظرة بالحق. ثم قال: ﴿وإما ينسينَّك الشيطانُ﴾؛ أي: بأن جلستَ معهم على وجه النسيان والغفلة، ﴿فلا تقعُدْ بعد الذِّكرى مع القوم الظالمين﴾: يشملُ الخائضين بالباطل وكلَّ متكلِّم بمحرَّم أو فاعل لمحرم؛ فإنه يحرم الجلوس والحضور عند حضور المنكر الذي لا يقدِرُ على إزالته، هذا النهي والتحريم لمن جلس معهم، ولم يستعمل تقوى الله بأن كان يشارِكُهم في القول والعمل المحرم أو يسكت عنهم وعن الإنكار؛ فإن استعمل تقوى الله تعالى بأن كان يأمرهم بالخير وينهاهم عن الشرِّ والكلام الذي يصدُرُ منهم؛ فيترتَّب على ذلك زوال الشر أو تخفيفه؛ فهذا ليس عليه حرجٌ ولا إثم، ولهذا قال:"}],"136":[{"a":"6:69","t":"﴿وما على الذين يتَّقون من حسابِهم من شيءٍ ولكن ذِكْرى لعلَّهم يتَّقون﴾؛ أي: ولكن لِيذكِّرَهم ويَعِظَهم لعلَّهم يتَّقون الله تعالى. وفي هذا دليلٌ على أنه ينبغي أن يستعملَ المذكِّر من الكلام ما يكون أقربَ إلى حصول مقصود التقوى، وفيه دليلٌ على أنه إذا كان التذكير والوعظ مما يزيد الموعوظَ شرًّا إلى شرِّه؛ كان تركُهُ هو الواجب ؛ لأنَّه إذا ناقض المقصود؛ كان تركُهُ مقصوداً."},{"a":"6:70","t":"المقصود من العباد أن يُخْلِصوا لله الدين بأن يعبُدوه وحدَه لا شريك له ويبذُلوا مقدورَهم في مرضاتِهِ ومَحَابِّه، وذلك متضمِّن لإقبال القلب على الله وتوجُّهه إليه وكون سعي العبد نافعاً، وجِدًّا لا هزلاً، وإخلاصاً لوجه الله لا رياء وسمعة، هذا هو الدين الحقيقي الذي يُقالُ له: دينٌ، فأما من زعم أنه على الحقِّ، وأنه صاحب دين وتقوى، وقد اتَّخذ دينه لعباً ولهواً؛ بأنْ لَهَا قلبُهُ عن محبة الله ومعرفته، وأقبل على كلِّ ما يضرُّه، ولَهَا في باطله، ولعب فيه ببدنِهِ؛ لأن العمل والسعي إذا كان لغير الله؛ فهو لعبٌ؛ فهذا أمر الله تعالى أن يُتْرَكَ ويحذرَ ولا يغترَّ به، وتنظر حاله، ويحذر من أفعاله ، ولا يغتر بتعويقه عما يقرب إلى الله. ﴿وذكِّر به﴾؛ أي: ذكِّر بالقرآن ما ينفع العباد أمراً وتفصيلاً وتحسيناً له بذكر ما فيه من أوصاف الحسن، وما يضرُّ العباد نهياً عنه وتفصيلاً لأنواعه وبيان ما فيه من الأوصاف القبيحة الشنيعة الداعية لتركِهِ، وكلُّ هذا لئلا تُبْسَلَ نفسٌ بما كَسَبَتْ؛ أي: قبل اقتحام العبد للذنوب وتجرُّئِهِ على علاَّم الغيوب واستمراره على ذلك المرهوب؛ فذكِّرْها وَعِظْهَا لترتدعَ وتنزجرَ وتكفَّ عن فعلها. وقوله: ﴿ليس لها من دونِ الله وليٌّ ولا شفيعٌ﴾؛ أي: قبل أن تحيطَ بها ذنوبُها ثم لا ينفعُها أحدٌ من الخلق لا قريبٌ ولا صديقٌ ولا يتولاَّها من دون الله أحدٌ ولا يشفع لها شافعٌ. ﴿وإن تَعْدِلْ كلَّ عَدْل﴾؛ أي: تفتدي بكل فداءٍ ولو بملء الأرض ذهباً ﴿لا يُؤْخَذْ منها﴾؛ أي: لا يُقبل ولا يُفيد. ﴿أولئك﴾: الموصوفون بما ذُكِرَ ﴿الذين أُبْسِلوا﴾؛ أي: أهلِكوا وأيسوا من الخير، وذلك ﴿بما كَسَبوا لهم شرابٌ من حميم﴾؛ أي: ماء حارٌّ قد انتهى حرُّه يَشْوي وجوههم ويقطع أمعاءهم ﴿وعذابٌ أليمٌ بما كانوا يكفرون﴾."},{"a":"6:71","t":"﴿قل﴾ يا أيها الرسولُ للمشركين بالله، الداعين معه غيرَه، الذين يدعونكم إلى دينهم؛ مبيناً وشارحاً لوصف آلهتهم التي يكتفي العاقل بذِكْرِ وصفها عن النهي عنها؛ فإنَّ كلَّ عاقل إذا تصوَّر مذهب المشركين؛ جزم ببطلانِهِ قبل أن تُقام البراهين على ذلك، فقال: ﴿أنَدْعو من دونِ الله ما لا يَنفَعُنا ولا يضرُّنا﴾؟ وهذا وصفٌ يدخل فيه كلُّ من عُبِدَ من دون الله؛ فإنه لا ينفع ولا يضرُّ، وليس له من الأمر شيء، إن الأمر إلا لله. ﴿ونُرَدُّ على أعقابنا بعد إذ هدانا الله﴾؛ أي: وننقلب بعد هداية الله لنا إلى الضلال، ومن الرشد إلى الغيِّ، ومن الصراط الموصل إلى جنات النعيم إلى الطرق التي تُفْضي بسالِكِها إلى العذاب الأليم!! فهذه حالٌ لا يرتضيها ذو رشدٍ، وصاحبها ﴿كالذي استهوتْه الشياطينُ في الأرض﴾؛ أي: أضلَّته وتيَّهته عن طريقه ومنهجه الموصل إلى مقصده، فبقي ﴿حيرانَ له أصحابٌ يدعونَه إلى الهدى﴾، والشياطين يدعونه إلى الردى، فبقي بين الداعيين حائراً، وهذه حال الناس كلِّهم؛ إلا من عصمه الله تعالى؛ فإنهم يجدون فيهم جواذب ودواعي متعارضة؛ داعي الرسالة والعقل الصحيح والفطرة المستقيمة يدعونَه إلى الهدى والصعود إلى أعلى عليين، ودواعي الشيطان ومن سَلَكَ مسلَكَه والنفس الأمارة بالسوء يدعونه إلى الضلال والنزول إلى أسفل سافلين؛ فمن الناس من يكونُ مع دواعي الهدى في أمورِهِ كلِّها أو أغلبها، ومنهم من بالعكس من ذلك، ومنهم من يتساوى لديه الداعيانِ ويتعارضُ عندَهُ الجاذبانِ، وفي هذا الموضع تعرف أهل السعادة من أهل الشقاوة. وقوله: ﴿قل إن هدى الله هو الهدى﴾؛ أي: ليس الهدى إلا الطريق التي شرعها الله على لسان رسوله، وما عداه فهو ضلالٌ وردىً وهلاكٌ. ﴿وأُمِرْنا لِنُسْلِمَ لربِّ العالمينَ﴾: بأنْ ننقادَ لتوحيدِهِ ونستسلمَ لأوامرِهِ ونواهيهِ وندخلَ تحت [رِقٍّ] عبوديَّته؛ فإنَّ هذا أفضل نعمة أنعم الله بها على العباد، وأكمل تربية أوصلها إليهم."},{"a":"6:72","t":"﴿وأن أقيموا الصلاة﴾؛ أي: وأُمِرْنا أن نقيمَ الصلاة بأركانها وشروطها وسننها ومكمِّلاتها، ﴿واتَّقوه﴾: بفعل ما أمر به واجتناب ما عنه نهى. ﴿وهو الذي إليه تُحشرون﴾؛ أي: تجمعون ليوم القيامة، فيجازيكم بأعمالكم خيرها وشرها."},{"a":"6:73","t":"﴿وهو الذي خلق السموات والأرض بالحقِّ﴾: ليأمرَ العباد وينهاهم ويثيبَهم ويعاقِبَهم، ﴿ويومَ يقولُ كُن فيكونُ قولُهُ الحقُّ﴾: الذي لا مِرْيَةَ فيه ولا مثنوية ولا يقولُ شيئاً عبثاً. ﴿وله الملك يوم يُنفخ في الصور﴾؛ أي: يوم القيامة خصَّه بالذِّكر مع أنه مالك كل شيء؛ لأنه تنقطع فيه الأملاك، فلا يبقى مَلِكٌ إلا الله الواحد القهار. ﴿عالم الغيب والشهادة وهو الحكيم الخبير﴾: الذي له الحكمة التامة، والنعمة السابغة، والإحسان العظيم، والعلم المحيط بالسرائر والبواطن والخفايا، لا إله إلا هو، ولا ربَّ سواه."}],"137":[{"a":"6:74","t":"يقول تعالى: واذكُرْ قصة إبراهيم عليه الصلاة والسلام مثنياً عليه ومعظماً في حال دعوته إلى التوحيد ونهيه عن الشرك. ﴿إذ قال إبراهيمُ لأبيه آزَرَ أتتَّخِذُ أصناماً آلهةً﴾؛ أي: لا تنفع ولا تضرُّ، وليس لها من الأمر شيء، ﴿إني أراك وقومَكَ في ضلال مبينٍ﴾: حيث عبدتُم مَن لا يستحقُّ من العبادة شيئاً، وتركتُم عبادةَ خاِلقِكُم ورازِقِكم ومدبِّرِكم."},{"a":"6:75","t":"﴿وكذلك﴾: حين وفَّقناه للتوحيد والدعوة إليه، ﴿نُري إبراهيمَ ملكوتَ السمواتِ والأرضِ﴾؛ أي: ليرى ببصيرتِهِ ما اشتملتْ عليه من الأدلة القاطعة والبراهين الساطعة، ﴿وَلِيَكونَ من الموقنينَ﴾: فإنه بحسب قيام الأدلَّة يحصُلُ له الإيقان والعلم التامُّ بجميع المطالب."},{"a":"6:76","t":"﴿فلما جَنَّ عليه الليلُ﴾؛ أي: أظلم، ﴿رأى كوكباً﴾: لعله من الكواكب المضيئة؛ لأنَّ تخصيصَه بالذكر يدلُّ على زيادتِهِ عن غيره، ولهذا ـ والله أعلم ـ قال من قال: إنه الزُّهرة، ﴿قال هذا ربي﴾؛ أي: على وجه التنزُّل مع الخصم؛ أي: هذا ربي؛ فهلمَّ ننظرْ: هل يستحقُّ الربوبيَّة؟ وهل يقوم لنا دليلٌ على ذلك؟ فإنه لا ينبغي لعاقل أن يتَّخذ إلهه هواه بغير حُجَّة ولا برهان، ﴿فلمَّا أفَلَ﴾؛ أي: غاب ذلك الكوكب، ﴿قال لا أحبُّ الآفلينَ﴾؛ أي: الذي يغيبُ ويختفي عمَّن عبده؛ فإنَّ المعبود لا بدَّ أن يكون قائماً بمصالح مَن عَبَدَهُ ومدبِّراً له في جميع شؤونه، فأما الذي يَمضي وقتٌ كثيرٌ وهو غائبٌ؛ فمن أين يستحقُّ العبادة، وهل اتِّخاذُهُ إلهاَ إلاَّ من أسفه السَّفه وأبطل الباطل؟!"},{"a":"6:77","t":"﴿فلما رأى القمر بازغاً﴾؛ أي: طالعاً، ورأى زيادَتَه على نور الكواكب ومخالفته لها، ﴿قال هذا ربِّي﴾: تنزُّلاً، ﴿فلمَّا أفَلَ قال لَئِن لَمْ يَهْدِني ربِّي لأكوننَّ من القوم الضالين﴾: فافتقر غاية الافتقار إلى هداية ربِّه، وعلم أنه إن لم يهدِهِ الله؛ فلا هاديَ له، وإن لم يُعِنْه على طاعته؛ فلا معين له."},{"a":"6:78","t":"﴿فلما رأى الشمس بازغةً قال هذا ربِّي هذا أكبرُ﴾: من الكوكب ومن القمر، ﴿فلما أفلتْ﴾: تقرَّر حينئذٍ الهُدى، واضمحل الرَّدى فـ ﴿قال يا قوم إني بريءٌ مما تشركونَ﴾: حيث قام البرهانُ الصادق الواضح على بطلانِهِ."},{"a":"6:79","t":"﴿إني وجهتُ وجهيَ للذي فطر السمواتِ والأرضَ حنيفاً﴾؛ أي: لله وحده، مقبلاً عليه، معرضاً عن من سواه، ﴿وما أَنَا من المشركين﴾: فتبرَّأ من الشرك، وأذعن بالتوحيد، وأقام على ذلك البرهان. وهذا الذي ذكرنا في تفسير هذه الآيات هو الصواب، وهو أنَّ المقامَ مقامُ مناظرةٍ من إبراهيم لقومِهِ وبيانُ بطلان إلهيَّة هذه الأجرام العلويَّة وغيرها، وأما من قال: إنه مقامُ نظرٍ في حال طفوليَّته؛ فليس عليه دليلٌ."},{"a":"6:80","t":"﴿وحاجَّه قومُه قال أتُحاجُّونِّي في الله وقد هدانِ﴾: أيُّ فائدةٍ لمحاجَّة من لم يتبيَّنْ له الهدى؟ فأما من هداه الله ووصلَ إلى أعلى درجات اليقين؛ فإنه هو بنفسه يدعو الناس إلى ما هو عليه. ﴿ولا أخافُ ما تشرِكونَ به﴾: فإنَّها لن تضرَّني ولن تمنعَ عني من النفع شيئاً، ﴿إلَّا أن يشاء ربِّي شيئاً وَسِعَ ربِّي كلَّ شيءٍ علماً أفلا تتذكَّرونَ﴾: فتعلمون أنه وحدَه المعبودُ المستحقُّ للعبودية."},{"a":"6:81","t":"﴿وكيف أخاف ما أشركتم﴾: وحالُها حالُ العجز وعدم النفع، ﴿ولا تخافونَ أنَّكم أشركتُم بالله ما لم ينزِّلْ به عليكم سلطاناً﴾؛ أي: إلا بمجرَّد اتِّباع الهوى؟! ﴿فأيُّ الفريقين أحقُّ بالأمن إن كنتُم تعلمونَ﴾؟!"}],"138":[{"a":"6:82","t":"قال الله تعالى فاصلاً بين الفريقين: ﴿الذين آمنوا ولم يلبِسوا﴾؛ أي: يخلُطوا ﴿إيمانَهم بظُلْم أولئك لهمُ الأمنُ وهم مهتدونَ﴾: الأمنُ من المخاوف والعذاب والشقاء، والهداية إلى الصراط المستقيم؛ فإن كانوا لم يلبِسوا إيمانَهم بظلم مطلقاً لا بشركٍ ولا بمعاصٍ؛ حصل لهم الأمنُ التامُّ والهداية التامَّة، وإن كانوا لم يلبِسوا إيمانَهم بالشرك وحده، ولكنَّهم يعملون السيئاتِ؛ حصل لهم أصلُ الهداية وأصل الأمنِ، وإن لم يحصل لهم كمالها. ومفهوم الآية الكريمة: أنَّ الذين لم يحصُل لهم الأمران؛ لم يحصُل لهم هدايةٌ ولا أمنٌ، بل حظُّهم الضلالُ والشقاءُ."},{"a":"6:83","t":"ولما حكم لإبراهيم عليه السلام بما بيَّن به من البراهين القاطعة قال: ﴿وتلكَ حُجَّتُنا آتَيْناها إبراهيمَ على قومِهِ﴾؛ أي: علا بها عليهم وفلجهم بها. ﴿نرفعُ درجاتٍ من نشاءُ﴾: كما رفعنا درجاتِ إبراهيم عليه السلام في الدنيا والآخرة؛ فإنَّ العلم يرفعُ اللهُ به صاحِبَه فوق العباد درجاتٍ، خصوصاً العالم العامل المعلِّم؛ فإنه يجعلُه الله إماماً للناس بحسب حاله، تُرمق أفعالُهُ، وتُقتفى آثارُه، ويُستضاء بنوره، ويُمشى بعلمه في ظلمة ديجوره؛ قال تعالى: ﴿يرفع اللهُ الذين آمنوا منكم والذين أوتوا العلم درجات﴾. ﴿إنَّ ربَّك حكيمٌ عليمٌ﴾: فلا يضعُ العلم والحكمةَ إلاَّ في المحلِّ اللائق بها، وهو أعلم بذلك المحلِّ، وبما ينبغي له."},{"a":"6:84","t":"لما ذكر الله تعالى عبده وخليله إبراهيم عليه السلام، وذكر ما منَّ الله عليه به من العلم والدعوة والصبر؛ ذكر ما أكرمه الله به من الذُّرِّيَّة الصالحة والنسل الطيب وأنَّ الله جعل صفوةَ الخلق من نسلِهِ، وأعْظِمْ بهذه المنقبة والكرامة الجسيمة التي لا يُدْرَكُ لها نظيرٌ!! فقال: ﴿ووهبنا له إسحاقَ ويعقوبَ﴾: ابنه الذي هو إسرائيلُ أبو الشعب الذي فضَّله الله على العالمين، ﴿كُلًّا﴾ منهما هَدَيْناهُ الصراطَ المستقيم في علمه وعمله، و ﴿نوحاً﴾ هديناهُ ﴿من قبلُ﴾، وهدايته من أعلى أنواع الهدايات الخاصة التي لم تحصَلْ إلا لأفرادٍ من العالم، وهم أولو العزم من الرسل، الذي هو أحدهم، ﴿ومن ذُرِّيَّتِهِ﴾ ـ: يُحتمل أنَّ الضمير عائدٌ إلى نوح؛ لأنه أقرب مذكور، ولأن الله ذكر مع مَن ذَكَرَ لوطاً، وهو من ذُرِّيَّةِ نوح لا من ذُرِّيَّة إبراهيم؛ لأنه ابن أخيه، ويحتمل أن الضمير يعود إلى إبراهيم؛ لأنَّ السياق في مدحه والثناء عليه، ولوطٌ وإن لم يكن من ذُرِّيَّتِهِ؛ فإنه ممَّن آمن على يده، فكان منقبةُ الخليل وفضيلتُه بذلك أبلغَ من كونه مجردَ ابن له. ـ ﴿داودَ وسليمانَ﴾ ابنَ داود ﴿وأيوبَ ويوسفَ﴾ ابن يعقوبَ ﴿وموسى وهارون﴾ ابني عِمْران. ﴿وكذلك﴾: كما أصلحنا ذُرِّيَّة إبراهيم الخليل لأنَّه أحسن في عبادة ربِّه وأحسن في نفع الخلق، كذلك ﴿نَجْزي المحسنين﴾: بأن نجعلَ لهم من الثناء الصدق والذُّرِّيَّة الصالحة بحسب إحسانهم."},{"a":"6:85","t":"﴿وزكريا ويحيى﴾: ابنه، ﴿وعيسى﴾ ابن مريم، ﴿وإلياس كلٌّ﴾: من هؤلاء ﴿من الصالحين﴾: في أخلاقهم وأعمالهم وعلومهم، بل هم سادةُ الصالحين وقادتِهم وأئمتهم."},{"a":"6:86","t":"﴿وإسماعيل﴾ ابن إبراهيم، أبو الشعب الذي هو أفضل الشعوب، وهو الشعب العربي، ووالد سيد ولد آدم محمد - صلى الله عليه وسلم -، ﴿ويونُس﴾ ابن متى، ﴿ولوطاً﴾ ابن هارون أخي إبراهيم، ﴿وكلًّا﴾: من هؤلاء الأنبياء والمرسلين ﴿فضَّلْنا على العالمين﴾: لأن درجات الفضائل أربع، وهي التي ذكرها الله بقوله: ﴿ومَن يُطِع اللهَ والرَّسولَ فأولئكَ مع الذين أنعمَ اللهُ عليهم من النبيِّين والصدِّيقين والشهداء والصالحين﴾: فهؤلاء من الدرجة العليا، بل هم أفضل الرسل على الإطلاق، فالرسل الذين قصَّهم الله في كتابه أفضلُ ممَّن لم يَقْصُصْ علينا نبأهم بلا شك."},{"a":"6:87","t":"﴿ومن آبائهم﴾؛ أي: آباء هؤلاء المذكورين، ﴿وذُرِّيَّاتهم وإخوانهم﴾؛ أي: وهدينا من آباء هؤلاء وذُرِّيَّاتهم وإخوانهم، ﴿واجتبيناهم﴾؛ أي: اخترناهم، ﴿وهديناهُم إلى صراط مستقيم﴾."},{"a":"6:88","t":"﴿ذلك﴾: الهدى المذكور ﴿هُدى الله﴾: الذي لا هدى إلا هداه. ﴿يهدي به من يشاءُ من عبادِهِ﴾: فاطلبوا منه الهُدى؛ فإنّه إنْ لم يهدِكُم؛ فلا هادي لكم غيره، وممن شاء هدايته هؤلاء المذكورين. ﴿ولو أشركوا﴾: على الفَرَض والتقدير، ﴿لَحَبِطَ عنهم ما كانوا يعملون﴾: فإن الشرك محبطٌ للعمل موجبٌ للخلودِ في النار؛ فإذا كان هؤلاء الصفوة الأخيار لو أشركوا - وحاشاهم - لحبطتْ أعمالُهم؛ فغيرُهم أولى."},{"a":"6:89","t":"﴿ذلك﴾: الهدى المذكور ﴿هُدى الله﴾: الذي لا هدى إلا هداه. ﴿يهدي به من يشاءُ من عبادِهِ﴾: فاطلبوا منه الهُدى؛ فإنّه إنْ لم يهدِكُم؛ فلا هادي لكم غيره، وممن شاء هدايته هؤلاء المذكورين. ﴿ولو أشركوا﴾: على الفَرَض والتقدير، ﴿لَحَبِطَ عنهم ما كانوا يعملون﴾: فإن الشرك محبطٌ للعمل موجبٌ للخلودِ في النار؛ فإذا كان هؤلاء الصفوة الأخيار لو أشركوا - وحاشاهم - لحبطتْ أعمالُهم؛ فغيرُهم أولى."},{"a":"6:90","t":"﴿أولئك﴾: المذكورون ﴿الذين هدى الله فبهداهُمُ اقْتَدِهْ﴾؛ أي: امش أيها الرسول، الكريمُ خلفَ هؤلاءِ الأنبياءِ الأخيارِ واتَّبعْ ملتَهم. وقد امتثل - صلى الله عليه وسلم - فاهتدى بهدي الرسل قبله، وجمع كلَّ كمال فيهم، فاجتمعت لديه فضائل وخصائص فاق بها جميع العالمين، وكان سيد المرسلين وإمام المتقين صلوات الله وسلامه عليه وعليهم أجمعين. وبهذا الملحظ استدلَّ بهذه من استدلَّ من الصحابة أن رسول الله - صلى الله عليه وسلم - أفضل الرسل كلهم، ﴿قل﴾ للذين أعرضوا عن دعوتك: ﴿لا أسألكم عليه أجراً﴾؛ أي: لا أطلبُ منكم مغرماً ومالاً جزاء عن إبلاغي إياكم ودعوتي لكم، فيكون من أسباب امتناعكم، إنْ أجري إلاَّ على الله. ﴿إنْ هو إلا ذِكرى للعالمين﴾: يتذكَّرون به ما ينفعُهم فيفعلونَه وما يضُرُّهم فيذرونَه، ويتذكَّرون به معرفةَ ربِّهم بأسمائه وأوصافه، ويتذكَّرون به الأخلاق الحميدةَ والطُّرق الموصلة إليها، والأخلاق الرذيلة والطرق المفضية إليها؛ فإذا كان ذكرى للعالمين؛ كان أعظم نعمة أنعم الله بها عليهم، فعليهم قبولها، والشكر عليها."}],"139":[{"a":"6:91","t":"هذا تشنيعٌ على من نفى الرسالة من اليهود والمشركين وزَعَمَ أنَّ الله ما أنزل على بشر من شيء؛ فمن قال هذا؛ فما قَدَرَ الله حقَّ قدرِهِ ولا عظَّمه حقَّ عظمته؛ إذ هذا قدحٌ في حكمته، وزعمٌ أنه يترك عباده هملاً لا يأمرهم ولا ينهاهم، ونفيٌ لأعظم مِنَّةٍ امْتَنَّ الله بها على عباده، وهي الرسالة التي لا طريق للعباد إلى نيل السعادة والكرامة والفلاح إلا بها؛ فأيُّ قدح في الله أعظم من هذا؟! ﴿قل﴾ لهم ملزماً بفساد قولهم وقَرِّرْهم بما به يُقِرُّون: ﴿من أنزل الكتابَ الذي جاء به موسى﴾: وهو التوراة العظيمة ﴿نوراً﴾: في ظلمات الجهل، ﴿وهدىً﴾: من الضلالة، وهادياً إلى الصراط المستقيم علماً وعملاً، وهو الكتاب الذي شاع وذاع وملأ ذكرُهُ القلوب والأسماع، حتى إنهم جعلوا يتناسَخونه في القراطيس ويتصرَّفون فيه بما شاؤوا؛ فما وافق أهواءهم منه؛ أبدَوْه وأظهروه، وما خالف ذلك؛ أخفَوْه وكتموه، وذلك كثير. ﴿وعُلِّمْتُم﴾: من العلوم التي بسبب ذلك الكتاب الجليل ﴿ما لم تعلموا أنتم ولا آباؤكم﴾. فإذا سألتهم عن من أنزل هذا الكتاب الموصوف بتلك الصفات؛ فأجب عن هذا السؤال و ﴿قلِ اللهُ﴾: الذي أنزله، فحينئذٍ يتضح الحق، وينجلي مثل الشمس؛ وتقوم عليهم الحجة. ﴿ثم﴾ إذا ألزمتهم بهذا الإلزام ﴿ذَرْهم في خوضِهِم يلعبونَ﴾؛ أي: اتركهم يخوضوا في الباطل ويلعبوا بما لا فائدةَ فيه حتى يُلاقوا يومَهم الذي يوعدون."},{"a":"6:92","t":"أي: ﴿وهذا﴾: القرآن الذي ﴿أنزلناه﴾ إليك ﴿مباركٌ﴾؛ أي: وصفه البركة، وذلك لكثرة خيراتِهِ وسعة مَبَرَّاتِهِ ﴿مصدقُ الذي بين يديه﴾؛ أي: موافقٌ للكتب السابقة وشاهدٌ لها بالصدق، ﴿ولِتُنذِرَ أمَّ القُرى ومن حولَها﴾؛ أي: وأنزلناه أيضاً لتنذرَ أمَّ القرى ـ وهي مكة المكرمة ـ ومن حولها من ديار العرب، بل ومن سائر البلدان، فتحذِّر الناس عقوبة الله وأخذه الأمم، وتحذِّرهم مما يوجب ذلك. ﴿والذين يؤمنون بالآخرة يؤمنون به﴾: لأنَّ الخوف إذا كان في القلب؛ عمرتْ أركانُهُ وانقادَ لمراضي الله، ﴿وهم على صلاتهم يحافظونَ﴾؛ أي: يداومون عليها ويحفظون أركانها وحدودَها وشروطها وآدابها ومكمِّلاتها. جعلنا الله منهم."},{"a":"6:93","t":"يقول تعالى: لا أحد أعظم ظلماً ولا أكبر جُرماً ممَّن كَذَبَ على الله بأن نسب إلى الله قولاً أو حكماً وهو تعالى بريء منه، وإنما كان هذا أظلم الخلق؛ لأن فيه من الكذب وتغيير الأديان أصولها وفروعها ونسبة ذلك إلى الله ما هو من أكبر المفاسد، ويدخل في ذلك ادِّعاء النبوة، وأنَّ الله يوحي إليه، وهو كاذب في ذلك؛ فإنَّه مع كذبه على الله وجرأته على عظمته وسلطانه يوجب على الخلق أن يتَّبِعوه ويجاهِدَهم على ذلك ويستحلَّ دماء مَن خالفه وأموالهم. ويدخل في هذه الآية كلُّ من ادَّعى النبوة كمسيلمة الكذاب والأسود العنسي والمختار وغيرهم ممن اتصف بهذا الوصف. ﴿ومن قال سأنزِلُ مثلَ ما أنزلَ الله﴾؛ أي: ومن أظلم ممَّن زعم أنه يقدر على ما يقدر الله عليه ويجاري الله في أحكامه ويشرعُ من الشرائع كما يشرعه الله. ويدخل في هذا كل من يزعم أنه يقدِرُ على معارضة القرآن، وأنَّه في إمكانه أن يأتي بمثله! وأي ظلم أعظمُ من دعوى الفقير العاجز بالذات الناقص من كل وجه، مشاركةَ القوي الغني الذي له الكمال المطلق من جميع الوجوه في ذاته وأسمائه وصفاته؟! ولما ذمَّ الظالمين؛ ذَكَرَ ما أعدَّ لهم من العقوبة في حال الاحتضار ويوم القيامة، فقال: ﴿وَلَوْ تَرى إذ الظالمونَ في غَمَراتِ الموتِ﴾؛ أي: شدائدِهِ وأهواله الفظيعة وكُرَبه الشنيعة؛ لرأيت أمراً هائلاً وحالةً لا يقدر الواصف أن يصفها. ﴿والملائكة باسطو أيديهم﴾: إلى أولئك الظالمين المحتضرينَ بالضَّرب والعذاب؛ يقولون لهم عند منازعة أرواحهم وقلقها وتعصِّيها عن الخروج من الأبدان: ﴿أخْرِجوا أنفُسَكُم اليومَ تُجْزَوْنَ عذاب الهُونِ﴾؛ أي: العذاب الشديد الذي يُهينكم ويُذِلُّكم، والجزاء من جنس العمل؛ فإنَّ هذا العذاب ﴿بما كُنتم تقولونَ على الله غير الحقِّ﴾: من كذبِكم عليه وردِّكم للحقِّ الذي جاءت به الرسل، ﴿وكنتُم عن آياتِهِ تستكبرونَ﴾؛ أي: تَرَفَّعُون عن الانقياد لها والاستسلام لأحكامها. وفي هذا دليل على عذاب البرزخ ونعيمه؛ فإنَّ هذا الخطاب والعذاب الموجه إليهم إنما هو عند الاحتضار وقُبيل الموت وبعده. وفيه دليل على أن الرُّوح جسم يدخُلُ، ويخرُجُ، ويخاطَب، ويساكِن الجسد، ويفارقه."},{"a":"6:94","t":"فهذه حالهم في البرزخ، وأما يوم القيامة؛ فإنهم إذا وردوها؛ وردوها مفلسين فرادى بلا أهل ولا مال ولا أولاد ولا جنودٍ ولا أنصارٍ؛ كما خلقهم الله أول مرة، عارين من كل شيء؛ فإن الأشياء إنما تُتَمَوَّلُ وتحصُل بعد ذلك بأسبابها التي هي أسبابها، وفي ذلك اليوم تنقطع جميع الأمور التي كانت مع العبد في الدنيا سوى العمل الصالح والعمل السيئ الذي هو مادة الدار الآخرة الذي تنشأ عنه ويكون حسنها وقبحها وسرورها وغمومها وعذابها ونعيمها بحسب الأعمال؛ فهي التي تنفع أو تضرُّ وتسوء أو تسرُّ، وما سواها من الأهل والولد والمال والأنصار فعواري خارجية وأوصاف زائلة وأحوال حائلة، ولهذا قال تعالى: ﴿ولقد جئتُمونا فُرادى كما خلقْناكم أولَ مرةٍ وتركتُم ما خوَّلْناكم﴾؛ أي: أعطيناكُم وأنعمنا به عليكم ﴿وراءَ ظهورِكم﴾: لا يُغنون عنكم شيئاً، ﴿وما نرى معكم شُفعاءَكُم الذين زعمتُم أنهم فيكم شركاءُ﴾: فإن المشركين يشركون بالله ويعبُدون معه الملائكة والأنبياء والصالحين وغيرهم، وهم كلُّهم لله، ولكنهم يجعلون لهذه المخلوقات نصيباً من أنفسهم وشركة في عبادتهم، وهذا زعمٌ منهم وظلمٌ؛ فإن الجميع عبيد لله، والله مالكهم والمستحقُّ لعبادتهم؛ فشركُهم في العبادة وصرفها لبعض العبيد تنزيلٌ لهم منزلة الخالق المالك، فيوبَّخون يوم القيامة، ويُقال لهم هذه المقالة ﴿ما نرى معكم شفعاءَكم الذين زعمتُم أنهم فيكم شركاء لقد تقطَّع بينَكم﴾؛ أي: تقطَّعت الوصل والأسباب بينكم وبين شركائكم من الشفاعة وغيرها، فلم تنفعْ ولم تُجْدِ شيئاً. ﴿وضلَّ عنكم ما كنتُم تزعُمون﴾: من الرِّبح والأمن والسعادة والنجاة التي زيَّنها لكم الشيطانُ وحسَّنها في قلوبكم، فنطقتْ بها ألسنتكُم، واغتررتُم بهذا الزعم الباطل الذي لا حقيقةَ له حين تبيَّن لكم نقيضُ ما كنتم تزعُمون، وظهر أنَّكم الخاسرون لأنفسكم وأهليكم وأموالكم."}],"140":[{"a":"6:95","t":"يخبر تعالى عن كماله وعظمةِ سلطانه وقوة اقتداره وسعة رحمته وعموم كرمه وشدة عنايته بخلقه، فقال: ﴿إنَّ الله فالقُ الحبِّ﴾ شاملٌ لسائر الحبوب التي يباشر الناس زرعَها، والتي لا يباشِرونها منها؛ كالحبوب التي يبثها الله في البراري والقفار، فيفلق الحبوب عن الزروع والنوابت على اختلاف أنواعها وأشكالها ومنافعها، ويفلق النوى عن الأشجار من النخيل والفواكه وغير ذلك، فينتفع الخلقُ من الآدميين والأنعام والدواب، ويرتعون فيما فَلَقَ الله من الحبِّ والنوى، ويقتاتون وينتفعون بجميع أنواع المنافع التي جعلها الله في ذلك، ويريهم الله من برِّه وإحسانه ما يبهر العقول ويُذْهِلُ الفحول، ويريهم من بدائع صنعته وكمال حكمته ما به يعرفونه ويوحِّدونه ويعلمون أنه هو الحقُّ وأن عبادة ما سواه باطلة. ﴿يُخْرِجُ الحيَّ من الميِّت﴾: كما يخرِجُ من المنيِّ حيواناً ومن البيضة فرخاً ومن الحبِّ والنوى زرعاً وشجراً، ﴿ومُخْرِجُ الميِّتِ﴾: وهو الذي لا نموَّ فيه أو لا روح ﴿من الحيِّ﴾: كما يخرِجُ من الأشجار والزُّروع النوى والحب، ويخرِجُ من الطائر بيضاً ونحو ذلك. ﴿ذلكم﴾ الذي فعل ما فعل وانفردَ بخلقِ هذه الأشياء وتدبيرِها ﴿اللهُ ربُّكم﴾؛ أي: الذي له الألوهيَّة والعبادة على خلقه أجمعينَ، وهو الذي ربَّى جميع العالَمين بنعمِهِ وغذَّاهم بكرمه، ﴿فأنَّى تؤفَكونَ﴾؛ أي: فأنَّى تصرَفون وتَصُدُّون عن عبادة من هذا شأنه إلى عبادة من لا يملك لنفسه نفعاً ولا ضرًّا ولا موتاً ولا حياةً ولا نشوراً؟"},{"a":"6:96","t":"ولما ذكر تعالى مادة خلق الأقواتِ؛ ذكر مِنَّته بتهيئة المساكن وخلقه كلَّ ما يحتاجُ إليه العباد من الضياء والظلمة وما يترتَّب على ذلك من أنواع المنافع والمصالح، فقال: ﴿فالقُ الإصباح﴾؛ أي: كما أنه فالق الحبِّ والنَّوى، كذلك هو فالقُ ظلمةِ الليل الداجي الشامل لما على وجه الأرض بضياء الصُّبح الذي يفلقه شيئاً فشيئاً، حتى تذهبَ ظلمةُ الليل كلُّها ويخلُفُها الضياءُ والنورُ العامُّ الذي يتصرَّف به الخلقُ في مصالحهم ومعايشهم ومنافع دينهم ودنياهم. ولما كان الخلقُ محتاجين إلى السكون والاستقرار والراحة التي لا تتمُّ إلا بوجود النهار والنور؛ ﴿جعل﴾: الله الليلَ سَكَناً يسكن فيه الآدميُّون إلى دورهم ومنامهم والأنعامُ إلى مأواها والطيورُ إلى أوكارها فتأخذ نصيبها من الراحة، ثم يزيل الله ذلك بالضياء، وهكذا أبداً إلى يوم القيامة. ﴿و﴾ جعل تعالى ﴿الشمسَ والقمرَ حُسْباناً﴾: بهما تُعرف الأزمنة والأوقات؛ فتنضبِطُ بذلك أوقات العبادات وآجال المعاملات، ويُعْرَفُ بها مدة ما مضى من الأوقات التي لولا وجودُ الشمس والقمر وتناوُبُهما واختلافُهما لما عَرَفَ ذلك عامة الناس واشتركوا في علمه، بل كان لا يعرفه إلا أفرادٌ من الناس بعد الاجتهاد، وبذلك يفوت
